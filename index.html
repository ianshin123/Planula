<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planula">
<meta name="application-name" content="Planula">
<link rel="manifest" href="manifest.webmanifest?v=93">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=93">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=93">

<title>Planula</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* 시험기간용으로 톤을 다시 잡았다. 따뜻한 크림 + 테라코타에서
     색을 뺀 뉴트럴 페이퍼 + 딥 틸로 옮겼다. 과목 일곱 색(빨~검)이 화면을 채우므로
     UI 강조색은 그 일곱과 겹치지 않는 청록으로 두고, 표면에서는 색기를 뺀다. */
  --bg:#F1F0EC; --bg2:#FBFAF8; --solid:#FFFFFF; --muted:#E8E7E1;
  --ink:#1A1917; --ink2:#5C5A53; --ink3:#98958D;
  --line:rgba(36,34,29,.14); --line2:rgba(36,34,29,.07);
  --ac:#0B87DA; --ac2:#39A4EA; --ac-s:rgba(11,135,218,.12); --ac-b:rgba(11,135,218,.34);
  --ac-glow:rgba(11,135,218,.38); --spot-glow:rgba(11,135,218,.6);
  --tour-paper:rgba(253,253,251,.7); --tour-sheen:rgba(255,255,255,.55);
  --tour-halo:rgba(223,240,253,.55); --tour-lift:rgba(252,254,253,.9);
  --tour-ink:#191D1C; --tour-ink2:#48524F; --tour-dim:#818A87; --tour-ac:#0B87DA;
  --gd:#CE4238; --gd-s:rgba(206,66,56,.12);
  --ok:#2E9C60; --ok-s:rgba(46,156,96,.13);
  --band:rgba(11,135,218,.06);
  --surface:var(--bg2); --surface-brd:var(--line);
  --blur-surface:rgba(255,255,255,.94); --blur-strong:rgba(249,249,246,.82); --done-bg:rgba(232,231,225,.66);
  --shadow-sm:0 1px 2px rgba(28,26,22,.05),0 4px 12px rgba(28,26,22,.045);
  --shadow-md:0 8px 24px rgba(28,26,22,.1); --shadow-lg:0 16px 46px rgba(22,20,17,.16);
  /* 과목 일곱 색 — 빨 주 노 초 파 보 검. 저장값은 hex 가 아니라 키라서
     라이트·다크에서 각각 알맞은 값이 나온다. */
  --sc-red:#DC3B3B; --sc-orange:#E8720F; --sc-yellow:#C08D00; --sc-green:#1E9C57;
  --sc-blue:#4355E0; --sc-purple:#8145D4; --sc-ink:#454952;
  --scs-red:rgba(220,59,59,.13); --scs-orange:rgba(232,114,15,.14); --scs-yellow:rgba(192,141,0,.15);
  --scs-green:rgba(30,156,87,.13); --scs-blue:rgba(67,85,224,.13); --scs-purple:rgba(129,69,212,.13);
  --scs-ink:rgba(69,73,82,.12);
  /* 강조색 위에 얹는 글자. 다크의 밝은 아쿠아 위에 흰 글자를 쓰면 읽히지 않는다. */
  --on-ac:#FFFFFF; --exam-fg:#FFFFFF;
  --r:20px; --r2:16px; --r3:12px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --dockh:78px; --wrap:780px; --gut:50px; --unw:144px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121315; --bg2:#1B1D20; --solid:#1B1D20; --muted:#23262A;
  --ink:#ECEDEA; --ink2:#A4A8A4; --ink3:#6F736F;
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.06);
  --ac:#54BFFF; --ac2:#8AD5FF; --ac-s:rgba(84,191,255,.16); --ac-b:rgba(84,191,255,.42);
  --ac-glow:rgba(84,191,255,.24); --spot-glow:rgba(84,191,255,.5);
  --tour-paper:rgba(247,252,251,.72); --tour-sheen:rgba(255,255,255,.18);
  --tour-halo:rgba(160,213,255,.5); --tour-lift:rgba(246,254,252,.78);
  --tour-ink:#191D1C; --tour-ink2:#48524F; --tour-dim:#818A87; --tour-ac:#0B87DA;
  --gd:#FF6F63; --gd-s:rgba(255,111,99,.16);
  --ok:#48C983; --ok-s:rgba(72,201,131,.15);
  --band:rgba(84,191,255,.08);
  --surface:var(--bg2); --surface-brd:rgba(255,255,255,.1);
  --blur-surface:rgba(27,29,32,.95); --blur-strong:rgba(20,22,24,.8); --done-bg:rgba(35,38,42,.66);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 5px 14px rgba(0,0,0,.2);
  --shadow-md:0 10px 26px rgba(0,0,0,.4); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  --sc-red:#FF6B63; --sc-orange:#FF9440; --sc-yellow:#E8BC42; --sc-green:#45C77E;
  --sc-blue:#8B96FF; --sc-purple:#B183F5; --sc-ink:#AEB3BC;
  --scs-red:rgba(255,107,99,.17); --scs-orange:rgba(255,148,64,.17); --scs-yellow:rgba(232,188,66,.17);
  --scs-green:rgba(69,199,126,.17); --scs-blue:rgba(139,150,255,.17); --scs-purple:rgba(177,131,245,.17);
  --scs-ink:rgba(174,179,188,.16);
  --on-ac:#07131D; --exam-fg:#15171A;
}}
:root[data-theme="dark"]{
  --bg:#121315; --bg2:#1B1D20; --solid:#1B1D20; --muted:#23262A;
  --ink:#ECEDEA; --ink2:#A4A8A4; --ink3:#6F736F;
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.06);
  --ac:#54BFFF; --ac2:#8AD5FF; --ac-s:rgba(84,191,255,.16); --ac-b:rgba(84,191,255,.42);
  --ac-glow:rgba(84,191,255,.24); --spot-glow:rgba(84,191,255,.5);
  --tour-paper:rgba(247,252,251,.72); --tour-sheen:rgba(255,255,255,.18);
  --tour-halo:rgba(160,213,255,.5); --tour-lift:rgba(246,254,252,.78);
  --tour-ink:#191D1C; --tour-ink2:#48524F; --tour-dim:#818A87; --tour-ac:#0B87DA;
  --gd:#FF6F63; --gd-s:rgba(255,111,99,.16);
  --ok:#48C983; --ok-s:rgba(72,201,131,.15);
  --band:rgba(84,191,255,.08);
  --surface:var(--bg2); --surface-brd:rgba(255,255,255,.1);
  --blur-surface:rgba(27,29,32,.95); --blur-strong:rgba(20,22,24,.8); --done-bg:rgba(35,38,42,.66);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 5px 14px rgba(0,0,0,.2);
  --shadow-md:0 10px 26px rgba(0,0,0,.4); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  --sc-red:#FF6B63; --sc-orange:#FF9440; --sc-yellow:#E8BC42; --sc-green:#45C77E;
  --sc-blue:#8B96FF; --sc-purple:#B183F5; --sc-ink:#AEB3BC;
  --scs-red:rgba(255,107,99,.17); --scs-orange:rgba(255,148,64,.17); --scs-yellow:rgba(232,188,66,.17);
  --scs-green:rgba(69,199,126,.17); --scs-blue:rgba(139,150,255,.17); --scs-purple:rgba(177,131,245,.17);
  --scs-ink:rgba(174,179,188,.16);
  --on-ac:#07131D; --exam-fg:#15171A;
}
html,body{height:100%;overscroll-behavior:none;touch-action:pan-x pan-y}
/* 이동이 '꾹 눌러서 끌기'라 누르고 있는 동안 글자가 선택되면 안 된다.
   눌러 잡는 순간 파란 선택 블록이 뜨고 끌기가 글자 끌기로 새어 나간다.
   입력창만 예외로 둔다 — 제목을 고칠 때는 골라 지울 수 있어야 한다. */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* 영어는 낱말 사이가 넓어 한국어용 자간·줄바꿈 규칙을 그대로 쓰면 성기게 읽힌다.
   자간을 되돌리고 낱말 단위 줄바꿈으로 바꾼다. */
:root[data-lang="en"] body{letter-spacing:-.004em}
:root[data-lang="en"] .h1{font-size:23px;letter-spacing:-.026em}
:root[data-lang="en"] .hbtns{min-width:172px;gap:6px}
:root[data-lang="en"] .ib{width:38px;height:38px}
:root[data-lang="en"] .ib svg{width:20px;height:20px}
:root[data-lang="en"] .mascot-home{width:48px;height:62px}
:root[data-lang="en"] .h1 small{word-break:normal;overflow-wrap:break-word}
:root[data-lang="en"] .nb .lb{font-size:9.5px;letter-spacing:-.005em}
:root[data-lang="en"] .tourbody h2{letter-spacing:-.028em}
:root[data-lang="en"] .tourbody p,:root[data-lang="en"] .sheetlead{word-break:normal;overflow-wrap:break-word}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,'Pretendard','Apple SD Gothic Neo','Helvetica Neue',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;position:fixed;inset:0;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::-webkit-scrollbar{width:0;height:0}
/* 카드는 거의 불투명한 '종이'다. 유리(강한 블러)는 실제로 떠 있는 것 — 독·시트 — 에만 쓴다.
   어디나 반투명하면 글자 뒤로 배경이 비쳐 밀도 높은 화면이 읽기 어려워진다. */
.glass{background:var(--blur-surface);border:1px solid var(--surface-brd);box-shadow:var(--shadow-sm)}
.frost{background:var(--blur-strong);border:1px solid var(--surface-brd);box-shadow:var(--shadow-md);
  -webkit-backdrop-filter:blur(26px) saturate(1.06);backdrop-filter:blur(26px) saturate(1.06)}

#app{height:100%;display:flex;flex-direction:column}
#top{padding:calc(var(--st) + 42px) calc(var(--sr) + 20px) 8px calc(var(--sl) + 20px);flex:none}
#topin{max-width:var(--wrap);margin:0 auto}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
/* 마스코트가 탭을 옮겨도 같은 자리에 있도록 제목이 남는 폭을 먹고 버튼 영역 폭을 고정한다.
   버튼 수가 탭마다 달라도(달력은 3개) 오른쪽 정렬이라 보이는 위치는 그대로다. */
.h1{flex:1;min-width:0;overflow:hidden}
.hbtns{min-width:192px;justify-content:flex-end}
.h1{font-size:29px;font-weight:800;letter-spacing:-.034em;line-height:1.08}
/* 제목은 한 줄로 두고, 넘치면 말줄임한다. 넘쳐 흘러 마스코트를 덮으면 안 된다. */
.h1 .hname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 마스코트가 자리를 차지하므로 부제목은 줄이 바뀔 수 있다. 낱말 중간에서 끊기지 않게 한다. */
.h1 small{display:block;font-size:13px;font-weight:650;color:var(--ink3);letter-spacing:-.01em;margin-bottom:3px;word-break:keep-all}
.hbtns{display:flex;gap:8px;align-items:center}
.ib{width:42px;height:42px;border-radius:var(--r3);display:grid;place-items:center;color:var(--ink2);flex:none}
.ib:active{transform:scale(.9);color:var(--ac)}
.ib svg{width:21px;height:21px}
.ib.on{color:var(--ac);background:var(--ac-s)}
/* 2주 이내 마감 — 작은 빨간 글씨 */
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:4px calc(var(--sr) + 20px) calc(var(--sb) + var(--dockh) + 26px) calc(var(--sl) + 20px)}
#view{width:100%;max-width:var(--wrap);margin:0 auto;will-change:transform}

/* 미배정 — 오른쪽 세로 레일 */
.daylayout{display:grid;grid-template-columns:minmax(0,1fr) var(--unw);gap:12px;align-items:start}
/* 미배정 레일은 스크롤과 관계없이 화면 오른쪽에 통째로 보여야 한다.
   높이를 화면 크기로만 계산하면 스크롤 맨 아래에서 sticky 가 풀리며 위가 잘리고
   아래는 독에 가린다. 실제로 보이는 세로를 재서 --railh 에 넣는다(fitRail). */
.unbar{position:sticky;top:4px;z-index:20;padding:9px 8px;border-radius:17px;
  height:var(--railh,calc(100dvh - var(--st) - var(--dockh) - 98px));min-height:150px;
  display:flex;flex-direction:column;transition:box-shadow .16s}
.unbar.tgt{box-shadow:0 0 0 2.5px var(--ac) inset}
.unbar .uh{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase;margin-bottom:7px}
/* 미리보기가 서 있는 동안에는 가운데 정렬을 걷는다. 그러지 않으면 미리보기가
   내용 폭으로 좁아져 이름이 가운데부터 시작한 것처럼 보인다. */
.unrow.hasghost{align-items:stretch;justify-content:flex-start;border-width:0}
.unrow{display:flex;flex-direction:column;gap:7px;overflow-y:auto;overflow-x:hidden;min-height:0;padding-bottom:2px}
.uchip{flex:0 0 auto;min-width:0;display:flex;align-items:center;gap:6px;padding:10px 8px;border-radius:var(--r3);
  background:var(--blur-surface);border:1px solid var(--line2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:transform .16s cubic-bezier(.2,1.5,.4,1),box-shadow .16s ease}
.uchip:active{background:var(--ac-s);border-color:var(--ac-b)}
/* 끌기 시작하면 목록 밖으로 꺼내(absolute) 레일 위로 띄운다. 목록은 스크롤 영역이라
   그 안에 두면 커진 만큼 잘린다. 기준은 .unbar 다. */
/* 칩은 키우지 않고 띄우기만 한다. 조금이라도 키우면 그 칩의 이름만 줄이 어긋나
   목록의 다른 이름·미리보기와 나란하지 않게 보인다. 목록에서 꺼내 그림자로 띄우는
   것만으로도 잡혔다는 건 충분히 보인다. */
.uchip.lift{position:absolute;border-color:var(--ac);background:var(--ac-s);box-shadow:var(--shadow-lg);
  transform:translateY(-2px);z-index:40}
/* 끌기 시작하면 꺼내 둔 원래 칩은 감춘다. 목록 밖으로 꺼내 띄운 것이라
   흐리게만 두면 제자리에 남은 것처럼 보여, 미리보기와 함께 같은 일이 둘로 보인다. */
.uchip.dragging{opacity:.3}
.uchip.lift.dragging{opacity:0}
.uchip.done{background:var(--done-bg)}
.uchip.done .ut{opacity:.56}
.uchip.done .ut>i{text-decoration:line-through}
.uchip .ut{min-width:0;flex:1}
.uchip .ut>i{display:block;font-style:normal;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip .gr{width:14px;flex:none;display:flex;flex-direction:column;gap:2.5px;opacity:.35}
.uchip .gr b{display:block;width:11px;height:1.6px;border-radius:1px;background:var(--ink2)}
.uck{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);background:var(--blur-strong);
  display:grid;place-items:center;flex:none;z-index:2}
.uck:active{transform:scale(.9)}
.uck svg{width:11px;height:11px;color:#fff;opacity:0}
.uck.on{background:var(--ok);border-color:var(--ok)}
.uck.on svg{opacity:1}

/* 전날 미완료 정리 — 오늘 시간표보다 먼저 선택하게 한다. */
.carry{margin-bottom:14px;padding:14px;border-radius:var(--r);box-shadow:var(--shadow-md)}
.carryhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.carryhead b{display:block;font-size:16px;letter-spacing:-.025em}
.carryhead span{display:block;margin-top:2px;font-size:11.5px;font-weight:700;color:var(--ink3)}
.carrycount{flex:none;min-width:28px;height:28px;padding:0 9px;border-radius:10px;display:grid;place-items:center;
  background:var(--ac-s);color:var(--ac);font-size:12px;font-weight:850}
.carrylist{display:flex;flex-direction:column;gap:7px}
.carryrow{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px auto;align-items:center;gap:6px;
  min-height:52px;padding:7px 7px 7px 11px;border:1px solid var(--line2);border-radius:var(--r3);background:var(--blur-strong)}
.carrytext{min-width:0}
.carrytitle{font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carrymeta{margin-top:2px;font-size:10.5px;font-weight:700;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carryck,.carrydel{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1.5px solid var(--line)}
.carryck{background:var(--ok-s);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.carrydel{background:var(--gd-s);color:var(--gd);border-color:color-mix(in srgb,var(--gd) 30%,transparent)}
.carryck svg,.carrydel svg{width:17px;height:17px}
.carrymove{height:38px;padding:0 11px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:5px;
  background:var(--ac-s);color:var(--ac);font-size:11.5px;font-weight:850;white-space:nowrap}
.carrymove svg{width:15px;height:15px}
.carryck:active,.carrydel:active,.carrymove:active{transform:scale(.94)}

/* ── 타임그리드 ── */
#gridwrap{position:relative}
.grid{position:relative;margin-left:var(--gut);border-left:1px solid var(--line)}
.hl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line2);pointer-events:none}
.hl.major{border-top-color:var(--line)}
.hl i{position:absolute;left:calc(-1 * var(--gut));top:-9px;width:calc(var(--gut) - 8px);text-align:right;
  font-style:normal;font-size:11.5px;font-weight:750;color:var(--ink3);font-variant-numeric:tabular-nums}
.band{position:absolute;left:0;right:0;background:var(--band);pointer-events:none;
  border-top:1px solid var(--ac-s);border-bottom:1px solid var(--ac-s)}
.band.gap{background:transparent;border-top:1px dashed var(--line2);border-bottom:none}
.band b{position:absolute;left:7px;top:2px;font-size:11px;font-weight:800;color:var(--ac);opacity:.85;
  letter-spacing:-.02em;white-space:nowrap}
.band.gap b{color:var(--ink3);opacity:.65;font-weight:750}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--gd);z-index:6;pointer-events:none}
.nowl::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--gd)}

.ev{position:absolute;border-radius:11px;overflow:hidden;z-index:4;
  background:var(--bg2);border:1px solid var(--line);box-shadow:0 1px 3px rgba(63,49,36,.08);
  display:flex;flex-direction:column;min-height:0;touch-action:pan-y;
  transition:transform .16s cubic-bezier(.2,1.5,.4,1),box-shadow .16s ease}
.ev.done{opacity:1;background:var(--done-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ev.done .evb{opacity:.55}
.ev.done .evt{text-decoration:line-through}
/* 손이 닿으면 주황 불이 잠깐 들어온다. 미배정 칩과 같은 반응이라야
   두 번 톡톡 하는 동안 '눌리고 있다'가 그리드에서도 보인다. */
.ev:active,.ev.done:active{background:var(--ac-s);border-color:var(--ac-b)}
.ev.act{z-index:12;overflow:visible;box-shadow:var(--shadow-md);border-color:var(--ac);touch-action:none}
/* 선택된 카드 */
/* 잡혀서 움직이는 카드는 살짝 떠오른다 */
.ev.lift{z-index:20;transform:scale(1.035);box-shadow:var(--shadow-lg)}
.evb{flex:1;min-width:0;padding:4px 40px 4px 9px;overflow:hidden;border-radius:10px}
.evtitle{display:flex;align-items:center;gap:6px;min-width:0}
.evt{font-size:13px;font-weight:700;letter-spacing:-.02em;line-height:1.25;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* flex 컨테이너 안의 맨 텍스트에는 text-overflow 가 걸리지 않아 이름이 말줄임 없이 뚝 잘린다.
   이름을 b 로 감싸 거기에 말줄임을 건다. */
.evcat,.ucat{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;max-width:44%;min-width:0;
  font-size:10px;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden}
.evcat b,.ucat b{min-width:0;font-weight:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evcat i,.ucat i{width:7px;height:7px;border-radius:50%;flex:none}
.ucat{display:flex;margin-top:2px;max-width:100%;font-size:9.5px}
.evm{font-size:10px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums;
  overflow:hidden;white-space:nowrap}
.ev.sm .evm{display:none}
.ev.sm .evb{padding:1px 34px 1px 7px}
.ev.sm .evt{font-size:12.5px}
/* 선택하면 나오는 위·아래 손잡이. 보이는 막대는 그대로 두고 잡히는 범위만 넓힌다 —
   9px 막대만으로는 손가락이 자꾸 빗나간다. */
.evtime{position:absolute;right:8px;bottom:3px;font-size:11px;font-weight:850;color:var(--ac);
  font-variant-numeric:tabular-nums;opacity:0;transition:opacity .14s;pointer-events:none;
  background:var(--bg2);padding:0 4px;border-radius:5px}
.ev.act .evtime{opacity:1}
.ev.sm .evtime{display:none}
.evck{position:absolute;right:2px;top:1px;bottom:1px;width:30px;min-height:0;border-radius:8px;border:2px solid var(--line);
  display:grid;place-items:center;z-index:3;background:var(--bg2)}
.evck:active{transform:scale(.9)}
.evck.on{background:var(--ok);border-color:var(--ok)}
.evck svg{width:11px;height:11px;color:#fff;opacity:0}
.evck.on svg{opacity:1}
.ev.sm .evck{right:1px;top:0;bottom:0;width:30px;border-radius:4px}
.ev.sm .evck svg{display:block;width:10px;height:10px}
/* 끌고 있는 동안 도착 자리를 미리 보여주는 반투명 주황 카드.
   시간 칸으로 갈 때든 미배정으로 되돌릴 때든 항상 이게 따라다닌다. */
.dropghost{z-index:16;pointer-events:none;border-color:var(--ac);background:var(--ac-s);
  box-shadow:0 6px 16px rgba(224,122,79,.2);opacity:.94}
.uchip.dropghost{transform:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.ev.dragging{opacity:.32}
#ptag{position:fixed;z-index:210;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--ac);color:var(--on-ac);padding:6px 12px;border-radius:11px;font-size:12.5px;font-weight:800;
  box-shadow:var(--shadow-md);white-space:nowrap;font-variant-numeric:tabular-nums}
#ptag.on{opacity:1}

.card{border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.ctitle{display:flex;align-items:center;justify-content:space-between;padding:15px 17px 10px;gap:8px}
.ctitle b{font-size:12.5px;font-weight:800;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase}
.empty{text-align:center;padding:24px 16px;color:var(--ink3);font-size:13.5px;font-weight:600}

.calh{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
.calh b{font-size:21px;font-weight:800;letter-spacing:-.028em}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow i{font-style:normal;text-align:center;font-size:11.5px;font-weight:800;color:var(--ink3);padding:3px 0}
.dow i.sun{color:var(--gd)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:6px}
.cell{border-radius:var(--r3);background:var(--muted);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;padding-top:7px;gap:3px;position:relative;
  transition:transform .12s;min-height:42px;overflow:hidden}
.cell:active{transform:scale(.94)}
/* 다른 달의 날짜도 이 달과 똑같이 선명하게 둔다. 흐리게 하면 달 경계 주의 날짜를
   읽으려고 눈을 찡그리게 되는데, 시험 기간은 달을 걸쳐 있기 일쑤다. */
.cell.out{opacity:1}
.cell.today{background:var(--ac-s);border-color:var(--ac-b)}
.dn{font-size:15px;font-weight:750;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell.sun .dn{color:var(--gd)}
.cell.today .dn{color:var(--ac)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.dot{width:5px;height:5px;border-radius:50%;background:var(--ac)}
.cdd{font-size:9px;font-weight:800;color:var(--gd);letter-spacing:-.02em;line-height:1.1;text-align:center}

.sjc{width:13px;height:13px;border-radius:50%;flex:none}
/* ── 시험 탭 ─────────────────────────────────────────────────────────
   달로 끊기지 않는 연속 달력. 한 칸에 그 날의 시험·할 일이 그대로 서고,
   다 안 들어가면 그 주의 줄이 통째로 늘어난다. */
.exambar{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ebi{display:inline-flex;align-items:baseline;gap:5px;padding:4px 9px;border-radius:9px;
  background:var(--cs);color:var(--c);font-size:11.5px;font-weight:750;letter-spacing:-.015em;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ebi b{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em}

.exwrap{padding-bottom:8px;min-width:0}
/* 시험 탭은 달력과 미배정 레일이 나란하다. 레일은 화면에 붙어 따라온다. */
.exlayout{display:grid;grid-template-columns:minmax(0,1fr) var(--unw);gap:12px;align-items:start}
.exstage{position:sticky;top:4px;z-index:20;display:flex;flex-direction:column;gap:8px;
  padding:9px 8px;border-radius:17px;max-height:calc(100vh - var(--dockh) - 120px)}
.exstage .uh{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase;margin:0 2px}
.exstage.tgt{box-shadow:inset 0 0 0 2.5px var(--ac)}
.exstagerow{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:12px}
.exchip.stagechip{font-size:12px;padding:7px 8px;border-radius:9px;
  display:flex;align-items:center;gap:7px}
.exchip.stagechip>span{min-width:0;flex:1}
.exchip.stagechip .uck{width:22px;height:22px;border-radius:7px}
.exchip.stagechip .uck svg{width:10px;height:10px}
.stageadd{display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 6px;border-radius:11px;
  border:1.5px dashed var(--line);color:var(--ink3);font-size:12px;font-weight:800}
.stageadd svg{width:12px;height:12px;flex:none}
.stageadd:active{background:var(--ac-s);color:var(--ac);border-color:var(--ac-b)}
/* 시험 탭은 좌우를 넓게 쓴다 — 패드에서 달력이 화면을 가득 채운다. */
body[data-tab="exam"] #view,body[data-tab="exam"] #topin{max-width:none}
.ebi:active{transform:scale(.95)}
.ebi.ebadd{background:transparent;border:1.5px dashed var(--line);color:var(--ink3)}
@media(max-width:620px){
  .exlayout{gap:8px}
  .exdow{padding-right:calc(var(--unw) + 8px)}
  .stageadd{font-size:11px;white-space:nowrap;gap:4px;padding:9px 4px}
  .exchip.stagechip{font-size:11px;padding:6px 6px;gap:5px}
}
/* 요일 줄은 스크롤을 따라 붙어 있어야 몇 월 며칠인지 잃지 않는다. */
/* 요일 줄은 헤더의 일부다. 스크롤 위에 붙여 두면 뒤 날짜 숫자가 위로 삐져나온다.
   오른쪽 여백은 미배정 레일 폭만큼 비워 달력 칸과 열이 맞는다. */
.exdow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  padding:9px calc(var(--unw) + 12px) 0 0}
.exdow i{font-style:normal;text-align:center;font-size:11px;font-weight:800;color:var(--ink3)}
.exdow i.sun{color:var(--gd)}
.exstream{display:flex;flex-direction:column;gap:4px}
.exmore{align-self:center;margin:2px 0 6px;padding:8px 16px;border-radius:11px;background:var(--muted);
  color:var(--ink3);font-size:12px;font-weight:750}
.exmore:active{transform:scale(.96);background:var(--ac-s);color:var(--ac)}
/* 달 이름은 흐르게 둔다. 붙여 두면(sticky) 바로 아래 줄의 날짜 숫자를 덮는다. */
.exmonth{margin:13px 0 3px;font-size:15.5px;font-weight:850;letter-spacing:-.032em;color:var(--ink2)}
.exweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:stretch}
.excell{min-height:72px;border-radius:10px;background:var(--muted);border:1px solid transparent;
  padding:5px 3px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;
  transition:background .16s,border-color .16s}
.excell.out{opacity:1}
.excell.today{background:var(--ac-s);border-color:var(--ac-b)}
.excell.tgt{background:var(--ac-s);border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.exdn{font-size:11px;font-weight:850;color:var(--ink3);text-align:center;line-height:1.1;
  font-variant-numeric:tabular-nums;flex:none}
.excell.today .exdn{color:var(--ac)}
.excell.sun .exdn{color:var(--gd)}
.exitems{display:flex;flex-direction:column;gap:3px;min-width:0}
/* 제목을 자르지 않는다. 다 안 들어가면 칩이 여러 줄이 되고 그만큼 칸이 늘어난다 —
   '+3 더보기' 로 감추면 달력만 보고 그날 할 일을 아는 뜻이 없어진다. */
.exchip{border-radius:6px;background:var(--cs);color:var(--c);padding:3px 4px;
  font-size:10px;font-weight:800;line-height:1.3;letter-spacing:-.03em;
  word-break:keep-all;overflow-wrap:anywhere;touch-action:pan-y}
.exchip i{font-style:normal;opacity:.72;font-variant-numeric:tabular-nums}
.exchip.exam{background:var(--c);color:var(--exam-fg);font-weight:900;letter-spacing:-.02em}
.exchip.done{opacity:.4;text-decoration:line-through}
.exchip.dragging{opacity:.24}
.exchip:active{filter:brightness(.96)}
.exslot{height:15px;border-radius:5px;border:1.5px dashed var(--ac);background:var(--ac-s);flex:none}
/* 꾹 눌러 잡히면 살짝 커지며 떠오른다 — 손에 잡혔다는 신호가 없으면 그냥 스크롤인 줄 안다. */
body.exdrag .dock,body.exdrag .dock>*{pointer-events:none}
#exghost{position:fixed;left:0;top:0;z-index:190;pointer-events:none;will-change:transform}
#exghost .exchip{animation:exlift .19s cubic-bezier(.3,1.5,.5,1) both;box-shadow:var(--shadow-lg);opacity:1}
@keyframes exlift{from{transform:scale(1)}to{transform:scale(1.16)}}
@media(min-width:560px){
  .excell{min-height:84px;padding:6px 5px 7px}
  .exchip{font-size:11.5px;padding:4px 6px}
}
.dd{display:flex;align-items:center;gap:11px;padding:12px 17px;border-top:1px solid var(--line2)}
.ddn{flex:1;min-width:0;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddd{font-size:11.5px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.ddc{font-size:14.5px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em;flex:none;
  padding:5px 11px;border-radius:11px;background:var(--gd-s);color:var(--gd)}

.ddc.past{background:var(--line2);color:var(--ink3)}

.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:11px;

.nb{width:auto;min-width:64px;padding:0 8px;height:52px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;

.nb:active{transform:scale(.9)}
.fab{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:var(--on-ac);
  background:var(--ac);box-shadow:0 8px 18px rgba(164,79,43,.24)}

#popfab{position:fixed;z-index:110;bottom:calc(var(--sb) + 22px);

@media(max-width:620px){
  :root{--gut:44px;--unw:104px}

  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);

  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}

  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  transform:translateY(110%);transition:transform .32s cubic-bezier(.32,.72,0,1);

/* 시트 맨 위 손잡이. 보이는 막대는 42×5 그대로지만 잡히는 범위는 ::before 로
   시트 폭 전체·위아래 13px 넓힌다. 막대 크기 그대로면 끌어내리기가 계속 빗나간다.
   시트는 overflow-x:hidden 이라 넓힌 영역이 가로 스크롤을 만들지 않는다. */
.grab{position:relative;width:42px;height:5px;border-radius:3px;background:var(--ink3);opacity:.45;margin:0 auto 14px;
  transition:opacity .16s,transform .16s}
.grab::before{content:'';position:absolute;left:-50vw;right:-50vw;top:-13px;bottom:-13px}
.dragging-sheet .grab{opacity:.8;transform:scaleX(1.25)}
.sh2{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:16px}
.fl{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;margin:18px 0 8px;

.fl button{font-size:11.5px;font-weight:800;color:var(--ac);letter-spacing:-.01em;text-transform:none}
.fi{width:100%;padding:15px 16px;border-radius:var(--r3);background:var(--muted);border:1px solid var(--line);
  font-size:16px;font-weight:600;transition:.16s}
.fi:focus{border-color:var(--ac);background:var(--ac-s)}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.sg{padding:11px 15px;border-radius:var(--r3);background:var(--muted);border:1px solid var(--line);
  font-size:14px;font-weight:700;color:var(--ink2);transition:.16s}
.sg.on{background:var(--ac);color:var(--on-ac);border-color:transparent;box-shadow:0 3px 10px var(--ac-b)}

/* 말풍선 — 마스코트가 말하는 것처럼 보이게 한다. 모서리만 살짝 깎은 네모라
   마스코트의 픽셀 느낌과 결이 맞고, 배경은 어느 테마에서나 밝은 크림을 유지해

/* ═════ 1. 시간·시간표 ═════ */
const M=(h,m)=>h*60+m;

   나중에 다시 옮기더라도 한 곳만 고친다. */

const PLACE_SNAP=5;         // 직접 배치도 5분 단위 — 6시 정각처럼 5분 끝자리를 맞출 수 있어야 한다
const LEGACY_CLASSES=[
  ['roll', M(6,50), M(7,15), L.legacy[0]],
  ['hr',   M(8,10), M(8,20), L.legacy[1]],
  ['p1',   M(8,30), M(9,20), L.legacy[2]],
  ['p2',   M(9,30), M(10,20),L.legacy[3]],
  ['p3',   M(10,30),M(11,20),L.legacy[4]],

  ['p5',   M(13,30),M(14,20),L.legacy[6]],

/* 기본 시간대 — 시간표를 따로 만들지 않은 사람도 하루가 칸으로 나뉘어 보인다.
   실제 고등학생 하루를 그대로 넣었고, 사용자는 이걸 바탕으로 자기 시간표에 맞게 고쳐 쓴다.
   칸 사이의 빈 시간은 블록으로 만들지 않고 자동으로 이름이 붙어(gapName) 회색으로 보인다. */
const DEFAULT_WEEKDAY=[
  ['p1',  M(8,30), M(9,20),  0],
  ['p2',  M(9,30), M(10,20), 1],
  ['p3',  M(10,30),M(11,20), 2],
  ['p4',  M(11,30),M(12,20), 3],
  ['p5',  M(13,30),M(14,20), 4],
  ['p6',  M(14,30),M(15,20), 5],
  ['p7',  M(15,30),M(16,20), 6],
  ['aft', M(16,50),M(18,0),  7],
  ['ja1', M(19,10),M(21,0),  8],
  ['ja2', M(21,15),M(23,30), 9],
];
const DEFAULT_WEEKEND=[
  ['wam',  M(8,0),  M(9,0),  0],
  ['wam2', M(9,30), M(12,0), 1],
  ['wpm',  M(13,0), M(15,0), 2],
  ['wpm2', M(15,30),M(18,0), 3],
  ['wev',  M(19,0), M(21,0), 4],
  ['wnig', M(21,30),M(23,30),5],
];
/* 시간대는 하나다. 그 안에 요일 묶음을 여러 개 둔다. 평일·주말은 처음부터 들어 있고
   필요하면 얼마든지 더 넣는다. 하나를 고쳐도 시간표가 하나 더 생기는 게 아니라 이
   시간대의 내용이 바뀐다. 한 요일은 한 묶음에만 속하고, 어느 묶음에도 없는 요일은
   그 날만 24시간 보기다. blocks 가 비어 있으면 코드에 있는 원래 값을 쓴다. */
function freshSched(){return {sets:[
  {id:'weekday',kind:'weekday',days:[1,2,3,4,5],blocks:null},
  {id:'weekend',kind:'weekend',days:[0,6],blocks:null}
]};}
function schedRoot(){
  const st=DB.s;
  if(!st.sched||!Array.isArray(st.sched.sets)||!st.sched.sets.length)st.sched=freshSched();
  return st.sched;
}
function schedSets(){return schedRoot().sets;}
/* 이름은 어느 묶음이든 고칠 수 있다. 평일·주말 씨앗은 고치기 전까지만
   정해진 이름을 쓰고, 고치면 그 이름이 그대로 남는다. */
function seedName(kind){return kind==='weekday'?L.defaultWeekday:kind==='weekend'?L.defaultWeekend:'';}
function setName(x){
  if(x.name)return x.name;
  return seedName(x.kind)||L.schedSetFallback;}
function setBlocks(x){
  if(Array.isArray(x.blocks)&&x.blocks.length)return x.blocks.map(b=>({id:b.id,name:b.name,s:b.s,e:b.e,gap:b.gap===true}));
  const src=x.kind==='weekday'?DEFAULT_WEEKDAY:x.kind==='weekend'?DEFAULT_WEEKEND:null;
  if(!src)return [];
  const names=x.kind==='weekend'?L.defaultWeekendBlocks:L.defaultWeekdayBlocks;
  return src.map(v=>({id:v[0],s:v[1],e:v[2],name:names[v[3]]}));
}
function setDays(x){return Array.isArray(x.days)?x.days.slice().sort((a,b)=>a-b):[];}
function setEdited(x){return !!((Array.isArray(x.blocks)&&x.blocks.length)||x.name);}
function findSet(id){return schedSets().find(x=>x.id===id)||null;}
const LEGACY_PROFILE_ID='default-school';
function legacyProfile(){return {id:LEGACY_PROFILE_ID,name:L.schoolName,blocks:LEGACY_CLASSES.map(x=>({id:x[0],s:x[1],e:x[2],name:x[3]}))};}
/* 빈 구간 이름. 점심·저녁은 정확한 분이 아니라 시간대 범위로 잡는다.
   블록으로 만들지 않고 빈 구간으로 두어야 평일 쉬는시간과 같은 회색으로 보인다. */
function gapName(s,e){
  if(s===0)return L.gapDawn;
  if(s>=M(11,30)&&s<=M(13,0))return L.gapLunch;
  if(s>=M(17,30)&&s<=M(19,0))return L.gapDinner;
  if(e<=M(6,50))return L.gapDawn;
  if(s>=M(23,30))return L.gapNight;
  if(s===M(7,15))return L.gapMorning;
  return (e-s)>=25?L.gapFree:L.gapBreak;
}
/* 칸의 시각은 시계 시각으로 저장하지만, 다루는 좌표는 하루선(02:00 시작)이다.
   그래야 '취침 전 23:00~00:30'처럼 자정을 넘는 칸도 그대로 표현된다.
   돌려주는 s·e 는 모두 하루선 분(0~1440)이고 늘 s<e 다. */
function blockSpan(b){const a=rel(b.s);let len=b.e-b.s;if(len<=0)len+=1440;return {a,len};}
/* 하루선의 끝(02:00)을 넘는 칸은 두 조각으로 나뉜다. 같은 칸이 화면 맨 위와
   맨 아래에 나뉘어 보이는 것이고, 저장값은 하나 그대로다. */
function blockSegs(list){
  const segs=[];
  (list||[]).forEach(b=>{
    const sp=blockSpan(b);if(sp.len<=0)return;
    const end=sp.a+sp.len;
    if(end<=1440)segs.push({b,s:sp.a,e:end});
    else{segs.push({b,s:sp.a,e:1440});segs.push({b,s:0,e:end-1440,tail:true});}});
  return segs.sort((x,y)=>x.s-y.s);
}
/* 하루를 칸으로 채워 돌려준다. 칸 사이가 비어 있으면 그 구간에 gapName() 으로
   이름을 붙인 칸을 끼워 넣는다 — 저장값이 어디까지만 채워져 있어도 하루 전체가 보인다.
   `cls` 는 색이 있는 진짜 칸과 자동으로 채운 빈 시간(회색)을 가르는 값이다. 진짜 칸이라도
   '쉬는 시간'으로 켜 두면(gap:true) 색 없이 그려진다 — 색 배정은 이렇게 수동이다. */
function buildScheduleBlocks(profile){
  const out=[];let cur=0;
  const gap=(s,e)=>({id:'g'+s,s,e,name:gapName(abs(s),abs(e)),cls:false});
  blockSegs(profile&&profile.blocks).forEach(x=>{
    if(x.s<cur)return;                       // 앞 칸과 겹치면 건너뛴다
    if(x.s>cur)out.push(gap(cur,x.s));
    out.push({id:x.b.id+(x.tail?'-t':''),s:x.s,e:x.e,name:x.b.name,cls:x.b.gap!==true});cur=x.e;});
  if(cur<1440)out.push(gap(cur,1440));
  return out;
}
function scheduleProfile(ds){
  const d=parseD(ds).getDay();
  const x=schedSets().find(v=>setDays(v).indexOf(d)>=0);
  if(!x)return null;
  const blocks=setBlocks(x);
  return blocks.length?{id:'sched-'+x.id,name:setName(x),blocks}:null;
}
function scheduleBlocks(ds){const p=scheduleProfile(ds);return p?buildScheduleBlocks(p):[];}
function default24(ds){return !scheduleProfile(ds);}
function is24(ds){
  const f=DB.s.force24[ds];
  return f!==undefined?f:default24(ds);
}
function bandAt(ds,min){
  if(is24(ds))return null;
  const r=rel(min);
  const b=scheduleBlocks(ds).find(x=>r>=x.s&&r<x.e)||null;
  if(!b||b.cls||b.e-b.s<=120)return b;
  // 자정~등교 전처럼 긴 빈 구간은 통째로 채우지 않고 손가락이 놓인 1시간만 사용한다.
  const s=Math.max(b.s,Math.floor(r/60)*60);
  return {id:b.id+'h'+s,s,e:Math.min(b.e,s+60),name:b.name,cls:false};
}
function relParts(s,e){
  const rs=rel(s),re=rs+(e-s);
  return re<=1440?[[rs,re]]:[[rs,1440],[0,re-1440]];
}
function hhmm(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function durTxt(d){
  const h=Math.floor(d/60),m=d%60;
  if(d<60)return d+L.minute;
  return m?h+L.hour+' '+m+L.minute:h+L.hour;}
/** 절대 분 → 하루 안에서의 상대 위치(0=02:00) */
const rel=m=>((m-DAY0)%1440+1440)%1440;
const abs=r=>((Math.round(r)+DAY0)%1440+1440)%1440;
const snapTo=(m,step)=>Math.round(m/step)*step;
const snap=m=>snapTo(m,SNAP);
const placeSnap=m=>snapTo(m,PLACE_SNAP);

const KEY='planner_v3';
function freshSettings(){return {force24:{},theme:'sys',sched:freshSched(),tutorialSeen:false,introDone:false};}
function normalizeProfile(p){

/* 옛 저장값(여러 개의 시간표 + 요일 연결)을 하나뿐인 시간대로 옮긴다.
   평일에 가장 많이 걸려 있던 시간표를 평일 벌로, 주말에 걸려 있던 것을 주말 벌로 삼는다.
   어느 쪽에도 없던 요일은 예전처럼 24시간 보기가 되도록 요일 목록에서 뺀다. */

  const dayList=v=>Array.isArray(v)?[...new Set(v.map(Number).filter(x=>x>=0&&x<=6))].sort((a,b)=>a-b):null;
  const out=freshSched();
  const seed=k=>out.sets.find(x=>x.kind===k);
  const rs=raw.sched;
  if(rs&&typeof rs==='object'&&Array.isArray(rs.sets)){          // 지금 형식
    const sets=rs.sets.map(x=>{
      const b=norm(x.blocks),kind=x.kind==='weekday'||x.kind==='weekend'?x.kind:null;
      // 씨앗이라고 이름을 버리면 안 된다. 버리면 고쳐 둔 이름이 새로고침마다 평일·주말로 되돌아간다.
      return {id:String(x.id||uid()),kind,name:String(x.name||'').trim(),
        days:dayList(x.days)||[],blocks:b.length?b:null};
    }).filter(x=>x.kind||x.blocks);
    ['weekday','weekend'].forEach(k=>{if(!sets.some(x=>x.kind===k))
      sets.push({id:k,kind:k,days:[],blocks:null});});
    return {sets};
  }
  if(rs&&typeof rs==='object'&&rs.weekday){                      // v7 두 벌 형식
    ['weekday','weekend'].forEach(k=>{
      const v=rs[k]||{},b=norm(v.blocks),sd=seed(k);

    seed('weekday').days=daysOf(wd.id);
    seed('weekday').blocks=wd.blocks.length?wd.blocks:null;
    seed('weekend').days=we?daysOf(we.id):[];
    seed('weekend').blocks=we&&we.blocks.length?we.blocks:null;
    // 남은 시간표도 묶음으로 그대로 옮긴다
    sorted.filter(pr=>pr!==wd&&pr!==we).forEach(pr=>out.sets.push(
      {id:uid(),name:pr.name,days:daysOf(pr.id),blocks:pr.blocks.length?pr.blocks:null}));
  }else if(legacy&&hasPlannerData&&!raw.defaultBlocks&&raw.defaultSchedOff===undefined&&!Array.isArray(raw.scheduleProfiles)){
    seed('weekday').blocks=legacyProfile().blocks;               // v4 이하
  }

}

   디데이가 있었다면 가장 이른 것을 그 과목의 시험일로 옮긴다 — 적어 둔 날짜를 잃지 않는다.

  const moved=day().find(t=>t.id===movedId); if(!moved) return;
  const ms=R(moved), me=E(moved);
  day().filter(t=>t.id!==movedId).forEach(t=>{
    const ts=R(t), te=E(t);
    if(te<=ms||ts>=me) return;
    if(ts<ms){ t.dur=Math.max(SNAP, ms-ts); }          // 앞엣것은 끝을 잘라 맞춘다
    else { const d=Math.max(SNAP,te-ts);               // 뒤엣것은 뒤로 밀어 이어 붙인다
           t.min=abs(Math.min(1440-d, me)); t.dur=d; }
  });
  // 밀린 것끼리 다시 겹치면 순서대로 정렬해 붙인다
  let cur=me;
  day().filter(t=>t.id!==movedId&&R(t)>=me).sort((a,b)=>R(a)-R(b)).forEach(t=>{
    const d=Math.max(SNAP,taskDur(t,ds));
    if(R(t)<cur) t.min=abs(Math.min(1440-d,cur));
    cur=rel(t.min)+taskDur(t,ds);
  });
}
/** 한 칸의 일정을 원하는 순서로 놓고 칸 시간을 똑같이 나눈다 */
function splitBand(ds, band, fillEvenIfOne, movingId, insertAt){
  let inB=DB.tasks.filter(t=>t.date===ds&&t.min!=null&&rel(t.min)>=band.s&&rel(t.min)<band.e)
    .sort((a,b)=>rel(a.min)-rel(b.min)||(a.ord||0)-(b.ord||0));
  if(movingId&&insertAt!=null){
    const mv=inB.find(t=>t.id===movingId);
    if(mv){inB=inB.filter(t=>t.id!==movingId);
      inB.splice(Math.max(0,Math.min(inB.length,insertAt)),0,mv);}}
  if(!inB.length) return;
  if(inB.length<2&&!fillEvenIfOne) return;
  const each=Math.max(SNAP, snap((band.e-band.s)/inB.length));
  inB.forEach((t,i)=>{
    const st=band.s+each*i;
    t.min=abs(st);
    t.dur=(i===inB.length-1)?Math.max(SNAP,band.e-st):each;
    t.ord=i;});
}
/** 주말 24시간 보기에서 기본 1시간 일정들이 공유하는 상대 시간 슬롯 */
function autoSlotBand(task){
  if(!task||task.autoSlot==null)return null;
  const s=Math.max(0,Math.min(1380,Math.round(task.autoSlot)));
  return {id:'auto'+s,s,e:s+60,auto:true};
}
function autoSlotMembers(ds,band){
  return DB.tasks.filter(t=>{
    if(t.date!==ds||t.min==null)return false;
    if(t.autoSlot===band.s)return true;
    // 기능 추가 전부터 있던, 손대지 않은 1시간 일정도 첫 합류 때 슬롯으로 승격한다.
    return t.autoSlot==null&&rel(t.min)===band.s&&taskDur(t,ds)===60;
  });
}
function autoSlotClean(ds,band,movingId){
  const ids=new Set(autoSlotMembers(ds,band).map(t=>t.id));
  return DB.tasks.filter(t=>t.date===ds&&t.min!=null&&t.id!==movingId).every(t=>{
    const s=rel(t.min),e=s+taskDur(t,ds);
    return e<=band.s||s>=band.e||ids.has(t.id);
  });
}
function weekendSlotAt(ds,at,movingId){
  if(!is24(ds))return null;
  const starts=[];
  DB.tasks.forEach(t=>{
    if(t.date!==ds||t.min==null||t.id===movingId)return;
    const s=t.autoSlot!=null?t.autoSlot:(taskDur(t,ds)===60?rel(t.min):null);
    if(s!=null&&s>=0&&s<=1380&&!starts.includes(s))starts.push(s);
  });
  return starts.map(s=>({id:'auto'+s,s,e:s+60,auto:true}))
    .filter(b=>at>=b.s&&at<b.e&&autoSlotClean(ds,b,movingId))
    .sort((a,b)=>Math.abs(at-(a.s+30))-Math.abs(at-(b.s+30)))[0]||null;
}
function splitAutoSlot(ds,band,fillEvenIfOne,movingId,insertAt){
  let inB=autoSlotMembers(ds,band).sort((a,b)=>rel(a.min)-rel(b.min)||(a.ord||0)-(b.ord||0));
  if(movingId&&insertAt!=null){
    const mv=inB.find(t=>t.id===movingId);
    if(mv){inB=inB.filter(t=>t.id!==movingId);
      inB.splice(Math.max(0,Math.min(inB.length,insertAt)),0,mv);}}
  if(!inB.length)return;
  inB.forEach(t=>{t.autoSlot=band.s;});
  if(inB.length<2&&!fillEvenIfOne){
    inB[0].min=abs(band.s);inB[0].dur=60;inB[0].ord=0;return;}
  const each=Math.max(SNAP,Math.floor(((band.e-band.s)/inB.length)/SNAP)*SNAP);
  inB.forEach((t,i)=>{
    const s=Math.min(band.e-SNAP,band.s+each*i);
    t.min=abs(s);t.dur=(i===inB.length-1)?Math.max(SNAP,band.e-s):each;t.ord=i;});
}
function sameBand(a,b){return !!(a&&b&&a.s===b.s&&a.e===b.e);}
function gridItems(ds){
  return tasksOf(ds).filter(t=>t.min!=null).map(t=>{
    const s=rel(t.min),d=Math.max(SNAP,taskDur(t,ds));
    return {t,s,e:Math.min(1440,s+d)};});
}
/* 짧은 카드가 머무는 칸의 끝. 시간표에서는 해당 밴드, 24시간 보기에서는 다음 정각이다. */
function visualCellEnd(ds,it){
  let end=Math.min(1440,Math.floor(it.s/60)*60+60);
  if(!is24(ds)){
    const b=bandAt(ds,abs(Math.min(1439,it.s)));
    if(b&&it.s>=b.s&&it.s<b.e)end=b.e;
  }
  return Math.max(it.e,end);
}
/* 짧은 카드는 같은 칸의 남은 빈 공간을 먼저 쓴다. 다음 일정이나 칸 끝에 부딪힐 때만 시간축을 늘린다. */
function timeMap(ds){
  const items=gridItems(ds).sort((a,b)=>a.s-b.s||a.e-b.e);
  const spans=items.filter((it,i)=>{
    const d=it.e-it.s;if(d<=0||d*PPM>=MIN_EVENT_PX)return false;
    const next=items.slice(i+1).find(x=>x.t.id!==it.t.id);
    const roomEnd=Math.max(it.e,Math.min(visualCellEnd(ds,it),next?next.s:1440));
    return (roomEnd-it.s)*PPM<MIN_EVENT_PX;
  }).map(it=>({s:it.s,e:it.e,scale:MIN_EVENT_PX/(it.e-it.s)}));
  const cuts=[0,1440];spans.forEach(x=>{cuts.push(x.s,x.e);});
  cuts.sort((a,b)=>a-b);
  const uniq=cuts.filter((x,i)=>!i||x!==cuts[i-1]),segs=[];let total=0;
  for(let i=0;i<uniq.length-1;i++){
    const s=uniq[i],e=uniq[i+1],mid=(s+e)/2;
    let scale=PPM;
    spans.forEach(x=>{if(mid>=x.s&&mid<x.e)scale=Math.max(scale,x.scale);});
    segs.push({s,e,y:total,scale});total+=(e-s)*scale;}
  const y=min=>{min=Math.max(0,Math.min(1440,min));
    if(min===1440)return total;
    const q=segs.find(x=>min>=x.s&&min<x.e)||segs[segs.length-1];
    return q.y+(min-q.s)*q.scale;};
  const min=px=>{px=Math.max(0,Math.min(total,px));
    if(px===total)return 1440;
    const q=segs.find(x=>px>=x.y&&px<x.y+(x.e-x.s)*x.scale)||segs[segs.length-1];
    return q.s+(px-q.y)/q.scale;};
  return {height:total,y,min};
}
function evHTML(it,map){

  return '<div class="ev'+done+small+'" data-id="'+t.id+'" '+

    (sj?'<span class="evcat"><i style="background:'+scVar(sj.color)+'"></i><b>'+esc(sj.name)+'</b></span>':'')+'</div>'+
    '<div class="evm">'+hhmm(t.min)+'~'+hhmm(end)+' \u00b7 '+durTxt(it.e-it.s)+(t.repId?' \u00b7 '+L.repeatShort:'')+'</div></div>'+
    '<div class="evtime">'+hhmm(t.min)+'~'+hhmm(end)+'</div>'+ck+'</div>';
}
function renderDay(ds){
  const map=timeMap(ds),H=map.height;

       (hh>=17?'<b>'+esc(b.name)+'</b>':'')+'</div>';}));

/* 할 일에 과목을 붙이는 건 고르기가 아니라 **태그**다. 제목에 그 과목의 태그가 들어 있으면
   그 과목 색으로 칠한다. 여러 과목이 걸리면 더 긴(= 더 구체적인) 태그가 이긴다. */
function subjOfTitle(title){
  const t=String(title||'').toLowerCase();
  if(!t)return null;
  let best=null,len=0;
  DB.subjects.forEach(x=>(x.tags||[]).forEach(g=>{
    const k=String(g||'').trim().toLowerCase();
    if(k&&k.length>len&&t.indexOf(k)>=0){len=k.length;best=x;}}));
  return best;
}

/* 시험일이 잡힌 과목의 디데이는 화면 맨 위에 **전부** 선다. 2주 안쪽만 보여 주면

/* `full` 은 시험 탭이다. 과목 판을 없앴으므로 이 줄이 과목의 **유일한 입구**다 —
   지난 시험도, 아직 날짜가 없는 시험도 여기 서야 손이 닿는다. 오늘 탭은 예전처럼

/* ═════ 8. 시험 ═════ */
/* 시험기간에 쓰는 탭이다. 다른 달력 탭과 달리 **달로 끊지 않는다** — 주(週)를 계속 이어
   붙이고, 달이 시작하는 주 앞에만 달 이름을 끼운다.
   이 탭은 **시험 계획 전용**이다. 여기서 만든 일(task.exam)만 달력에 서고,
   오늘 탭에서 만든 일반 미배정은 여기 올라오지 않는다. 반대로 여기서 만든 일은
   그 날의 미배정으로도 들어가서, 오늘 탭에서 시간을 잡아도 여기서는 사라지지 않는다. */
const EX={start:null,weeks:0};
const EX_BACK=4, EX_WEEKS=26, EX_STEP=8, EX_PREPEND=6;
function weekStart(ds){const d=parseD(ds);d.setDate(d.getDate()-d.getDay());return d;}
function examReset(){
  const st=weekStart(TODAY());st.setDate(st.getDate()-7*EX_BACK);
  EX.start=dstr(st);EX.weeks=EX_WEEKS;
}
function examWeekDate(i,j){const d=parseD(EX.start);d.setDate(d.getDate()+i*7+(j||0));return d;}
/* 완료된 일은 레일 바닥으로 가라앉는다 — 달력 칸과 같은 규칙이다. */
function stageList(){return DB.stage.slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.ord||0)-(b.ord||0));}
function examTasksOf(ds){return tasksOf(ds).filter(t=>t.exam);}
/* 그 날에 놓인 것들. 시험이 맨 위, 그 다음 **안 한 일**(손으로 정한 순서), 완료된 일은
   전부 바닥으로 보낸다 — 남은 일이 항상 위에 모여 있어야 한눈에 읽힌다. */
function examItems(ds){
  const ex=DB.subjects.filter(x=>x.exam===ds).sort((a,b)=>(a.ord||0)-(b.ord||0)).map(x=>({exam:true,s:x}));
  const ts=examTasksOf(ds).sort((a,b)=>
    (exHeld(a.id)?0:a.done?1:0)-(exHeld(b.id)?0:b.done?1:0)||(a.ord||0)-(b.ord||0)||(a.min||0)-(b.min||0)).map(t=>({exam:false,t}));
  return ex.concat(ts);
}
/* 과목 순서는 `ord` 하나가 정한다. 같은 날 시험이 여럿이면 그 순서가 곧
   **그 날 먼저 보는 시험**이고, 헤더 디데이 줄도 같은 값을 따라간다.
   옮긴 뒤에는 (시험일 → 그 날 안의 자리) 순으로 전체를 다시 번호 매겨,
   날짜를 건너 옮겨도 번호가 엉키지 않게 한다. */
function renumberSubjects(){
  const key=x=>x.exam||'9999-99-99';
  DB.subjects.sort((a,b)=>(key(a)<key(b)?-1:key(a)>key(b)?1:0)||(a.ord||0)-(b.ord||0));
  DB.subjects.forEach((x,i)=>{x.ord=i;});
}
/* 과목 x 를 ds 날의 at 번째 시험으로 놓는다. 이웃 사이의 중간값을 잠깐 준 뒤
   전체를 다시 번호 매기면 앞뒤 어느 쪽으로 옮겨도 한 번에 맞는다. */
function placeExamSubject(x,ds,at){
  x.exam=ds;
  const day=DB.subjects.filter(v=>v.exam===ds&&v.id!==x.id).sort((a,b)=>(a.ord||0)-(b.ord||0));
  const i=Math.max(0,Math.min(day.length,at)),before=day[i-1],after=day[i];
  x.ord=before?(after?(before.ord+after.ord)/2:before.ord+1):(after?after.ord-1:0);
  renumberSubjects();
}
function examChipHTML(it,extra){

/* 달 이름은 그 달의 1일이 든 주 앞에 세운다. 맨 첫 줄은 어느 달인지 알 수 없으니 붙여 준다. */
function examWeeksHTML(from,count){
  let h='';

/* 오늘이 화면 위쪽 1/5 에 오게 맞춘다. 시험기간에는 지난 날보다 앞이 중요하다. */
function examScrollToToday(){

/* 뒤는 끝에 닿기 전에 미리 이어 붙인다 — 달이 바뀌는 자리에서 화면이 멈추면 안 된다.
   앞(지난 주)은 **자동으로 붙이지 않는다.** 자동으로 붙이면 맨 위로 올릴 때마다 앞이 늘어나
   과목 판이 계속 위로 도망간다. 지난 날은 시험 계획에서 급하지 않으므로 버튼으로 받는다. */
function examScroll(){

function examMore(){

/* 레일 칩의 완료. 미배정인 채로 완료만 뒤집는다 — 완료하려고 날짜를 잡을 이유는 없다. */
function toggleStageDone(id){

/* ═════ 꾹 눌러 끌기 ═════
   시험 탭의 이동은 **꾹 누르기**다. 칸 안의 글자를 읽으려고 손을 얹었을 뿐인데 딸려 오면
   안 되고, 그렇다고 손잡이를 붙이기엔 칩이 너무 작다. 눌러서 기다리면 살짝 커지며
   떠오르고(손에 잡혔다는 신호), 그때부터 손가락을 따라온다.
   완료된 칩은 끌지 않는다 — 완료는 바닥에 가라앉은 기록이지 다시 계획할 대상이 아니다. */
const EXD={on:false,armed:false,el:null,ghost:null,kind:null,id:null,
           x:0,y:0,dx:0,dy:0,timer:null,tgt:null,idx:0,slot:null,scrollTimer:null};
const EX_HOLD=280, EX_SLOP=10;
/* 두 번째 탭을 기다리는 시간. 완료를 이만큼 미뤄 두고, 그 안에 두 번째 탭이 오면 수정이다.
   기다리는 시간과 두 번으로 세는 창은 **같은 값**이어야 한다 — 창이 더 좁으면 그 틈에
   떨어진 두 번째 탭이 두 번으로도, 새 한 번으로도 못 세어져 아무 일도 안 일어난다. */
const EX_DBL=340;
/* 터치가 끝나면 브라우저가 mousedown/mouseup/click 을 한 벌 더 만들어 보낸다.
   그걸 새 누름으로 받으면 꾹 누르기 타이머가 한 번 더 돌아 손도 안 댄 칩이 떠오른다. */
let _exTouchAt=0;
/* 손가락이 칩 위에서 시작해 흘러갔으면(= 스크롤·탭 넘기기) 그건 탭이 아니다.
   브라우저가 그런 경우 click 을 안 보내 주기를 기대하지 않고 우리가 직접 센다. */
let _exMoved=false;
function exClearTimer(){clearTimeout(EXD.timer);EXD.timer=null;}
function exPoint(e){const t=e.touches&&e.touches[0]||e.changedTouches&&e.changedTouches[0]||e;
  return {x:t.clientX,y:t.clientY};}
function exLift(){
  const el=EXD.el;if(!el)return;
  EXD.on=true;EXD.armed=false;GD.on=true;buzz(14);
  // 끌고 있는 동안에는 아래 독을 관통해 놓을 수 있어야 한다. 독이 화면 아래를 덮고 있어서
  // 이걸 빼면 자동 스크롤로 끝까지 내려가 놓으려는 순간 독에 막혀 아무 데도 안 놓인다.
  document.body.classList.add('exdrag');
  const r=el.getBoundingClientRect();
  const g=document.createElement('div');g.id='exghost';
  g.style.width=r.width+'px';
  g.innerHTML=el.outerHTML;
  document.body.appendChild(g);
  EXD.ghost=g;EXD.dx=EXD.x-r.left;EXD.dy=EXD.y-r.top;
  exMoveGhost();
  el.classList.add('dragging');
}
function exMoveGhost(){
  if(EXD.ghost)EXD.ghost.style.transform='translate3d('+(EXD.x-EXD.dx)+'px,'+(EXD.y-EXD.dy)+'px,0)';
}
/* 몇 번째 자리인지 잴 때는 도착 자리 빈 줄(`.exslot`)을 잠깐 숨긴다. 빈 줄이 낀 채로
   재면 그 높이만큼 아래 칩들이 밀려나 손가락이 경계를 넘어도 넘은 게 되지 않는다 —
   빈 줄이 스스로를 밀어내며 제자리를 지키는 꼴이라 순서가 아예 안 바뀐다. */
function exIndexAt(list,y){
  const s=EXD.slot,vis=s?s.style.display:null;
  if(s)s.style.display='none';
  let idx=list.length;
  for(let i=0;i<list.length;i++){
    const r=list[i].getBoundingClientRect();
    if(y<r.top+r.height/2){idx=i;break;}}
  if(s)s.style.display=vis||'';
  return idx;
}
function exClearTarget(){
  document.querySelectorAll('.excell.tgt,.exstage.tgt').forEach(n=>n.classList.remove('tgt'));
  if(EXD.slot&&EXD.slot.parentNode)EXD.slot.parentNode.removeChild(EXD.slot);
  EXD.slot=null;EXD.tgt=null;
}
/* 도착 자리를 보여 준다. 칸을 밝히는 것만으로는 '몇 번째로 들어가는지' 알 수 없어서
   들어갈 자리에 빈 줄을 세운다. 자리는 **안 한 일들 사이**에만 선다 —
   완료 더미 사이나 그 아래로는 끼어들 수 없다. */
function exHover(){
  if(EXD.ghost)EXD.ghost.style.pointerEvents='none';
  const at=document.elementFromPoint(EXD.x,EXD.y);
  const cell=at&&at.closest?at.closest('.excell'):null;
  const stage=at&&at.closest?at.closest('.exstage'):null;
  if(!cell&&!stage){exClearTarget();return;}
  if(stage){
    if(EXD.kind==='exam'){exClearTarget();return;}        // 시험 칩은 미배정이 될 수 없다
    const box=stage.querySelector('.exstagerow');
    // 안 한 일들 사이에만 선다. 완료 더미 사이나 그 아래로는 끼어들 수 없다(달력 칸과 같다).
    const chips=[...box.querySelectorAll('.stagechip')].filter(n=>
      n!==EXD.el&&n!==EXD.slot&&!n.classList.contains('done'));
    const idx=exIndexAt(chips,EXD.y);
    if(EXD.tgt&&EXD.tgt.stage&&EXD.idx===idx&&EXD.slot&&EXD.slot.parentNode===box)return;
    exClearTarget();stage.classList.add('tgt');
    const slot=document.createElement('div');slot.className='exslot';
    box.insertBefore(slot,chips[idx]||box.querySelector('.stagechip.done')||null);
    EXD.slot=slot;EXD.tgt={stage:true};EXD.idx=idx;
    return;
  }
  const ds=cell.dataset.d;
  const box=cell.querySelector('.exitems');
  /* 시험 칩은 **시험 칩들 사이**에만 선다. 같은 날 시험끼리의 순서가 곧 그 날 보는
     순서라서, 할 일 사이로 끼워 봐야 뜻이 없다. */
  if(EXD.kind==='exam'){
    const ex=[...box.querySelectorAll('.exchip.exam')].filter(n=>n!==EXD.el&&n!==EXD.slot);
    const i2=exIndexAt(ex,EXD.y);
    if(EXD.tgt&&EXD.tgt.ds===ds&&EXD.idx===i2&&EXD.slot&&EXD.slot.parentNode===box)return;
    exClearTarget();cell.classList.add('tgt');
    const slot=document.createElement('div');slot.className='exslot';
    box.insertBefore(slot,ex[i2]||box.querySelector('.exchip:not(.exam)')||null);
    EXD.slot=slot;EXD.tgt={ds};EXD.idx=i2;
    return;
  }
  const und=[...box.querySelectorAll('.exchip')].filter(n=>
    n!==EXD.el&&n!==EXD.slot&&!n.classList.contains('exam')&&!n.classList.contains('done'));
  const idx=exIndexAt(und,EXD.y);
  const anchor=und[idx]||box.querySelector('.exchip.done')||null;   // 완료 더미 위에서 멈춘다
  if(EXD.tgt&&EXD.tgt.ds===ds&&EXD.idx===idx&&EXD.slot&&EXD.slot.parentNode===box)return;
  exClearTarget();
  cell.classList.add('tgt');
  const slot=document.createElement('div');slot.className='exslot';
  box.insertBefore(slot,anchor);
  EXD.slot=slot;EXD.tgt={ds};EXD.idx=idx;
}
/* 손가락이 화면 위·아래 끝에 닿아 있으면 계속 굴러간다. 달력이 길어서 이게 없으면
   먼 날짜로 옮길 수가 없다. */
function exAutoScroll(){
  if(!EXD.on)return;
  const S=$('#scroll'),r=S.getBoundingClientRect();
  // 아래쪽 임계는 독 높이만큼 위로 올린다 — 독에 가린 자리에서야 굴러가면 이미 늦다.
  const dock=(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dockh'))||78)+14;
  let v=0;
  if(EXD.y<r.top+58)v=-Math.min(17,(r.top+58-EXD.y)/4);
  else if(EXD.y>r.bottom-dock)v=Math.min(17,(EXD.y-(r.bottom-dock))/4);
  if(v){S.scrollTop+=v;exHover();}
}
function exEnd(apply){
  exClearTimer();
  const el=EXD.el;
  if(EXD.on){
    if(apply&&EXD.tgt)examApplyDrop();
    if(EXD.ghost&&EXD.ghost.parentNode)EXD.ghost.parentNode.removeChild(EXD.ghost);
    exClearTarget();
    if(el)el.classList.remove('dragging');
    document.body.classList.remove('exdrag');
    GD.on=false;GD.endedAt=Date.now();
  }
  EXD.on=false;EXD.armed=false;EXD.el=null;EXD.ghost=null;EXD.kind=null;EXD.id=null;
  clearInterval(EXD.scrollTimer);EXD.scrollTimer=null;
}
/* 그 날의 안 한 시험 일들 중 at 번째 자리에 t 를 끼운다. ord 는 그 날 전체에서
   다시 매기므로 오늘 탭 미배정 레일의 순서도 함께 맞는다. */
function placeExamTask(t,ds,at){
  const all=tasksOf(ds).filter(v=>v.id!==t.id).sort((a,b)=>(a.ord||0)-(b.ord||0)||(a.min||0)-(b.min||0));
  const und=all.filter(v=>v.exam&&!v.done);
  let pos;
  if(at>=und.length)pos=und.length?all.indexOf(und[und.length-1])+1:all.length;
  else pos=all.indexOf(und[at]);
  all.splice(pos,0,t);
  all.forEach((v,i)=>{v.ord=i;});
}
function examApplyDrop(){
  const tgt=EXD.tgt;
  if(EXD.kind==='exam'){
    // 시험일을 지우는 건 과목 시트의 '날짜 지우기'다 — 달력 안에서는 날짜만 옮긴다.
    const x=subjOf(EXD.id);if(!x||tgt.stage||!tgt.ds)return;
    const moved=x.exam!==tgt.ds;
    placeExamSubject(x,tgt.ds,EXD.idx);
    save();paint();buzz(12);
    // 같은 날 안에서 순서만 바꾼 것이면 알림을 띄우지 않는다 — 날짜는 그대로다.
    if(moved)toast(L.examSet(x.name,fmtDot(parseD(tgt.ds))));
    return;
  }
  if(EXD.kind==='stage'){
    const g=DB.stage.find(v=>v.id===EXD.id);if(!g)return;
    if(tgt.stage){                                     // 레일 안 순서 바꾸기
      const list=stageList().filter(v=>v.id!==g.id);
      list.splice(Math.max(0,Math.min(list.length,EXD.idx)),0,g);
      list.forEach((v,i)=>{v.ord=i;});DB.stage=list;
    }else if(tgt.ds){                                  // 날짜에 배정 → 그 날의 미배정
      DB.stage=DB.stage.filter(v=>v.id!==g.id);
      DB.stage.forEach((v,i)=>{v.ord=i;});
      const t={id:g.id,title:g.title,date:tgt.ds,min:null,dur:null,autoSlot:null,
               ord:0,done:false,subj:null,mile:null,repId:null,exam:true};
      DB.tasks.push(t);
      placeExamTask(t,tgt.ds,EXD.idx);
    }else return;
    save();paint();buzz(12);
    return;
  }
  const t=DB.tasks.find(v=>v.id===EXD.id);if(!t)return;
  if(tgt.stage){                                       // 달력 → 레일: 날짜를 다시 비운다
    const oldDs=t.date,oldBand=t.min!=null?(autoSlotBand(t)||bandAt(t.date,t.min)):null;
    addRepException(t);
    DB.tasks=DB.tasks.filter(v=>v.id!==t.id);
    if(oldBand){if(oldBand.auto)splitAutoSlot(oldDs,oldBand,true);else splitBand(oldDs,oldBand,true);}
    const list=stageList();
    list.splice(Math.max(0,Math.min(list.length,EXD.idx)),0,{id:t.id,title:t.title,ord:0,done:false});
    list.forEach((v,i)=>{v.ord=i;});DB.stage=list;
    save();paint();buzz(12);
    return;
  }
  if(!tgt.ds)return;
  const ds=tgt.ds;
  if(t.date!==ds){
    // 다른 날로 보내면 시간은 따라가지 않는다. 그날 계획은 그날 다시 짠다 —
    // 그래서 도착한 날의 **미배정**으로 들어간다.
    const oldDs=t.date,oldBand=t.min!=null?(autoSlotBand(t)||bandAt(t.date,t.min)):null;
    addRepException(t);
    Object.assign(t,{date:ds,min:null,dur:null,autoSlot:null,repId:null});
    if(oldBand){if(oldBand.auto)splitAutoSlot(oldDs,oldBand,true);else splitBand(oldDs,oldBand,true);}
  }
  placeExamTask(t,ds,EXD.idx);
  save();paint();buzz(12);
}
/* 탭 한 번은 완료, 두 번은 수정이다. 완료는 **기다리지 않고 그 자리에서** 뒤집는다 —
   두 번째 탭을 기다렸다 실행하면 한 번 누를 때마다 반응이 늦어 앱이 굼떠 보인다.
   두 번째 탭이 오면 첫 탭이 뒤집은 것을 되돌리고 수정 시트를 연다.
   대신 완료된 칩은 그 칸 바닥으로 가라앉으므로, 두 번째 탭을 받는 동안에는
   방금 누른 칩만 제자리에 붙들어 둔다(`_exHold`). 안 붙들면 첫 탭에 칩이 밑으로
   내려가 버려 두 번째 탭이 엉뚱한 칩에 떨어진다. */
let _exClick={id:null,at:0,timer:null};
let _exHold={id:null,until:0,timer:null};
function exHeld(id){return _exHold.id===id&&Date.now()<_exHold.until;}
function exHoldSpot(id){
  clearTimeout(_exHold.timer);
  _exHold={id,until:Date.now()+EX_DBL,timer:setTimeout(()=>{
    _exHold={id:null,until:0,timer:null};
    if(tab==='exam')paint();                 // 창이 닫히면 제자리로 가라앉는다
  },EX_DBL)};
}
function exToggleDone(id){
  const t=DB.tasks.find(v=>v.id===id);if(!t)return;
  t.done=!t.done;buzz(9);save();exHoldSpot(id);paint();
}
function bindExamDrag(){
  const v=$('#view');if(!v||v._exb)return;v._exb=true;
  const down=e=>{
    if(EXD.on)return;
    if(e.target.closest&&e.target.closest('.uck'))return;  // 완료 버튼은 끌기와 분리한다
    const chip=e.target.closest&&e.target.closest('.exchip');
    if(!chip)return;
    if(chip.classList.contains('done'))return;           // 완료된 칩은 끌지 않는다
    const p=exPoint(e);EXD.x=p.x;EXD.y=p.y;
    _exMoved=false;EXD.el=chip;
    EXD.kind=chip.dataset.sid?'exam':(chip.dataset.gid?'stage':'task');
    EXD.id=chip.dataset.sid||chip.dataset.gid||chip.dataset.tid;EXD.armed=true;
    exClearTimer();
    EXD.timer=setTimeout(()=>{if(EXD.armed)exLift();},EX_HOLD);
    clearInterval(EXD.scrollTimer);EXD.scrollTimer=setInterval(exAutoScroll,16);
  };
  const move=e=>{
    if(!EXD.armed&&!EXD.on)return;
    const p=exPoint(e);
    if(EXD.armed){
      if(Math.abs(p.x-EXD.x)>EX_SLOP||Math.abs(p.y-EXD.y)>EX_SLOP){
        _exMoved=true;EXD.armed=false;exClearTimer();
        clearInterval(EXD.scrollTimer);EXD.scrollTimer=null;}
      return;
    }
    if(e.cancelable)e.preventDefault();
    _exMoved=true;EXD.x=p.x;EXD.y=p.y;exMoveGhost();exHover();
  };
  v.addEventListener('touchstart',e=>{_exTouchAt=Date.now();down(e);},{passive:true});
  v.addEventListener('touchmove',move,{passive:false});
  v.addEventListener('touchend',()=>{_exTouchAt=Date.now();exEnd(true);});
  v.addEventListener('touchcancel',()=>{_exTouchAt=Date.now();exEnd(false);});
  v.addEventListener('mousedown',e=>{
    if(Date.now()-_exTouchAt<700)return;      // 터치가 만든 합성 mousedown 은 받지 않는다
    if(e.button===0)down(e);});
  window.addEventListener('mousemove',e=>{if(EXD.armed||EXD.on)move(e);});
  window.addEventListener('mouseup',()=>{if(EXD.armed||EXD.on)exEnd(true);});
  /* 탭 규칙 — 할 일 칩: 한 번은 완료 토글, 두 번은 수정. 시험 칩: 두 번에 과목 수정.
     레일 칩: 한 번에 수정. 빈 칸 탭은 아무 일도 하지 않는다(오늘 탭과 같다). */
  v.addEventListener('click',e=>{
    // 끌기가 방금 끝났거나(합성 click), 손가락이 흘러가 스크롤이 된 손짓은 탭이 아니다.
    if(Date.now()-GD.endedAt<320||_exMoved)return;
    const chip=e.target.closest('.exchip');
    if(!chip)return;
    const id=chip.dataset.tid||chip.dataset.sid||chip.dataset.gid;
    if(chip.dataset.gid){
      if(e.target.closest('.uck'))toggleStageDone(id);else editStage(id);
      return;}
    const dbl=_exClick.id===id&&Date.now()-_exClick.at<EX_DBL;
    if(dbl){
      _exClick.id=null;
      if(chip.dataset.sid){editExamSubject(id);return;}
      const t=DB.tasks.find(v=>v.id===id);   // 첫 탭이 뒤집은 완료를 되돌린다
      if(t){t.done=!t.done;save();}
      clearTimeout(_exHold.timer);_exHold={id:null,until:0,timer:null};
      openTask(id);return;
    }
    _exClick.id=id;_exClick.at=Date.now();
    if(chip.dataset.tid)exToggleDone(id);    // 기다리지 않고 바로 뒤집는다
  });
}

function todayStartScroll(){

  const target=timeMap(TODAY()).y(rel(nowMin))-S.clientHeight*.32;

function placeThumb(){
  const bar=$('#navtabs');if(!bar)return;
  const th=bar.querySelector('.dockthumb'),a=bar.querySelector('.nb.on');if(!th||!a)return;
  th.style.width=a.offsetWidth+'px';th._x=a.offsetLeft;

function attachDockDrag(){
  const bar=$('#navtabs');if(!bar||bar._bound)return;bar._bound=true;
  const th=bar.querySelector('.dockthumb');let on=false;
  const idxAt=cx=>{const b=[...bar.querySelectorAll('.nb')];let bi=0,bd=1e9;
    b.forEach((n,i)=>{const r=n.getBoundingClientRect(),c=(r.left+r.right)/2;
      if(Math.abs(cx-c)<bd){bd=Math.abs(cx-c);bi=i;}});return bi;};
  bar.addEventListener('touchstart',()=>{on=true;th.classList.add('drag');
    th.style.transition='transform .18s ease-out, background .2s';
    th.style.transform='translateX('+(th._x||0)+'px) scale(1.13)';},{passive:true});
  bar.addEventListener('touchmove',e=>{if(!on)return;if(e.cancelable)e.preventDefault();
    const r=bar.getBoundingClientRect(),tw=th.offsetWidth;
    let x=e.touches[0].clientX-r.left-tw/2;x=Math.max(0,Math.min(bar.clientWidth-tw,x));
    th._x=x;th.style.transition='none';th.style.transform='translateX('+x+'px) scale(1.13)';},{passive:false});

    const cx=e.changedTouches?e.changedTouches[0].clientX:0,b=[...bar.querySelectorAll('.nb')],i=idxAt(cx),nt=b[i].dataset.t;
    if(nt!==tab)go(nt);else{th._x=b[i].offsetLeft;th.style.transform='translateX('+b[i].offsetLeft+'px)';}};
  bar.addEventListener('touchend',rel2,{passive:true});

/* 시계 버튼의 불은 '시간대(시간표) 보기'를 뜻한다. 24시간 보기면 불이 꺼진다.

function toggleDone(id){const t=DB.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;buzz(9);save();refresh();}
/* 한 번 톡 = 완료, 두 번 톡톡 = 수정. 시험 탭과 **같은 규칙·같은 시간**이다.
   완료는 기다리지 않고 그 자리에서 뒤집고, 두 번째 톡이 오면 그것을 되돌린 뒤 시트를 연다.
   두 번째를 기다렸다 완료를 실행하면 한 번 누를 때마다 반응이 늦어 앱이 굼떠 보인다.
   여기 카드는 완료해도 자리가 바뀌지 않으므로 시험 탭처럼 자리를 붙들 필요는 없다. */
let _tap={id:null,at:0};
function tapTask(id){
  const t=DB.tasks.find(x=>x.id===id);if(!t)return;
  if(_tap.id===id&&Date.now()-_tap.at<EX_DBL){
    _tap.id=null;t.done=!t.done;save();     // 첫 톡이 뒤집은 완료를 되돌린다
    openTask(id);return;}
  _tap.id=id;_tap.at=Date.now();
  toggleDone(id);

function carryAction(id,action){
  const prev=addDays(TODAY(),-1),t=DB.tasks.find(x=>x.id===id&&x.date===prev&&!x.done);if(!t)return;
  if(action==='done'){
    t.done=true;
  }else if(action==='delete'||action==='move'){
    const oldDate=t.date,oldBand=t.min!=null?(autoSlotBand(t)||bandAt(t.date,t.min)):null;
    addRepException(t);
    if(action==='delete')DB.tasks=DB.tasks.filter(x=>x.id!==t.id);
    else{
      const ord=DB.tasks.filter(x=>x.date===TODAY()&&x.min==null).length;
      Object.assign(t,{date:TODAY(),min:null,dur:null,autoSlot:null,ord,done:false,repId:null});
    }
    if(oldBand){if(oldBand.auto)splitAutoSlot(oldDate,oldBand,true);else splitBand(oldDate,oldBand,true);}
  }else return;
  save();buzz(10);paint();
  toast(action==='done'?L.carryDone:action==='delete'?L.carryDeleted:L.carryMoved);
}

/* ═════ 10. 스와이프 — 가로로 쓸어 탭을 넘긴다 ═════ */
(function(){
  const S=$('#scroll');let x0=null,y0=null,decided=false,horiz=false;
  S.addEventListener('touchstart',e=>{if(_anim||GD.on){x0=null;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;decided=false;horiz=false;},{passive:true});
  S.addEventListener('touchmove',e=>{
    if(x0==null||GD.on)return;
    const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
    if(!decided&&(Math.abs(dx)>10||Math.abs(dy)>10)){decided=true;horiz=Math.abs(dx)>Math.abs(dy)*1.6;}
    if(horiz&&e.cancelable){e.preventDefault();const v=$('#view');v.style.transition='none';
      v.style.transform='translateX('+(dx*.28)+'px)';v.style.opacity=String(Math.max(.55,1-Math.abs(dx)/620));}
  },{passive:false});
  const end=e=>{if(x0==null)return;const v=$('#view');
    if(horiz){const dx=(e.changedTouches?e.changedTouches[0].clientX:x0)-x0;
      const order=['today','cal','exam'],i=order.indexOf(tab);
      v.style.transition='transform .26s cubic-bezier(.3,1.1,.4,1),opacity .24s';
      v.style.transform='translateX(0)';v.style.opacity='1';
      if(dx<-58&&i<order.length-1)go(order[i+1]);else if(dx>58&&i>0)go(order[i-1]);}
    x0=null;decided=false;horiz=false;};
  S.addEventListener('touchend',end);S.addEventListener('touchcancel',end);
})();

/* ═════ 11. 그리드 조작 — 이동 / 크기 / 경계 / 미배정 끌어놓기 ═════ */
const GD={on:false,endedAt:0};
/* 손가락은 가만히 눌러도 몇 px 흔들린다. 이 값보다 적게 움직이면 탭, 넘으면 끌기다.
   너무 작으면 선택된 일정을 다시 눌러 수정하려 할 때마다 끌기로 새어 나간다. */
const TAP_SLOP=12;
/* 제스처 — 고르고 나서 한다
   · 탭            → 선택. 위·아래 손잡이가 나온다
   · 선택된 걸 탭   → 수정 창
   · 선택된 걸 끌기 → 이동 (도착 자리는 반투명 주황 유령이 보여준다)
   · 손잡이 끌기    → 길이 조절. 같은 칸에서 맞닿은 이웃이 있으면 경계를 함께 민다
   · 미배정 위로 끌면 → 미배정으로 되돌린다 (들어갈 자리에 칩 미리보기가 선다) */
function bindGrid(root){
  // 한 노드에 딱 한 번만 붙인다. _b 를 되돌려 다시 부르면 같은 노드에 리스너가 겹쳐
  // 완료 토글이 짝수 번 실행되고(= 아무 일도 안 일어난다) 리스너가 배로 불어난다.
  if(!root||root._b)return;root._b=true;
  /* `#view` 는 탭이 바뀌어도 같은 노드다. 리스너는 한 번만 붙으므로 오늘 탭이 아닐 때는
     여기 붙은 손들이 스스로 물러나야 한다. 물러나지 않으면 시험 탭에서 칩을 한 번 톡
     누른 것만으로도 `commit()`→`clearAll()` 이 `GD.endedAt` 을 새로 찍어, 바로 뒤따라오는
     click 이 시험 탭의 `<320ms` 걸름망에 걸려 완료·수정이 통째로 삼켜진다.
     날짜 팝업(`#popbody`)은 언제나 그리드이므로 그대로 살아 있다. */
  const live=()=>root.id!=='view'||tab==='today';
  const grid=()=>root.querySelector('.grid');
  const unbar=()=>root.querySelector('.unbar');
  const dateOf=()=>{const g=grid();return g?g.dataset.date:TODAY();};
  const scroller=()=>root.closest('#sheet')||document.getElementById('scroll');
  const tag=document.getElementById('ptag');
  // 화면을 그린 timeMap 과 손가락 좌표가 갈라지지 않게 제스처가 시작될 때마다 다시 잡는다.
  // 짧은 일정이 하나 생기면 그 아래 구간의 배율이 통째로 바뀌므로 바인딩 시점 값을 붙들면 안 된다.
  // 한 번의 드래그 안에서는 다시 그리지 않으니 제스처 도중에는 그대로 쓴다.
  let map=timeMap(dateOf());
  let mode=null,el=null,tid=null,sx=0,sy=0,cx=0,cy=0,moved=0,blocked=false,virtualDoneId=null,ghost=null;
  let baseD=0,curS=0,curD=0,overUn=false,prevBand=null,dropBand=null,dropIndex=null;
  // 꾹 누르기 대기 타이머. 이 그리드 안에서만 산다.
  let hold=null,lifted=null,unIndex=null,unGhost=null;

  const relAt=cy=>{const r=grid().getBoundingClientRect();
    return map.min(cy-r.top);};
  // 짧은 일정은 실제 시간 높이를 유지하고, 손가락 좌표만 가까운 일정에 매칭한다.
  const pickAt=(cx,cy)=>{
    const g=grid();if(!g)return null;
    const r=g.getBoundingClientRect();
    if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return null;
    const py=cy-r.top,pad=22;
    const hits=gridItems(dateOf()).filter(it=>py>=map.y(it.s)-pad&&py<=map.y(it.e)+pad);
    hits.sort((a,b)=>{
      const da=Math.abs(py-(map.y(a.s)+map.y(a.e))/2),db=Math.abs(py-(map.y(b.s)+map.y(b.e))/2);
      if(Math.abs(da-db)>.01)return da-db;
      return (a.t.ord||0)-(b.t.ord||0);});
    return hits[0]||null;};
  const inDoneZone=(cx)=>{const r=grid().getBoundingClientRect();return cx>=r.right-44;};
  const showTag=(txt,cy)=>{
    tag.textContent=txt;tag.classList.add('on');
    const r=tag.getBoundingClientRect(),g=grid().getBoundingClientRect();
    tag.style.left=Math.max(8,Math.min(window.innerWidth-r.width-8,g.left+g.width/2-r.width/2))+'px';
    tag.style.top=Math.max(8,cy-64)+'px';};
  const ensureGhost=()=>{
    if(ghost)return ghost;
    const task=DB.tasks.find(x=>x.id===tid),sj=task&&task.subj?subjOf(task.subj):null;
    ghost=document.createElement('div');ghost.className='ev dropghost';
    ghost.innerHTML='<div class="evb"><div class="evtitle"><div class="evt">'+esc(task?task.title:'')+'</div>'+
      (sj?'<span class="evcat"><i style="background:'+sj.color+'"></i><b>'+esc(sj.name)+'</b></span>':'')+'</div><div class="evm"></div></div>';
    grid().appendChild(ghost);return ghost;};
  /* 미배정으로 갈 때는 진짜 칩과 똑같은 미리보기(uchipHTML)를 실제로 끼어들 자리에
     세운다. 마크업이 같아야 이름 줄이 배치 결과와 어긋나지 않는다. */
  const clearUnGhost=()=>{
    if(!unGhost)return;
    const r=unGhost.parentElement;unGhost.remove();unGhost=null;unIndex=null;
    if(r)r.classList.remove('hasghost');};
  const paintUnGhost=cy=>{
    const row=root.querySelector('.unrow');if(!row)return;
    if(!unGhost){
      const task=DB.tasks.find(x=>x.id===tid);if(!task)return;
      const box=document.createElement('div');box.innerHTML=uchipHTML(task,' dropghost');
      unGhost=box.firstElementChild;unGhost.removeAttribute('data-id');
      row.classList.add('hasghost');row.appendChild(unGhost);}
    const rows=[].slice.call(row.querySelectorAll('.uchip')).filter(c=>c!==unGhost&&c!==el);
    let idx=rows.length;
    for(let i=0;i<rows.length;i++){const rr=rows[i].getBoundingClientRect();
      if(cy<rr.top+rr.height/2){idx=i;break;}}
    unIndex=idx;
    const before=rows[idx]||null;
    if(unGhost.nextElementSibling!==before||unGhost.parentElement!==row)row.insertBefore(unGhost,before);};
  const paintGhost=(sMin,dMin)=>{
    const g=ensureGhost(),top=map.y(sMin),h=Math.max(MIN_EVENT_PX,map.y(Math.min(1440,sMin+dMin))-top);
    g.style.top=top+'px';g.style.height=h+'px';g.style.left='3px';g.style.right='3px';
    g.classList.toggle('sm',h<40);
    const m=g.querySelector('.evm');if(m)m.textContent=hhmm(abs(sMin))+'~'+hhmm(abs(sMin+dMin))+' \u00b7 '+durTxt(dMin);};
  /* 미배정 칩을 목록 밖으로 꺼내 레일 위에 띄운다. 지금 자리 그대로 두되
     기준만 .unbar 로 바꾸므로 눈에는 제자리에서 떠오른 것으로 보인다. */
  const liftOut=chip=>{
    const bar=unbar();if(!bar||!chip)return;
    const r=chip.getBoundingClientRect(),br=bar.getBoundingClientRect(),cs=getComputedStyle(bar);
    // 절대 위치의 기준은 테두리 안쪽(패딩 상자)이다. 테두리 두께를 빼지 않으면
    // 그만큼 오른쪽·아래로 밀려 이름 줄이 옆 칩과 어긋난다. 반올림도 하지 않는다.
    const bl=parseFloat(cs.borderLeftWidth)||0,bt=parseFloat(cs.borderTopWidth)||0;
    chip.style.width=r.width.toFixed(2)+'px';
    chip.style.left=(r.left-br.left-bl).toFixed(2)+'px';
    chip.style.top=(r.top-br.top-bt).toFixed(2)+'px';
    lifted=chip;};
  /* 꺼낸 그 칩만 되돌린다. 아무 요소나 되돌리면 안 된다 — 배정 카드의
     top·height 는 인라인 스타일이라, 지우는 순간 카드가 그리드 맨 위로
     날아가 화면에서 사라진 것처럼 보인다. */
  const dropIn=()=>{
    if(!lifted)return;
    lifted.style.width='';lifted.style.left='';lifted.style.top='';lifted=null;};
  const clearAll=()=>{
    if(el)el.classList.remove('act','dragging','lift');
    dropIn();
    if(ghost){ghost.remove();ghost=null;}
    clearUnGhost();
    const u=unbar();if(u)u.classList.remove('tgt');
    tag.classList.remove('on');
    mode=null;el=null;tid=null;unIndex=null;overUn=false;prevBand=null;dropBand=null;dropIndex=null;blocked=false;virtualDoneId=null;
    // 진짜로 끌었을 때만 자취를 남긴다. 그냥 톡 누른 것까지 찍으면 바로 뒤따라오는
    // click 이 '끌기 직후 300ms' 걸름망에 걸려 완료·수정이 통째로 삼켜진다.
    if(GD.on){GD.on=false;GD.endedAt=Date.now();}};
  const inUnbar=(cx,cy)=>{const u=unbar();if(!u)return false;
    const r=u.getBoundingClientRect();
    return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom;};
  const autoScroll=cy=>{
    if(overUn)return;                       // 미배정 바 위에선 스크롤하지 않는다
    const S=scroller(),r=S.getBoundingClientRect();
    let v=0;
    if(cy<r.top+70)v=-Math.min(13,(r.top+70-cy)/5);
    else if(cy>r.bottom-110)v=Math.min(13,(cy-(r.bottom-110))/5);
    if(v)S.scrollTop+=v;};

  /* ═════ 제스처 — 시험 탭과 같다 ═════
     · 한 번 톡      → 완료 (기다리지 않고 바로 뒤집는다)
     · 두 번 톡톡     → 수정 (첫 톡이 뒤집은 완료를 되돌리고 시트를 연다)
     · 꾹 눌러 끌기   → 이동 (도착 자리는 반투명 주황 유령이 보여준다)
     길이 조절 손잡이는 없앴다. 칸에 맞춰 커지고 나뉘고 순서가 잡히는 것은 그대로다. */
  const clearHold=()=>{clearTimeout(hold);hold=null;};
  /* 잡히는 순간. 잡자마자 도착 자리를 한 번 그려 둔다 — 안 그리면 잡고 바로 손을 뗐을 때
     어디로 가는지 못 본 채 놓게 된다. */
  const lift=()=>{
    hold=null;
    if(!el||GD.on)return;
    GD.on=true;buzz(12);
    el.classList.add('act','dragging');
    if(mode==='new'){liftOut(el);el.classList.add('lift');}
    preview(cx,cy);
  };
  const arm=()=>{clearHold();hold=setTimeout(lift,EX_HOLD);};

  /* 손가락 자리에 맞춰 도착 자리를 계산해 유령으로 보여준다. 칸(시간표 밴드)이 있으면
     그 칸을 사람 수대로 나눈 자리에, 24시간 보기의 기본 60분짜리는 1시간 슬롯에 맞춘다. */
  function preview(px,py){
    const ds=dateOf(),r=relAt(py);
    overUn=inUnbar(px,py);
    const u=unbar();if(u)u.classList.toggle('tgt',overUn);
    autoScroll(py);
    // 미배정 레일 위에서는 실제로 끼어들 자리에 진짜 칩과 같은 미리보기를 세운다.
    if(overUn){
      if(ghost){ghost.remove();ghost=null;}
      paintUnGhost(py);
      showTag(L.dropToUn,py);return;}
    clearUnGhost();
    const task=DB.tasks.find(x=>x.id===tid),point=placeSnap(r);
    let d=(task&&task.autoSlot!=null)?60:baseD,sM=placeSnap(r-d/2);
    dropBand=null;
    const b=bandAt(ds,abs(point));           // 학교 시간표면 쉬는시간까지 모든 칸에 맞춘다
    if(b){
      const others=DB.tasks.filter(x=>x.date===ds&&x.id!==tid&&x.min!=null&&rel(x.min)>=b.s&&rel(x.min)<b.e)
        .sort((a,c)=>rel(a.min)-rel(c.min)||(a.ord||0)-(c.ord||0));
      const n=others.length+1;
      dropIndex=Math.max(0,Math.min(others.length,Math.floor(((point-b.s)/(b.e-b.s))*n)));
      const each=Math.max(SNAP,snap((b.e-b.s)/n));
      sM=Math.min(b.e-SNAP,b.s+each*dropIndex);
      d=dropIndex===n-1?Math.max(SNAP,b.e-sM):each;
    }else if(is24(ds)&&(baseD===60||(task&&task.autoSlot!=null))){
      let slot=weekendSlotAt(ds,point,tid);
      if(!slot){const ss=Math.max(0,Math.min(1380,placeSnap(r-30)));
        const candidate={id:'auto'+ss,s:ss,e:ss+60,auto:true};
        if(autoSlotClean(ds,candidate,tid))slot=candidate;}
      if(slot){
        dropBand=slot;
        const others=autoSlotMembers(ds,slot).filter(x=>x.id!==tid)
          .sort((a,c)=>rel(a.min)-rel(c.min)||(a.ord||0)-(c.ord||0));
        const n=others.length+1;
        dropIndex=Math.max(0,Math.min(others.length,Math.floor(((point-slot.s)/60)*n)));
        const each=Math.max(SNAP,Math.floor((60/n)/SNAP)*SNAP);
        sM=Math.min(slot.e-SNAP,slot.s+each*dropIndex);
        d=dropIndex===n-1?Math.max(SNAP,slot.e-sM):each;
      }else dropIndex=null;
    }else dropIndex=null;
    sM=Math.max(0,Math.min(1440-d,sM));curS=sM;curD=d;
    paintGhost(sM,d);
    showTag(hhmm(abs(sM))+' ~ '+hhmm(abs(sM+d))+' · '+durTxt(d),py);
  }

  root.addEventListener('touchstart',e=>{
    if(!live()||GD.on)return;
    clearHold();
    map=timeMap(dateOf());
    const t=e.touches[0];sx=cx=t.clientX;sy=cy=t.clientY;moved=0;virtualDoneId=null;
    if(e.target.closest('.evck,.uck')){       // 완료 버튼은 끌기와 분리한다
      blocked=true;mode=null;el=null;tid=null;dropIndex=null;return;}
    blocked=false;
    let ev=e.target.closest('.ev');
    const uc=e.target.closest('.uchip');
    // 실제 카드 밖을 눌러도 22px 안의 가장 가까운 일정이 잡힌다.
    if(!ev&&!uc){
      const picked=pickAt(t.clientX,t.clientY);
      if(picked){
        ev=root.querySelector('.ev[data-id="'+picked.t.id+'"]');
        if(inDoneZone(t.clientX)){            // 그리드 오른쪽 44px 는 가상 완료 영역
          virtualDoneId=picked.t.id;blocked=true;
          mode=null;el=null;tid=null;dropIndex=null;return;}}}
    if(uc){
      el=uc;tid=uc.dataset.id;prevBand=null;
      const task=DB.tasks.find(x=>x.id===tid);
      baseD=task&&task.dur?task.dur:60;curD=baseD;
      mode='new';arm();return;}
    if(ev){
      const ds=dateOf(),task=DB.tasks.find(x=>x.id===ev.dataset.id);if(!task)return;
      el=ev;tid=task.id;
      baseD=Math.max(SNAP,taskDur(task,ds));curD=baseD;
      prevBand=autoSlotBand(task)||bandAt(ds,task.min);
      mode='move';arm();}
  },{passive:true});

  root.addEventListener('touchmove',e=>{
    if(!live())return;
    const t=e.touches[0];cx=t.clientX;cy=t.clientY;
    moved=Math.max(moved,Math.abs(cx-sx)+Math.abs(cy-sy));
    // 잡히기 전에 손이 흘러가면 그건 화면 스크롤이다 — 손을 뗀다.
    if(!GD.on){if(hold&&moved>TAP_SLOP)clearHold();return;}
    if(e.cancelable)e.preventDefault();
    preview(cx,cy);
  },{passive:false});

  const commit=()=>{
    if(!live())return;
    clearHold();
    if(blocked){
      const doneId=virtualDoneId,shouldToggle=doneId&&moved<=TAP_SLOP;
      blocked=false;virtualDoneId=null;
      // 여기서 처리했으면 뒤따라오는 합성 click 이 같은 일을 또 하지 않게 막는다.
      if(shouldToggle){GD.endedAt=Date.now();toggleDone(doneId);}
      return;}
    // 끌지 않았다 = 탭. 탭의 알맹이는 click 에서 처리한다(시험 탭과 같다).
    if(!GD.on){clearAll();return;}
    // 잡기만 하고 손가락을 움직이지 않았다. 어디로도 옮기지 않는다.
    if(moved<=TAP_SLOP){clearAll();refresh();return;}
    const ds=dateOf(),task=DB.tasks.find(x=>x.id===tid);
    const leftBand=prevBand;
    if(task){
      if(overUn){
        task.min=null;task.dur=null;task.autoSlot=null;
        // 손가락이 있던 자리에 끼워 넣는다 — 미배정끼리 순서 바꾸기도 이 길이다
        const list=DB.tasks.filter(x=>x.date===ds&&x.min==null&&x.id!==task.id)
          .sort((a,b)=>(a.ord||0)-(b.ord||0));
        list.splice(Math.max(0,Math.min(list.length,unIndex==null?list.length:unIndex)),0,task);
        list.forEach((x,i)=>{x.ord=i;});
      }else{
        task.min=abs(curS);task.dur=Math.max(SNAP,curD);
        const b=bandAt(ds,task.min);
        if(dropBand){task.autoSlot=dropBand.s;splitAutoSlot(ds,dropBand,false,task.id,dropIndex);}
        else if(b){task.autoSlot=null;splitBand(ds,b,false,task.id,dropIndex);}
        else task.autoSlot=null;
        /* 칸 나누기는 그 칸에서 시작하는 일만 센다. 옆 칸에서 늘어나 걸쳐 있는 일은
           세지 못해 새로 놓은 일 위에 그대로 덮인다. 놓은 뒤 한 번 정리해 그 꼬리를 자른다. */
        resolveOverlaps(ds,task.id);}
      // 원래 칸을 떠나면 남은 일정이 반드시 칸 전체를 다시 채운다.
      // 동적 새벽 1시간 슬롯도 s/e로 비교해야 같은 큰 gap id에 속한 다른 시간을 구분할 수 있다.
      if(leftBand){
        const landed=task.min==null?null:(autoSlotBand(task)||bandAt(ds,task.min));
        if(!sameBand(leftBand,landed)){
          if(leftBand.auto)splitAutoSlot(ds,leftBand,true);
          else splitBand(ds,leftBand,true);}}
      save();buzz(11);

    clearAll();refresh();};
  root.addEventListener('touchend',commit);
  root.addEventListener('touchcancel',()=>{if(!live())return;clearHold();clearAll();refresh();});

  /* 탭의 알맹이. 끌기가 방금 끝났으면(합성 click) 건너뛴다. */

/* 시트는 바깥 빈 곳을 눌러 닫을 수도 있고, 맨 위 손잡이를 잡아 아래로 끌어내려도 닫힌다.
   시트 자체가 스크롤 영역이므로 스크롤과 헷갈리지 않게 조건을 좁게 잡는다.
   · 손잡이(넓힌 ::before 포함)에서 시작한 터치만 후보로 본다
   · 이미 아래로 스크롤한 상태(scrollTop>0)면 손잡이가 화면 밖이라 애초에 잡히지 않는다
   · 가로로 더 움직이거나 위로 올리면 즉시 손을 떼 스크롤에 맡긴다
   · 아래로 8px 넘게 내려야 비로소 끌어내리기로 확정한다 */
function bindSheetDrag(el,close,scrim){
  if(!el||el._sd)return;el._sd=true;
  let y0=0,x0=0,on=false,armed=false,dy=0,gen=0;
  const sc=()=>$(scrim);
  const clear=()=>{el.style.transition='';el.style.transform='';el.classList.remove('dragging-sheet');
    const c=sc();if(c)c.style.opacity='';on=false;armed=false;dy=0;};
  el.addEventListener('touchstart',e=>{
    if(!e.target.closest('.grab')||el.scrollTop>0||e.touches.length>1){armed=false;return;}
    const t=e.touches[0];y0=t.clientY;x0=t.clientX;armed=true;on=false;dy=0;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!armed)return;
    const t=e.touches[0],ddy=t.clientY-y0,ddx=t.clientX-x0;
    if(!on){
      if(Math.abs(ddx)>Math.abs(ddy)){armed=false;return;}   // 가로 이동 — 넘긴다
      if(ddy<-4){armed=false;return;}                        // 위로 올림 — 스크롤이다
      if(ddy<8)return;                                       // 아직 탭인지 끌기인지 모른다
      on=true;el.style.transition='none';el.classList.add('dragging-sheet');buzz(9);
    }
    dy=Math.max(0,ddy);
    if(e.cancelable)e.preventDefault();
    el.style.transform='translateY('+dy+'px)';
    const c=sc();if(c)c.style.opacity=String(Math.max(0,1-dy/Math.max(160,el.offsetHeight)));
  },{passive:false});
  const end=()=>{
    if(!on){armed=false;return;}
    const g=++gen,far=dy>Math.min(130,Math.max(70,el.offsetHeight*.24));
    on=false;armed=false;
    if(far){
      el.style.transition='transform .24s cubic-bezier(.32,.72,0,1)';
      el.style.transform='translateY(110%)';
      // 닫은 뒤에 인라인 값을 지운다. CSS 도 같은 translateY(110%) 라 되튀지 않는다.
      setTimeout(()=>{if(g!==gen)return;close();clear();},200);
    }else{
      el.style.transition='transform .3s cubic-bezier(.32,1.12,.45,1)';
      el.style.transform='';el.classList.remove('dragging-sheet');
      const c=sc();if(c)c.style.opacity='';dy=0;
      setTimeout(()=>{if(g===gen)el.style.transition='';},300);
    }};
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
}

/* 반복 고르개의 손들. 시트를 다시 그리므로 입력창에 적어 둔 것을 먼저 거둬들이고,

   시트가 맨 위로 튀어 아래쪽의 요일·간격 줄이 화면 밖으로 사라진다. */
function repaintTaskSheet(){

function setRep(freq){
  readTitle();const e=_ed;

    weekdays:(cur.weekdays&&cur.weekdays.length)?cur.weekdays.slice():[parseD(e.date).getDay()],
    interval:cur.interval||2,
    start:cur.start||e.date,

function togDow(i){

/* 할 일에 과목을 직접 고르게 하지 않는다. 제목에 과목 태그가 들어 있으면 그 색이 붙는다.
   태그 대신 고르기로 되돌리면 시험 탭에서 색이 두 갈래로 갈린다. */
function saveTask(){
  readTitle();const e=_ed;
  if(!e.title.trim()){toast(L.needTaskName);return;}
  // 요일을 하나도 안 고른 '요일 지정'은 어느 날에도 안 걸린다. 조용히 사라지느니 여기서 막는다.
  if(e.rep&&e.rep.freq==='weekly'&&!(e.rep.weekdays||[]).length){toast(L.needDow);return;}
  const mkRule=()=>({id:e.repId||uid(),title:e.title.trim(),freq:e.rep.freq,
    weekdays:e.rep.weekdays.slice(),interval:e.rep.interval,
    start:e.rep.start||e.date,end:e.rep.end||'',min:e.min,dur:e.dur,subj:e.subj,
    exam:!!e.exam,mode24:is24(e.date),ex:[]});
  if(e.stage){
    /* 반복은 날짜가 있어야 뜻이 있다. 레일 항목에 반복을 걸면 레일에서 나와
       시작일부터 시험 달력에 깔린다 — 시작·끝 날짜는 바로 위 칸에서 고른다. */
    if(e.rep){
      DB.repeats.push(mkRule());
      if(e.sgid){DB.stage=DB.stage.filter(v=>v.id!==e.sgid);DB.stage.forEach((v,i)=>{v.ord=i;});}
    }else if(e.sgid){
      const g=DB.stage.find(v=>v.id===e.sgid);if(g)g.title=e.title.trim();
    }else DB.stage.push({id:uid(),title:e.title.trim(),ord:DB.stage.length,done:false});
    materializeWindow();save();finishTaskSheet();
    toast(e.sgid?L.edited:L.added);return;
  }
  if(e.id){
    const t=DB.tasks.find(x=>x.id===e.id);if(!t)return;
    Object.assign(t,{title:e.title.trim(),min:e.min,
      dur:e.min==null?null:(e.dur!=null?e.dur:bandLen(e.date,e.min)),subj:e.subj,mile:e.mile||null});
    if(e.rep){
      const old=e.repId?DB.repeats.find(r=>r.id===e.repId):null;
      if(old){const ex=old.ex||[];Object.assign(old,mkRule(),{ex});
        DB.tasks=DB.tasks.filter(x=>!(x.repId===old.id&&x.date>e.date));}
      else{const r=mkRule();DB.repeats.push(r);t.repId=r.id;}
    }else if(e.repId){
      DB.repeats=DB.repeats.filter(r=>r.id!==e.repId);
      DB.tasks.forEach(x=>{if(x.repId===e.repId)x.repId=null;});}
  }else{
    if(e.rep){const r=mkRule();DB.repeats.push(r);}
    else{
      const sibs=DB.tasks.filter(x=>x.date===e.date&&(x.min==null)===(e.min==null));
      const nid=uid();
      DB.tasks.push({id:nid,title:e.title.trim(),date:e.date,min:e.min,
        dur:e.min==null?null:(e.dur!=null?e.dur:bandLen(e.date,e.min)),
        ord:sibs.length,done:false,subj:e.subj,mile:e.mile||null,exam:!!e.exam,repId:null});
      tourMade('task',nid);}}
  materializeWindow();save();finishTaskSheet();
  toast(e.id?L.edited:L.added);tourSignal(e.id?'task-edited':'task-saved');
}
/* 제목만 같은 **독립된** 사본을 미배정으로 하나 더 만든다. 새 id·미완료·반복 없음이다.
   시험 탭의 일은 시험 탭의 미배정 레일로 간다 — 시험 계획은 시험 탭에서 이어 짜므로
   그 날의 미배정으로 보내면 사본을 찾으러 오늘 탭까지 건너가야 한다. */
function copyTask(){
