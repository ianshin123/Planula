<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F7F5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JellyPlan">
<meta name="application-name" content="JellyPlan">
<link rel="manifest" href="manifest.webmanifest?v=38">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JellyPlan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F7F5F1; --bg2:#FFFEFC; --solid:#FFFFFF; --muted:#F1EEE8;
  --ink:#26221D; --ink2:#6E655A; --ink3:#A79D90;
  --line:rgba(82,68,54,.14); --line2:rgba(82,68,54,.075);
  --ac:#E07A4F; --ac2:#F0A059; --ac-s:rgba(224,122,79,.13); --ac-b:rgba(224,122,79,.34);
  --gd:#D64F4F; --gd-s:rgba(214,79,79,.13);
  --ok:#3F9E6B; --ok-s:rgba(63,158,107,.13);
  --band:rgba(224,122,79,.075);
  --surface:var(--bg2); --surface-brd:var(--line);
  --blur-surface:rgba(255,254,252,.76); --blur-strong:rgba(255,254,252,.88); --done-bg:rgba(241,238,232,.62);
  --shadow-sm:0 1px 2px rgba(63,49,36,.055),0 5px 14px rgba(63,49,36,.045);
  --shadow-md:0 10px 28px rgba(63,49,36,.12); --shadow-lg:0 18px 52px rgba(47,35,24,.18);
  --r:20px; --r2:16px; --r3:12px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --dockh:78px; --wrap:780px; --gut:50px; --unw:144px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181613; --bg2:#23201C; --solid:#23201C; --muted:#2B2722;
  --ink:#F2EDE5; --ink2:#B0A597; --ink3:#7A7166;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.055);
  --ac:#FF9264; --ac2:#FFB877; --ac-s:rgba(255,146,100,.16); --ac-b:rgba(255,146,100,.4);
  --gd:#FF7A6E; --gd-s:rgba(255,122,110,.16);
  --ok:#4FC98A; --ok-s:rgba(79,201,138,.15);
  --band:rgba(255,146,100,.085);
  --surface:var(--bg2); --surface-brd:rgba(255,255,255,.1);
  --blur-surface:rgba(35,32,28,.72); --blur-strong:rgba(35,32,28,.86); --done-bg:rgba(43,39,34,.62);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.16);
  --shadow-md:0 12px 30px rgba(0,0,0,.34); --shadow-lg:0 20px 56px rgba(0,0,0,.48);
}}
:root[data-theme="dark"]{
  --bg:#181613; --bg2:#23201C; --solid:#23201C; --muted:#2B2722;
  --ink:#F2EDE5; --ink2:#B0A597; --ink3:#7A7166;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.055);
  --ac:#FF9264; --ac2:#FFB877; --ac-s:rgba(255,146,100,.16); --ac-b:rgba(255,146,100,.4);
  --gd:#FF7A6E; --gd-s:rgba(255,122,110,.16);
  --ok:#4FC98A; --ok-s:rgba(79,201,138,.15);
  --band:rgba(255,146,100,.085);
  --surface:var(--bg2); --surface-brd:rgba(255,255,255,.1);
  --blur-surface:rgba(35,32,28,.72); --blur-strong:rgba(35,32,28,.86); --done-bg:rgba(43,39,34,.62);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.16);
  --shadow-md:0 12px 30px rgba(0,0,0,.34); --shadow-lg:0 20px 56px rgba(0,0,0,.48);
}
html,body{height:100%;overscroll-behavior:none;touch-action:pan-x pan-y}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;position:fixed;inset:0;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::-webkit-scrollbar{width:0;height:0}
/* 단순 반투명 표면 + 일반 블러. 채도·광택 효과는 섞지 않는다. */
.glass{background:var(--blur-surface);border:1px solid var(--surface-brd);box-shadow:var(--shadow-sm);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

#app{height:100%;display:flex;flex-direction:column}
#top{padding:calc(var(--st) + 14px) 20px 8px;flex:none}
#topin{max-width:var(--wrap);margin:0 auto}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.h1{font-size:29px;font-weight:800;letter-spacing:-.034em;line-height:1.08}
.h1 small{display:block;font-size:13px;font-weight:650;color:var(--ink3);letter-spacing:-.01em;margin-bottom:3px}
.hbtns{display:flex;gap:8px;align-items:center}
.ib{width:42px;height:42px;border-radius:var(--r3);display:grid;place-items:center;color:var(--ink2);flex:none}
.ib:active{transform:scale(.9);color:var(--ac)}
.ib svg{width:21px;height:21px}
.ib.on{color:var(--ac);background:var(--ac-s)}
/* 2주 이내 마감 — 작은 빨간 글씨 */
.soon{margin-top:7px;font-size:12px;font-weight:750;color:var(--gd);line-height:1.5;
  display:flex;flex-wrap:wrap;gap:2px 12px}
.soon span{white-space:nowrap}
.soon b{font-weight:850}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:4px 20px calc(var(--sb) + var(--dockh) + 26px)}
#view{width:100%;max-width:var(--wrap);margin:0 auto;will-change:transform}

/* 미배정 — 오른쪽 세로 레일 */
.daylayout{display:grid;grid-template-columns:minmax(0,1fr) var(--unw);gap:12px;align-items:start}
.unbar{position:sticky;top:4px;z-index:20;padding:9px 8px;border-radius:17px;
  height:calc(100dvh - var(--st) - var(--dockh) - 98px);min-height:180px;
  display:flex;flex-direction:column;transition:box-shadow .16s}
.unbar.tgt{box-shadow:0 0 0 2.5px var(--ac) inset}
.unbar.empty .unrow{min-height:120px;display:flex;align-items:center;justify-content:center;
  border:1.5px dashed var(--line);border-radius:11px;font-size:12px;font-weight:700;color:var(--ink3)}
.unbar .uh{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase;margin-bottom:7px}
.unrow{display:flex;flex-direction:column;gap:7px;overflow-y:auto;overflow-x:hidden;min-height:0;padding-bottom:2px}
.uchip{flex:0 0 auto;min-width:0;display:flex;align-items:center;gap:6px;padding:10px 8px;border-radius:var(--r3);
  background:var(--blur-surface);border:1px solid var(--line2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.uchip:active{background:var(--ac-s);border-color:var(--ac-b)}
.uchip.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-s);background:var(--ac-s)}
.uchip.dragging{opacity:.25}
.uchip.done{background:var(--done-bg)}
.uchip.done .ut{opacity:.56}
.uchip.done .ut>i{text-decoration:line-through}
.uchip .ut{min-width:0;flex:1}
.uchip .ut>i{display:block;font-style:normal;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip .gr{width:14px;flex:none;display:flex;flex-direction:column;gap:2.5px;opacity:.35}
.uchip .gr b{display:block;width:11px;height:1.6px;border-radius:1px;background:var(--ink2)}
.uck{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);background:var(--blur-strong);
  display:grid;place-items:center;flex:none;z-index:2}
.uck:active{transform:scale(.9)}
.uck svg{width:11px;height:11px;color:#fff;opacity:0}
.uck.on{background:var(--ok);border-color:var(--ok)}
.uck.on svg{opacity:1}

/* 전날 미완료 정리 — 오늘 시간표보다 먼저 선택하게 한다. */
.carry{margin-bottom:14px;padding:14px;border-radius:var(--r);box-shadow:var(--shadow-md)}
.carryhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.carryhead b{display:block;font-size:16px;letter-spacing:-.025em}
.carryhead span{display:block;margin-top:2px;font-size:11.5px;font-weight:700;color:var(--ink3)}
.carrycount{flex:none;min-width:28px;height:28px;padding:0 9px;border-radius:10px;display:grid;place-items:center;
  background:var(--ac-s);color:var(--ac);font-size:12px;font-weight:850}
.carrylist{display:flex;flex-direction:column;gap:7px}
.carryrow{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px auto;align-items:center;gap:6px;
  min-height:52px;padding:7px 7px 7px 11px;border:1px solid var(--line2);border-radius:var(--r3);background:var(--blur-strong)}
.carrytext{min-width:0}
.carrytitle{font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carrymeta{margin-top:2px;font-size:10.5px;font-weight:700;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carryck,.carrydel{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1.5px solid var(--line)}
.carryck{background:var(--ok-s);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.carrydel{background:var(--gd-s);color:var(--gd);border-color:color-mix(in srgb,var(--gd) 30%,transparent)}
.carryck svg,.carrydel svg{width:17px;height:17px}
.carrymove{height:38px;padding:0 11px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:5px;
  background:var(--ac-s);color:var(--ac);font-size:11.5px;font-weight:850;white-space:nowrap}
.carrymove svg{width:15px;height:15px}
.carryck:active,.carrydel:active,.carrymove:active{transform:scale(.94)}

/* ── 타임그리드 ── */
#gridwrap{position:relative}
.grid{position:relative;margin-left:var(--gut);border-left:1px solid var(--line)}
.hl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line2);pointer-events:none}
.hl.major{border-top-color:var(--line)}
.hl i{position:absolute;left:calc(-1 * var(--gut));top:-9px;width:calc(var(--gut) - 8px);text-align:right;
  font-style:normal;font-size:11.5px;font-weight:750;color:var(--ink3);font-variant-numeric:tabular-nums}
.band{position:absolute;left:0;right:0;background:var(--band);pointer-events:none;
  border-top:1px solid var(--ac-s);border-bottom:1px solid var(--ac-s)}
.band.gap{background:transparent;border-top:1px dashed var(--line2);border-bottom:none}
.band b{position:absolute;left:7px;top:2px;font-size:11px;font-weight:800;color:var(--ac);opacity:.85;
  letter-spacing:-.02em;white-space:nowrap}
.band.gap b{color:var(--ink3);opacity:.65;font-weight:750}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--gd);z-index:6;pointer-events:none}
.nowl::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--gd)}

.ev{position:absolute;border-radius:11px;overflow:hidden;z-index:4;
  background:var(--bg2);border:1px solid var(--line);box-shadow:0 1px 3px rgba(63,49,36,.08);
  display:flex;flex-direction:column;min-height:0;touch-action:pan-y}
.ev.done{opacity:1;background:var(--done-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ev.done .evb{opacity:.55}
.ev.done .evt{text-decoration:line-through}
.ev.act{z-index:12;overflow:visible;box-shadow:var(--shadow-md);border-color:var(--ac);touch-action:none}
.ev.sel{z-index:11;overflow:visible;border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-s);touch-action:none}
.evb{flex:1;min-width:0;padding:4px 40px 4px 9px;overflow:hidden;border-radius:10px}
.evtitle{display:flex;align-items:center;gap:6px;min-width:0}
.evt{font-size:13px;font-weight:700;letter-spacing:-.02em;line-height:1.25;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evcat,.ucat{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;max-width:44%;
  font-size:10px;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evcat i,.ucat i{width:7px;height:7px;border-radius:50%;flex:none}
.ucat{display:flex;margin-top:2px;max-width:100%;font-size:9.5px}
.evm{font-size:10px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums;
  overflow:hidden;white-space:nowrap}
.ev.sm .evm{display:none}
.ev.sm .evb{padding:1px 34px 1px 7px}
.ev.sm .evt{font-size:12.5px}
.evh{position:absolute;left:0;right:0;height:28px;z-index:5;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .16s}
.evh.t{top:-14px}
.evh.b{bottom:-14px}
.evh i{display:block;width:58px;height:9px;border-radius:5px;background:var(--ac);
  box-shadow:0 2px 5px rgba(75,48,34,.2);pointer-events:none}
.ev.sel .evh,.ev.act .evh{opacity:1}
.ev.sel .evh i,.ev.act .evh i{pointer-events:auto}
.evtime{position:absolute;right:8px;bottom:3px;font-size:11px;font-weight:850;color:var(--ac);
  font-variant-numeric:tabular-nums;opacity:0;transition:opacity .14s;pointer-events:none;
  background:var(--bg2);padding:0 4px;border-radius:5px}
.ev.act .evtime{opacity:1}
.ev.sm .evtime{display:none}
.evck{position:absolute;right:2px;top:1px;bottom:1px;width:30px;min-height:0;border-radius:8px;border:2px solid var(--line);
  display:grid;place-items:center;z-index:3;background:var(--bg2)}
.evck:active{transform:scale(.9)}
.evck.on{background:var(--ok);border-color:var(--ok)}
.evck svg{width:11px;height:11px;color:#fff;opacity:0}
.evck.on svg{opacity:1}
.ev.sm .evck{right:1px;top:0;bottom:0;width:30px;border-radius:4px}
.ev.sm .evck svg{display:block;width:10px;height:10px}
.dropghost{z-index:16;pointer-events:none;border-color:var(--ac);background:var(--ac-s);
  box-shadow:0 6px 16px rgba(224,122,79,.2);opacity:.94}
#ptag{position:fixed;z-index:210;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--ac);color:#fff;padding:6px 12px;border-radius:11px;font-size:12.5px;font-weight:800;
  box-shadow:var(--shadow-md);white-space:nowrap;font-variant-numeric:tabular-nums}
#ptag.on{opacity:1}

.card{border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.ctitle{display:flex;align-items:center;justify-content:space-between;padding:15px 17px 10px;gap:8px}
.ctitle b{font-size:12.5px;font-weight:800;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase}
.empty{text-align:center;padding:24px 16px;color:var(--ink3);font-size:13.5px;font-weight:600}

.calh{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
.calh b{font-size:21px;font-weight:800;letter-spacing:-.028em}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow i{font-style:normal;text-align:center;font-size:11.5px;font-weight:800;color:var(--ink3);padding:3px 0}
.dow i.sun{color:var(--gd)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:6px}
.cell{border-radius:var(--r3);background:var(--muted);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;padding-top:7px;gap:3px;position:relative;
  transition:transform .12s;min-height:42px;overflow:hidden}
.cell:active{transform:scale(.94)}
.cell.out{opacity:.3}
.cell.today{background:var(--ac-s);border-color:var(--ac-b)}
.dn{font-size:15px;font-weight:750;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell.sun .dn{color:var(--gd)}
.cell.today .dn{color:var(--ac)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.dot{width:5px;height:5px;border-radius:50%;background:var(--ac)}
.cdd{font-size:9px;font-weight:800;color:var(--gd);letter-spacing:-.02em;line-height:1.1;text-align:center}

.sj{border-radius:var(--r);margin-bottom:13px;overflow:hidden}
.sjh{display:flex;align-items:center;gap:11px;padding:16px 17px}
.sjc{width:13px;height:13px;border-radius:50%;flex:none}
.sjh b{font-size:18px;font-weight:800;letter-spacing:-.028em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{display:flex;align-items:center;gap:11px;padding:12px 17px;border-top:1px solid var(--line2)}
.ddn{flex:1;min-width:0;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddd{font-size:11.5px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.ddc{font-size:14.5px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em;flex:none;
  padding:5px 11px;border-radius:11px;background:var(--gd-s);color:var(--gd)}
.ddc.far{background:var(--ac-s);color:var(--ac)}
.ddc.past{background:var(--line2);color:var(--ink3)}
.gl{display:flex;align-items:center;gap:11px;padding:10px 17px 10px 19px}
.gld{width:6px;height:6px;border-radius:50%;background:var(--ink3);flex:none;margin-left:3px}
.glt{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl.dragging{opacity:.3}
.gr2{width:22px;flex:none;display:flex;flex-direction:column;gap:3px;align-items:center;opacity:.3}
.gr2 i{display:block;width:15px;height:1.8px;border-radius:1px;background:var(--ink2)}
.sjf{display:flex;gap:8px;padding:11px 14px 15px}
.mini{flex:1;padding:12px;border-radius:var(--r3);background:var(--muted);color:var(--ink2);
  font-size:13.5px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:5px}
.mini:active{transform:scale(.96);background:var(--ac-s);color:var(--ac)}
.mini svg{width:14px;height:14px}

.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:11px;
  padding:6px 14px calc(var(--sb) + 10px);z-index:40;pointer-events:none}
.dock>*{pointer-events:auto}
.dock-bar{display:flex;gap:3px;padding:7px 15px;border-radius:24px;flex:0 1 auto;touch-action:none;
  position:relative;height:66px;box-sizing:border-box;align-items:center}
.dockthumb{position:absolute;top:7px;left:0;height:52px;width:64px;border-radius:16px;z-index:0;pointer-events:none;
  background:var(--ac-s);transition:transform .42s cubic-bezier(.32,1.75,.5,1),width .25s,background .28s}
.dockthumb.drag{background:var(--ac-b)}
.nb{width:64px;height:52px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink3);position:relative;z-index:1;transition:color .2s}
.nb svg{width:25px;height:25px}
.nb .lb{font-size:10.5px;font-weight:700;letter-spacing:-.02em}
.nb.on{color:var(--ac)}
.nb.on .lb{font-weight:800}
.nb:active{transform:scale(.9)}
.fab{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:#fff;
  background:var(--ac);box-shadow:0 8px 18px rgba(164,79,43,.24)}
.fab:active{transform:scale(.9)}
.fab svg{width:27px;height:27px}
#popfab{position:fixed;z-index:110;bottom:calc(var(--sb) + 22px);
  right:max(20px, calc(50% - 380px + 20px));
  opacity:0;pointer-events:none;transform:scale(.7);transition:opacity .22s,transform .28s cubic-bezier(.34,1.5,.6,1)}
#popfab.on{opacity:1;pointer-events:auto;transform:none}
@media(max-width:620px){
  :root{--gut:44px;--unw:104px}
  #top{padding-left:14px;padding-right:14px}
  #scroll{padding-left:30px;padding-right:10px}
  .daylayout{gap:8px}
  .unbar{padding:8px 6px}
  .unbar .uh{font-size:10px;letter-spacing:0}
  .uchip{padding:9px 6px}
  .uchip .gr{display:none}

<script>
'use strict';
/* ═════ 1. 시간·시간표 ═════ */
const M=(h,m)=>h*60+m;
const DAY0=M(2,0);          // 하루의 시작 = 새벽 2시
const PPM=1.4;              // 기본 1분당 픽셀
const MIN_EVENT_PX=20;      // 짧은 일정 카드의 최소 터치 높이
const SNAP=5;               // 길이 조절과 자동 분할은 5분 단위
const PLACE_SNAP=10;        // 일정을 직접 배치할 때는 10분 단위
const LEGACY_CLASSES=[
  ['roll', M(6,50), M(7,15), '점호'],
  ['hr',   M(8,10), M(8,20), '아침조례'],
  ['p1',   M(8,30), M(9,20), '1교시'],
  ['p2',   M(9,30), M(10,20),'2교시'],
  ['p3',   M(10,30),M(11,20),'3교시'],
  ['p4',   M(11,30),M(12,20),'4교시'],
  ['p5',   M(13,30),M(14,20),'5교시'],
  ['p6',   M(14,30),M(15,20),'6교시'],
  ['p7',   M(15,30),M(16,20),'7교시'],
  ['p8',   M(16,50),M(18,0), '8교시'],
  ['ja1',  M(19,10),M(21,0), '야자 1차시'],
  ['ja2',  M(21,15),M(23,30),'야자 2차시'],
];
const LEGACY_PROFILE_ID='default-school';
function legacyProfile(){return {id:LEGACY_PROFILE_ID,name:'학교',blocks:LEGACY_CLASSES.map(x=>({id:x[0],s:x[1],e:x[2],name:x[3]}))};}
function gapName(s,e){
  if(s===M(12,20))return '점심시간';
  if(s===M(18,0))return '저녁시간';
  if(e<=M(6,50))return '새벽';
  if(s>=M(23,30))return '취침 전';
  if(s===M(7,15))return '아침 시간';
  return (e-s)>=25?'빈 시간':'쉬는시간';
}
function buildScheduleBlocks(profile){
  const out=[];let cur=0;
  const blocks=(profile&&profile.blocks||[]).slice().sort((a,b)=>a.s-b.s);
  blocks.forEach(b=>{
    if(b.s>cur)out.push({id:'g'+cur,s:cur,e:b.s,name:gapName(cur,b.s),cls:false});
    out.push({id:b.id,s:b.s,e:b.e,name:b.name,cls:true});cur=b.e;});
  if(cur<1440)out.push({id:'g'+cur,s:cur,e:1440,name:gapName(cur,1440),cls:false});
  return out;
}
function scheduleProfile(ds){
  const id=DB.s.dayProfiles&&DB.s.dayProfiles[String(parseD(ds).getDay())];
  return (DB.s.scheduleProfiles||[]).find(p=>p.id===id)||null;
}
function scheduleBlocks(ds){const p=scheduleProfile(ds);return p?buildScheduleBlocks(p):[];}
function default24(ds){return !scheduleProfile(ds);}
function is24(ds){
  const f=DB.s.force24[ds];
  return f!==undefined?f:default24(ds);
}
function bandAt(ds,min){
  if(is24(ds))return null;
  const b=scheduleBlocks(ds).find(x=>min>=x.s&&min<x.e)||null;
  if(!b||b.cls||b.e-b.s<=120)return b;
  // 자정~등교 전처럼 긴 빈 구간은 통째로 채우지 않고 손가락이 놓인 1시간만 사용한다.
  const s=Math.max(b.s,Math.floor(min/60)*60);
  return {id:b.id+'h'+s,s,e:Math.min(b.e,s+60),name:b.name,cls:false};
}
function relParts(s,e){
  const rs=rel(s),re=rs+(e-s);
  return re<=1440?[[rs,re]]:[[rs,1440],[0,re-1440]];
}
function hhmm(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function durTxt(d){return d>=60?(d%60?Math.floor(d/60)+'시간 '+(d%60)+'분':Math.floor(d/60)+'시간'):d+'분';}
/** 절대 분 → 하루 안에서의 상대 위치(0=02:00) */
const rel=m=>((m-DAY0)%1440+1440)%1440;
const abs=r=>((Math.round(r)+DAY0)%1440+1440)%1440;
const snapTo=(m,step)=>Math.round(m/step)*step;
const snap=m=>snapTo(m,SNAP);
const placeSnap=m=>snapTo(m,PLACE_SNAP);

/* ═════ 2. 저장소 ═════ */
const KEY='planner_v3';
function freshSettings(){return {force24:{},theme:'sys',scheduleProfiles:[],dayProfiles:{},tutorialSeen:false};}
function normalizeProfile(p){
  const blocks=(Array.isArray(p&&p.blocks)?p.blocks:[]).map((b,i)=>({
    id:String(b.id||('b'+i+'-'+Date.now().toString(36))),name:String(b.name||'시간대'),
    s:Math.max(0,Math.min(1435,Math.round(Number(b.s)||0))),
    e:Math.max(5,Math.min(1440,Math.round(Number(b.e)||0)))
  })).filter(b=>b.e>b.s).sort((a,b)=>a.s-b.s);
  return {id:String(p&&p.id||('sch-'+Date.now().toString(36))),name:String(p&&p.name||'시간표'),blocks};
}
function legacyDuration(min){
  const b=buildScheduleBlocks(legacyProfile()).find(x=>min>=x.s&&min<x.e)||null;
  if(!b)return 60;if(!b.cls&&b.e-b.s>120)return Math.min(60,b.e-Math.floor(min/60)*60);
  return b.e-b.s;
}
function normalizeDB(d,legacy){
  d=d&&typeof d==='object'?d:{};const raw=d.s&&typeof d.s==='object'?d.s:{};
  const hasSchedules=Array.isArray(raw.scheduleProfiles)&&raw.dayProfiles&&typeof raw.dayProfiles==='object';
  const hasPlannerData=(Array.isArray(d.tasks)&&d.tasks.length)||(Array.isArray(d.subjects)&&d.subjects.length)||(Array.isArray(d.repeats)&&d.repeats.length);
  const s=freshSettings();s.force24=raw.force24&&typeof raw.force24==='object'?Object.assign({},raw.force24):{};
  s.theme=['sys','light','dark'].includes(raw.theme)?raw.theme:'sys';s.tutorialSeen=raw.tutorialSeen===true;
  if(hasSchedules){
    s.scheduleProfiles=raw.scheduleProfiles.map(normalizeProfile);
    const ids=new Set(s.scheduleProfiles.map(p=>p.id));
    Object.keys(raw.dayProfiles).forEach(k=>{const id=String(raw.dayProfiles[k]||'');if(/^[0-6]$/.test(k)&&ids.has(id))s.dayProfiles[k]=id;});
  }else if(legacy&&hasPlannerData){
    const p=legacyProfile();s.scheduleProfiles=[p];
    ['1','2','3','4','5'].forEach(k=>s.dayProfiles[k]=p.id);
    Object.keys(s.force24).forEach(ds=>{if(s.force24[ds]===false){const wd=String(new Date(ds+'T00:00:00').getDay());s.dayProfiles[wd]=p.id;}});

  if(rep.freq==='daily')return true;

  if(rep.freq==='interval')return Math.round((d-start)/864e5)%(rep.interval||1)===0;
  return false;
}

/** 겹치면 나란히 놓지 않고 서로 경계를 맞춘다 (이동·크기조절 뒤 정리) */
function resolveOverlaps(ds, movedId){
  const R=t=>rel(t.min), E=t=>rel(t.min)+taskDur(t,ds);
  const day=()=>DB.tasks.filter(t=>t.date===ds&&t.min!=null);
  const moved=day().find(t=>t.id===movedId); if(!moved) return;
  const ms=R(moved), me=E(moved);
  day().filter(t=>t.id!==movedId).forEach(t=>{
    const ts=R(t), te=E(t);
    if(te<=ms||ts>=me) return;
    if(ts<ms){ t.dur=Math.max(SNAP, ms-ts); }          // 앞엣것은 끝을 잘라 맞춘다
    else { const d=Math.max(SNAP,te-ts);               // 뒤엣것은 뒤로 밀어 이어 붙인다
           t.min=abs(Math.min(1440-d, me)); t.dur=d; }
  });
  // 밀린 것끼리 다시 겹치면 순서대로 정렬해 붙인다
  let cur=me;
  day().filter(t=>t.id!==movedId&&R(t)>=me).sort((a,b)=>R(a)-R(b)).forEach(t=>{
    const d=Math.max(SNAP,taskDur(t,ds));
    if(R(t)<cur) t.min=abs(Math.min(1440-d,cur));
    cur=rel(t.min)+taskDur(t,ds);

/** 한 칸의 일정을 원하는 순서로 놓고 칸 시간을 똑같이 나눈다 */
function splitBand(ds, band, fillEvenIfOne, movingId, insertAt){
  let inB=DB.tasks.filter(t=>t.date===ds&&t.min!=null&&t.min>=band.s&&t.min<band.e)
    .sort((a,b)=>a.min-b.min||(a.ord||0)-(b.ord||0));
  if(movingId&&insertAt!=null){
    const mv=inB.find(t=>t.id===movingId);
    if(mv){inB=inB.filter(t=>t.id!==movingId);
      inB.splice(Math.max(0,Math.min(inB.length,insertAt)),0,mv);}}
  if(!inB.length) return;
  if(inB.length<2&&!fillEvenIfOne) return;
  const each=Math.max(SNAP, snap((band.e-band.s)/inB.length));

  const spans=items.filter((it,i)=>{
    const d=it.e-it.s;if(d<=0||d*PPM>=MIN_EVENT_PX)return false;
    const next=items.slice(i+1).find(x=>x.t.id!==it.t.id);
    const roomEnd=Math.max(it.e,Math.min(visualCellEnd(ds,it),next?next.s:1440));
    return (roomEnd-it.s)*PPM<MIN_EVENT_PX;
  }).map(it=>({s:it.s,e:it.e,scale:MIN_EVENT_PX/(it.e-it.s)}));
  const cuts=[0,1440];spans.forEach(x=>{cuts.push(x.s,x.e);});
  cuts.sort((a,b)=>a-b);
  const uniq=cuts.filter((x,i)=>!i||x!==cuts[i-1]),segs=[];let total=0;
  for(let i=0;i<uniq.length-1;i++){

    if(min===1440)return total;
    const q=segs.find(x=>min>=x.s&&min<x.e)||segs[segs.length-1];
    return q.y+(min-q.s)*q.scale;};
  const min=px=>{px=Math.max(0,Math.min(total,px));
    if(px===total)return 1440;
    const q=segs.find(x=>px>=x.y&&px<x.y+(x.e-x.s)*x.scale)||segs[segs.length-1];

    '<b>'+y+'년 '+(m+1)+'월</b>'+

    '<div class="dow">'+DOW.map((d,i)=>'<i class="'+(i===0?'sun':'')+'">'+d+'</i>').join('')+'</div><div class="calgrid">';
  for(let i=0;i<42;i++){

    h+='<div class="cell'+(dt.getMonth()!==m?' out':'')+(ds===TODAY()?' today':'')+(dt.getDay()===0?' sun':'')+'" onclick="openDay(\''+ds+'\')">'+
      '<div class="dn">'+dt.getDate()+'</div>'+
      (n?'<div class="dots">'+Array.from({length:Math.min(n,4)},()=>'<span class="dot"></span>').join('')+'</div>':'')+
      (dds.length?'<div class="cdd">'+esc(dds[0].d.title.slice(0,3))+'</div>':'')+'</div>';}

/* ═════ 9. paint ═════ */
function paint(){
  materializeWindow();
  $('#topin').innerHTML=topHTML();
  $('#view').innerHTML=({today:todayHTML,cal:calHTML,subj:subjHTML}[tab])();
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));

}
function todayStartScroll(){
  if(carryTasks().length)return 0;
  const S=$('#scroll'),now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  const target=timeMap(TODAY()).y(rel(nowMin))-S.clientHeight*.32;
  return Math.max(0,Math.min(Math.max(0,S.scrollHeight-S.clientHeight),target));
}
function focusToday(behavior){
  const S=$('#scroll');S.scrollTo({top:todayStartScroll(),behavior:behavior||'auto'});
}
function placeThumb(){
  const bar=$('#navtabs');if(!bar)return;
  const th=bar.querySelector('.dockthumb'),a=bar.querySelector('.nb.on');if(!th||!a)return;
  th.style.width=a.offsetWidth+'px';th._x=a.offsetLeft;
  if(!th.classList.contains('drag'))th.style.transform='translateX('+a.offsetLeft+'px)';
}
function attachDockDrag(){
  const bar=$('#navtabs');if(!bar||bar._bound)return;bar._bound=true;
  const th=bar.querySelector('.dockthumb');let on=false;
  const idxAt=cx=>{const b=[...bar.querySelectorAll('.nb')];let bi=0,bd=1e9;
    b.forEach((n,i)=>{const r=n.getBoundingClientRect(),c=(r.left+r.right)/2;
      if(Math.abs(cx-c)<bd){bd=Math.abs(cx-c);bi=i;}});return bi;};
  bar.addEventListener('touchstart',()=>{on=true;th.classList.add('drag');
    th.style.transition='transform .18s ease-out, background .2s';
    th.style.transform='translateX('+(th._x||0)+'px) scale(1.13)';},{passive:true});
  bar.addEventListener('touchmove',e=>{if(!on)return;if(e.cancelable)e.preventDefault();
    const r=bar.getBoundingClientRect(),tw=th.offsetWidth;
    let x=e.touches[0].clientX-r.left-tw/2;x=Math.max(0,Math.min(bar.clientWidth-tw,x));
    th._x=x;th.style.transition='none';th.style.transform='translateX('+x+'px) scale(1.13)';},{passive:false});
  const rel2=e=>{if(!on)return;on=false;th.classList.remove('drag');
    th.style.transition='transform .42s cubic-bezier(.32,1.75,.5,1), background .3s';
    const cx=e.changedTouches?e.changedTouches[0].clientX:0,b=[...bar.querySelectorAll('.nb')],i=idxAt(cx),nt=b[i].dataset.t;
    if(nt!==tab)go(nt);else{th._x=b[i].offsetLeft;th.style.transform='translateX('+b[i].offsetLeft+'px)';}};
  bar.addEventListener('touchend',rel2,{passive:true});
  bar.addEventListener('touchcancel',()=>{on=false;th.classList.remove('drag');placeThumb();},{passive:true});
}
function go(t){
  if(t===tab){
    if(t==='today')focusToday('smooth');
    else if(t==='cal'){calM=new Date();$('#scroll').scrollTop=0;paint();toast('이번 달로 돌아왔다');}
    else $('#scroll').scrollTo({top:0,behavior:'smooth'});
    return;}
  const order=['today','cal','subj'],dir=order.indexOf(t)>order.indexOf(tab)?1:-1;
  _anim=true;const v=$('#view');
  v.style.transition='transform .17s ease-in,opacity .17s ease-in';
  v.style.transform='translateX('+(-dir*28)+'px)';v.style.opacity='0';
  setTimeout(()=>{tab=t;$('#scroll').scrollTop=0;paint();
    if(t==='today')requestAnimationFrame(()=>{focusToday();});
    v.style.transition='none';v.style.transform='translateX('+(dir*28)+'px)';v.style.opacity='0';
    requestAnimationFrame(()=>{v.style.transition='transform .32s cubic-bezier(.3,1.1,.4,1),opacity .3s';
      v.style.transform='translateX(0)';v.style.opacity='1';setTimeout(()=>{_anim=false;},320);});},170);
  buzz(8);
}
function moveMonth(n){calM=new Date(calM.getFullYear(),calM.getMonth()+n,1);paint();}
function toggle24(){const ds=TODAY();if(setDateViewMode(ds)){paint();toast(is24(ds)?'24시간 보기':'시간표 표시');}}
function toggleDone(id){const t=DB.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;buzz(9);save();refresh();}
function carryAction(id,action){
  const prev=addDays(TODAY(),-1),t=DB.tasks.find(x=>x.id===id&&x.date===prev&&!x.done);if(!t)return;
  if(action==='done'){
    t.done=true;
  }else if(action==='delete'||action==='move'){
    const oldDate=t.date,oldBand=t.min!=null?(autoSlotBand(t)||bandAt(t.date,t.min)):null;
    addRepException(t);
    if(action==='delete')DB.tasks=DB.tasks.filter(x=>x.id!==t.id);
    else{
      const ord=DB.tasks.filter(x=>x.date===TODAY()&&x.min==null).length;
      Object.assign(t,{date:TODAY(),min:null,dur:null,autoSlot:null,ord,done:false,repId:null});
    }
    if(oldBand){if(oldBand.auto)splitAutoSlot(oldDate,oldBand,true);else splitBand(oldDate,oldBand,true);}
  }else return;
  SEL=null;save();buzz(10);paint();
  toast(action==='done'?'어제 할 일을 완료했다':action==='delete'?'어제 할 일을 지웠다':'오늘 미배정으로 옮겼다');
}

/* ═════ 10. 스와이프 ═════ */
(function(){
  const S=$('#scroll');let x0=null,y0=null,decided=false,horiz=false;
  S.addEventListener('touchstart',e=>{if(_anim||GD.on){x0=null;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;decided=false;horiz=false;},{passive:true});
  S.addEventListener('touchmove',e=>{
    if(x0==null||GD.on)return;
    const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
    if(!decided&&(Math.abs(dx)>10||Math.abs(dy)>10)){decided=true;horiz=Math.abs(dx)>Math.abs(dy)*1.6;}
    if(horiz&&e.cancelable){e.preventDefault();const v=$('#view');v.style.transition='none';
      v.style.transform='translateX('+(dx*.28)+'px)';v.style.opacity=String(Math.max(.55,1-Math.abs(dx)/620));}
  },{passive:false});
  const end=e=>{if(x0==null)return;const v=$('#view');
    if(horiz){const dx=(e.changedTouches?e.changedTouches[0].clientX:x0)-x0;
      const order=['today','cal','subj'],i=order.indexOf(tab);
      v.style.transition='transform .26s cubic-bezier(.3,1.1,.4,1),opacity .24s';
      v.style.transform='translateX(0)';v.style.opacity='1';
      if(dx<-58&&i<order.length-1)go(order[i+1]);else if(dx>58&&i>0)go(order[i-1]);}
    x0=null;decided=false;horiz=false;};
  S.addEventListener('touchend',end);S.addEventListener('touchcancel',end);
})();

/* ═════ 11. 그리드 조작 — 이동 / 크기 / 경계 / 미배정 끌어놓기 ═════ */
const GD={on:false,endedAt:0};
/* 제스처 (롱프레스 없음)
   · 탭            → 선택. 위아래 손잡이가 나온다
   · 선택된 걸 탭   → 자세한 옵션(수정)
   · 선택된 걸 끌기 → 이동
   · 손잡이 끌기    → 길이 조절 (뒤엣것과 맞닿아 있으면 경계를 함께 민다)
   · 미배정 바로 끌어올리면 → 미배정으로 되돌린다                         */
function bindGrid(root){
  // 한 노드에 딱 한 번만 붙인다. _b 를 되돌려 다시 부르면 같은 노드에 리스너가 겹쳐
  // 완료 토글이 짝수 번 실행되고(= 아무 일도 안 일어난다) 리스너가 배로 불어난다.
  if(!root||root._b)return;root._b=true;
  const grid=()=>root.querySelector('.grid');
  const unbar=()=>root.querySelector('.unbar');
  const dateOf=()=>{const g=grid();return g?g.dataset.date:TODAY();};
  const scroller=()=>root.closest('#sheet')||document.getElementById('scroll');
  const tag=document.getElementById('ptag');
  // 화면을 그린 timeMap 과 손가락 좌표가 갈라지지 않게 제스처가 시작될 때마다 다시 잡는다.
  // 짧은 일정이 하나 생기면 그 아래 구간의 배율이 통째로 바뀌므로 바인딩 시점 값을 붙들면 안 된다.
  // 한 번의 드래그 안에서는 다시 그리지 않으니 제스처 도중에는 그대로 쓴다.
  let map=timeMap(dateOf());
  let mode=null,el=null,tid=null,sy=0,sx=0,moved=0,armed=false,blocked=false,virtualDoneId=null,ghost=null;
  let baseS=0,baseD=0,prevT=null,prevBase=0,nextT=null,nextBase=0,curS=0,curD=0,overUn=false,prevBand=null,dropBand=null,dropIndex=null;

  const relAt=cy=>{const r=grid().getBoundingClientRect();
    return map.min(cy-r.top);};
  // 짧은 일정은 실제 시간 높이를 유지하고, 손가락 좌표만 가까운 일정에 매칭한다.
  const pickAt=(cx,cy)=>{
    const g=grid();if(!g)return null;
    const r=g.getBoundingClientRect();
    if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return null;
    const py=cy-r.top,pad=22;
    const hits=gridItems(dateOf()).filter(it=>py>=map.y(it.s)-pad&&py<=map.y(it.e)+pad);
    hits.sort((a,b)=>{
      const da=Math.abs(py-(map.y(a.s)+map.y(a.e))/2),db=Math.abs(py-(map.y(b.s)+map.y(b.e))/2);
      if(Math.abs(da-db)>.01)return da-db;
      if(a.t.id===SEL)return -1;if(b.t.id===SEL)return 1;
      return (a.t.ord||0)-(b.t.ord||0);});
    return hits[0]||null;};
  const inDoneZone=(cx)=>{const r=grid().getBoundingClientRect();return cx>=r.right-44;};
  const showTag=(txt,cy)=>{
    tag.textContent=txt;tag.classList.add('on');
    const r=tag.getBoundingClientRect(),g=grid().getBoundingClientRect();
    tag.style.left=Math.max(8,Math.min(window.innerWidth-r.width-8,g.left+g.width/2-r.width/2))+'px';
    tag.style.top=Math.max(8,cy-64)+'px';};
  const paintEl=(sMin,dMin)=>{
    if(!el)return;
    const top=map.y(sMin),h=Math.max(MIN_EVENT_PX,map.y(Math.min(1440,sMin+dMin))-top);
    el.style.top=top+'px';el.style.height=h+'px';
    el.classList.toggle('sm',h<40);
    const lab=el.querySelector('.evtime');
    if(lab)lab.textContent=hhmm(abs(sMin))+'~'+hhmm(abs(sMin+dMin));
    const m=el.querySelector('.evm');
    if(m)m.textContent=hhmm(abs(sMin))+'~'+hhmm(abs(sMin+dMin))+' \u00b7 '+durTxt(dMin);};
  const ensureGhost=()=>{
    if(ghost)return ghost;
    const task=DB.tasks.find(x=>x.id===tid),sj=task&&task.subj?subjOf(task.subj):null;
    ghost=document.createElement('div');ghost.className='ev dropghost';
    ghost.innerHTML='<div class="evb"><div class="evtitle"><div class="evt">'+esc(task?task.title:'')+'</div>'+
      (sj?'<span class="evcat"><i style="background:'+sj.color+'"></i>'+esc(sj.name)+'</span>':'')+'</div><div class="evm"></div></div>';
    grid().appendChild(ghost);return ghost;};
  const paintGhost=(sMin,dMin)=>{
    const g=ensureGhost(),top=map.y(sMin),h=Math.max(MIN_EVENT_PX,map.y(Math.min(1440,sMin+dMin))-top);
    g.style.top=top+'px';g.style.height=h+'px';g.style.left='3px';g.style.right='3px';
    g.classList.toggle('sm',h<40);
    const m=g.querySelector('.evm');if(m)m.textContent=hhmm(abs(sMin))+'~'+hhmm(abs(sMin+dMin))+' \u00b7 '+durTxt(dMin);};
  const clearAll=()=>{
    if(el)el.classList.remove('act','dragging');
    if(ghost){ghost.remove();ghost=null;}
    const u=unbar();if(u)u.classList.remove('tgt');
    tag.classList.remove('on');
    mode=null;el=null;tid=null;prevT=null;nextT=null;overUn=false;armed=false;prevBand=null;dropBand=null;dropIndex=null;blocked=false;virtualDoneId=null;
    GD.on=false;GD.endedAt=Date.now();};
  const inUnbar=(cx,cy)=>{const u=unbar();if(!u)return false;
    const r=u.getBoundingClientRect();
    return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom;};
  const autoScroll=cy=>{
    if(overUn)return;                       // 미배정 바 위에선 스크롤하지 않는다
    const S=scroller(),r=S.getBoundingClientRect();
    let v=0;
    if(cy<r.top+70)v=-Math.min(13,(r.top+70-cy)/5);
    else if(cy>r.bottom-110)v=Math.min(13,(cy-(r.bottom-110))/5);
    if(v)S.scrollTop+=v;};

  root.addEventListener('touchstart',e=>{
    map=timeMap(dateOf());
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=0;virtualDoneId=null;
    if(e.target.closest('.evck,.uck')){
      blocked=true;mode=null;el=null;tid=null;armed=false;dropIndex=null;
      return;}
    blocked=false;
    // 보이는 주황 막대 자체를 잡았을 때만 크기를 조절한다.
    const handle=e.target.closest('.evh i')?.parentElement||null;
    let ev=e.target.closest('.ev');
    const uc=e.target.closest('.uchip');

    // 실제 카드 밖을 눌러도 22px 안의 가장 가까운 일정이 잡힌다.
    if(!handle&&!ev&&!uc){
      const picked=pickAt(t.clientX,t.clientY);
      if(picked){
        ev=root.querySelector('.ev[data-id="'+picked.t.id+'"]');
        if(inDoneZone(t.clientX)){
          virtualDoneId=picked.t.id;blocked=true;
          mode=null;el=null;tid=null;armed=false;dropIndex=null;
          return;}}}

    if(uc){                                   // 미배정도 먼저 선택한 뒤에만 끌린다
      el=uc;tid=uc.dataset.id;prevBand=null;
      const task=DB.tasks.find(x=>x.id===tid);
      baseD=task&&task.dur?task.dur:60;curD=baseD;
      if(SEL===tid){mode='new';armed=true;if(e.cancelable)e.preventDefault();}
      return;}

    if(handle&&ev&&SEL===ev.dataset.id){       // 선택된 일정의 손잡이만 길이 조절
      const ds=dateOf(),task=DB.tasks.find(x=>x.id===ev.dataset.id);if(!task)return;
      el=ev;tid=task.id;mode=handle.classList.contains('t')?'rt':'rb';
      baseS=rel(task.min);baseD=Math.max(SNAP,taskDur(task,ds));curS=baseS;curD=baseD;
      prevBand=autoSlotBand(task);
      if(mode==='rt'){
        prevT=DB.tasks.find(x=>x.date===ds&&x.id!==task.id&&x.min!=null&&Math.abs(rel(x.min)+taskDur(x,ds)-baseS)<.5)||null;
        if(prevT)prevBase=Math.max(SNAP,taskDur(prevT,ds));
      }else{
        const endR=baseS+baseD;
        nextT=DB.tasks.find(x=>x.date===ds&&x.id!==task.id&&x.min!=null&&Math.abs(rel(x.min)-endR)<.5)||null;
        if(nextT)nextBase=Math.max(SNAP,taskDur(nextT,ds));}
      GD.on=true;el.classList.add('act');
      if(e.cancelable)e.preventDefault();
      return;}

    if(ev){
      const ds=dateOf(),task=DB.tasks.find(x=>x.id===ev.dataset.id);if(!task)return;
      el=ev;tid=task.id;
      baseS=rel(task.min);baseD=Math.max(SNAP,taskDur(task,ds));curS=baseS;curD=baseD;
      prevBand=autoSlotBand(task)||bandAt(ds,task.min);
      // 첫 탭은 선택만 한다. 선택된 카드의 본문만 이동 영역으로 활성화한다.
      if(SEL===task.id){mode='move';armed=true;}
    }
  },{passive:false});

  root.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    moved=Math.max(moved,Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy));
    if(!GD.on){
      if(armed&&moved>7){GD.on=true;if(el)el.classList.add(mode==='new'?'dragging':'act');buzz(12);}
      else return;}
    if(e.cancelable)e.preventDefault();
    const ds=dateOf(),r=relAt(t.clientY);

    if(mode==='move'||mode==='new'){
      overUn=inUnbar(t.clientX,t.clientY);
      const u=unbar();if(u)u.classList.toggle('tgt',overUn);
      autoScroll(t.clientY);
      if(overUn){if(ghost){ghost.remove();ghost=null;}showTag('미배정으로',t.clientY);return;}
      const task=DB.tasks.find(x=>x.id===tid),point=placeSnap(r);
      let d=(task&&task.autoSlot!=null)?60:baseD,sM=placeSnap(r-d/2);
      dropBand=null;
      const b=bandAt(ds,abs(point));           // 학교 시간표면 쉬는시간까지 모든 칸에 맞춘다
      if(b){
        const others=DB.tasks.filter(x=>x.date===ds&&x.id!==tid&&x.min!=null&&x.min>=b.s&&x.min<b.e)
          .sort((a,c)=>a.min-c.min||(a.ord||0)-(c.ord||0));
        const raw=abs(point),n=others.length+1;
        dropIndex=Math.max(0,Math.min(others.length,Math.floor(((raw-b.s)/(b.e-b.s))*n)));
        const each=Math.max(SNAP,snap((b.e-b.s)/n));
        const sAbs=Math.min(b.e-SNAP,b.s+each*dropIndex);
        sM=rel(sAbs);d=dropIndex===n-1?Math.max(SNAP,b.e-sAbs):each;
      }else if(is24(ds)&&(baseD===60||(task&&task.autoSlot!=null))){
        let slot=weekendSlotAt(ds,point,tid);
        if(!slot){const ss=Math.max(0,Math.min(1380,placeSnap(r-30)));
          const candidate={id:'auto'+ss,s:ss,e:ss+60,auto:true};
          if(autoSlotClean(ds,candidate,tid))slot=candidate;}
        if(slot){
          dropBand=slot;
          const others=autoSlotMembers(ds,slot).filter(x=>x.id!==tid)
            .sort((a,c)=>rel(a.min)-rel(c.min)||(a.ord||0)-(c.ord||0));
          const n=others.length+1;
          dropIndex=Math.max(0,Math.min(others.length,Math.floor(((point-slot.s)/60)*n)));
          const each=Math.max(SNAP,Math.floor((60/n)/SNAP)*SNAP);
          sM=Math.min(slot.e-SNAP,slot.s+each*dropIndex);
          d=dropIndex===n-1?Math.max(SNAP,slot.e-sM):each;
        }else dropIndex=null;
      }else dropIndex=null;
      sM=Math.max(0,Math.min(1440-d,sM));curS=sM;curD=d;
      if(mode==='move')paintEl(sM,d);
      else paintGhost(sM,d);
      showTag(hhmm(abs(sM))+' ~ '+hhmm(abs(sM+d))+' \u00b7 '+durTxt(d),t.clientY);
    }else{
      autoScroll(t.clientY);
      if(mode==='rt'){
        const minS=prevT?baseS-prevBase+SNAP:0;
        let sM=snap(r);sM=Math.max(minS,Math.min(baseS+baseD-SNAP,sM));
        curS=sM;curD=baseS+baseD-sM;paintEl(curS,curD);
        showTag((prevT?'경계 ':'')+hhmm(abs(curS))+' 시작 \u00b7 '+durTxt(curD),t.clientY);
      }else{
        const maxE=nextT?baseS+baseD+nextBase-SNAP:1440;
        let en=snap(r);en=Math.max(baseS+SNAP,Math.min(maxE,en));
        curS=baseS;curD=en-baseS;paintEl(curS,curD);
        showTag((nextT?'경계 ':'')+hhmm(abs(en))+' \u00b7 '+durTxt(curD),t.clientY);}
    }
  },{passive:false});

  const commit=()=>{
    if(blocked){
      const doneId=virtualDoneId,shouldToggle=doneId&&moved<=9;
      blocked=false;virtualDoneId=null;
      if(shouldToggle)toggleDone(doneId);
      return;}
    if(!GD.on){                                // 끌지 않았다 = 탭
      if(el&&tid&&moved<=9){
        const id=tid,isEvent=el.classList.contains('ev'),isUnassigned=el.classList.contains('uchip');
        if(isEvent){const wasSel=(SEL===id);clearAll();
          if(wasSel){GD.endedAt=Date.now();openTask(id);}   // 선택된 걸 또 탭 → 수정
          else{SEL=id;buzz(8);refresh();}                   // 처음 탭 → 선택
          return;}
        if(isUnassigned){const wasSel=(SEL===id);clearAll();
          if(wasSel){GD.endedAt=Date.now();openTask(id);}
          else{SEL=id;buzz(8);refresh();}
          return;}}
      clearAll();return;}
    const ds=dateOf(),task=DB.tasks.find(x=>x.id===tid);
    const leftBand=prevBand;
    if(task){
      if((mode==='move'||mode==='new')&&overUn){
        task.min=null;task.dur=null;task.autoSlot=null;if(SEL===task.id)SEL=null;
      }else if(mode==='rt'&&prevT){
        clearAutoSlot(ds,leftBand);clearAutoSlot(ds,autoSlotBand(prevT));
        resizeLinked(task,mode,baseS,baseD,curS,curD,prevT,prevBase);
      }else if(mode==='rb'&&nextT){
        clearAutoSlot(ds,leftBand);clearAutoSlot(ds,autoSlotBand(nextT));
        resizeLinked(task,mode,baseS,baseD,curS,curD,nextT,nextBase);
      }else{
        if(mode==='rt'||mode==='rb')clearAutoSlot(ds,leftBand);
        task.min=abs(curS);task.dur=Math.max(SNAP,curD);
        const b=bandAt(ds,task.min);
        if(dropBand&&(mode==='move'||mode==='new')){
          task.autoSlot=dropBand.s;splitAutoSlot(ds,dropBand,false,task.id,dropIndex);
        }else if(b&&(mode==='move'||mode==='new')){
          task.autoSlot=null;splitBand(ds,b,false,task.id,dropIndex);
        }else{task.autoSlot=null;resolveOverlaps(ds,task.id);}
        SEL=task.id;}
      // 원래 칸을 떠나면 남은 일정이 반드시 칸 전체를 다시 채운다.
      // 동적 새벽 1시간 슬롯도 s/e로 비교해야 같은 큰 gap id에 속한 다른 시간을 구분할 수 있다.
      if((mode==='move'||mode==='new')&&leftBand){
        const landed=task.min==null?null:(autoSlotBand(task)||bandAt(ds,task.min));
        if(!sameBand(leftBand,landed)){
          if(leftBand.auto)splitAutoSlot(ds,leftBand,true);
          else splitBand(ds,leftBand,true);}}
      save();buzz(11);}
    clearAll();refresh();};
  root.addEventListener('touchend',commit);
  root.addEventListener('touchcancel',()=>{clearAll();refresh();});

  root.addEventListener('click',e=>{
    if(e.target.closest('.evck')){
      const ev=e.target.closest('.ev');if(ev){e.stopPropagation();toggleDone(ev.dataset.id);}return;}
    if(e.target.closest('.uck')){
      const uc=e.target.closest('.uchip');if(uc){e.stopPropagation();toggleDone(uc.dataset.id);}return;}
    if(GD.on||Date.now()-GD.endedAt<300)return;

      const id=ev.dataset.id;

    if(uc){const id=uc.dataset.id;if(SEL===id)openTask(id);else{SEL=id;buzz(8);refresh();}return;}
    if(SEL){SEL=null;refresh();}          // 일정이 없는 곳을 누르면 어디든 선택 해제
  });
}
function bindGoalDrag(){
  document.querySelectorAll('.goals').forEach(list=>{
    if(list._b)return;list._b=true;
    let items=[],el=null,y0=0,h=44,from=-1,to=-1,timer=null,active=false;
    const clr=()=>{clearTimeout(timer);timer=null;};
    list.addEventListener('touchstart',e=>{const it=e.target.closest('.gl');if(!it)return;
      y0=e.touches[0].clientY;clr();
      timer=setTimeout(()=>{active=true;el=it;items=[...list.querySelectorAll('.gl')];
        from=items.indexOf(it);to=from;
        h=items.length>1?(items[1].getBoundingClientRect().top-items[0].getBoundingClientRect().top):it.offsetHeight;
        items.forEach(x=>{if(x!==it)x.style.transition='transform .18s cubic-bezier(.3,1.2,.5,1)';});
        it.classList.add('dragging');buzz(12);},240);},{passive:true});
    list.addEventListener('touchmove',e=>{
      if(!active){if(Math.abs(e.touches[0].clientY-y0)>8)clr();return;}
      if(e.cancelable)e.preventDefault();
      const dy=e.touches[0].clientY-y0;
      el.style.transform='translateY('+dy+'px) scale(1.02)';
      to=Math.max(0,Math.min(items.length-1,from+Math.round(dy/h)));
      items.forEach((it,i)=>{if(it===el)return;let s=0;
        if(from<to&&i>from&&i<=to)s=-h;else if(from>to&&i>=to&&i<from)s=h;
        it.style.transform=s?'translateY('+s+'px)':'';});},{passive:false});
    const end=()=>{clr();if(!active)return;active=false;
      const s=subjOf(list.dataset.sid),ids=items.map(x=>x.dataset.gid);
      el.classList.remove('dragging');items.forEach(x=>{x.style.transition='';x.style.transform='';});
      if(to!==from&&s){const mv=ids.splice(from,1)[0];ids.splice(to,0,mv);
        s.goals=ids.map(id=>s.goals.find(g=>g.id===id)).filter(Boolean);save();paint();}
      el=null;};
    list.addEventListener('touchend',end);list.addEventListener('touchcancel',end);});
}

/* ═════ 12. 시트 ═════ */
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;
  closeSubSheet();
  $('#scrim').classList.add('on');$('#sheet').classList.add('on');
  $('#popfab').classList.remove('on');}
function closeSheet(fromScrim){
  const resume=_tourReturnStep;_tourReturnStep=null;
  closeSubSheet();$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');
  $('#popfab').classList.remove('on');popDate=null;
  if(resume!=null)setTimeout(()=>openTutorial(resume),90);
  else if(fromScrim&&_tourActive)setTimeout(()=>tourMove(-1),90);
}
let _popScroll=0;
function subSheetOn(){return $('#subsheet').classList.contains('on');}
function openSubSheet(html){
  if(!subSheetOn())_popScroll=$('#sheet').scrollTop;
  $('#subsheet').innerHTML='<div class="grab"></div>'+html;
  $('#subscrim').classList.add('on');$('#subsheet').classList.add('on');$('#popfab').classList.remove('on');
  tourRelayout();
}
function closeSubSheet(){
  const sub=$('#subsheet');if(!sub)return;
  const was=sub.classList.contains('on');
  $('#subscrim').classList.remove('on');sub.classList.remove('on');
  if(popDate&&$('#sheet').classList.contains('on')){
    $('#popfab').classList.add('on');requestAnimationFrame(()=>{$('#sheet').scrollTop=_popScroll;});}
  if(was)tourRelayout();
}
function openTaskSheet(html){
  if(popDate&&$('#sheet').classList.contains('on')&&$('#popbody'))openSubSheet(html);else openSheet(html);
}
function finishTaskSheet(){
  SEL=null;
  if(subSheetOn()){
    closeSubSheet();
    if(popDate&&$('#popbody')){$('#popbody').innerHTML=renderDay(popDate);
      requestAnimationFrame(()=>{$('#sheet').scrollTop=_popScroll;});}
  }else{closeSheet();paint();}
}
let _ed={},_adv=false;
function newTask(ds,min){
  _ed={id:null,title:'',date:ds||TODAY(),min:(min==null?null:min),dur:null,subj:null,rep:null,repId:null};
  _adv=false;taskSheet();
}
function openTask(id){
  const t=DB.tasks.find(x=>x.id===id);if(!t)return;
  const rule=t.repId?DB.repeats.find(r=>r.id===t.repId):null;
  _ed={id:t.id,title:t.title,date:t.date,min:t.min,dur:t.dur,subj:t.subj||null,repId:t.repId||null,
    rep:rule?{freq:rule.freq,weekdays:(rule.weekdays||[]).slice(),interval:rule.interval||2,start:rule.start,end:rule.end||''}:null};
  _adv=true;taskSheet();
}
function detailHTML(){
  const e=_ed,rep=e.rep;
  const eEnd=e.min!=null?e.min+(e.dur!=null?e.dur:taskDur({min:e.min,dur:null},e.date)):null;
  const when=e.min==null?'미배정':hhmm(e.min)+' ~ '+hhmm(eEnd)+' · '+durTxt(eEnd-e.min);
  let h='<div class="fl">현재 배치</div><div style="padding:13px 15px;border-radius:var(--r3);background:var(--muted);'+
    'font-size:14px;font-weight:800;color:var(--ink2)">'+when+
    '<div style="margin-top:4px;font-size:11.5px;font-weight:650;color:var(--ink3)">시간 변경은 일정의 손잡이와 드래그로 한다</div></div>';
  if(DB.subjects.length)h+='<div class="fl">과목</div><div class="seg"><button class="sg'+(!e.subj?' on':'')+'" onclick="setSubj(null)">없음</button>'+
    DB.subjects.map(s=>'<button class="sg'+(e.subj===s.id?' on':'')+'" onclick="setSubj(\''+s.id+'\')">'+esc(s.name)+'</button>').join('')+'</div>';
  h+='<div class="fl">반복</div><div class="seg">'+
    '<button class="sg'+(!rep?' on':'')+'" onclick="setRep(null)">없음</button>'+
    '<button class="sg'+(rep&&rep.freq==='daily'?' on':'')+'" onclick="setRep(\'daily\')">매일</button>'+
    '<button class="sg'+(rep&&rep.freq==='weekly'?' on':'')+'" onclick="setRep(\'weekly\')">요일 지정</button>'+
    '<button class="sg'+(rep&&rep.freq==='interval'?' on':'')+'" onclick="setRep(\'interval\')">N일마다</button></div>';
  if(rep){
    if(rep.freq==='weekly')h+='<div style="margin-top:10px" class="dws">'+DOW.map((d,i)=>
      '<button class="dw'+(rep.weekdays.includes(i)?' on':'')+(i===0?' sun':'')+'" onclick="togDow('+i+')">'+d+'</button>').join('')+'</div>';
    if(rep.freq==='interval')h+='<div class="tp" style="margin-top:8px"><button class="tpb" onclick="bumpN(-1)">−</button>'+
      '<div><div class="tpv">'+rep.interval+'일</div><div class="tpu">마다 반복</div></div>'+
      '<button class="tpb" onclick="bumpN(1)">+</button></div>';
    h+='<div class="two" style="margin-top:12px">'+
      '<div><label>시작</label><input class="fi" type="date" id="r_s" value="'+rep.start+'"></div>'+
      '<div><label>종료 (비우면 계속)</label><input class="fi" type="date" id="r_e" value="'+(rep.end||'')+'"></div></div>';
  }
  return h;
}
function taskSheet(){
  const e=_ed;
  let h='<div class="sh2">'+(e.id?'할일 수정':'새 할일')+'</div>'+
    '<input class="fi" id="f_title" placeholder="무엇을 할까" value="'+esc(e.title)+'">';
  if(!e.id&&!_adv){
    const where=e.min==null?'미배정':(hhmm(e.min)+(bandAt(e.date,e.min)?' · '+esc(bandAt(e.date,e.min).name):''));
    if(DB.subjects.length)h+='<div class="fl">과목</div><div class="seg">'+
      '<button class="sg'+(!e.subj?' on':'')+'" onclick="setSubj(null)">없음</button>'+
      DB.subjects.map(x=>'<button class="sg'+(e.subj===x.id?' on':'')+'" onclick="setSubj(\''+x.id+'\')">'+esc(x.name)+'</button>').join('')+'</div>';
    h+='<div class="fl">'+where+'에 들어간다<button onclick="toggleAdv()">자세히 ▾</button></div>';
  }else{
    h+=detailHTML();
    if(!e.id)h+='<div class="fl"><span></span><button onclick="toggleAdv()">간단히 ▴</button></div>';
  }
  h+='<div class="row2">'+(e.id?'<button class="btn s" onclick="copyTask()">미배정으로 복사</button>':'')+
    '<button class="btn p" onclick="saveTask()">'+(e.id?'저장':'추가')+'</button></div>';
  if(e.id)h+='<div class="row2"><button class="btn d" onclick="delTask(false)">'+(e.repId?'이것만 삭제':'삭제')+'</button>'+
    (e.repId?'<button class="btn d" onclick="delTask(true)">반복 전체 삭제</button>':'')+'</div>';
  openTaskSheet(h);
  setTimeout(()=>{if(!e.id&&$('#f_title'))$('#f_title').focus();},380);
}
function readTitle(){const i=$('#f_title');if(i)_ed.title=i.value;
  const rs=$('#r_s'),re=$('#r_e');if(_ed.rep){if(rs)_ed.rep.start=rs.value;if(re)_ed.rep.end=re.value;}}
function toggleAdv(){readTitle();_adv=!_adv;taskSheet();}
function setSubj(s){readTitle();_ed.subj=s;taskSheet();}
function setRep(f){readTitle();
  if(!f)_ed.rep=null;
  else _ed.rep={freq:f,weekdays:[parseD(_ed.date).getDay()],interval:2,start:_ed.date,end:''};
  taskSheet();}
function togDow(i){readTitle();const d=_ed.rep.weekdays,k=d.indexOf(i);
  if(k>=0){if(d.length>1)d.splice(k,1);}else d.push(i);taskSheet();}
function bumpN(x){readTitle();_ed.rep.interval=Math.max(1,Math.min(60,_ed.rep.interval+x));taskSheet();}
function copyTask(){
  readTitle();const e=_ed;if(!e.id)return;
  const title=e.title.trim();if(!title){toast('할일 이름을 적어줘');return;}
  const date=e.date||TODAY();
  const ord=DB.tasks.filter(x=>x.date===date&&x.min==null).length;
  DB.tasks.push({id:uid(),title,date,min:null,dur:null,ord,done:false,subj:e.subj||null,repId:null});
  save();finishTaskSheet();
  toast('미배정에 복사했다');
}
function saveTask(){
  readTitle();const e=_ed;
  if(!e.title.trim()){toast('할일 이름을 적어줘');return;}
  const mkRule=()=>({id:e.repId||uid(),title:e.title.trim(),freq:e.rep.freq,
    weekdays:e.rep.weekdays.slice(),interval:e.rep.interval,
    start:e.rep.start||e.date,end:e.rep.end||'',min:e.min,dur:e.dur,subj:e.subj,
    mode24:is24(e.date),ex:[]});
  if(e.id){
    const t=DB.tasks.find(x=>x.id===e.id);if(!t)return;
    Object.assign(t,{title:e.title.trim(),min:e.min,
      dur:e.min==null?null:(e.dur!=null?e.dur:bandLen(e.date,e.min)),subj:e.subj});
    if(e.rep){
      const old=e.repId?DB.repeats.find(r=>r.id===e.repId):null;
      if(old){const ex=old.ex||[];Object.assign(old,mkRule(),{ex});
        DB.tasks=DB.tasks.filter(x=>!(x.repId===old.id&&x.date>e.date));}
      else{const r=mkRule();DB.repeats.push(r);t.repId=r.id;}
    }else if(e.repId){
      DB.repeats=DB.repeats.filter(r=>r.id!==e.repId);
      DB.tasks.forEach(x=>{if(x.repId===e.repId)x.repId=null;});}
  }else{
    if(e.rep){const r=mkRule();DB.repeats.push(r);}
    else{
      const sibs=DB.tasks.filter(x=>x.date===e.date&&(x.min==null)===(e.min==null));
      DB.tasks.push({id:uid(),title:e.title.trim(),date:e.date,min:e.min,
        dur:e.min==null?null:(e.dur!=null?e.dur:bandLen(e.date,e.min)),
        ord:sibs.length,done:false,subj:e.subj,repId:null});}}
  materializeWindow();save();finishTaskSheet();
  toast(e.id?'수정했다':'추가했다');tourSignal('task-saved');
}
function delTask(all){
  const t=DB.tasks.find(x=>x.id===_ed.id);if(!t)return;
  if(all&&t.repId){
    DB.repeats=DB.repeats.filter(r=>r.id!==t.repId);
    DB.tasks=DB.tasks.filter(x=>x.repId!==t.repId);
  }else{
    addRepException(t);
    const b=t.min!=null?(autoSlotBand(t)||bandAt(t.date,t.min)):null;
    DB.tasks=DB.tasks.filter(x=>x.id!==t.id);
    if(b){if(b.auto)splitAutoSlot(t.date,b,true);else splitBand(t.date,b,true);}}
  save();finishTaskSheet();
  toast(all?'반복 전체를 지웠다':'지웠다');
}

let _dd={};

/* ═════ 14. 요일별 시간표 ═════ */
function profileDays(id){return DOW.map((_,i)=>DB.s.dayProfiles[String(i)]===id?i:null).filter(i=>i!=null);}
function daysText(days){
  const a=days.slice().sort((a,b)=>a-b);
  if(a.length===7)return '매일';if(a.length===5&&[1,2,3,4,5].every(x=>a.includes(x)))return '평일';
  if(a.length===2&&a.includes(0)&&a.includes(6))return '주말';return a.length?a.map(i=>DOW[i]).join(' · '):'적용 요일 없음';
}
function openScheduleSettings(){
  const profiles=DB.s.scheduleProfiles||[],free=DOW.map((d,i)=>DB.s.dayProfiles[String(i)]?null:d).filter(d=>d!=null);
  let list=profiles.length?profiles.map(p=>{
    const days=profileDays(p.id);return '<button class="schedsum" onclick="editSchedule(\''+p.id+'\')"><div><b>'+esc(p.name)+'</b><span>'+esc(daysText(days))+' · 시간대 '+p.blocks.length+'개</span></div><i class="schedbadge">수정</i></button>';
  }).join(''):'<div class="schedempty">아직 만든 시간표가 없다.<br>모든 요일을 24시간으로 보여준다.</div>';
  openSheet('<div class="sh2">시간표 설정</div><div class="sheetlead">이름을 붙인 시간표를 만들고 적용할 요일을 고르면 된다. 요일마다 따로 만들 수도 있고 평일처럼 묶을 수도 있다.</div>'+list+
    '<div class="fullnote">24시간 보기: '+(free.length?free.join(' · '):'없음')+'<br>시간표가 없는 요일은 하루 전체에 자유롭게 배치된다.</div>'+
    '<div class="row2"><button class="btn p" onclick="editSchedule(null)">새 시간표</button></div>'+
    '<div class="row2"><button class="btn s tutorial-replay" onclick="openTutorial(0)">사용법 다시 보기</button></div>');
}
let _sched={};
function timeVal(m){if(m===1440)return '00:00';m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function parseTime(v,end){if(!/^\d\d:\d\d$/.test(v||''))return NaN;const a=v.split(':').map(Number),m=a[0]*60+a[1];return end&&m===0?1440:m;}
function editSchedule(id){
  const p=id?(DB.s.scheduleProfiles||[]).find(x=>x.id===id):null;
  _sched=p?{id:p.id,name:p.name,days:profileDays(p.id),blocks:p.blocks.map(b=>Object.assign({},b)),deleteArmed:false}:
    {id:null,name:'',days:[1,2,3,4,5],blocks:[{id:uid(),name:'첫 시간대',s:M(9,0),e:M(10,0)}],deleteArmed:false};
  scheduleEditor();
}
function syncScheduleForm(){
  const n=$('#schName');if(n)_sched.name=n.value;
  document.querySelectorAll('.blockrow[data-bi]').forEach(row=>{const b=_sched.blocks[Number(row.dataset.bi)];if(!b)return;
    b.name=row.querySelector('.bname').value;b.s=parseTime(row.querySelector('.bstart').value,false);b.e=parseTime(row.querySelector('.bend').value,true);});
}
function scheduleEditor(){
  const h='<div class="sh2">'+(_sched.id?'시간표 수정':'새 시간표')+'</div>'+
    '<div class="fl">시간표 이름</div><input class="fi" id="schName" placeholder="예: 학교, 토요일 학원" value="'+esc(_sched.name)+'">'+
    '<div class="fl"><span>적용 요일 · 비워두면 24시간</span><span><button onclick="setScheduleDays(\'weekday\')">평일</button> · <button onclick="setScheduleDays(\'none\')">모두 해제</button></span></div>'+
    '<div class="dws">'+DOW.map((d,i)=>'<button class="dw'+(_sched.days.includes(i)?' on':'')+(i===0?' sun':'')+'" onclick="toggleScheduleDay('+i+')">'+d+'</button>').join('')+'</div>'+
    '<div class="fl"><span>시간대</span><button onclick="loadScheduleExample()">학교 예시 불러오기</button></div>'+
    _sched.blocks.map((b,i)=>'<div class="blockrow" data-bi="'+i+'"><div class="bnamewrap"><label>이름</label><input class="fi bname" value="'+esc(b.name)+'" placeholder="예: 1교시"></div>'+
      '<div class="blocktimes"><div><label>시작</label><input class="fi bstart" type="time" step="300" value="'+timeVal(b.s)+'"></div>'+
      '<div><label>끝</label><input class="fi bend" type="time" step="300" value="'+timeVal(b.e)+'"></div></div>'+
      '<button class="blockdel" aria-label="시간대 삭제" onclick="removeScheduleBlock('+i+')">−</button></div>').join('')+
    '<button class="btn s" style="width:100%;margin-top:4px" onclick="addScheduleBlock()">+ 시간대 추가</button>'+
    '<div class="row2"><button class="btn p" onclick="saveSchedule()">저장</button></div>'+
    (_sched.id?'<div class="row2"><button class="btn d" onclick="deleteSchedule()">'+(_sched.deleteArmed?'정말 삭제하기':'시간표 삭제')+'</button></div>':'');
  openSheet(h);
}
function toggleScheduleDay(i){syncScheduleForm();const p=_sched.days.indexOf(i);if(p>=0)_sched.days.splice(p,1);else _sched.days.push(i);scheduleEditor();}
function setScheduleDays(kind){syncScheduleForm();_sched.days=kind==='weekday'?[1,2,3,4,5]:[];scheduleEditor();}
function addScheduleBlock(){
  syncScheduleForm();const last=_sched.blocks.slice().sort((a,b)=>a.e-b.e).pop(),s=last&&Number.isFinite(last.e)?Math.min(1380,last.e+10):M(9,0);
  _sched.blocks.push({id:uid(),name:'새 시간대',s,e:Math.min(1440,s+60)});scheduleEditor();
}
function removeScheduleBlock(i){syncScheduleForm();_sched.blocks.splice(i,1);scheduleEditor();}
function loadScheduleExample(){syncScheduleForm();_sched.blocks=legacyProfile().blocks.map(b=>Object.assign({},b,{id:uid()}));scheduleEditor();}
function saveSchedule(){
  syncScheduleForm();const name=_sched.name.trim(),days=[...new Set(_sched.days)].sort((a,b)=>a-b);
  const blocks=_sched.blocks.map(b=>({id:b.id||uid(),name:String(b.name||'').trim(),s:Number(b.s),e:Number(b.e)})).sort((a,b)=>a.s-b.s);
  if(!name){toast('시간표 이름을 적어줘');return;}if(!blocks.length){toast('시간대를 하나 이상 만들어줘');return;}
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i];if(!b.name){toast('시간대 이름을 모두 적어줘');return;}
    if(!Number.isFinite(b.s)||!Number.isFinite(b.e)||b.s<0||b.e>1440||b.e<=b.s){toast('시작·끝 시간을 확인해줘');return;}
    if(i&&b.s<blocks[i-1].e){toast('겹치는 시간대가 있어');return;}
  }
  const id=_sched.id||uid(),p={id,name,blocks};const at=DB.s.scheduleProfiles.findIndex(x=>x.id===id);
  if(at>=0)DB.s.scheduleProfiles[at]=p;else DB.s.scheduleProfiles.push(p);
  Object.keys(DB.s.dayProfiles).forEach(k=>{if(DB.s.dayProfiles[k]===id)delete DB.s.dayProfiles[k];});
  days.forEach(i=>DB.s.dayProfiles[String(i)]=id);save();paint();openScheduleSettings();toast('시간표를 저장했다');
  tourSignal('schedule-saved');
}
function deleteSchedule(){
  if(!_sched.deleteArmed){syncScheduleForm();_sched.deleteArmed=true;scheduleEditor();return;}
  const id=_sched.id,days=profileDays(id);DB.s.scheduleProfiles=DB.s.scheduleProfiles.filter(p=>p.id!==id);
  Object.keys(DB.s.dayProfiles).forEach(k=>{if(DB.s.dayProfiles[k]===id)delete DB.s.dayProfiles[k];});
  Object.keys(DB.s.force24).forEach(ds=>{if(days.includes(parseD(ds).getDay())&&DB.s.force24[ds]===false)delete DB.s.force24[ds];});
  save();paint();openScheduleSettings();toast('시간표만 삭제했다 · 할일은 그대로다');
}

/* ═════ 15. 화면을 직접 따라가는 사용법 ═════ */
const MASCOT_IDLE='assets/planner-mascot-idle.png';
const MASCOT_LOOP='assets/planner-mascot-loop.gif';
const MASCOT_ONCE='assets/planner-mascot-once.gif';
const MASCOT_CYCLE_MS=5040;
let _homeMascotTimer=null,_homeMascotUntil=0,_homeMascotToken=0;
function mascotHTML(place){
  if(place!=='home')return '';
  const playing=_homeMascotUntil>Date.now();
  return '<button id="mascotHome" class="mascot-home'+(playing?' playing':'')+(_tourActive?' tour-away':'')+'" data-mascot-slot="home" aria-label="캐릭터 움직이기" onclick="playHomeMascot()">'+
    '<img id="mascotHomeImg" src="'+(playing?MASCOT_ONCE:MASCOT_IDLE)+'" alt="주황 해파리 캐릭터"></button>';
}
function playHomeMascot(){
  if(_tourActive)return;const home=$('#mascotHome'),img=$('#mascotHomeImg');if(!home||!img)return;
  const token=++_homeMascotToken;_homeMascotUntil=Date.now()+MASCOT_CYCLE_MS;
  clearTimeout(_homeMascotTimer);home.classList.add('playing');img.src=MASCOT_IDLE;
  requestAnimationFrame(()=>{if(token===_homeMascotToken&&document.contains(img))img.src=MASCOT_ONCE;});
  _homeMascotTimer=setTimeout(()=>{if(token!==_homeMascotToken)return;_homeMascotUntil=0;
    const now=$('#mascotHomeImg'),btn=$('#mascotHome');if(now)now.src=MASCOT_IDLE;if(btn)btn.classList.remove('playing');
  },MASCOT_CYCLE_MS+80);

    '타임그리드로 바꾸기 전 원본 · 할일 <b>'+b.tasks+'</b>개 · 과목 <b>'+b.subjects+'</b>개 · 반복 <b>'+b.repeats+'</b>개</div>'+
    (_bakArm
      ?'<div class="row2" style="margin-top:0"><button class="btn d" onclick="restoreBackup()">정말 되돌린다 — 지금 데이터는 사라진다</button></div>'
      :'<div class="row2" style="margin-top:0"><button class="btn s" onclick="armRestore()">백업으로 되돌리기</button></div>');
}
function importBakInfo(){
  const r=localStorage.getItem(IMPORT_BAK);if(!r)return null;
  try{const d=JSON.parse(r);return {tasks:(d.tasks||[]).length,schedules:(d.s&&d.s.scheduleProfiles||[]).length};}catch(e){return null;}
}
function restoreImportBackup(){
  const r=localStorage.getItem(IMPORT_BAK);if(!r){toast('가져오기 전 백업이 없다');return;}
  try{DB=normalizeDB(JSON.parse(r),true);save();applyTheme();closeSheet();paint();toast('가져오기 전 상태로 되돌렸다');}
  catch(e){toast('백업을 읽지 못했다');}
}
function dataSheet(){
  const ib=importBakInfo();
  openSheet('<div class="sh2">데이터</div>'+
    '<div style="font-size:14px;font-weight:650;color:var(--ink2);line-height:1.7">'+
    '할일 <b>'+DB.tasks.length+'</b>개 · 과목 <b>'+DB.subjects.length+'</b>개 · 반복 <b>'+DB.repeats.length+'</b>개 · 시간표 <b>'+DB.s.scheduleProfiles.length+'</b>개<br>'+
    '<span style="color:var(--ink3);font-size:13px">내보내기 파일에는 시간표 설정까지 모두 들어간다.</span></div>'+
    '<div class="row2"><button class="btn p" onclick="doExport()">내보내기</button>'+
    '<button class="btn s" onclick="document.getElementById(\'fileIn\').click()">가져오기</button></div>'+
    '<div class="row2"><button class="btn s tutorial-replay" onclick="openTutorial(0)">튜토리얼 다시 보기</button></div>'+
    (ib?'<div class="row2"><button class="btn s" onclick="restoreImportBackup()">가져오기 전 상태로 되돌리기 · 할일 '+ib.tasks+'개</button></div>':'')+
    '<div class="fl">백업</div>'+bakHTML()+
    '<div class="fl">반복 규칙</div>'+
    (DB.repeats.length?DB.repeats.map(r=>'<div class="dd" style="border-top:1px solid var(--line2)">'+
      '<div style="flex:1;min-width:0"><div class="ddn">'+esc(r.title)+'</div>'+
      '<div class="ddd">'+repLabel(r)+' · '+r.start+(r.end?' ~ '+r.end:' ~')+(r.min!=null?' · '+hhmm(r.min):'')+(r.mode24?' · 24시간':'')+'</div></div>'+
      '<button class="mini" style="flex:0 0 auto;padding:8px 12px;color:var(--gd)" onclick="delRule(\''+r.id+'\')">삭제</button></div>').join('')
      :'<div class="empty" style="padding:14px">등록된 반복이 없다</div>'));
}
function doExport(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='jellyplan-'+TODAY()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
  toast('내보냈다');
}
function doImport(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.tasks))throw 0;
      try{localStorage.setItem(IMPORT_BAK,JSON.stringify(DB));}catch(e){}
      DB=normalizeDB(d,true);
      save();applyTheme();closeSheet();paint();
      toast('가져왔다 — 할일 '+DB.tasks.length+'개');
    }catch(err){toast('파일을 읽지 못했다');}
    inp.value='';};
  rd.onerror=()=>{toast('파일을 읽지 못했다');inp.value='';};
  rd.readAsText(f);
}
function delRule(id){
  DB.repeats=DB.repeats.filter(r=>r.id!==id);
  DB.tasks=DB.tasks.filter(t=>t.repId!==id);
  save();paint();openData();toast('반복을 지웠다');
}

/* ═════ 15. 부팅 ═════ */
firstPaint();
if(!DB.s.tutorialSeen||plannerUntouched())setTimeout(()=>openTutorial(0),420);
window.addEventListener('resize',()=>{placeThumb();if(tab==='cal')setTimeout(fitCalendar,50);
  if(_tourActive&&!_tourLanding){clearTimeout(_tourPlaceTimer);_tourPlaceTimer=setTimeout(placeTutorial,60);}});
setInterval(()=>{if(tab==='today'&&!GD.on&&!$('#sheet').classList.contains('on'))paint();},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=38').catch(()=>{});
</script>
</body>
