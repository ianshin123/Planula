/* 같은 내용 그대로 하루 뒤로 보낸다. 시각과 길이는 그대로 두고 원래 칸만 정리한다.
   반복 일정이면 그 날짜를 예외로 남기고 규칙에서 떼어낸다. */
function moveNextDay(){
  readTitle();const t=DB.tasks.find(x=>x.id===_ed.id);if(!t)return;
  const oldDs=t.date,oldBand=t.min!=null?(autoSlotBand(t)||bandAt(oldDs,t.min)):null;
  addRepException(t);t.repId=null;
  const title=String(_ed.title||'').trim();if(title)t.title=title;
  t.subj=_ed.subj;t.mile=_ed.mile||null;t.date=addDays(oldDs,1);
  // 다음날의 같은 시각이 아니라 미배정으로 보낸다. 그날 계획은 그날 다시 짠다.
  t.min=null;t.dur=null;t.autoSlot=null;
  t.ord=DB.tasks.filter(x=>x.date===t.date&&x.id!==t.id&&x.min==null).length;
  if(oldBand){if(oldBand.auto)splitAutoSlot(oldDs,oldBand,true);else splitBand(oldDs,oldBand,true);}
  save();finishTaskSheet();toast(L.movedNextDay);
}
function delTask(all){
  if(_ed.stage){
    if(_ed.sgid){DB.stage=DB.stage.filter(v=>v.id!==_ed.sgid);DB.stage.forEach((v,i)=>{v.ord=i;});}
    save();finishTaskSheet();toast(L.deleted);return;
  }
  const t=DB.tasks.find(x=>x.id===_ed.id);if(!t)return;
  if(all&&t.repId){
    DB.repeats=DB.repeats.filter(r=>r.id!==t.repId);
    DB.tasks=DB.tasks.filter(x=>x.repId!==t.repId);
  }else{
    addRepException(t);
    const b=t.min!=null?(autoSlotBand(t)||bandAt(t.date,t.min)):null;
    DB.tasks=DB.tasks.filter(x=>x.id!==t.id);
    if(b){if(b.auto)splitAutoSlot(t.date,b,true);else splitBand(t.date,b,true);}}
  save();finishTaskSheet();
  toast(all?L.delAllRepDone:L.deleted);
}

let _sj={};
/* 사용법에서는 직접 타이핑하는 게 포인트가 아니라 만들어 보고 옮겨 보는 경험이
   포인트다. 그래서 사용법 중에 새로 만들 때만 이름을 미리 채워 둔다. */
let _tourMade=null;
/* '사용법을 실제로 보고 있는 중'은 시작 질문에 답한 뒤부터 끝내기 전까지다.
   `_tourActive`는 시작 질문이 떠 있을 때와 캐릭터가 날아가는 동안에도 서 있어서,
   그것만 보면 사용법을 고르지 않은 사람에게도 예시 이름이 들어간다. */
function tourRunning(){return _tourActive&&!_tourIntro&&!_tourLanding;}
function tourMadeReset(){_tourMade={task:[],subj:[],dday:[]};}
function tourMade(kind,id){if(_tourMade&&id&&tourRunning())_tourMade[kind].push(id);}
function clearTourSamples(){
  const m=_tourMade;_tourMade=null;

  if(m.subj.length)DB.subjects=DB.subjects.filter(s=>m.subj.indexOf(s.id)<0);

function tourSample(kind){
  if(!tourRunning())return '';
  // 지금 안내하는 단계가 그걸 만들라는 단계일 때만 채운다.
  const s=TOUR_STEPS[_tourStep];
  if(!s||s.id!==kind)return '';
  if(kind==='goal')return L.sampleGoal;
  if(kind==='dday')return L.sampleDday;
  const n=tasksOf(TODAY()).filter(t=>t.min==null).length;
  return L.sampleTasks[Math.min(n,L.sampleTasks.length-1)];
}

/* ═════ 14. 시간대(시간표) 편집 ═════ */
/* 탭이 아니라 헤더 아이콘에서 여는 시트다. 칸을 목록으로 늘어놓고 손잡이로 순서를 바꾼다.
   칸마다 '쉬는 시간'으로 켤 수 있고, 켠 칸만 회색으로 그려진다 — 색 배정은 수동이다. */
function daysText(days){
  const a=days.slice().sort((x,y)=>x-y);
  if(!a.length)return L.noDays;
  if(a.length===7)return L.everyDay;
  if(a.length===5&&[1,2,3,4,5].every(x=>a.includes(x)))return L.weekdays;
  if(a.length===2&&a.includes(0)&&a.includes(6))return L.weekends;
  return a.map(i=>DOW[i]).join(' · ');
}
/* 카드 본문을 누르면 고르기만 하고, 실제 수정은 오른쪽 '수정' 버튼으로만 연다. */
let _schedSel=null;
function selectSchedRow(id){_schedSel=(_schedSel===id?null:id);openScheduleSettings();}
function schedRowHTML(x,i){
  const rowId='schedRow-'+x.id,days=setDays(x),blocks=setBlocks(x);

  const sub=dayTxt+' · '+L.blockCount(blocks.length)+(setEdited(x)&&x.kind?' · '+L.editedMark:'');
  return '<div class="schedrow'+(days.length?'':' off')+(_schedSel===rowId?' sel':'')+'" id="'+rowId+'">'+
    '<button class="schedsum" onclick="selectSchedRow(\''+rowId+'\')">'+
    '<div><b>'+esc(setName(x))+'</b><span>'+esc(sub)+'</span></div></button>'+
    '<button class="schedbadge" onclick="editSchedSet(\''+x.id+'\')">'+esc(L.edit)+'</button></div>';
}
function openScheduleSettings(){
  const sets=schedSets();
  const used={};sets.forEach(x=>setDays(x).forEach(d=>{used[d]=1;}));
  const wide=DOW.map((d,i)=>used[i]?null:d).filter(d=>d!=null);
  const addBtn=SCHED_ADD_ON?'<div class="row2"><button class="btn s" onclick="editSchedSet(null)">'+esc(L.schedAdd)+'</button></div>':'';
  openSheet('<div class="sh2">'+esc(L.schedTitle)+'</div>'+
    sets.map(schedRowHTML).join('')+
    (wide.length?'<div class="fullnote">'+esc(L.schedFree)+esc(wide.join(' · '))+'</div>':'')+addBtn);
}
let _sched={};
function timeVal(m){if(m===1440)return '00:00';m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function parseTime(v,end){if(!/^\d\d:\d\d$/.test(v||''))return NaN;const a=v.split(':').map(Number),m=a[0]*60+a[1];return end&&m===0?1440:m;}
/* 진짜 입력은 <input type=time> 그대로다 — 시각 고르개는 기기가 주는 것을 쓴다.
   보이는 글자는 input.value(지역설정과 무관하게 늘 24시간)로 우리가 그린다. */
function timeFieldHTML(cls,m,label){
  return '<div class="tfield"><span class="tval" aria-hidden="true">'+esc(timeVal(m))+'</span>'+
    '<input class="'+cls+'" type="time" step="300" value="'+timeVal(m)+'" aria-label="'+esc(label)+'" oninput="blockTimeInput(this)"></div>';
}
function blockLenTxt(s,e){
  if(!Number.isFinite(s)||!Number.isFinite(e))return '';
  let d=e-s;if(d<=0)d+=1440;
  return d>0&&d<1440?durTxt(d):'';
}
function blockTimeInput(el){
  const row=el.closest('.blockrow');if(!row)return;
  const f=el.closest('.tfield'),v=f&&f.querySelector('.tval');
  if(v)v.textContent=el.value||'--:--';
  const len=row.querySelector('.tlen');
  if(len)len.textContent=blockLenTxt(parseTime(row.querySelector('.bstart').value,false),
                                     parseTime(row.querySelector('.bend').value,true));
}
/* 묶음 하나를 고친다. 저장하면 그 묶음의 내용이 바뀔 뿐, 시간표가 하나 더 생기지 않는다.
   id 가 없으면 이 시간대에 묶음을 하나 더 넣는다. */
function editSchedSet(id){
  const x=id?findSet(id):null;
  // 칸 사이의 빈 시간도 행으로 꺼내 준다. 이름과 길이를 그대로 고칠 수 있다.
  const rows=x?buildScheduleBlocks({blocks:setBlocks(x)}).map(b=>({
    id:uid(),name:b.name,s:abs(b.s),e:abs(b.e),gap:!b.cls})):[];
  _sched=x
    ?{id:x.id,kind:x.kind||null,name:setName(x),days:setDays(x),blocks:rows,delArmed:false}
    :{id:null,kind:null,name:'',days:[],
      blocks:[{id:uid(),name:L.firstBlock,s:M(9,0),e:M(10,0)}],delArmed:false};
  scheduleEditor();
}
function syncScheduleForm(){
  const n=$('#schName');if(n)_sched.name=n.value;
  document.querySelectorAll('.blockrow[data-bi]').forEach(row=>{const b=_sched.blocks[Number(row.dataset.bi)];if(!b)return;
    b.name=row.querySelector('.bname').value;b.s=parseTime(row.querySelector('.bstart').value,false);b.e=parseTime(row.querySelector('.bend').value,true);});
}
function scheduleEditor(){
  const head='<div class="sh2">'+esc(_sched.id?L.schedSetEdit:L.schedSetNew)+'</div>'+
    '<div class="fl">'+esc(L.schedSetName)+'</div><input class="fi" id="schName" placeholder="'+esc(L.schedSetNamePh)+'" value="'+esc(_sched.name)+'">';
  const h=head+
    '<div class="fl"><span>'+esc(L.schedDays)+'</span><span><button onclick="setScheduleDays()">'+esc(L.clearDays)+'</button></span></div>'+
    '<div class="dws">'+DOW.map((d,i)=>'<button class="dw'+(_sched.days.includes(i)?' on':'')+(i===0?' sun':'')+'" onclick="toggleScheduleDay('+i+')">'+d+'</button>').join('')+'</div>'+
    '<div class="fl">'+esc(L.blocks)+'</div>'+
    _sched.blocks.map((b,i)=>'<div class="blockrow" data-bi="'+i+'"><div class="bnamewrap"><label>'+esc(L.name)+
      ' <button class="gaptog'+(b.gap?' on':'')+'" onclick="toggleBlockGap('+i+')">'+esc(b.gap?L.gapKind:L.blockKind)+'</button></label><input class="fi bname" value="'+esc(b.name)+'" placeholder="'+esc(L.blockNamePh)+'"></div>'+
      '<div class="blocktimes">'+
        timeFieldHTML('bstart',b.s,L.start)+
        '<svg class="tarrow" viewBox="0 0 11 9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M.9 4.5h8.4M6.6 1.4l3 3.1-3 3.1"/></svg>'+
        timeFieldHTML('bend',b.e,L.end)+
        '<div class="tlen">'+esc(blockLenTxt(b.s,b.e))+'</div></div>'+
      '<div class="blockside">'+
        '<button class="blockgrip" aria-label="'+esc(L.aBlockMove)+'"><i></i><i></i><i></i></button>'+
        '<button class="blockdel" aria-label="'+esc(L.aBlockDel)+'" onclick="removeScheduleBlock('+i+')">−</button>'+
      '</div></div>').join('')+
    '<button class="btn s" style="width:100%;margin-top:4px" onclick="addScheduleBlock()">'+esc(L.addBlock)+'</button>'+
    '<div class="row2"><button class="btn p" onclick="saveSchedule()">'+esc(L.save)+'</button></div>'+
    (_sched.kind
      ?(setEdited(findSet(_sched.id)||{})?'<div class="row2"><button class="btn d" onclick="resetSchedSet()">'+esc(L.defaultReset)+'</button></div>':'')
      :(_sched.id?'<div class="row2"><button class="btn d" onclick="deleteSchedSet()">'+esc(_sched.delArmed?L.reallyDel:L.setDel)+'</button></div>':''));
  openSheet(h);
  bindBlockDrag();
}
/* 순서를 바꾸면 시각도 그 순서대로 다시 깐다. 칸의 길이와 칸 사이의 빈 시간은
   자리마다 그대로 두고, 맨 처음 칸이 시작하던 시각에서 다시 이어 붙인다.
   그래서 전체가 차지하는 범위는 그대로고, 옮긴 칸만 제 길이째로 자리를 바꾼다. */
function reorderScheduleBlocks(from,to){
  const cur=_sched.blocks;
  if(from===to||from<0||to<0||from>=cur.length||to>=cur.length)return false;
  const span=cur.map(b=>{
    const s=Number(b.s),e=Number(b.e);
    if(!Number.isFinite(s)||!Number.isFinite(e))return null;
    let len=e-s;if(len<=0)len+=1440;
    return {a:rel(s),len};});
  if(span.some(x=>!x||x.len<=0)){                       // 시각이 덜 채워졌으면 순서만 바꾼다
    const mv=cur.splice(from,1)[0];cur.splice(to,0,mv);return true;}
  // 자리마다의 빈 시간은 그 자리에 남긴다 — 옮긴 칸이 빈 시간까지 끌고 다니지 않는다
  const gapAt=[];
  for(let i=0;i<span.length-1;i++)gapAt.push(Math.max(0,span[i+1].a-(span[i].a+span[i].len)));
  const total=span.reduce((a,x)=>a+x.len,0)+gapAt.reduce((a,x)=>a+x,0);
  if(span[0].a+total>1440){                             // 이미 겹쳐 있으면 시각은 건드리지 않는다
    const mv=cur.splice(from,1)[0];cur.splice(to,0,mv);return true;}
  const order=cur.map((b,i)=>i);
  order.splice(to,0,order.splice(from,1)[0]);
  let cursor=span[0].a;
  const next=order.map((oi,k)=>{
    const b=cur[oi],len=span[oi].len,a=cursor;
    cursor=a+len+(k<gapAt.length?gapAt[k]:0);
    return Object.assign({},b,{s:abs(a),e:abs(a+len)});});
  _sched.blocks=next;
  return true;
}
/* 손잡이를 잡으면 그 줄만 따라 움직이고 나머지는 자리를 비켜 준다.
   포인터 이벤트라 손가락과 마우스가 같은 길을 쓴다. */
function bindBlockDrag(){
  const sheet=$('#sheet');if(!sheet)return;
  sheet.querySelectorAll('.blockgrip').forEach(grip=>{
    if(grip._b)return;grip._b=true;
    grip.addEventListener('pointerdown',e=>{
      const el=grip.closest('.blockrow[data-bi]');if(!el)return;
      e.preventDefault();
      syncScheduleForm();                               // 끌기 전에 입력창 값을 먼저 거둔다
      const items=[...sheet.querySelectorAll('.blockrow[data-bi]')];
      const from=items.indexOf(el);if(from<0)return;
      const step=items.length>1
        ?Math.abs(items[1].getBoundingClientRect().top-items[0].getBoundingClientRect().top)
        :el.offsetHeight;
      const y0=e.clientY;let to=from,moved=false;
      try{grip.setPointerCapture(e.pointerId);}catch(err){}
      items.forEach(x=>{if(x!==el)x.style.transition='transform .18s cubic-bezier(.3,1.2,.5,1)';});
      el.classList.add('liftrow');buzz(10);
      const move=ev=>{
        const dy=ev.clientY-y0;
        if(!moved&&Math.abs(dy)>4){moved=true;el.classList.add('dragging');}
        el.style.transform='translateY('+dy+'px)';
        const t=Math.max(0,Math.min(items.length-1,from+Math.round(dy/(step||1))));
        if(t!==to){to=t;buzz(6);}
        items.forEach((it,i)=>{if(it===el)return;let sft=0;
          if(from<to&&i>from&&i<=to)sft=-step;else if(from>to&&i>=to&&i<from)sft=step;
          it.style.transform=sft?'translateY('+sft+'px)':'';});};
      const end=()=>{
        grip.removeEventListener('pointermove',move);
        grip.removeEventListener('pointerup',end);grip.removeEventListener('pointercancel',end);
        el.classList.remove('liftrow','dragging');
        items.forEach(x=>{x.style.transition='';x.style.transform='';});
        if(to!==from&&reorderScheduleBlocks(from,to))scheduleEditor();};
      grip.addEventListener('pointermove',move);
      grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);
    });
  });
}
function toggleScheduleDay(i){syncScheduleForm();const p=_sched.days.indexOf(i);if(p>=0)_sched.days.splice(p,1);else _sched.days.push(i);scheduleEditor();}
function setScheduleDays(){syncScheduleForm();_sched.days=[];scheduleEditor();}
function addScheduleBlock(){
  syncScheduleForm();const last=_sched.blocks.slice().sort((a,b)=>a.e-b.e).pop(),st=last&&Number.isFinite(last.e)?Math.min(1380,last.e+10):M(9,0);
  _sched.blocks.push({id:uid(),name:L.newBlock,s:st,e:Math.min(1440,st+60)});scheduleEditor();
}
function removeScheduleBlock(i){syncScheduleForm();_sched.blocks.splice(i,1);scheduleEditor();}
function toggleBlockGap(i){syncScheduleForm();const b=_sched.blocks[i];if(b)b.gap=!b.gap;scheduleEditor();}
/* 한 요일은 한 묶음에만 속한다. 새로 가져간 요일은 다른 묶음에서 뺀다. */
function claimDays(days,exceptId){
  schedSets().forEach(x=>{if(x.id!==exceptId)x.days=setDays(x).filter(d=>days.indexOf(d)<0);});
}
function saveSchedule(){
  syncScheduleForm();
  const days=[...new Set(_sched.days)].sort((a,b)=>a-b);
  const name=String(_sched.name||'').trim();
  const blocks=_sched.blocks.map(b=>({id:b.id||uid(),name:String(b.name||'').trim(),s:Number(b.s),e:Number(b.e),gap:b.gap===true}))
    .sort((a,b)=>rel(a.s)-rel(b.s));
  if(!name){toast(L.needSetName);return;}
  if(!blocks.length){toast(L.needBlock);return;}
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i];if(!b.name){toast(L.needBlockNames);return;}
    if(!Number.isFinite(b.s)||!Number.isFinite(b.e)||b.s<0||b.s>=1440||b.e<0||b.e>1440||blockSpan(b).len<=0){
      toast(L.checkTimes);return;}
  }
  // 하루선 조각으로 펼쳐 겹치는지만 본다.
  const segs=blockSegs(blocks);
  for(let i=1;i<segs.length;i++)if(segs[i].s<segs[i-1].e){toast(L.overlapping);return;}
  let x=_sched.id?findSet(_sched.id):null;
  if(!x){x={id:uid(),kind:null,name,days:[],blocks:null};schedSets().push(x);}
  claimDays(days,x.id);
  // 씨앗의 이름을 그대로 두고 저장했으면 빈 이름으로 남긴다 — 정해진 이름을 계속 따라간다.
  x.days=days;x.blocks=blocks;x.name=(x.kind&&name===seedName(x.kind))?'':name;
  save();paint();openScheduleSettings();toast(L.defaultSaved);
  tourSignal('schedule-saved');
}
function resetSchedSet(){
  const x=findSet(_sched.id);if(!x)return;
  const days=x.kind==='weekend'?[0,6]:[1,2,3,4,5];
  claimDays(days,x.id);x.days=days;x.blocks=null;x.name='';
  save();paint();openScheduleSettings();toast(L.defaultResetDone);
}
function deleteSchedSet(){
  if(!_sched.delArmed){syncScheduleForm();_sched.delArmed=true;scheduleEditor();return;}
  const id=_sched.id;
  schedRoot().sets=schedSets().filter(x=>x.id!==id||x.kind);
  save();paint();openScheduleSettings();toast(L.setDeleted);
}
/* ═════ 15. 화면을 직접 따라가는 사용법 ═════ */
/* 자산 URL에도 캐시 버전을 붙인다. 파일명이 같으면 그림을 바꿔도 옛 파일이 계속 나온다. */
const MASCOT_IDLE='assets/planner-mascot-idle.png?v=93';
const MASCOT_LOOP='assets/planner-mascot-loop.gif?v=93';
const MASCOT_ONCE='assets/planner-mascot-once.gif?v=93';
const MASCOT_CYCLE_MS=5040;
let _homeMascotTimer=null,_homeMascotUntil=0,_homeMascotToken=0;
function mascotHTML(place){
  if(!MASCOT_ON||place!=='home')return '';
  const playing=_homeMascotUntil>Date.now();
  return '<button id="mascotHome" class="mascot-home'+(playing?' playing':'')+(_tourActive?' tour-away':'')+'" data-mascot-slot="home" aria-label="'+esc(L.aMascot)+'" onclick="playHomeMascot(true)">'+
    '<img id="mascotHomeImg" src="'+(playing?MASCOT_ONCE:MASCOT_IDLE)+'" alt="'+esc(L.altMascot)+'"></button>';
}
function playHomeMascot(withSay){
  if(!TOUR_ON)withSay=false;      // 말풍선은 사용법 다시보기 입구라 같이 끈다
  if(_tourActive)return;const home=$('#mascotHome'),img=$('#mascotHomeImg');if(!home||!img)return;
  if(withSay)showMascotSay();else hideMascotSay();
  const token=++_homeMascotToken;_homeMascotUntil=Date.now()+MASCOT_CYCLE_MS;
  clearTimeout(_homeMascotTimer);home.classList.add('playing');img.src=MASCOT_IDLE;
  requestAnimationFrame(()=>{if(token===_homeMascotToken&&document.contains(img))img.src=MASCOT_ONCE;});
  _homeMascotTimer=setTimeout(()=>{if(token!==_homeMascotToken)return;_homeMascotUntil=0;
    const now=$('#mascotHomeImg'),btn=$('#mascotHome');if(now)now.src=MASCOT_IDLE;if(btn)btn.classList.remove('playing');
  },MASCOT_CYCLE_MS+80);
}
/* 헤더 캐릭터를 누르면 재생과 함께 말풍선이 뜨고, 거기서 사용법을 다시 볼 수 있다.
   시간표 설정과 데이터 화면에 있던 다시 보기 버튼은 이 자리로 합쳤다. */
function showMascotSay(){
  const home=$('#mascotHome');if(!home)return;

/* 사용법은 짧게, 대신 반드시 해 봐야 넘어간다.
   시간대 만들기만 넘길 수 있고 나머지는 직접 해야 다음으로 간다.

const TOUR_STEPS=[
  {id:'install',scene:'modal',hintKind:'none',btn:'skip',hint:''},
  // 목록에서는 아무 데도 강조하지 않는다. 수정 버튼에 상자를 씌우면 읽지도 않고 눌러 버린다.

  {id:'dday',scene:'subject',selector:['#sheet.on #f_ddt','.sj .sjf .mini'],hintKind:'press',

  {id:'task',scene:'today',selector:['#sheet.on #f_title','#mainFab'],hintKind:'press',

  {id:'edit',scene:'today',selector:['#subsheet.on #f_title','#sheet.on #f_title','.uchip'],hintKind:'dbl',
   signal:'task-edited',allow:['.unbar','#sheet','#subsheet']},
  {id:'place',scene:'today',target:'grid',hintKind:'drag',keepClear:['.unbar'],

  {id:'split',scene:'today',target:'grid',cell:'shared',hintKind:'drag',keepClear:['.unbar'],

  {id:'done',scene:'today',selector:'button[aria-label="'+L.aTheme+'"]',hintKind:'press',
   final:true,btn:'finish',hint:'',allow:['button[aria-label="'+L.aTheme+'"]']}

/* 단계를 넘길 조건. 저장 한 번으로는 부족한 단계가 있다. */
const TOUR_NEED={

  onePlaced:()=>tasksOf(TODAY()).filter(t=>t.min!=null).length>=1,
  shareBand:()=>{
    const ds=TODAY(),placed=tasksOf(ds).filter(t=>t.min!=null);
    if(placed.length<2)return false;
    const key=t=>{const b=autoSlotBand(t)||bandAt(ds,t.min);return b?b.s+'-'+b.e:'x'+t.min;};
    const seen={};return placed.some(t=>{const k=key(t);if(seen[k])return true;seen[k]=1;return false;});

};
/* 단계의 대사는 언어 사전(L.tour)에 있다. 여기에는 순서와 조작 대상만 둔다. */

let _tourStep=0,_tourActive=false,_tourLanding=false,_tourReturnStep=null,_tourPlaceTimer=null,_tourCopyTimer=null,_tourTrackTimer=null,_tourTrackFrame=null;
// 끝내기 착지는 여러 프레임에 걸쳐 진행된다. 그 사이에 튜토리얼을 다시 열면 세대 번호가 올라가고
// 옛 착지 절차는 새 화면을 건드리지 않고 조용히 물러난다.
let _tourLandGen=0,_tourLandTimer=null,_tourIntro=false,_tourTypeTimer=null,_tourTypeDone=null;
/* 처음 보는 사람은 직접 해내야 넘어가지만, 다시 보는 사람은 원하는 부분만 보고 싶다.
   다시보기에서는 모든 단계에 이전·다음·끝내기를 열어 준다. */
let _tourReplay=false;
/* 안내 글을 한 글자씩 적어 나간다. <strong> 표시는 유지한 채 보이는 글자 수만 늘린다.
   높이는 먼저 완성본으로 재서 고정해 두므로 타자 도중에 말풍선이 흔들리지 않는다. */
/* 말풍선 폭을 대사에 맞춘다. max-content 로 두면 긴 문장이 한 줄로 재어져
   늘 상한 폭이 되고, 짧은 대사에도 커다란 상자가 남는다. 줄 수가 늘지 않는
   가장 좁은 폭을 이분 탐색으로 찾는다. */
function fitTourBubble(){
  const guide=$('#tour .tourguide');if(!guide)return;
  const p=guide.querySelector('.tourbody p');
  const max=Math.min(innerWidth-28,guide.classList.contains('sheet-space')?300:340);
  guide.style.width=max+'px';
  if(!p)return;
  const lh=parseFloat(getComputedStyle(p).lineHeight)||20;
  const lines=()=>Math.round(p.getBoundingClientRect().height/lh);
  const target=lines();
  let lo=190,hi=max;
  while(hi-lo>6){const mid=Math.round((lo+hi)/2);guide.style.width=mid+'px';
    if(lines()<=target)hi=mid;else lo=mid;}
  guide.style.width=hi+'px';
}
function tourType(el,html){
  clearTimeout(_tourTypeTimer);_tourTypeTimer=null;_tourTypeDone=null;
  if(!el)return;
  const segs=[],re=/<strong>([\s\S]*?)<\/strong>/g;let m,last=0;
  while((m=re.exec(html))){
    if(m.index>last)segs.push({t:html.slice(last,m.index),b:false});
    segs.push({t:m[1],b:true});last=re.lastIndex;}
  if(last<html.length)segs.push({t:html.slice(last),b:false});
  const total=segs.reduce((n,x)=>n+x.t.length,0);
  const build=k=>{let out='',left=k;
    for(const g of segs){if(left<=0)break;const part=g.t.slice(0,left);left-=part.length;
      out+=g.b?'<strong>'+part+'</strong>':part;}
    return out;};
  el.innerHTML=html;                       // 완성본을 먼저 넣고
  fitTourBubble();                         // 그 상태에서 폭을 대사에 맞춘 뒤
  el.style.minHeight=el.offsetHeight+'px'; // 높이를 고정한다
  const finish=()=>{clearTimeout(_tourTypeTimer);_tourTypeTimer=null;_tourTypeDone=null;
    el.innerHTML=html;el.classList.remove('typing');};
  _tourTypeDone=finish;
  el.classList.add('typing');el.innerHTML='';
  let i=0;
  const tick=()=>{
    if(!document.contains(el)){clearTimeout(_tourTypeTimer);_tourTypeTimer=null;_tourTypeDone=null;return;}
    i=Math.min(total,i+1);el.innerHTML=build(i);
    if(i>=total){finish();return;}
    const ch=build(i).slice(-1);
    _tourTypeTimer=setTimeout(tick,ch==='\n'?150:(/[.?!]/.test(ch)?90:16));
  };
  _tourTypeTimer=setTimeout(tick,120);
}
function tourTypeSkip(){if(_tourTypeDone)_tourTypeDone();}

/* 튜토리얼 중에는 지금 안내하는 곳만 만질 수 있다. 다른 기능을 둘러보다 흐름이 끊기지 않게 한다.
   건너뛰기·끝내기·이전·다음은 항상 열려 있고, 세로 스크롤은 막지 않는다(터치 기본동작을 살려 둔다). */
const TOUR_GATE_EVENTS=['pointerdown','pointerup','mousedown','mouseup','click','dblclick',
  'touchstart','touchend','touchcancel','keydown','keypress','focusin','contextmenu'];
function tourGateAllows(node){
  if(!node)return false;
  if(node.closest('#tour'))return true;                    // 튜토리얼 자체 버튼
  if(node.closest('#scrim,#subscrim'))return true;         // 바깥 빈 곳 → 이전 단계로 돌아가는 경로
  if(_tourIntro)return false;                              // 시작 질문 중에는 앱을 만지지 않는다
  const s=TOUR_STEPS[_tourStep];if(!s)return false;
  const t=getTourTarget(s);
  if(t&&(t===node||t.contains(node)))return true;          // 지금 가리키는 대상
  // 한 단계에서 여러 곳을 만져야 하는 경우(미배정에서 집어 시간표로 끌기 등)
  if(Array.isArray(s.allow)&&s.allow.some(q=>node.closest(q)))return true;
  const sub=$('#subsheet'),sheet=$('#sheet');
  const open=sub&&sub.classList.contains('on')?sub:(sheet&&sheet.classList.contains('on')?sheet:null);
  if(open&&open.contains(node)){
    if(s.signal)return true;                               // 저장까지 해야 넘어가는 단계
    if(!t||!open.contains(t))return true;                  // 사용자의 조작으로 새로 열린 시트는 끝까지 쓸 수 있어야 한다
  }
  return false;
}

TOUR_GATE_EVENTS.forEach(name=>window.addEventListener(name,e=>{
  if(!_tourActive||_tourLanding)return;
  const node=e.target instanceof Element?e.target:null;
  if(tourGateAllows(node))return;
  e.stopImmediatePropagation();
  if(e.type==='focusin'){if(node&&node.blur)node.blur();return;}
  // 터치는 기본동작을 막지 않는다 — 막으면 화면 스크롤까지 멈춘다.
  if(e.cancelable&&e.type.slice(0,5)!=='touch')e.preventDefault();
},true));

/* 시트는 올라오면서 움직인다. 그 동안 강조 박스가 옛 자리에 남지 않게 따라가고,
   말풍선이 시트를 덮지 않게 시트 높이를 줄인다. 장면 이름이 아니라 '지금 시트가
   열려 있는가'로 판단해야 어떤 단계에서 시트가 떠도 항상 맞는다. */
function standaloneMode(){return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function tourSheetEl(){

/* 시트를 닫아도 내용은 DOM에 남는다. 입력창이 '있는지'가 아니라
   '열린 시트 안에 있는지'를 봐야 단계를 다시 열 때 시트가 제대로 뜬다. */
function tourSheetHas(sel){

function getTourTarget(s){
  if(s.target==='unassigned')return document.querySelector('.uchip')||document.querySelector('.unbar .unrow');
  if(s.target==='grid')return document.querySelector('#gridwrap .grid');
  if(!s.selector)return null;
  // 목표를 여러 개 적으면 지금 화면에 실제로 있는 첫 번째를 쓴다.
  // 시트가 한 층 더 뜨면 강조 박스가 사라진 버튼에 남지 않고 새 입력창으로 옮겨간다.
  const list=Array.isArray(s.selector)?s.selector:[s.selector];
  for(let i=0;i<list.length;i++){const t=document.querySelector(list[i]);if(t)return t;}
  return null;
}
function cancelTourTracking(){

function setTourSceneSpace(){

/* 목표가 들어 있는 스크롤 영역. 이 밖으로 밀려난 목표는 강조하지 않는다. */
function tourClipRect(t){
  const sh=t.closest('#subsheet,#sheet');
  if(sh)return sh.getBoundingClientRect();
  const sc=$('#scroll');
  if(sc&&sc.contains(t))return sc.getBoundingClientRect();
  return {top:0,bottom:innerHeight,left:0,right:innerWidth};
}
function tourTargetRect(s,t,allowScroll){
  const raw=t.getBoundingClientRect(),clip=tourClipRect(t);
  const lo=Math.max(clip.top,0)+2,hi=Math.min(clip.bottom,innerHeight)-2;
  const outside=raw.bottom<=lo+6||raw.top>=hi-6;
  if(outside){
    // 단계에 처음 들어올 때만 목표를 화면 안으로 데려온다.
    // 사용자가 직접 스크롤하는 중에는 끌어당기지 않고 강조만 감춘다.
    if(allowScroll&&raw.height<innerHeight*.7){
      t.scrollIntoView({block:'center'});clearTimeout(_tourPlaceTimer);
      _tourPlaceTimer=setTimeout(()=>placeTutorial(false),190);return null;}
    return 'hidden';
  }
  // 목표가 스크롤로 잘려 나가는 중이면 가장자리에 걸친 조각을 그리지 않고 감춘다.
  // 시간표 그리드처럼 원래 화면보다 큰 대상은 아래에서 따로 보이는 구간만 잡는다.
  const tall=s.target==='grid'||raw.height>innerHeight*.55;
  const shown=Math.min(raw.bottom,hi)-Math.max(raw.top,lo);
  if(!tall&&shown<raw.height*.75)return 'hidden';
  let left=Math.max(7,raw.left-7),right=Math.min(innerWidth-7,raw.right+7);
  let top=Math.max(lo,raw.top-7),bottom=Math.min(hi,raw.bottom+7);
  if(bottom-top<14)return 'hidden';
  if(s.target==='grid'){
    /* 강조 칸은 일정이 실제로 들어가는 칸이어야 한다. 시간표 보기에서는 그 시간대 밴드
       통째로 들어가므로 한 시간으로 그리면 '이만큼 들어간다'가 실제와 어긋난다.
       24시간 보기에서만 다음 정각까지의 한 시간을 쓴다. */
    const scroll=$('#scroll'),sr=scroll?scroll.getBoundingClientRect():{top:80,bottom:innerHeight-90};
    const visibleTop=Math.max(raw.top+2,sr.top+8,lo,82),visibleBottom=Math.min(raw.bottom-2,sr.bottom-12,hi,innerHeight-92);
    const grid=$('#gridwrap .grid'),ds=grid?grid.dataset.date:TODAY();
    const map=timeMap(ds);
    const span=(rs,re)=>({t:raw.top+map.y(Math.max(0,rs)),b:raw.top+map.y(Math.min(1440,re))});
    const cellAt=cy=>{
      const cm=map.min(Math.max(0,cy-raw.top));
      if(!is24(ds)){
        const bd=bandAt(ds,abs(Math.min(1439,cm)));
        if(bd)return span(bd.s,bd.e);}
      const h0=Math.max(0,Math.min(1380,Math.floor(cm/60)*60));
      return span(h0,h0+60);
    };
    /* 분할 단계는 '이미 놓인 일이 있는 그 칸'을 가리켜야 한다. 보이는 가운데 칸을
       가리키면 안내한 칸과 실제로 넣어야 하는 칸이 달라져 사용자가 헤맨다. */
    let c=null;
    if(s.cell==='shared'){
      const t0=tasksOf(ds).filter(x=>x.min!=null).sort((a,b)=>a.min-b.min)[0];
      if(t0){
        const bd=autoSlotBand(t0)||(is24(ds)?null:bandAt(ds,t0.min));
        if(bd)c=span(bd.s,bd.e);
        else{const h0=Math.max(0,Math.min(1380,Math.floor(rel(t0.min)/60)*60));c=span(h0,h0+60);}}
      if(c&&(c.t<visibleTop-2||c.b>visibleBottom+2)&&allowScroll!==false&&scroll){
        // 그 칸이 화면 밖이면 다른 칸을 고르지 말고 그 칸으로 데려간다
        scroll.scrollTop+=((c.t+c.b)/2-(visibleTop+visibleBottom)/2);
        clearTimeout(_tourPlaceTimer);
        _tourPlaceTimer=setTimeout(()=>placeTutorial(false),190);return null;}
    }
    if(!c)c=cellAt((visibleTop+visibleBottom)/2);
    else if(c.t>=visibleTop&&c.b<=visibleBottom){/* 그대로 쓴다 */}
    if(s.cell!=='shared'&&(c.t<visibleTop||c.b>visibleBottom)){   // 화면 밖으로 삐져나오면 위·아래 칸을 살펴본다
      [visibleTop+30,visibleBottom-30].some(y=>{
        const alt=cellAt(y);
        if(alt.t>=visibleTop&&alt.b<=visibleBottom){c=alt;return true;}
        return false;});
    }
    top=Math.max(visibleTop,c.t);bottom=Math.min(visibleBottom,c.b);
    if(bottom-top<42){top=Math.max(lo,visibleTop);bottom=Math.min(hi,Math.max(top+42,visibleBottom));}
    if(bottom-top<14)return 'hidden';
    left=Math.max(7,raw.left+3);right=Math.min(innerWidth-7,raw.right-3);
  }else if(raw.height>innerHeight*.55){
    top=Math.max(Math.max(lo,90),innerHeight*.4);bottom=Math.min(Math.min(hi,innerHeight-90),top+78);
  }
  return {left,right,top,bottom};
}
function applyTourSpot(rect,tracking){

  spot.classList.toggle('tracking',!!tracking);spot.style.opacity='.94';

  spot.style.width=Math.max(20,rect.right-rect.left)+'px';spot.style.height=Math.max(20,rect.bottom-rect.top)+'px';

function startTourTracking(){
  cancelTourTracking();
  const step=_tourStep;
  _tourTrackTimer=setTimeout(()=>{
    const until=performance.now()+560;
    const tick=now=>{
      if(!_tourActive||_tourLanding||_tourStep!==step){cancelTourTracking();return;}

function placeTutorial(allowScroll){
  if(!_tourActive||_tourLanding)return;
  const s=_tourIntro?{scene:'modal'}:TOUR_STEPS[_tourStep],t=_tourIntro?null:getTourTarget(s);
  const guide=$('#tour .tourguide'),fly=$('#tour .tourfly'),spot=$('#tour .tourspot'),tail=$('#tour .tourtail');
  if(!guide||!fly||!spot)return;
  const gw=guide.offsetWidth,gh=guide.offsetHeight,fw=fly.offsetWidth,fh=fly.offsetHeight;
  const stPx=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--st'))||0;
  const safe=14+stPx;
  const dock=$('.dock'),dockTop=dock?dock.getBoundingClientRect().top:innerHeight-safe;
  let gx=Math.max(safe,(innerWidth-gw)/2),gy=Math.max(245,innerHeight*.53);
  // 캐릭터가 덮으면 안 되는 곳 — 강조 대상과 단계가 지정한 자리
  const avoid=[];
  const addRect=r=>{if(r&&r.width!==0)avoid.push({left:r.left,right:r.right,top:r.top,bottom:r.bottom});};
  if(Array.isArray(s.keepClear))s.keepClear.forEach(q=>{
    const el=document.querySelector(q);if(el)addRect(el.getBoundingClientRect());});
  // 열린 시트는 사용자가 지금 채워야 하는 곳이다. 캐릭터가 그 위에 앉으면 안 된다.
  const sheetEl=tourSheetEl();if(sheetEl)addRect(sheetEl.getBoundingClientRect());

  let hintRect=null,spotRect=null;
  if(s.scene==='modal'||!t){
    spot.style.opacity='0';clearTourHint();
    // 강조할 곳이 없더라도 시트가 열려 있으면 말풍선은 비켜서 위로 올라간다.
    // 이걸 빼면 시간대 단계처럼 강조가 없는 단계에서 말풍선이 시트 한가운데를 덮는다.
    if(sheetEl){gx=safe;gy=safe;}
    else gy=Math.max(safe,Math.min(Math.max(120,innerHeight*.24),dockTop-gh-12));
  }else{
    const rect=tourTargetRect(s,t,allowScroll!==false);
    if(!rect)return;
    if(rect==='hidden'){
      spot.style.opacity='0';clearTourHint();
      if(sheetEl){gx=safe;gy=safe;}
      else gy=Math.max(safe,Math.min(Math.max(120,innerHeight*.3),dockTop-gh-12));
    }else{
      const {left,right,top,bottom}=rect;applyTourSpot(rect,false);
      avoid.push({left,right,top,bottom});hintRect=rect;spotRect=rect;
      if(sheetEl){gx=safe;gy=safe;}
      else{
        const below=bottom+18,above=top-gh-18,limit=Math.max(safe,dockTop-gh-12);
        gy=below+gh<dockTop-12?below:(above>safe?above:limit);
        gx=Math.max(safe,Math.min(innerWidth-gw-safe,(left+right-gw)/2));
      }
    }
  }
  gx=Math.max(safe,Math.min(innerWidth-gw-safe,gx));
  gy=Math.max(safe,Math.min(Math.max(safe,dockTop-gh-8),gy));

  /* 캐릭터는 말풍선에 붙여 둔다. 말하는 것처럼 보여야 하고, 멀리 떨어져 입력창 위로
     내려가면 안 된다. 위쪽을 먼저 보고 자리가 없을 때만 아래·옆으로 돌린다. */
  const area=(x,y,a)=>!a?0:Math.max(0,Math.min(x+fw,a.right)-Math.max(x,a.left))*
                            Math.max(0,Math.min(y+fh,a.bottom)-Math.max(y,a.top));
  const over=(x,y)=>avoid.reduce((n,a)=>n+area(x,y,a),0);
  // 말풍선 글씨를 덮는 것도 강조 칸을 덮는 것 다음으로 나쁘다.
  const guideRect={left:gx,right:gx+gw,top:gy,bottom:gy+gh};
  const gap=4;
  const cands=[
    {side:'up',   x:gx+12,        y:gy-fh-gap},
    {side:'up',   x:gx+gw-fw-12,  y:gy-fh-gap},
    {side:'down', x:gx+12,        y:gy+gh+gap},
    {side:'down', x:gx+gw-fw-12,  y:gy+gh+gap},
    {side:'right',x:gx+gw+gap,    y:gy+4},
    {side:'left', x:gx-fw-gap,    y:gy+4}
  ];
  /* 강조 칸이 크면 말풍선 옆자리가 전부 막힌다. 그럴 때 쓸 자리로 강조 칸의
     위·아래를 후보에 더한다. 말풍선에서 좀 떨어지더라도 글씨를 덮는 것보다 낫다. */
  if(spotRect){
    cands.push({side:'up',  x:gx+12,y:spotRect.top-fh-8});
    cands.push({side:'down',x:gx+12,y:spotRect.bottom+8});
  }
  /* 강조 칸을 덮는 것이 화면 밖으로 나가는 것보다 나쁘다. 자리가 정 없으면
     화면 안으로 끌어당겨 놓고 겹침이 가장 적은 쪽을 고른다. */
  let pick=null;
  cands.forEach((c,i)=>{
    const cx=Math.max(8,Math.min(innerWidth-fw-8,c.x));
    const cy=Math.max(8,Math.min(Math.max(8,dockTop-fh-4),c.y));
    const fits=Math.abs(cx-c.x)<1&&Math.abs(cy-c.y)<1;
    const score=over(cx,cy)*12+area(cx,cy,guideRect)*6+(fits?0:900)+i;
    if(!pick||score<pick.score)pick={score,...c,x:cx,y:cy};
  });
  const mx=Math.max(8,Math.min(innerWidth-fw-8,pick.x));
  const my=Math.max(8+stPx,Math.min(Math.max(8+stPx,dockTop-fh-4),pick.y));

  guide.style.transform='translate3d('+Math.round(gx)+'px,'+Math.round(gy)+'px,0)';
  fly.style.transform='translate3d('+Math.round(mx)+'px,'+Math.round(my)+'px,0)';
  if(!_tourIntro&&hintRect)applyTourHint(s,t,hintRect);

  // 말풍선 꼬리가 캐릭터를 가리킨다
  if(tail){
    tail.className='tourtail '+pick.side;
    const cx=mx+fw/2-gx,cy=my+fh/2-gy;
    if(pick.side==='up'||pick.side==='down'){
      tail.style.left=Math.round(Math.max(10,Math.min(gw-27,cx-8)))+'px';
      tail.style.top=(pick.side==='up'?-12:gh-1)+'px';
    }else{
      tail.style.top=Math.round(Math.max(10,Math.min(gh-27,cy-8)))+'px';
      tail.style.left=(pick.side==='left'?-12:gw-1)+'px';
    }
  }
}
/* ── 조작 힌트 ──────────────────────────────────────────────

   drag  : 미배정 → 시간 칸으로 옮기는 동작을 유령 카드로 반복 재생

let _tourPressEl=null,_tourPressCls='tour-press',_tourHintKey='';
function clearTourHint(){

/* 미배정 칩을 집어 시간 칸에 놓는 동작을 그대로 보여준다 */
function tourHintDrag(spotRect){

/* 스크롤할 때마다 placeTutorial 이 다시 도는데, 그때마다 애니메이션을 새로 만들면
   유령 카드가 계속 처음으로 튄다. 같은 자리면 그대로 둔다. */
function applyTourHint(s,t,rect){
  if(!s||!_tourActive||_tourLanding){clearTourHint();_tourHintKey='';return;}
  const key=s.id+'|'+(s.hintKind||'')+'|'+
    (rect?Math.round(rect.left)+','+Math.round(rect.top)+','+Math.round(rect.bottom):'')+'|'+
    (t?Math.round(t.getBoundingClientRect().top):'');
  if(key===_tourHintKey)return;
  clearTourHint();_tourHintKey=key;
  if(s.hintKind==='press')tourHintPress(t);
  else if(s.hintKind==='dbl')tourHintPress(t,'tour-dbl');
  else if(s.hintKind==='drag')tourHintDrag(rect&&typeof rect==='object'?rect:null);
  else if(s.hintKind==='grab')tourHintGrab(t);

  closeSheet();
  if(kind==='day'){setTimeout(()=>openDay(val),120);return;}
  if(kind==='task'){setTimeout(()=>openTask(val),120);return;}
  go('exam');
}
function runSearch(){
  const box=$('#searchres'),inp=$('#f_q');if(!box||!inp)return;
  const q=inp.value.trim().toLowerCase();
  if(!q){box.innerHTML='';return;}
  const hit=v=>String(v||'').toLowerCase().indexOf(q)>=0;
  const rows=[];
  DB.subjects.forEach(s=>{
    const tag=(s.tags||[]).join(' \u00b7 ');
    if(hit(s.name)||hit(tag))rows.push([L.subject,s.name,tag,'exam','']);
    if(s.exam&&(hit(s.name)||hit(s.exam)))rows.push([L.examWord,s.name+' '+L.examWord,s.exam,'day',s.exam]);
  });
  DB.tasks.forEach(t=>{
    if(!hit(t.title)&&!hit(t.date))return;
    const sj=taskSubj(t);
    rows.push([t.date,t.title,(t.min!=null?hhmm(t.min):L.unassigned)+(sj?' \u00b7 '+sj.name:''),'task',t.id]);
  });
  box.innerHTML=rows.length
    ?rows.slice(0,40).map(r=>'<div class="dd" onclick="searchGo(\''+r[3]+'\',\''+esc(r[4])+'\')">'+
      '<div style="flex:1;min-width:0"><div class="ddn">'+esc(r[1])+'</div>'+
      '<div class="ddd">'+esc(r[2]||'')+'</div></div><div class="ddc">'+esc(r[0])+'</div></div>').join('')
    :'<div class="empty">'+esc(L.searchNone)+'</div>';
}
function openData(){_bakArm=false;dataSheet();}
function armRestore(){_bakArm=true;dataSheet();}
function bakHTML(){
  const b=bakInfo();
  if(!b)return '<div class="empty" style="padding:14px">'+esc(L.noBak)+'</div>';
  return '<div style="font-size:13px;font-weight:650;color:var(--ink3);line-height:1.6;margin-bottom:9px">'+
    L.bakInfo(b.tasks,b.subjects,b.repeats)+'</div>'+
    (_bakArm
      ?'<div class="row2" style="margin-top:0"><button class="btn d" onclick="restoreBackup()">'+esc(L.bakReally)+'</button></div>'
      :'<div class="row2" style="margin-top:0"><button class="btn s" onclick="armRestore()">'+esc(L.bakRestore)+'</button></div>');
}
function importBakInfo(){
  const r=localStorage.getItem(IMPORT_BAK);if(!r)return null;
  try{const d=JSON.parse(r);return {tasks:(d.tasks||[]).length};}catch(e){return null;}
}
function restoreImportBackup(){
  const r=localStorage.getItem(IMPORT_BAK);if(!r){toast(L.noImportBak);return;}
  try{DB=normalizeDB(JSON.parse(r),true);save();applyTheme();closeSheet();paint();toast(L.importRestored);}
  catch(e){toast(L.bakUnreadable);}
}
function dataSheet(){
  const ib=importBakInfo();
  openSheet('<div class="sh2">'+esc(L.dataTitle)+'</div>'+
    '<div style="font-size:14px;font-weight:650;color:var(--ink2);line-height:1.7">'+
    L.dataCount(DB.tasks.length,DB.subjects.length,DB.repeats.length,schedSets().reduce((n,x)=>n+setBlocks(x).length,0))+'<br>'+
    '<span style="color:var(--ink3);font-size:13px">'+esc(L.dataNote)+'</span></div>'+
    '<div class="row2"><button class="btn p" onclick="doExport()">'+esc(L.exportBtn)+'</button>'+
    '<button class="btn s" onclick="document.getElementById(\'fileIn\').click()">'+esc(L.importBtn)+'</button></div>'+
    (ib?'<div class="row2"><button class="btn s" onclick="restoreImportBackup()">'+esc(L.importUndo(ib.tasks))+'</button></div>':'')+
    '<div class="fl">'+esc(L.backup)+'</div>'+bakHTML()+
    '<div class="fl">'+esc(L.repRules)+'</div>'+
    (DB.repeats.length?DB.repeats.map(r=>'<div class="dd" style="border-top:1px solid var(--line2)">'+
      '<div style="flex:1;min-width:0"><div class="ddn">'+esc(r.title)+'</div>'+
      '<div class="ddd">'+repLabel(r)+' · '+r.start+(r.end?' ~ '+r.end:' ~')+(r.min!=null?' · '+hhmm(r.min):'')+(r.mode24?' · '+esc(L.h24):'')+'</div></div>'+
      '<button class="mini" style="flex:0 0 auto;padding:8px 12px;color:var(--gd)" onclick="delRule(\''+r.id+'\')">'+esc(L.del)+'</button></div>').join('')
      :'<div class="empty" style="padding:14px">'+esc(L.noRules)+'</div>'));
}
function doExport(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='planula-'+TODAY()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
  toast(L.exported);
}
function doImport(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.tasks))throw 0;
      try{localStorage.setItem(IMPORT_BAK,JSON.stringify(DB));}catch(e){}
      DB=normalizeDB(d,true);
      save();applyTheme();closeSheet();paint();
      toast(L.imported(DB.tasks.length));
    }catch(err){toast(L.fileUnreadable);}
    inp.value='';};
  rd.onerror=()=>{toast(L.fileUnreadable);inp.value='';};
  rd.readAsText(f);
}
function delRule(id){
  DB.repeats=DB.repeats.filter(r=>r.id!==id);
  DB.tasks=DB.tasks.filter(t=>t.repId!==id);
  save();paint();openData();toast(L.repDeleted);
}

/* 뒤로가기는 앱을 나가기 전에 열려 있는 것부터 닫고, 다른 탭이면 오늘로 돌아온다.
   처리할 때마다 상태를 다시 쌓아 다음 뒤로가기도 받을 수 있게 한다. */
function navPush(){try{history.pushState({p:1},'');}catch(e){}}
try{history.replaceState({p:0},'');navPush();}catch(e){}
/* 뒤로가기는 아무 데도 가지 않는다. 되돌아갈 화면을 만들어 두면 시트가 닫히거나
   탭이 넘어가 오히려 헷갈렸다. 상태만 다시 밀어 넣어 앱이 나가지 않게 막는다. */
window.addEventListener('popstate',()=>{navPush();});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=93').catch(()=>{});
