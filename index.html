<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" id="tcolor" content="#F7F5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Planula</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F7F5F1; --bg2:#FFFEFC; --solid:#FFFFFF; --muted:#F1EEE8;
  --ink:#26221D; --ink2:#6E655A; --ink3:#A79D90;
  --line:rgba(82,68,54,.14); --line2:rgba(82,68,54,.075);
  --ac:#E07A4F; --ac2:#F0A059; --ac-s:rgba(224,122,79,.13); --ac-b:rgba(224,122,79,.34);
  --ac-glow:rgba(224,122,79,.42); --spot-glow:rgba(224,122,79,.62);
  --tour-paper:rgba(255,254,250,.66); --tour-sheen:rgba(255,255,255,.55);
  --tour-halo:rgba(255,249,236,.55); --tour-lift:rgba(255,252,246,.9);
  --tour-ink:#241F1A; --tour-ink2:#554B41; --tour-dim:#8C8175; --tour-ac:#C4653B;
  --gd:#D64F4F; --gd-s:rgba(214,79,79,.13);
  --ok:#3F9E6B; --ok-s:rgba(63,158,107,.13);
  --band:rgba(224,122,79,.075);
  --surface:var(--bg2); --surface-brd:var(--line);
  --blur-surface:rgba(255,254,252,.76); --blur-strong:rgba(255,254,252,.88); --done-bg:rgba(241,238,232,.62);
  --shadow-sm:0 1px 2px rgba(63,49,36,.055),0 5px 14px rgba(63,49,36,.045);
  --shadow-md:0 10px 28px rgba(63,49,36,.12); --shadow-lg:0 18px 52px rgba(47,35,24,.18);
  --r:20px; --r2:16px; --r3:12px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --dockh:78px; --wrap:780px; --gut:50px; --unw:144px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181613; --bg2:#23201C; --solid:#23201C; --muted:#2B2722;
  --ink:#F2EDE5; --ink2:#B0A597; --ink3:#7A7166;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.055);
  --ac:#FF9264; --ac2:#FFB877; --ac-s:rgba(255,146,100,.16); --ac-b:rgba(255,146,100,.4);
  --ac-glow:rgba(255,146,100,.26); --spot-glow:rgba(255,146,100,.5);
  --tour-paper:rgba(252,247,239,.70); --tour-sheen:rgba(255,255,255,.18);
  --tour-halo:rgba(255,214,170,.5); --tour-lift:rgba(255,250,242,.75);
  --tour-ink:#241F1A; --tour-ink2:#554B41; --tour-dim:#8C8175; --tour-ac:#C4653B;
  --gd:#FF7A6E; --gd-s:rgba(255,122,110,.16);
  --ok:#4FC98A; --ok-s:rgba(79,201,138,.15);
  --band:rgba(255,146,100,.085);
  --surface:var(--bg2); --surface-brd:rgba(255,255,255,.1);
  --blur-surface:rgba(35,32,28,.72); --blur-strong:rgba(35,32,28,.86); --done-bg:rgba(43,39,34,.62);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.16);
  --shadow-md:0 12px 30px rgba(0,0,0,.34); --shadow-lg:0 20px 56px rgba(0,0,0,.48);
}}
:root[data-theme="dark"]{
  --bg:#181613; --bg2:#23201C; --solid:#23201C; --muted:#2B2722;
  --ink:#F2EDE5; --ink2:#B0A597; --ink3:#7A7166;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.055);
  --ac:#FF9264; --ac2:#FFB877; --ac-s:rgba(255,146,100,.16); --ac-b:rgba(255,146,100,.4);
  --ac-glow:rgba(255,146,100,.26); --spot-glow:rgba(255,146,100,.5);
  --tour-paper:rgba(252,247,239,.70); --tour-sheen:rgba(255,255,255,.18);
  --tour-halo:rgba(255,214,170,.5); --tour-lift:rgba(255,250,242,.75);
  --tour-ink:#241F1A; --tour-ink2:#554B41; --tour-dim:#8C8175; --tour-ac:#C4653B;
  --gd:#FF7A6E; --gd-s:rgba(255,122,110,.16);
  --ok:#4FC98A; --ok-s:rgba(79,201,138,.15);
  --band:rgba(255,146,100,.085);
  --surface:var(--bg2); --surface-brd:rgba(255,255,255,.1);
  --blur-surface:rgba(35,32,28,.72); --blur-strong:rgba(35,32,28,.86); --done-bg:rgba(43,39,34,.62);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.16);
  --shadow-md:0 12px 30px rgba(0,0,0,.34); --shadow-lg:0 20px 56px rgba(0,0,0,.48);
}
html,body{height:100%;overscroll-behavior:none;touch-action:pan-x pan-y}
/* 이동이 '꾹 눌러서 끌기'라 누르고 있는 동안 글자가 선택되면 안 된다.
   눌러 잡는 순간 파란 선택 블록이 뜨고 끌기가 글자 끌기로 새어 나간다.
   입력창만 예외로 둔다 — 제목을 고칠 때는 골라 지울 수 있어야 한다. */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* 영어는 낱말 사이가 넓어 한국어용 자간·줄바꿈 규칙을 그대로 쓰면 성기게 읽힌다.
   자간을 되돌리고 낱말 단위 줄바꿈으로 바꾼다. */
:root[data-lang="en"] body{letter-spacing:-.004em}
:root[data-lang="en"] .h1{font-size:23px;letter-spacing:-.026em}
:root[data-lang="en"] .hbtns{min-width:172px;gap:6px}
:root[data-lang="en"] .ib{width:38px;height:38px}
:root[data-lang="en"] .ib svg{width:20px;height:20px}
:root[data-lang="en"] .mascot-home{width:48px;height:62px}
:root[data-lang="en"] .h1 small{word-break:normal;overflow-wrap:break-word}
:root[data-lang="en"] .nb .lb{font-size:9.5px;letter-spacing:-.005em}
:root[data-lang="en"] .tourbody h2{letter-spacing:-.028em}
:root[data-lang="en"] .tourbody p,:root[data-lang="en"] .sheetlead{word-break:normal;overflow-wrap:break-word}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,'Pretendard','Apple SD Gothic Neo','Helvetica Neue',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;position:fixed;inset:0;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::-webkit-scrollbar{width:0;height:0}
/* 단순 반투명 표면 + 일반 블러. 채도·광택 효과는 섞지 않는다. */
.glass{background:var(--blur-surface);border:1px solid var(--surface-brd);box-shadow:var(--shadow-sm);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

#app{height:100%;display:flex;flex-direction:column}
#top{padding:calc(var(--st) + 14px) calc(var(--sr) + 20px) 8px calc(var(--sl) + 20px);flex:none}
#topin{max-width:var(--wrap);margin:0 auto}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
/* 마스코트가 탭을 옮겨도 같은 자리에 있도록 제목이 남는 폭을 먹고 버튼 영역 폭을 고정한다.
   버튼 수가 탭마다 달라도(달력은 3개) 오른쪽 정렬이라 보이는 위치는 그대로다. */
.h1{flex:1;min-width:0;overflow:hidden}
.hbtns{min-width:192px;justify-content:flex-end}
.h1{font-size:29px;font-weight:800;letter-spacing:-.034em;line-height:1.08}
/* 제목은 한 줄로 두고, 넘치면 말줄임한다. 넘쳐 흘러 마스코트를 덮으면 안 된다. */
.h1 .hname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 마스코트가 자리를 차지하므로 부제목은 줄이 바뀔 수 있다. 낱말 중간에서 끊기지 않게 한다. */
.h1 small{display:block;font-size:13px;font-weight:650;color:var(--ink3);letter-spacing:-.01em;margin-bottom:3px;word-break:keep-all}
.hbtns{display:flex;gap:8px;align-items:center}
.ib{width:42px;height:42px;border-radius:var(--r3);display:grid;place-items:center;color:var(--ink2);flex:none}
.ib:active{transform:scale(.9);color:var(--ac)}
.ib svg{width:21px;height:21px}
.ib.on{color:var(--ac);background:var(--ac-s)}
/* 2주 이내 마감 — 작은 빨간 글씨 */
.soon{margin-top:7px;font-size:12px;font-weight:750;color:var(--gd);line-height:1.5;
  display:flex;flex-wrap:wrap;gap:2px 12px}
.soon span{white-space:nowrap}
.soon b{font-weight:850}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:4px calc(var(--sr) + 20px) calc(var(--sb) + var(--dockh) + 26px) calc(var(--sl) + 20px)}
#view{width:100%;max-width:var(--wrap);margin:0 auto;will-change:transform}

/* 미배정 — 오른쪽 세로 레일 */
.daylayout{display:grid;grid-template-columns:minmax(0,1fr) var(--unw);gap:12px;align-items:start}
/* 미배정 레일은 스크롤과 관계없이 화면 오른쪽에 통째로 보여야 한다.
   높이를 화면 크기로만 계산하면 스크롤 맨 아래에서 sticky 가 풀리며 위가 잘리고
   아래는 독에 가린다. 실제로 보이는 세로를 재서 --railh 에 넣는다(fitRail). */
.unbar{position:sticky;top:4px;z-index:20;padding:9px 8px;border-radius:17px;
  height:var(--railh,calc(100dvh - var(--st) - var(--dockh) - 98px));min-height:150px;
  display:flex;flex-direction:column;transition:box-shadow .16s}
.unbar.tgt{box-shadow:0 0 0 2.5px var(--ac) inset}
.unbar.empty .unrow{min-height:120px;display:flex;align-items:center;justify-content:center;
  border:1.5px dashed var(--line);border-radius:11px;font-size:12px;font-weight:700;color:var(--ink3)}
/* 미리보기 칩이 떠 있는 동안에는 '끌어와서 미배정' 안내를 감춘다.
   비어 있을 때의 가운데 정렬도 풀어야 미리보기가 진짜 칩과 같은 폭으로 보인다. */
.unrow.hasghost .unph{display:none}
.unbar.empty .unrow.hasghost{align-items:stretch;justify-content:flex-start}
.unbar .uh{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase;margin-bottom:7px}
.unrow{display:flex;flex-direction:column;gap:7px;overflow-y:auto;overflow-x:hidden;min-height:0;padding-bottom:2px}
.uchip{flex:0 0 auto;min-width:0;display:flex;align-items:center;gap:6px;padding:10px 8px;border-radius:var(--r3);
  background:var(--blur-surface);border:1px solid var(--line2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:transform .16s cubic-bezier(.2,1.5,.4,1),box-shadow .16s ease}
.uchip:active{background:var(--ac-s);border-color:var(--ac-b)}
/* 꾹 눌러 잡힌 순간 카드가 떠오른다. 평평하게 두면 잡혔는지 알 수 없다.
   미배정 목록은 스크롤 영역이라 그 안에서 키우면 커진 만큼 잘린다.
   잡히는 순간 목록에서 꺼내(absolute) 레일 위로 띄운다 — 기준은 .unbar 다. */
.uchip.lift{position:absolute;border-color:var(--ac);background:var(--ac-s);box-shadow:var(--shadow-lg);
  transform:scale(1.07);z-index:40}
.uchip.dragging{opacity:.3}
.uchip.done{background:var(--done-bg)}
.uchip.done .ut{opacity:.56}
.uchip.done .ut>i{text-decoration:line-through}
.uchip .ut{min-width:0;flex:1}
.uchip .ut>i{display:block;font-style:normal;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip .gr{width:14px;flex:none;display:flex;flex-direction:column;gap:2.5px;opacity:.35}
.uchip .gr b{display:block;width:11px;height:1.6px;border-radius:1px;background:var(--ink2)}
.uck{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);background:var(--blur-strong);
  display:grid;place-items:center;flex:none;z-index:2}
.uck:active{transform:scale(.9)}
.uck svg{width:11px;height:11px;color:#fff;opacity:0}
.uck.on{background:var(--ok);border-color:var(--ok)}
.uck.on svg{opacity:1}

/* 전날 미완료 정리 — 오늘 시간표보다 먼저 선택하게 한다. */
.carry{margin-bottom:14px;padding:14px;border-radius:var(--r);box-shadow:var(--shadow-md)}
.carryhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.carryhead b{display:block;font-size:16px;letter-spacing:-.025em}
.carryhead span{display:block;margin-top:2px;font-size:11.5px;font-weight:700;color:var(--ink3)}
.carrycount{flex:none;min-width:28px;height:28px;padding:0 9px;border-radius:10px;display:grid;place-items:center;
  background:var(--ac-s);color:var(--ac);font-size:12px;font-weight:850}
.carrylist{display:flex;flex-direction:column;gap:7px}
.carryrow{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px auto;align-items:center;gap:6px;
  min-height:52px;padding:7px 7px 7px 11px;border:1px solid var(--line2);border-radius:var(--r3);background:var(--blur-strong)}
.carrytext{min-width:0}
.carrytitle{font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carrymeta{margin-top:2px;font-size:10.5px;font-weight:700;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carryck,.carrydel{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1.5px solid var(--line)}
.carryck{background:var(--ok-s);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.carrydel{background:var(--gd-s);color:var(--gd);border-color:color-mix(in srgb,var(--gd) 30%,transparent)}
.carryck svg,.carrydel svg{width:17px;height:17px}
.carrymove{height:38px;padding:0 11px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:5px;
  background:var(--ac-s);color:var(--ac);font-size:11.5px;font-weight:850;white-space:nowrap}
.carrymove svg{width:15px;height:15px}
.carryck:active,.carrydel:active,.carrymove:active{transform:scale(.94)}

/* ── 타임그리드 ── */
#gridwrap{position:relative}
.grid{position:relative;margin-left:var(--gut);border-left:1px solid var(--line)}
.hl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line2);pointer-events:none}
.hl.major{border-top-color:var(--line)}
.hl i{position:absolute;left:calc(-1 * var(--gut));top:-9px;width:calc(var(--gut) - 8px);text-align:right;
  font-style:normal;font-size:11.5px;font-weight:750;color:var(--ink3);font-variant-numeric:tabular-nums}
.band{position:absolute;left:0;right:0;background:var(--band);pointer-events:none;
  border-top:1px solid var(--ac-s);border-bottom:1px solid var(--ac-s)}
.band.gap{background:transparent;border-top:1px dashed var(--line2);border-bottom:none}
.band b{position:absolute;left:7px;top:2px;font-size:11px;font-weight:800;color:var(--ac);opacity:.85;
  letter-spacing:-.02em;white-space:nowrap}
.band.gap b{color:var(--ink3);opacity:.65;font-weight:750}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--gd);z-index:6;pointer-events:none}
.nowl::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--gd)}

.ev{position:absolute;border-radius:11px;overflow:hidden;z-index:4;
  background:var(--bg2);border:1px solid var(--line);box-shadow:0 1px 3px rgba(63,49,36,.08);
  display:flex;flex-direction:column;min-height:0;touch-action:pan-y;
  transition:transform .16s cubic-bezier(.2,1.5,.4,1),box-shadow .16s ease}
.ev.done{opacity:1;background:var(--done-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ev.done .evb{opacity:.55}
.ev.done .evt{text-decoration:line-through}
.ev.act{z-index:12;overflow:visible;box-shadow:var(--shadow-md);border-color:var(--ac);touch-action:none}
/* 꾹 눌러 잡힌 카드는 살짝 떠오른다 */
.ev.lift{z-index:20;transform:scale(1.035);box-shadow:var(--shadow-lg)}
.evb{flex:1;min-width:0;padding:4px 40px 4px 9px;overflow:hidden;border-radius:10px}
.evtitle{display:flex;align-items:center;gap:6px;min-width:0}
.evt{font-size:13px;font-weight:700;letter-spacing:-.02em;line-height:1.25;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* flex 컨테이너 안의 맨 텍스트에는 text-overflow 가 걸리지 않아 이름이 말줄임 없이 뚝 잘린다.
   이름을 b 로 감싸 거기에 말줄임을 건다. */
.evcat,.ucat{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;max-width:44%;min-width:0;
  font-size:10px;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden}
.evcat b,.ucat b{min-width:0;font-weight:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evcat i,.ucat i{width:7px;height:7px;border-radius:50%;flex:none}
.ucat{display:flex;margin-top:2px;max-width:100%;font-size:9.5px}
.evm{font-size:10px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums;
  overflow:hidden;white-space:nowrap}
.ev.sm .evm{display:none}
.ev.sm .evb{padding:1px 34px 1px 7px}
.ev.sm .evt{font-size:12.5px}
/* 경계 토글 — 맞닿은 두 일 사이(마지막 일이면 그 끝)에 저절로 생긴다.
   카드 안이 아니라 그리드 위에 따로 둔다. 카드 안에 넣으면 overflow:hidden 에 잘린다.
   폭을 가운데 104px 로 잡아 오른쪽 완료 버튼과 겹치지 않게 한다. */
.bnd{position:absolute;left:50%;width:104px;height:26px;margin:-13px 0 0 -52px;z-index:7;
  display:flex;align-items:center;justify-content:center}
.bnd::after{content:'';display:block;width:52px;height:6px;border-radius:4px;background:var(--ac);
  opacity:.4;box-shadow:0 1px 3px rgba(75,48,34,.18);
  transition:opacity .15s ease,transform .15s cubic-bezier(.2,1.5,.4,1)}
.bnd.pair::after{width:66px;opacity:.62}
.bnd.hot::after{opacity:1;transform:scaleY(1.7) scaleX(1.06)}
.evtime{position:absolute;right:8px;bottom:3px;font-size:11px;font-weight:850;color:var(--ac);
  font-variant-numeric:tabular-nums;opacity:0;transition:opacity .14s;pointer-events:none;
  background:var(--bg2);padding:0 4px;border-radius:5px}
.ev.act .evtime{opacity:1}

/* 말풍선 — 마스코트가 말하는 것처럼 보이게 한다. 모서리만 살짝 깎은 네모라
   마스코트의 픽셀 느낌과 결이 맞고, 배경은 어느 테마에서나 밝은 크림을 유지해
   글자가 항상 또렷하다. 카드처럼 도드라지지 않게 그림자는 아주 옅게만 준다. */
/* 앱의 시트와 같은 반투명 블러 표면. 뒤가 비쳐 보이되 주변보다 밝게 떠 있어야 한다.
   중요: 같은 요소에 filter 를 걸면 그 요소가 backdrop root 가 되어 backdrop-filter 가
   사라진다. 그래서 발광은 뒤에 깔리는 별도 레이어(.tourguide::before)로 분리한다. */
.tourguide::before{content:'';position:absolute;inset:-4px;z-index:-1;pointer-events:none;
  background:var(--tour-halo);filter:blur(15px);opacity:.95;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.tourbubble{position:relative;pointer-events:auto;padding:12px 14px 8px;
  background:linear-gradient(157deg,var(--tour-sheen),rgba(255,255,255,0) 54%),var(--tour-paper);
  box-shadow:inset 0 1px 0 var(--tour-sheen);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.tourtail{position:absolute;width:17px;height:13px;background:var(--tour-paper);pointer-events:none;
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  transition:left .3s ease,top .3s ease,opacity .2s}
.tourtail.up{clip-path:polygon(50% 0,100% 100%,0 100%)}
.tourtail.down{clip-path:polygon(0 0,100% 0,50% 100%)}
.tourtail.left{width:13px;height:17px;clip-path:polygon(100% 0,100% 100%,0 50%)}
.tourtail.right{width:13px;height:17px;clip-path:polygon(0 0,0 100%,100% 50%)}
/* 말풍선 안은 항상 밝은 바탕이므로 글자는 두 테마 모두 진한 잉크색을 쓴다 */

  text-shadow:0 0 5px var(--tour-lift),0 0 10px var(--ac-glow)}

  text-shadow:0 0 6px var(--tour-lift)}

.tourbtn{padding:9px 2px 9px 12px;min-width:92px;color:var(--tour-ac);text-align:right;

/* 날짜 표기 — 한국어는 숫자 중심, 영어는 약어 월 이름 */
function fmtMD(d){return KO?(d.getMonth()+1)+'월 '+d.getDate()+'일':L.mon[d.getMonth()]+' '+d.getDate();}
function fmtMDW(d){return KO?fmtMD(d)+' '+L.dow[d.getDay()]+'요일':L.dow[d.getDay()]+', '+L.mon[d.getMonth()]+' '+d.getDate();}
function fmtMDWShort(d){return KO?fmtMD(d)+' ('+L.dow[d.getDay()]+')':L.dow[d.getDay()]+', '+L.mon[d.getMonth()]+' '+d.getDate();}
function fmtDot(d){return KO?(d.getMonth()+1)+'.'+d.getDate()+' ('+L.dow[d.getDay()]+')':L.mon[d.getMonth()]+' '+d.getDate()+' ('+L.dow[d.getDay()]+')';}
function fmtYM(y,m){return KO?y+'년 '+(m+1)+'월':L.monFull[m]+' '+y;}
function nOf(n,one,many){return n===1?one:many;}

/* 정적 마크업(독 라벨·FAB)의 문구를 고른 언어로 바꾼다 */
document.querySelectorAll('[data-i18n]').forEach(n=>{const v=L[n.dataset.i18n];if(v)n.textContent=v;});
document.querySelectorAll('[data-i18n-aria]').forEach(n=>{const v=L[n.dataset.i18nAria];if(v)n.setAttribute('aria-label',v);});

/* ═════ 1. 시간·시간표 ═════ */
const M=(h,m)=>h*60+m;
const DAY0=M(2,0);          // 하루의 시작 = 새벽 2시
const PPM=1.4;              // 기본 1분당 픽셀
const MIN_EVENT_PX=20;      // 짧은 일정 카드의 최소 터치 높이
const SNAP=5;               // 길이 조절과 자동 분할은 5분 단위
const PLACE_SNAP=5;         // 직접 배치도 5분 단위 — 6시 정각처럼 5분 끝자리를 맞출 수 있어야 한다

/* 기본 시간대 — 시간표를 따로 만들지 않은 사람도 하루가 칸으로 나뉘어 보인다.
   큰 덩어리로만 나누면 쪼개지는 감각이 안 와닿아서, 실제 고등학생 하루를 그대로 넣었다.
   사용자는 이걸 바탕으로 자기 시간표에 맞게 고쳐 쓴다. 자기 시간표를 만들면 기본은
   꺼지고 삭제되지는 않으므로 언제든 다시 켤 수 있다. */
const DEFAULT_WEEKDAY=[
  ['p1',  M(8,30), M(9,20),  0],
  ['p2',  M(9,30), M(10,20), 1],
  ['p3',  M(10,30),M(11,20), 2],
  ['p4',  M(11,30),M(12,20), 3],
  ['p5',  M(13,30),M(14,20), 4],
  ['p6',  M(14,30),M(15,20), 5],
  ['p7',  M(15,30),M(16,20), 6],
  ['aft', M(16,50),M(18,0),  7],
  ['ja1', M(19,10),M(21,0),  8],
  ['ja2', M(21,15),M(23,30), 9],
];
/* 주말도 한 칸이 너무 크면 칸에 들어가는 게 잘 안 보인다.
   점심·저녁·쉬는시간은 블록으로 만들지 않고 사이를 비워 자동으로 이름이 붙게 한다. */
const DEFAULT_WEEKEND=[
  ['wam',  M(8,0),  M(9,0),  0],
  ['wam2', M(9,30), M(12,0), 1],
  ['wpm',  M(13,0), M(15,0), 2],
  ['wpm2', M(15,30),M(18,0), 3],
  ['wev',  M(19,0), M(21,0), 4],
  ['wnig', M(21,30),M(23,30),5],
];
/* 시간대는 하나다. 그 안에 요일 묶음을 여러 개 둔다. 평일·주말은 처음부터 들어 있고
   필요하면 얼마든지 더 넣는다. 하나를 고쳐도 시간표가 하나 더 생기는 게 아니라 이
   시간대의 내용이 바뀐다. 한 요일은 한 묶음에만 속하고, 어느 묶음에도 없는 요일은
   그 날만 24시간 보기다. blocks 가 비어 있으면 코드에 있는 원래 값을 쓴다. */
function freshSched(){return {sets:[
  {id:'weekday',kind:'weekday',days:[1,2,3,4,5],blocks:null},
  {id:'weekend',kind:'weekend',days:[0,6],blocks:null}
]};}
function schedRoot(){
  const st=DB.s;
  if(!st.sched||!Array.isArray(st.sched.sets)||!st.sched.sets.length)st.sched=freshSched();
  return st.sched;
}
function schedSets(){return schedRoot().sets;}
function setName(x){
  return x.kind==='weekday'?L.defaultWeekday:x.kind==='weekend'?L.defaultWeekend:(x.name||L.schedSetFallback);}
function setBlocks(x){
  if(Array.isArray(x.blocks)&&x.blocks.length)return x.blocks.map(b=>({id:b.id,name:b.name,s:b.s,e:b.e}));
  const src=x.kind==='weekday'?DEFAULT_WEEKDAY:x.kind==='weekend'?DEFAULT_WEEKEND:null;
  if(!src)return [];
  const names=x.kind==='weekend'?L.defaultWeekendBlocks:L.defaultWeekdayBlocks;
  return src.map(v=>({id:v[0],s:v[1],e:v[2],name:names[v[3]]}));
}
function setDays(x){return Array.isArray(x.days)?x.days.slice().sort((a,b)=>a-b):[];}
function setEdited(x){return !!(Array.isArray(x.blocks)&&x.blocks.length);}
function findSet(id){return schedSets().find(x=>x.id===id)||null;}
const LEGACY_PROFILE_ID='default-school';
function legacyProfile(){return {id:LEGACY_PROFILE_ID,name:L.schoolName,blocks:LEGACY_CLASSES.map(x=>({id:x[0],s:x[1],e:x[2],name:x[3]}))};}
/* 빈 구간 이름. 점심·저녁은 정확한 분이 아니라 시간대 범위로 잡는다.
   블록으로 만들지 않고 빈 구간으로 두어야 평일 쉬는시간과 같은 회색으로 보인다. */
function gapName(s,e){
  if(s===0)return L.gapDawn;
  if(s>=M(11,30)&&s<=M(13,0))return L.gapLunch;
  if(s>=M(17,30)&&s<=M(19,0))return L.gapDinner;
  if(e<=M(6,50))return L.gapDawn;

    out.push({id:b.id,s:b.s,e:b.e,name:b.name,cls:true});cur=b.e;});

function bandAt(ds,min){

/* 옛 저장값(여러 개의 시간표 + 요일 연결)을 하나뿐인 시간대로 옮긴다.
   평일에 가장 많이 걸려 있던 시간표를 평일 벌로, 주말에 걸려 있던 것을 주말 벌로 삼는다.
   어느 쪽에도 없던 요일은 예전처럼 24시간 보기가 되도록 요일 목록에서 뺀다. */
/* 옛 저장값을 하나뿐인 시간대의 묶음 목록으로 옮긴다.
   묶음을 여러 개 둘 수 있으므로 옛 시간표가 셋 이상이어도 잃지 않는다. */
function migrateSched(raw,legacy,hasPlannerData){
  const norm=v=>normalizeProfile({blocks:v}).blocks;
  const dayList=v=>Array.isArray(v)?[...new Set(v.map(Number).filter(x=>x>=0&&x<=6))].sort((a,b)=>a-b):null;
  const out=freshSched();
  const seed=k=>out.sets.find(x=>x.kind===k);
  const rs=raw.sched;
  if(rs&&typeof rs==='object'&&Array.isArray(rs.sets)){          // 지금 형식
    const sets=rs.sets.map(x=>{
      const b=norm(x.blocks),kind=x.kind==='weekday'||x.kind==='weekend'?x.kind:null;
      return {id:String(x.id||uid()),kind,name:kind?undefined:String(x.name||'').trim(),
        days:dayList(x.days)||[],blocks:b.length?b:null};
    }).filter(x=>x.kind||x.blocks);
    ['weekday','weekend'].forEach(k=>{if(!sets.some(x=>x.kind===k))
      sets.push({id:k,kind:k,days:[],blocks:null});});
    return {sets};
  }
  if(rs&&typeof rs==='object'&&rs.weekday){                      // v7 두 벌 형식
    ['weekday','weekend'].forEach(k=>{
      const v=rs[k]||{},b=norm(v.blocks),sd=seed(k);
      sd.blocks=b.length?b:null;
      // 켜고 끄기가 사라졌다. 꺼져 있던 저장값은 모든 요일을 비워 24시간을 유지한다.
      sd.days=rs.off===true?[]:(dayList(v.days)||(k==='weekend'?[0,6]:[1,2,3,4,5]));
    });
    return out;
  }
  if(raw.defaultBlocks&&typeof raw.defaultBlocks==='object')['weekday','weekend'].forEach(k=>{
    const b=norm(raw.defaultBlocks[k]);if(b.length)seed(k).blocks=b;});
  if(raw.defaultSchedOff===true){out.sets.forEach(x=>{x.days=[];});}
  const profs=Array.isArray(raw.scheduleProfiles)?raw.scheduleProfiles.map(normalizeProfile):[];
  const dp=(raw.dayProfiles&&typeof raw.dayProfiles==='object')?raw.dayProfiles:{};
  const daysOf=id=>[0,1,2,3,4,5,6].filter(i=>String(dp[String(i)]||'')===id);
  const live=profs.filter(pr=>!pr.off&&daysOf(pr.id).length);
  if(live.length){
    const score=pr=>daysOf(pr.id).filter(x=>x>=1&&x<=5).length;
    const sorted=live.slice().sort((x,y)=>score(y)-score(x));
    const wd=sorted[0];
    const we=sorted.find(pr=>pr!==wd&&daysOf(pr.id).some(x=>x===0||x===6))||null;
    seed('weekday').days=daysOf(wd.id);
    seed('weekday').blocks=wd.blocks.length?wd.blocks:null;
    seed('weekend').days=we?daysOf(we.id):[];
    seed('weekend').blocks=we&&we.blocks.length?we.blocks:null;
    // 남은 시간표도 묶음으로 그대로 옮긴다
    sorted.filter(pr=>pr!==wd&&pr!==we).forEach(pr=>out.sets.push(
      {id:uid(),name:pr.name,days:daysOf(pr.id),blocks:pr.blocks.length?pr.blocks:null}));
  }else if(legacy&&hasPlannerData&&!raw.defaultBlocks&&raw.defaultSchedOff===undefined&&!Array.isArray(raw.scheduleProfiles)){
    seed('weekday').blocks=legacyProfile().blocks;               // v4 이하
  }
  // 한 요일이 두 묶음에 걸리지 않게 앞선 묶음이 우선한다
  const taken={};
  out.sets.forEach(x=>{x.days=setDays(x).filter(d=>taken[d]?false:(taken[d]=1,true));});
  return out;
}
function normalizeDB(d,legacy){
  d=d&&typeof d==='object'?d:{};const raw=d.s&&typeof d.s==='object'?d.s:{};
  const hasPlannerData=(Array.isArray(d.tasks)&&d.tasks.length)||(Array.isArray(d.subjects)&&d.subjects.length)||(Array.isArray(d.repeats)&&d.repeats.length);
  const s=freshSettings();s.force24=raw.force24&&typeof raw.force24==='object'?Object.assign({},raw.force24):{};
  s.theme=['sys','light','dark'].includes(raw.theme)?raw.theme:'sys';s.tutorialSeen=raw.tutorialSeen===true;
  s.introDone=raw.introDone===true;

  const out={v:7,tasks:Array.isArray(d.tasks)?d.tasks:[],subjects:Array.isArray(d.subjects)?d.subjects:[],repeats:Array.isArray(d.repeats)?d.repeats:[],s};
  out.tasks.forEach(t=>{

function repHits(rep,ds){
  const d=parseD(ds),start=parseD(rep.start);
  if(d<start)return false;
  if(rep.end&&d>parseD(rep.end))return false;
  if(rep.freq==='daily')return true;
  if(rep.freq==='weekly')return (rep.weekdays||[]).includes(d.getDay());
  if(rep.freq==='interval')return Math.round((d-start)/864e5)%(rep.interval||1)===0;
  return false;
}
let _dirty=false;
function materialize(ds){
  DB.repeats.forEach(rep=>{

    if(rep.ex&&rep.ex.indexOf(ds)>=0)return;
    if(rep.mode24&&!is24(ds)){DB.s.force24[ds]=true;_dirty=true;}
    if(DB.tasks.some(t=>t.repId===rep.id&&t.date===ds))return;
    const sibs=DB.tasks.filter(t=>t.date===ds&&(t.min==null)===(rep.min==null));
    DB.tasks.push({id:uid(),title:rep.title,date:ds,min:rep.min,
      dur:rep.dur!=null?rep.dur:bandLen(ds,rep.min),
      ord:sibs.length,done:false,subj:rep.subj,repId:rep.id});
    _dirty=true;
  });
}

/** 겹치면 나란히 놓지 않고 서로 경계를 맞춘다 (이동·크기조절 뒤 정리) */
function resolveOverlaps(ds, movedId){
  const R=t=>rel(t.min), E=t=>rel(t.min)+taskDur(t,ds);
  const day=()=>DB.tasks.filter(t=>t.date===ds&&t.min!=null);
  const moved=day().find(t=>t.id===movedId); if(!moved) return;
  const ms=R(moved), me=E(moved);
  day().filter(t=>t.id!==movedId).forEach(t=>{
    const ts=R(t), te=E(t);
    if(te<=ms||ts>=me) return;
    if(ts<ms){ t.dur=Math.max(SNAP, ms-ts); }          // 앞엣것은 끝을 잘라 맞춘다
    else { const d=Math.max(SNAP,te-ts);               // 뒤엣것은 뒤로 밀어 이어 붙인다
           t.min=abs(Math.min(1440-d, me)); t.dur=d; }
  });
  // 밀린 것끼리 다시 겹치면 순서대로 정렬해 붙인다
  let cur=me;
  day().filter(t=>t.id!==movedId&&R(t)>=me).sort((a,b)=>R(a)-R(b)).forEach(t=>{
    const d=Math.max(SNAP,taskDur(t,ds));
    if(R(t)<cur) t.min=abs(Math.min(1440-d,cur));
    cur=rel(t.min)+taskDur(t,ds);
  });
}
/** 한 칸의 일정을 원하는 순서로 놓고 칸 시간을 똑같이 나눈다 */

  let inB=DB.tasks.filter(t=>t.date===ds&&t.min!=null&&t.min>=band.s&&t.min<band.e)
    .sort((a,b)=>a.min-b.min||(a.ord||0)-(b.ord||0));
  if(movingId&&insertAt!=null){
    const mv=inB.find(t=>t.id===movingId);
    if(mv){inB=inB.filter(t=>t.id!==movingId);
      inB.splice(Math.max(0,Math.min(inB.length,insertAt)),0,mv);}}
  if(!inB.length) return;
  if(inB.length<2&&!fillEvenIfOne) return;
  const each=Math.max(SNAP, snap((band.e-band.s)/inB.length));
  inB.forEach((t,i)=>{
    t.min=band.s+each*i;
    t.dur=(i===inB.length-1)?Math.max(SNAP,band.e-t.min):each;
    t.ord=i;});
}
/** 주말 24시간 보기에서 기본 1시간 일정들이 공유하는 상대 시간 슬롯 */
function autoSlotBand(task){

function splitAutoSlot(ds,band,fillEvenIfOne,movingId,insertAt){
  let inB=autoSlotMembers(ds,band).sort((a,b)=>rel(a.min)-rel(b.min)||(a.ord||0)-(b.ord||0));
  if(movingId&&insertAt!=null){
    const mv=inB.find(t=>t.id===movingId);
    if(mv){inB=inB.filter(t=>t.id!==movingId);
      inB.splice(Math.max(0,Math.min(inB.length,insertAt)),0,mv);}}
  if(!inB.length)return;
  inB.forEach(t=>{t.autoSlot=band.s;});
  if(inB.length<2&&!fillEvenIfOne){
    inB[0].min=abs(band.s);inB[0].dur=60;inB[0].ord=0;return;}
  const each=Math.max(SNAP,Math.floor(((band.e-band.s)/inB.length)/SNAP)*SNAP);
  inB.forEach((t,i)=>{
    const s=Math.min(band.e-SNAP,band.s+each*i);
    t.min=abs(s);t.dur=(i===inB.length-1)?Math.max(SNAP,band.e-s):each;t.ord=i;});
}
function clearAutoSlot(ds,band){
  if(!band||!band.auto)return;
  DB.tasks.forEach(t=>{if(t.date===ds&&t.autoSlot===band.s)t.autoSlot=null;});
}
function sameBand(a,b){return !!(a&&b&&a.s===b.s&&a.e===b.e);}
function resizeLinked(task,mode,baseS,baseD,curS,curD,neighbor,neighborBase){
  if(!task||!neighbor)return false;
  if(mode==='rt'){
    const delta=curS-baseS;
    task.min=abs(curS);task.dur=Math.max(SNAP,curD);
    neighbor.dur=Math.max(SNAP,neighborBase+delta);
    return true;
  }
  if(mode==='rb'){
    const delta=(curS+curD)-(baseS+baseD);
    task.dur=Math.max(SNAP,curD);
    neighbor.min=abs(rel(neighbor.min)+delta);neighbor.dur=Math.max(SNAP,neighborBase-delta);
    return true;
  }
  return false;
}
function gridItems(ds){
  return tasksOf(ds).filter(t=>t.min!=null).map(t=>{
    const s=rel(t.min),d=Math.max(SNAP,taskDur(t,ds));
    return {t,s,e:Math.min(1440,s+d)};});
}
/* 짧은 카드가 머무는 칸의 끝. 시간표에서는 해당 밴드, 24시간 보기에서는 다음 정각이다. */
function visualCellEnd(ds,it){
  let end=Math.min(1440,Math.floor(it.s/60)*60+60);
  if(!is24(ds)){
    const b=bandAt(ds,abs(Math.min(1439,it.s)));
    if(b){const rs=rel(b.s),re=Math.min(1440,rs+(b.e-b.s));
      if(it.s>=rs&&it.s<re)end=re;}
  }
  return Math.max(it.e,end);
}
/* 짧은 카드는 같은 칸의 남은 빈 공간을 먼저 쓴다. 다음 일정이나 칸 끝에 부딪힐 때만 시간축을 늘린다. */
function timeMap(ds){
  const items=gridItems(ds).sort((a,b)=>a.s-b.s||a.e-b.e);
  const spans=items.filter((it,i)=>{
    const d=it.e-it.s;if(d<=0||d*PPM>=MIN_EVENT_PX)return false;
    const next=items.slice(i+1).find(x=>x.t.id!==it.t.id);
    const roomEnd=Math.max(it.e,Math.min(visualCellEnd(ds,it),next?next.s:1440));
    return (roomEnd-it.s)*PPM<MIN_EVENT_PX;
  }).map(it=>({s:it.s,e:it.e,scale:MIN_EVENT_PX/(it.e-it.s)}));
  const cuts=[0,1440];spans.forEach(x=>{cuts.push(x.s,x.e);});
  cuts.sort((a,b)=>a-b);
  const uniq=cuts.filter((x,i)=>!i||x!==cuts[i-1]),segs=[];let total=0;
  for(let i=0;i<uniq.length-1;i++){
    const s=uniq[i],e=uniq[i+1],mid=(s+e)/2;
    let scale=PPM;
    spans.forEach(x=>{if(mid>=x.s&&mid<x.e)scale=Math.max(scale,x.scale);});
    segs.push({s,e,y:total,scale});total+=(e-s)*scale;}
  const y=min=>{min=Math.max(0,Math.min(1440,min));
    if(min===1440)return total;
    const q=segs.find(x=>min>=x.s&&min<x.e)||segs[segs.length-1];
    return q.y+(min-q.s)*q.scale;};
  const min=px=>{px=Math.max(0,Math.min(total,px));
    if(px===total)return 1440;
    const q=segs.find(x=>px>=x.y&&px<x.y+(x.e-x.s)*x.scale)||segs[segs.length-1];
    return q.s+(px-q.y)/q.scale;};
  return {height:total,y,min};
}
function evHTML(it,map){
  const t=it.t,h=Math.max(MIN_EVENT_PX,map.y(it.e)-map.y(it.s)),sm=h<40;
  const sj=t.subj?subjOf(t.subj):null, end=abs(it.e);
  const done=t.done?' done':'', small=sm?' sm':'';
  const ck='<button class="evck'+(t.done?' on':'')+'">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></button>';
  return '<div class="ev'+done+small+'" data-id="'+t.id+'" '+
    'style="top:'+map.y(it.s)+'px;height:'+h+'px;left:3px;right:3px">'+
    '<div class="evb"><div class="evtitle"><div class="evt">'+esc(t.title)+'</div>'+
    (sj?'<span class="evcat"><i style="background:'+sj.color+'"></i><b>'+esc(sj.name)+'</b></span>':'')+'</div>'+
    '<div class="evm">'+hhmm(t.min)+'~'+hhmm(end)+' \u00b7 '+durTxt(it.e-it.s)+(t.repId?' \u00b7 '+L.repeatShort:'')+'</div></div>'+
    '<div class="evtime">'+hhmm(t.min)+'~'+hhmm(end)+'</div>'+ck+'</div>';
}
function renderDay(ds){
  const map=timeMap(ds),H=map.height;
  const un=tasksOf(ds).filter(t=>t.min==null).sort((a,b)=>a.ord-b.ord);
  let h='<div class="daylayout"><div id="gridwrap"><div class="grid" data-date="'+ds+'" style="height:'+H+'px">';
  // 이 요일에 지정된 시간표 밴드
  if(!is24(ds))scheduleBlocks(ds).forEach(b=>relParts(b.s,b.e).forEach(([s,e])=>{
    const top=map.y(s),hh=map.y(e)-top;
    h+='<div class="band'+(b.cls?'':' gap')+'" style="top:'+top+'px;height:'+hh+'px">'+
       (hh>=17?'<b>'+esc(b.name)+'</b>':'')+'</div>';}));
  // 시간선
  for(let i=0;i<=24;i++){
    const m=(DAY0+i*60)%1440;
    h+='<div class="hl'+(m%180===0?' major':'')+'" style="top:'+map.y(i*60)+'px"><i>'+hhmm(m)+'</i></div>';}
  // 지금
  if(ds===TODAY()){
    const now=new Date(),nm=rel(now.getHours()*60+now.getMinutes());
    h+='<div class="nowl" style="top:'+map.y(nm)+'px"></div>';}
  const items=gridItems(ds);
  items.forEach(it=>{h+=evHTML(it,map);});
  /* 경계 토글 — 일정마다 아래 모서리에 하나씩 저절로 생긴다. 바로 아래 일과 맞닿아 있고
     둘이 같은 칸에 있을 때만 나눠 쓰는 경계(pair)라, 꾹 눌러 끌면 총 길이를 지키며
     경계만 움직인다. 칸이 다르면 붙어 있어도 따라오지 않고 제 끝만 움직인다.
     같은 높이에 둘이 겹치면 하나만 둔다. */
  const bandOf=t=>autoSlotBand(t)||bandAt(ds,t.min);
  const seenY={};
  items.forEach(it=>{
    const y=Math.round(map.y(it.e));
    if(seenY[y])return;seenY[y]=1;
    const ba=bandOf(it.t);
    const nx=items.find(o=>{
      if(o.t.id===it.t.id||Math.abs(o.s-it.e)>=.5)return false;
      const bb=bandOf(o.t);
      return (!ba&&!bb)||sameBand(ba,bb);});
    h+='<div class="bnd'+(nx?' pair':'')+'" style="top:'+y+'px" data-a="'+it.t.id+'"'+
       (nx?' data-b="'+nx.t.id+'"':'')+'></div>';});
  h+='</div></div><div class="unbar glass'+(un.length?'':' empty')+'" data-un="1">'+
    '<div class="uh">'+L.unassigned+(un.length?' '+un.length:'')+'</div>'+
    '<div class="unrow">'+(un.length?un.map(t=>uchipHTML(t)).join('')
      :'<span class="unph">'+L.unDrop+'</span>')+'</div></div></div>';
  return h;
}

   이름만 있는 상자를 보여주면 어떤 모양으로 들어가는지 알 수 없다. */

/* 스크롤 영역에서 실제로 보이는 세로와, .daylayout 이 차지할 수 있는 세로 중
   작은 쪽에 맞춘다. 후자를 빼먹으면 맨 아래로 내렸을 때 sticky 가 풀려 위가 잘린다. */
function fitRail(){
  const S=$('#scroll'),d=document.querySelector('.dock');if(!S||!d)return;
  const sr=S.getBoundingClientRect(),dockTop=d.getBoundingClientRect().top;
  const pb=parseFloat(getComputedStyle(S).paddingBottom)||0;
  const onScreen=Math.min(dockTop,sr.bottom)-sr.top-14;
  const inFlow=sr.height-pb-8;
  document.documentElement.style.setProperty('--railh',Math.max(150,Math.round(Math.min(onScreen,inFlow)))+'px');
}
function fitCalendar(){
  const g=document.querySelector('.calgrid');if(!g)return;
  g.style.height='auto';
  const top=g.getBoundingClientRect().top;
  const dockTop=window.innerHeight-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dockh'))||78)-20;
  const hh=dockTop-top-16;
  if(hh>150)g.style.height=Math.min(hh,430)+'px';
}

      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:17px;height:17px;color:var(--ink3)"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></div>';
    dds.forEach(d=>{h+=ddHTML(s,d,true);});
    if(gls.length){h+='<div style="border-top:1px solid var(--line2);padding:4px 0 7px" class="goals" data-sid="'+s.id+'">';
      gls.forEach(g=>{h+='<div class="gl" data-gid="'+g.id+'" onclick="editGoal(\''+s.id+'\',\''+g.id+'\')">'+
        '<div class="gld"></div><div class="glt">'+esc(g.text)+'</div><div class="gr2"><i></i><i></i><i></i></div></div>';});
      h+='</div>';}
    h+='<div class="sjf">'+
      '<button class="mini" onclick="editDday(\''+s.id+'\',null)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>'+esc(L.dday)+'</button>'+
      '<button class="mini" onclick="editGoal(\''+s.id+'\',null)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>'+esc(L.goal)+'</button>'+
      '</div></div>';});
  return h;
}

/* ═════ 9. paint ═════ */
function paint(){
  materializeWindow();
  $('#topin').innerHTML=topHTML();
  $('#view').innerHTML=({today:todayHTML,cal:calHTML,subj:subjHTML}[tab])();
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  placeThumb();attachDockDrag();
  if(tab==='today'){bindGrid($('#view'));requestAnimationFrame(fitRail);}
  if(tab==='subj')bindGoalDrag();
  if(tab==='cal')requestAnimationFrame(fitCalendar);
}
function firstPaint(){
  paint();
  const S=$('#scroll');
  requestAnimationFrame(()=>{S.scrollTop=todayStartScroll();});
}
function todayStartScroll(){
  if(carryTasks().length)return 0;
  const S=$('#scroll'),now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  const target=timeMap(TODAY()).y(rel(nowMin))-S.clientHeight*.32;
  return Math.max(0,Math.min(Math.max(0,S.scrollHeight-S.clientHeight),target));
}
function focusToday(behavior){
  const S=$('#scroll');S.scrollTo({top:todayStartScroll(),behavior:behavior||'auto'});
}
function placeThumb(){
  const bar=$('#navtabs');if(!bar)return;
  const th=bar.querySelector('.dockthumb'),a=bar.querySelector('.nb.on');if(!th||!a)return;
  th.style.width=a.offsetWidth+'px';th._x=a.offsetLeft;
  if(!th.classList.contains('drag'))th.style.transform='translateX('+a.offsetLeft+'px)';
}
function attachDockDrag(){
  const bar=$('#navtabs');if(!bar||bar._bound)return;bar._bound=true;
  const th=bar.querySelector('.dockthumb');let on=false;
  const idxAt=cx=>{const b=[...bar.querySelectorAll('.nb')];let bi=0,bd=1e9;
    b.forEach((n,i)=>{const r=n.getBoundingClientRect(),c=(r.left+r.right)/2;
      if(Math.abs(cx-c)<bd){bd=Math.abs(cx-c);bi=i;}});return bi;};
  bar.addEventListener('touchstart',()=>{on=true;th.classList.add('drag');
    th.style.transition='transform .18s ease-out, background .2s';
    th.style.transform='translateX('+(th._x||0)+'px) scale(1.13)';},{passive:true});
  bar.addEventListener('touchmove',e=>{if(!on)return;if(e.cancelable)e.preventDefault();
    const r=bar.getBoundingClientRect(),tw=th.offsetWidth;
    let x=e.touches[0].clientX-r.left-tw/2;x=Math.max(0,Math.min(bar.clientWidth-tw,x));
    th._x=x;th.style.transition='none';th.style.transform='translateX('+x+'px) scale(1.13)';},{passive:false});
  const rel2=e=>{if(!on)return;on=false;th.classList.remove('drag');
    th.style.transition='transform .42s cubic-bezier(.32,1.75,.5,1), background .3s';
    const cx=e.changedTouches?e.changedTouches[0].clientX:0,b=[...bar.querySelectorAll('.nb')],i=idxAt(cx),nt=b[i].dataset.t;
    if(nt!==tab)go(nt);else{th._x=b[i].offsetLeft;th.style.transform='translateX('+b[i].offsetLeft+'px)';}};
  bar.addEventListener('touchend',rel2,{passive:true});
  bar.addEventListener('touchcancel',()=>{on=false;th.classList.remove('drag');placeThumb();},{passive:true});
}
function go(t){
  if(t===tab){
    if(t==='today')focusToday('smooth');
    else if(t==='cal'){calM=new Date();$('#scroll').scrollTop=0;paint();}
    else $('#scroll').scrollTo({top:0,behavior:'smooth'});
    return;}
  const order=['today','cal','subj'],dir=order.indexOf(t)>order.indexOf(tab)?1:-1;
  _anim=true;const v=$('#view');
  v.style.transition='transform .17s ease-in,opacity .17s ease-in';
  v.style.transform='translateX('+(-dir*28)+'px)';v.style.opacity='0';
  setTimeout(()=>{tab=t;$('#scroll').scrollTop=0;paint();
    playHomeMascot();                       // 탭을 옮길 때마다 캐릭터가 한 번 움직인다
    if(t==='today')requestAnimationFrame(()=>{focusToday();});
    v.style.transition='none';v.style.transform='translateX('+(dir*28)+'px)';v.style.opacity='0';
    requestAnimationFrame(()=>{v.style.transition='transform .32s cubic-bezier(.3,1.1,.4,1),opacity .3s';
      v.style.transform='translateX(0)';v.style.opacity='1';setTimeout(()=>{_anim=false;},320);});},170);
  buzz(8);
}
function moveMonth(n){calM=new Date(calM.getFullYear(),calM.getMonth()+n,1);paint();}
function toggle24(){const ds=TODAY();if(setDateViewMode(ds)){paint();toast(is24(ds)?L.view24:L.viewSched);}}
function toggleDone(id){const t=DB.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;buzz(9);save();refresh();}
function carryAction(id,action){
  const prev=addDays(TODAY(),-1),t=DB.tasks.find(x=>x.id===id&&x.date===prev&&!x.done);if(!t)return;
  if(action==='done'){
    t.done=true;
  }else if(action==='delete'||action==='move'){
    const oldDate=t.date,oldBand=t.min!=null?(autoSlotBand(t)||bandAt(t.date,t.min)):null;
    addRepException(t);
    if(action==='delete')DB.tasks=DB.tasks.filter(x=>x.id!==t.id);
    else{
      const ord=DB.tasks.filter(x=>x.date===TODAY()&&x.min==null).length;
      Object.assign(t,{date:TODAY(),min:null,dur:null,autoSlot:null,ord,done:false,repId:null});
    }
    if(oldBand){if(oldBand.auto)splitAutoSlot(oldDate,oldBand,true);else splitBand(oldDate,oldBand,true);}
  }else return;
  save();buzz(10);paint();
  toast(action==='done'?L.carryDone:action==='delete'?L.carryDeleted:L.carryMoved);
}
function refresh(){
  if(popDate&&$('#sheet').classList.contains('on')&&$('#popbody')){
    // #popbody 는 그대로 두고 안쪽만 다시 그린다. 제스처는 위임이라 다시 붙일 필요가 없다.
    $('#popbody').innerHTML=renderDay(popDate);
    $('#topin').innerHTML=topHTML();
  }else paint();
}
function quickAdd(){
  if(tab==='subj'){editSubject(null);return;}
  if(tab==='cal'){openDay(TODAY());return;}
  newTask(TODAY(),null);
}
/* ═════ 11. 그리드 조작 — 이동 / 크기 / 경계 / 미배정 끌어놓기 ═════ */
const GD={on:false,endedAt:0};
/* 손가락은 가만히 눌러도 몇 px 흔들린다. 이 값보다 적게 움직이면 탭, 넘으면 끌기다.
   너무 작으면 선택된 일정을 다시 눌러 수정하려 할 때마다 끌기로 새어 나간다. */
const TAP_SLOP=12;
/* 꾹 누르기로 인정하는 시간. 이보다 짧으면 탭이다. */
const LONG_MS=300;
/* 두 번째 탭이 이 안에 들어와야 수정이다. 느리게 두 번 누른 건 아무 일도 아니다. */
const DBL_MS=320;
/* 제스처
   · 꾹 눌러 끌기        → 이동. 미배정 칩도 같다. 잡히는 순간 카드가 떠오르고 진동한다
   · 빠르게 두 번 톡톡    → 수정
   · 경계 토글 꾹 눌러 끌기 → 맞닿은 두 일의 경계를 민다(총 길이는 그대로).
                          맞닿은 게 없으면 그 일의 끝만 움직인다
   · 미배정 위로 끌면     → 미배정으로 되돌린다
   선택해 두고 뭘 하는 방식은 없다. 한 번 누르는 것으로는 아무 일도 일어나지 않는다. */
function bindGrid(root){
  // 한 노드에 딱 한 번만 붙인다. _b 를 되돌려 다시 부르면 같은 노드에 리스너가 겹쳐
  // 완료 토글이 짝수 번 실행되고(= 아무 일도 안 일어난다) 리스너가 배로 불어난다.
  if(!root||root._b)return;root._b=true;
  const grid=()=>root.querySelector('.grid');
  const unbar=()=>root.querySelector('.unbar');
  const dateOf=()=>{const g=grid();return g?g.dataset.date:TODAY();};
  const scroller=()=>root.closest('#sheet')||document.getElementById('scroll');
  const tag=document.getElementById('ptag');
  // 화면을 그린 timeMap 과 손가락 좌표가 갈라지지 않게 제스처가 시작될 때마다 다시 잡는다.
  // 짧은 일정이 하나 생기면 그 아래 구간의 배율이 통째로 바뀌므로 바인딩 시점 값을 붙들면 안 된다.
  // 한 번의 드래그 안에서는 다시 그리지 않으니 제스처 도중에는 그대로 쓴다.
  let map=timeMap(dateOf());
  let mode=null,el=null,tid=null,sy=0,sx=0,moved=0,blocked=false,virtualDoneId=null,ghost=null;
  let baseS=0,baseD=0,nextT=null,nextBase=0,curS=0,curD=0,overUn=false,prevBand=null,dropBand=null,dropIndex=null;
  // 꾹 누르기 대기 상태와 직전 탭. 둘 다 이 그리드 안에서만 산다.
  let pending=null,pressTimer=null,bndEl=null,lastTapId=null,lastTapAt=0,unGhost=null,unIndex=null,lifted=null;

  const relAt=cy=>{const r=grid().getBoundingClientRect();
    return map.min(cy-r.top);};
  // 짧은 일정은 실제 시간 높이를 유지하고, 손가락 좌표만 가까운 일정에 매칭한다.
  const pickAt=(cx,cy)=>{
    const g=grid();if(!g)return null;
    const r=g.getBoundingClientRect();
    if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return null;
    const py=cy-r.top,pad=22;
    const hits=gridItems(dateOf()).filter(it=>py>=map.y(it.s)-pad&&py<=map.y(it.e)+pad);
    hits.sort((a,b)=>{
      const da=Math.abs(py-(map.y(a.s)+map.y(a.e))/2),db=Math.abs(py-(map.y(b.s)+map.y(b.e))/2);
      if(Math.abs(da-db)>.01)return da-db;
      return (a.t.ord||0)-(b.t.ord||0);});
    return hits[0]||null;};
  const inDoneZone=(cx)=>{const r=grid().getBoundingClientRect();return cx>=r.right-44;};
  const showTag=(txt,cy)=>{
    tag.textContent=txt;tag.classList.add('on');
    const r=tag.getBoundingClientRect(),g=grid().getBoundingClientRect();
    tag.style.left=Math.max(8,Math.min(window.innerWidth-r.width-8,g.left+g.width/2-r.width/2))+'px';
    tag.style.top=Math.max(8,cy-64)+'px';};
  const paintEl=(sMin,dMin)=>{
    if(!el)return;
    const top=map.y(sMin),h=Math.max(MIN_EVENT_PX,map.y(Math.min(1440,sMin+dMin))-top);
    el.style.top=top+'px';el.style.height=h+'px';
    el.classList.toggle('sm',h<40);
    const lab=el.querySelector('.evtime');
    if(lab)lab.textContent=hhmm(abs(sMin))+'~'+hhmm(abs(sMin+dMin));
    const m=el.querySelector('.evm');
    if(m)m.textContent=hhmm(abs(sMin))+'~'+hhmm(abs(sMin+dMin))+' \u00b7 '+durTxt(dMin);};
  const ensureGhost=()=>{
    if(ghost)return ghost;
    const task=DB.tasks.find(x=>x.id===tid),sj=task&&task.subj?subjOf(task.subj):null;
    ghost=document.createElement('div');ghost.className='ev dropghost';
    ghost.innerHTML='<div class="evb"><div class="evtitle"><div class="evt">'+esc(task?task.title:'')+'</div>'+
      (sj?'<span class="evcat"><i style="background:'+sj.color+'"></i><b>'+esc(sj.name)+'</b></span>':'')+'</div><div class="evm"></div></div>';
    grid().appendChild(ghost);return ghost;};
  /* 미배정으로 갈 때도 칸만 밝히지 않는다. 진짜 칩과 똑같이 생긴 미리보기를
     목록 안 실제로 끼어들 자리에 넣어, 어떤 모양으로 어디에 들어가는지 보여준다. */
  const paintUnGhost=cy=>{
    const row=root.querySelector('.unrow');if(!row)return;
    if(!unGhost){
      const task=DB.tasks.find(x=>x.id===tid);if(!task)return;
      const box=document.createElement('div');
      box.innerHTML=uchipHTML(task,' dropghost');
      unGhost=box.firstElementChild;unGhost.removeAttribute('data-id');
      row.classList.add('hasghost');row.appendChild(unGhost);}
    // 손가락 높이로 끼어들 자리를 정한다
    const rows=[].slice.call(row.querySelectorAll('.uchip')).filter(c=>c!==unGhost&&c!==el);
    let idx=rows.length;
    for(let i=0;i<rows.length;i++){
      const rr=rows[i].getBoundingClientRect();
      if(cy<rr.top+rr.height/2){idx=i;break;}}
    unIndex=idx;
    const before=rows[idx]||null;
    if(unGhost.nextElementSibling!==before||unGhost.parentElement!==row)row.insertBefore(unGhost,before);};
  const paintGhost=(sMin,dMin)=>{
    const g=ensureGhost(),top=map.y(sMin),h=Math.max(MIN_EVENT_PX,map.y(Math.min(1440,sMin+dMin))-top);
    g.style.top=top+'px';g.style.height=h+'px';g.style.left='3px';g.style.right='3px';
    g.classList.toggle('sm',h<40);
    const m=g.querySelector('.evm');if(m)m.textContent=hhmm(abs(sMin))+'~'+hhmm(abs(sMin+dMin))+' \u00b7 '+durTxt(dMin);};
  const cancelPress=()=>{clearTimeout(pressTimer);pressTimer=null;pending=null;};
  /* 미배정 칩을 목록 밖으로 꺼내 레일 위에 띄운다. 지금 자리 그대로 두되
     기준만 .unbar 로 바꾸므로 눈에는 제자리에서 떠오른 것으로 보인다. */
  const liftOut=chip=>{
    const bar=unbar();if(!bar||!chip)return;
    const r=chip.getBoundingClientRect(),br=bar.getBoundingClientRect();
    chip.style.width=Math.round(r.width)+'px';
    chip.style.left=Math.round(r.left-br.left)+'px';
    chip.style.top=Math.round(r.top-br.top)+'px';
    lifted=chip;};
  /* 꺼낸 그 칩만 되돌린다. 아무 요소나 되돌리면 안 된다 — 배정 카드의
     top·height 는 인라인 스타일이라, 지우는 순간 카드가 그리드 맨 위로
     날아가 화면에서 사라진 것처럼 보인다. */
  const dropIn=()=>{
    if(!lifted)return;
    lifted.style.width='';lifted.style.left='';lifted.style.top='';lifted=null;};
  /* 꾹 누르는 동안은 아무 일도 없다가, 시간을 채우면 그때 잡힌다.
     잡힌 티를 내야 한다 — 카드는 떠오르고 경계 토글은 두꺼워지고 진동이 온다. */
  const startPress=m=>{
    cancelPress();pending=m;
    pressTimer=setTimeout(()=>{
      pressTimer=null;
      if(!pending||!el||blocked){pending=null;return;}
      mode=pending;pending=null;GD.on=true;
      if(mode==='rb'){el.classList.add('act');if(bndEl)bndEl.classList.add('hot');}
      else{
        if(mode==='new')liftOut(el);
        el.classList.add('act','lift');}
      buzz(18);
    },LONG_MS);};
  const clearAll=()=>{
    cancelPress();
    if(el)el.classList.remove('act','dragging','lift');
    dropIn();
    if(bndEl)bndEl.classList.remove('hot');
    if(ghost){ghost.remove();ghost=null;}
    if(unGhost){const r=unGhost.parentElement;unGhost.remove();unGhost=null;
      if(r)r.classList.remove('hasghost');}
    unIndex=null;
    const u=unbar();if(u)u.classList.remove('tgt');
    tag.classList.remove('on');
    mode=null;el=null;tid=null;bndEl=null;nextT=null;overUn=false;prevBand=null;dropBand=null;dropIndex=null;blocked=false;virtualDoneId=null;
    GD.on=false;GD.endedAt=Date.now();};
  // 두 번째 탭이면 뒤따라올 유령 click 을 미리 막는다. 이게 없으면 방금 열린
  // 수정 시트 위의 스크림에 그 click 이 떨어져 시트가 곧바로 닫힌다.
  const dblArmed=id=>id&&lastTapId===id&&Date.now()-lastTapAt<=DBL_MS;
  const inUnbar=(cx,cy)=>{const u=unbar();if(!u)return false;
    const r=u.getBoundingClientRect();
    return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom;};
  const autoScroll=cy=>{
    if(overUn)return;                       // 미배정 바 위에선 스크롤하지 않는다
    const S=scroller(),r=S.getBoundingClientRect();
    let v=0;
    if(cy<r.top+70)v=-Math.min(13,(r.top+70-cy)/5);
    else if(cy>r.bottom-110)v=Math.min(13,(cy-(r.bottom-110))/5);
    if(v)S.scrollTop+=v;};

  root.addEventListener('touchstart',e=>{
    map=timeMap(dateOf());
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=0;virtualDoneId=null;
    cancelPress();
    if(e.target.closest('.evck,.uck')){
      blocked=true;mode=null;el=null;tid=null;bndEl=null;dropIndex=null;
      return;}
    blocked=false;bndEl=null;
    const bnd=e.target.closest('.bnd');
    let ev=e.target.closest('.ev');
    const uc=e.target.closest('.uchip');

    // 실제 카드 밖을 눌러도 22px 안의 가장 가까운 일정이 잡힌다.
    if(!bnd&&!ev&&!uc){
      const picked=pickAt(t.clientX,t.clientY);
      if(picked){
        ev=root.querySelector('.ev[data-id="'+picked.t.id+'"]');
        if(inDoneZone(t.clientX)){
          virtualDoneId=picked.t.id;blocked=true;
          mode=null;el=null;tid=null;dropIndex=null;
          return;}}}

    if(bnd){                                  // 경계 토글 — 꾹 누르면 경계가 잡힌다
      const ds=dateOf(),task=DB.tasks.find(x=>x.id===bnd.dataset.a);if(!task||task.min==null)return;
      bndEl=bnd;el=root.querySelector('.ev[data-id="'+task.id+'"]');tid=task.id;
      baseS=rel(task.min);baseD=Math.max(SNAP,taskDur(task,ds));curS=baseS;curD=baseD;
      prevBand=autoSlotBand(task);
      nextT=bnd.dataset.b?(DB.tasks.find(x=>x.id===bnd.dataset.b)||null):null;
      if(nextT)nextBase=Math.max(SNAP,taskDur(nextT,ds));
      startPress('rb');
      // 토글은 카드 아래 모서리를 덮는다. 짧게 누르면 그 아래 일정의 탭으로 넘긴다.
      if(dblArmed(tid)&&e.cancelable)e.preventDefault();
      return;}

    if(uc){
      el=uc;tid=uc.dataset.id;prevBand=null;
      const task=DB.tasks.find(x=>x.id===tid);
      baseD=task&&task.dur?task.dur:60;curD=baseD;
      startPress('new');
      if(dblArmed(tid)&&e.cancelable)e.preventDefault();
      return;}

    if(ev){
      const ds=dateOf(),task=DB.tasks.find(x=>x.id===ev.dataset.id);if(!task)return;
      el=ev;tid=task.id;
      baseS=rel(task.min);baseD=Math.max(SNAP,taskDur(task,ds));curS=baseS;curD=baseD;
      prevBand=autoSlotBand(task)||bandAt(ds,task.min);
      startPress('move');

    const ds=dateOf(),r=relAt(t.clientY);

    if(mode==='move'||mode==='new'){
      overUn=inUnbar(t.clientX,t.clientY);
      const u=unbar();if(u)u.classList.toggle('tgt',overUn);
      autoScroll(t.clientY);
      if(overUn){
        if(ghost){ghost.remove();ghost=null;}
        paintUnGhost(t.clientY);
        showTag(L.dropToUn,t.clientY);return;}
      if(unGhost){const rw=unGhost.parentElement;unGhost.remove();unGhost=null;unIndex=null;
        if(rw)rw.classList.remove('hasghost');}
      const task=DB.tasks.find(x=>x.id===tid),point=placeSnap(r);
      let d=(task&&task.autoSlot!=null)?60:baseD,sM=placeSnap(r-d/2);
      dropBand=null;
      const b=bandAt(ds,abs(point));           // 학교 시간표면 쉬는시간까지 모든 칸에 맞춘다
      if(b){
        const others=DB.tasks.filter(x=>x.date===ds&&x.id!==tid&&x.min!=null&&x.min>=b.s&&x.min<b.e)
          .sort((a,c)=>a.min-c.min||(a.ord||0)-(c.ord||0));
        const raw=abs(point),n=others.length+1;
        dropIndex=Math.max(0,Math.min(others.length,Math.floor(((raw-b.s)/(b.e-b.s))*n)));
        const each=Math.max(SNAP,snap((b.e-b.s)/n));
        const sAbs=Math.min(b.e-SNAP,b.s+each*dropIndex);
        sM=rel(sAbs);d=dropIndex===n-1?Math.max(SNAP,b.e-sAbs):each;
      }else if(is24(ds)&&(baseD===60||(task&&task.autoSlot!=null))){
        let slot=weekendSlotAt(ds,point,tid);
        if(!slot){const ss=Math.max(0,Math.min(1380,placeSnap(r-30)));
          const candidate={id:'auto'+ss,s:ss,e:ss+60,auto:true};
          if(autoSlotClean(ds,candidate,tid))slot=candidate;}
        if(slot){
          dropBand=slot;
          const others=autoSlotMembers(ds,slot).filter(x=>x.id!==tid)
            .sort((a,c)=>rel(a.min)-rel(c.min)||(a.ord||0)-(c.ord||0));
          const n=others.length+1;
          dropIndex=Math.max(0,Math.min(others.length,Math.floor(((point-slot.s)/60)*n)));
          const each=Math.max(SNAP,Math.floor((60/n)/SNAP)*SNAP);
          sM=Math.min(slot.e-SNAP,slot.s+each*dropIndex);

      return;}
    // 꾹 눌러 잡기만 하고 손가락을 움직이지 않았다. 어디로도 옮기지 않는다.
    // (이걸 빼면 도착 좌표가 정해지지 않은 채 커밋돼 엉뚱한 시각에 놓인다)
    if(moved<=TAP_SLOP){clearAll();refresh();return;}
    const ds=dateOf(),task=DB.tasks.find(x=>x.id===tid);
    const leftBand=prevBand;
    if(task){
      if((mode==='move'||mode==='new')&&overUn){
        task.min=null;task.dur=null;task.autoSlot=null;
        // 미리보기가 서 있던 자리에 그대로 끼워 넣는다
        const list=DB.tasks.filter(x=>x.date===ds&&x.min==null&&x.id!==task.id)
          .sort((a,b)=>(a.ord||0)-(b.ord||0));

        list.forEach((x,i)=>{x.ord=i;});

        if(mode==='rb')clearAutoSlot(ds,leftBand);

        if(dropBand&&(mode==='move'||mode==='new')){
          task.autoSlot=dropBand.s;splitAutoSlot(ds,dropBand,false,task.id,dropIndex);
        }else if(b&&(mode==='move'||mode==='new')){
          task.autoSlot=null;splitBand(ds,b,false,task.id,dropIndex);
        }else task.autoSlot=null;
        /* 칸 나누기는 그 칸에서 시작하는 일만 센다. 옆 칸에서 늘어나 걸쳐 있는 일은
           세지 못해 새로 놓은 일 위에 그대로 덮인다. 놓은 뒤 한 번 정리해 그 꼬리를 자른다. */
        resolveOverlaps(ds,task.id);}
      // 원래 칸을 떠나면 남은 일정이 반드시 칸 전체를 다시 채운다.
      // 동적 새벽 1시간 슬롯도 s/e로 비교해야 같은 큰 gap id에 속한 다른 시간을 구분할 수 있다.
      if((mode==='move'||mode==='new')&&leftBand){
        const landed=task.min==null?null:(autoSlotBand(task)||bandAt(ds,task.min));
        if(!sameBand(leftBand,landed)){
          if(leftBand.auto)splitAutoSlot(ds,leftBand,true);
          else splitBand(ds,leftBand,true);}}
      save();buzz(11);
      // 사용법 중에는 '실제로 해냈다'를 이 자리에서 알린다.
      if((mode==='move'||mode==='new')&&!overUn&&task.min!=null)tourSignal('task-placed');
      if(mode==='rb')tourSignal('task-resized');}
    clearAll();refresh();};
  root.addEventListener('touchend',commit);
  root.addEventListener('touchcancel',()=>{clearAll();refresh();});

  root.addEventListener('click',e=>{
    if(e.target.closest('.evck')){

    if(e.target.closest('.uck')){
      const uc=e.target.closest('.uchip');if(uc){e.stopPropagation();toggleDone(uc.dataset.id);}return;}
  });
  /* 손가락은 위에서 다 처리한다. 여기는 마우스로 볼 때뿐이다 —
     터치가 만든 합성 click 은 GD.endedAt 로 걸러 두 번 세지 않게 한다. */
  root.addEventListener('dblclick',e=>{
    if(GD.on||Date.now()-GD.endedAt<500)return;
    const ev=e.target.closest('.ev'),uc=e.target.closest('.uchip');

    if(hit&&hit.dataset.id)openTask(hit.dataset.id);
  });
}
function bindGoalDrag(){
  document.querySelectorAll('.goals').forEach(list=>{
    if(list._b)return;list._b=true;
    let items=[],el=null,y0=0,h=44,from=-1,to=-1,timer=null,active=false;
    const clr=()=>{clearTimeout(timer);timer=null;};
    list.addEventListener('touchstart',e=>{const it=e.target.closest('.gl');if(!it)return;
      y0=e.touches[0].clientY;clr();
      timer=setTimeout(()=>{active=true;el=it;items=[...list.querySelectorAll('.gl')];
        from=items.indexOf(it);to=from;
        h=items.length>1?(items[1].getBoundingClientRect().top-items[0].getBoundingClientRect().top):it.offsetHeight;
        items.forEach(x=>{if(x!==it)x.style.transition='transform .18s cubic-bezier(.3,1.2,.5,1)';});
        it.classList.add('dragging');buzz(12);},240);},{passive:true});
    list.addEventListener('touchmove',e=>{
      if(!active){if(Math.abs(e.touches[0].clientY-y0)>8)clr();return;}
      if(e.cancelable)e.preventDefault();
      const dy=e.touches[0].clientY-y0;
      el.style.transform='translateY('+dy+'px) scale(1.02)';
      to=Math.max(0,Math.min(items.length-1,from+Math.round(dy/h)));
      items.forEach((it,i)=>{if(it===el)return;let s=0;
        if(from<to&&i>from&&i<=to)s=-h;else if(from>to&&i>=to&&i<from)s=h;
        it.style.transform=s?'translateY('+s+'px)':'';});},{passive:false});
    const end=()=>{clr();if(!active)return;active=false;
      const s=subjOf(list.dataset.sid),ids=items.map(x=>x.dataset.gid);
      el.classList.remove('dragging');items.forEach(x=>{x.style.transition='';x.style.transform='';});
      if(to!==from&&s){const mv=ids.splice(from,1)[0];ids.splice(to,0,mv);
        s.goals=ids.map(id=>s.goals.find(g=>g.id===id)).filter(Boolean);save();paint();}
      el=null;};
    list.addEventListener('touchend',end);list.addEventListener('touchcancel',end);});
}

/* 시트는 바깥 빈 곳을 눌러 닫을 수도 있고, 맨 위 손잡이를 잡아 아래로 끌어내려도 닫힌다.
   시트 자체가 스크롤 영역이므로 스크롤과 헷갈리지 않게 조건을 좁게 잡는다.
   · 손잡이(넓힌 ::before 포함)에서 시작한 터치만 후보로 본다
   · 이미 아래로 스크롤한 상태(scrollTop>0)면 손잡이가 화면 밖이라 애초에 잡히지 않는다
   · 가로로 더 움직이거나 위로 올리면 즉시 손을 떼 스크롤에 맡긴다
   · 아래로 8px 넘게 내려야 비로소 끌어내리기로 확정한다 */
function bindSheetDrag(el,close,scrim){
  if(!el||el._sd)return;el._sd=true;
  let y0=0,x0=0,on=false,armed=false,dy=0,gen=0;
  const sc=()=>$(scrim);
  const clear=()=>{el.style.transition='';el.style.transform='';el.classList.remove('dragging-sheet');
    const c=sc();if(c)c.style.opacity='';on=false;armed=false;dy=0;};
  el.addEventListener('touchstart',e=>{
    if(!e.target.closest('.grab')||el.scrollTop>0||e.touches.length>1){armed=false;return;}
    const t=e.touches[0];y0=t.clientY;x0=t.clientX;armed=true;on=false;dy=0;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!armed)return;
    const t=e.touches[0],ddy=t.clientY-y0,ddx=t.clientX-x0;
    if(!on){
      if(Math.abs(ddx)>Math.abs(ddy)){armed=false;return;}   // 가로 이동 — 넘긴다
      if(ddy<-4){armed=false;return;}                        // 위로 올림 — 스크롤이다
      if(ddy<8)return;                                       // 아직 탭인지 끌기인지 모른다
      on=true;el.style.transition='none';el.classList.add('dragging-sheet');buzz(9);
    }
    dy=Math.max(0,ddy);
    if(e.cancelable)e.preventDefault();
    el.style.transform='translateY('+dy+'px)';
    const c=sc();if(c)c.style.opacity=String(Math.max(0,1-dy/Math.max(160,el.offsetHeight)));
  },{passive:false});
  const end=()=>{
    if(!on){armed=false;return;}
    const g=++gen,far=dy>Math.min(130,Math.max(70,el.offsetHeight*.24));
    on=false;armed=false;
    if(far){
      el.style.transition='transform .24s cubic-bezier(.32,.72,0,1)';
      el.style.transform='translateY(110%)';
      // 닫은 뒤에 인라인 값을 지운다. CSS 도 같은 translateY(110%) 라 되튀지 않는다.
      setTimeout(()=>{if(g!==gen)return;close();clear();},200);
    }else{
      el.style.transition='transform .3s cubic-bezier(.32,1.12,.45,1)';
      el.style.transform='';el.classList.remove('dragging-sheet');
      const c=sc();if(c)c.style.opacity='';dy=0;
      setTimeout(()=>{if(g===gen)el.style.transition='';},300);
    }};
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
}

function setSubj(s){readTitle();_ed.subj=s;taskSheet();}
function setRep(f){readTitle();
  if(!f)_ed.rep=null;
  else _ed.rep={freq:f,weekdays:[parseD(_ed.date).getDay()],interval:2,start:_ed.date,end:''};
  taskSheet();}
function togDow(i){readTitle();const d=_ed.rep.weekdays,k=d.indexOf(i);
  if(k>=0){if(d.length>1)d.splice(k,1);}else d.push(i);taskSheet();}
function bumpN(x){readTitle();_ed.rep.interval=Math.max(1,Math.min(60,_ed.rep.interval+x));taskSheet();}
function copyTask(){
  readTitle();const e=_ed;if(!e.id)return;
  const title=e.title.trim();if(!title){toast(L.needTaskName);return;}
  const date=e.date||TODAY();
  const ord=DB.tasks.filter(x=>x.date===date&&x.min==null).length;
  DB.tasks.push({id:uid(),title,date,min:null,dur:null,ord,done:false,subj:e.subj||null,repId:null});
  save();finishTaskSheet();
  toast(L.copiedToUn);
}
function saveTask(){
  readTitle();const e=_ed;
  if(!e.title.trim()){toast(L.needTaskName);return;}
  const mkRule=()=>({id:e.repId||uid(),title:e.title.trim(),freq:e.rep.freq,
    weekdays:e.rep.weekdays.slice(),interval:e.rep.interval,
    start:e.rep.start||e.date,end:e.rep.end||'',min:e.min,dur:e.dur,subj:e.subj,
    mode24:is24(e.date),ex:[]});
  if(e.id){
    const t=DB.tasks.find(x=>x.id===e.id);if(!t)return;
    Object.assign(t,{title:e.title.trim(),min:e.min,
      dur:e.min==null?null:(e.dur!=null?e.dur:bandLen(e.date,e.min)),subj:e.subj});
    if(e.rep){
      const old=e.repId?DB.repeats.find(r=>r.id===e.repId):null;
      if(old){const ex=old.ex||[];Object.assign(old,mkRule(),{ex});
        DB.tasks=DB.tasks.filter(x=>!(x.repId===old.id&&x.date>e.date));}
      else{const r=mkRule();DB.repeats.push(r);t.repId=r.id;}
    }else if(e.repId){
      DB.repeats=DB.repeats.filter(r=>r.id!==e.repId);
      DB.tasks.forEach(x=>{if(x.repId===e.repId)x.repId=null;});}
  }else{
    if(e.rep){const r=mkRule();DB.repeats.push(r);}
    else{
      const sibs=DB.tasks.filter(x=>x.date===e.date&&(x.min==null)===(e.min==null));
      const nid=uid();
      DB.tasks.push({id:nid,title:e.title.trim(),date:e.date,min:e.min,
        dur:e.min==null?null:(e.dur!=null?e.dur:bandLen(e.date,e.min)),
        ord:sibs.length,done:false,subj:e.subj,repId:null});
      tourMade('task',nid);}}
  materializeWindow();save();finishTaskSheet();
  toast(e.id?L.edited:L.added);tourSignal(e.id?'task-edited':'task-saved');
}
function delTask(all){
  const t=DB.tasks.find(x=>x.id===_ed.id);if(!t)return;
  if(all&&t.repId){
    DB.repeats=DB.repeats.filter(r=>r.id!==t.repId);
    DB.tasks=DB.tasks.filter(x=>x.repId!==t.repId);
  }else{
    addRepException(t);
    const b=t.min!=null?(autoSlotBand(t)||bandAt(t.date,t.min)):null;
    DB.tasks=DB.tasks.filter(x=>x.id!==t.id);
    if(b){if(b.auto)splitAutoSlot(t.date,b,true);else splitBand(t.date,b,true);}}
  save();finishTaskSheet();
  toast(all?L.delAllRepDone:L.deleted);
}

/* ═════ 13. 과목·디데이·목표 ═════ */
let _sj={};
/* 사용법에서는 직접 타이핑하는 게 포인트가 아니라 만들어 보고 옮겨 보는 경험이
   포인트다. 그래서 사용법 중에 새로 만들 때만 이름을 미리 채워 둔다. */
/* 사용법에서 만든 것은 예시일 뿐이라 끝나면 지운다. 남겨 두면 진짜 계획과 섞인다.
   사용법 중에 새로 만든 것만 기억해 둔다 — 원래 있던 것은 건드리지 않는다. */
let _tourMade=null;
/* '사용법을 실제로 보고 있는 중'은 시작 질문에 답한 뒤부터 끝내기 전까지다.
   `_tourActive`는 시작 질문이 떠 있을 때와 캐릭터가 날아가는 동안에도 서 있어서,
   그것만 보면 사용법을 고르지 않은 사람에게도 예시 이름이 들어간다. */
function tourRunning(){return _tourActive&&!_tourIntro&&!_tourLanding;}
function tourMadeReset(){_tourMade={task:[],subj:[],dday:[]};}
function tourMade(kind,id){if(_tourMade&&id&&tourRunning())_tourMade[kind].push(id);}
function clearTourSamples(){
  const m=_tourMade;_tourMade=null;
  if(!m||!(m.task.length||m.subj.length||m.dday.length))return false;
  if(m.task.length)DB.tasks=DB.tasks.filter(t=>m.task.indexOf(t.id)<0);
  if(m.dday.length)DB.subjects.forEach(s=>{s.ddays=(s.ddays||[]).filter(d=>m.dday.indexOf(d.id)<0);});
  if(m.subj.length){
    DB.subjects=DB.subjects.filter(s=>m.subj.indexOf(s.id)<0);
    DB.tasks.forEach(t=>{if(t.subj&&m.subj.indexOf(t.subj)>=0)t.subj=null;});}
  save();return true;
}
function tourSample(kind){
  if(!tourRunning())return '';
  // 지금 안내하는 단계가 그걸 만들라는 단계일 때만 채운다.
  const s=TOUR_STEPS[_tourStep];
  if(!s||s.id!==kind)return '';
  if(kind==='goal')return L.sampleGoal;
  if(kind==='dday')return L.sampleDday;
  const n=tasksOf(TODAY()).filter(t=>t.min==null).length;
  return L.sampleTasks[Math.min(n,L.sampleTasks.length-1)];
}
function editSubject(id){const s=id?subjOf(id):null;
  _sj=s?{id:s.id,name:s.name,color:s.color}:{id:null,name:tourSample('goal'),color:PALETTE[DB.subjects.length%PALETTE.length]};
  sjSheet();}
function sjSheet(){

  let h='<div class="sh2">'+esc(s.id?L.catEdit:L.catNew)+'</div>'+

    PALETTE.map(c=>'<button class="sw'+(s.color===c?' on':'')+'" style="background:'+c+'" onclick="setSjColor(\''+c+'\')"></button>').join('')+'</div>'+
    '<div class="row2"><button class="btn p" onclick="saveSubject()">'+esc(L.save)+'</button></div>';
  if(s.id)h+='<div class="row2"><button class="btn d" onclick="delSubject()">'+esc(L.catDel)+'</button></div>';

function setSjColor(c){const i=$('#f_sname');if(i)_sj.name=i.value;_sj.color=c;sjSheet();}
function saveSubject(){

function delSubject(){

let _dd={};

/* ═════ 14. 요일별 시간표 ═════ */
function daysText(days){
  const a=days.slice().sort((x,y)=>x-y);
  if(!a.length)return L.noDays;
  if(a.length===7)return L.everyDay;
  if(a.length===5&&[1,2,3,4,5].every(x=>a.includes(x)))return L.weekdays;
  if(a.length===2&&a.includes(0)&&a.includes(6))return L.weekends;
  return a.map(i=>DOW[i]).join(' · ');
}
/* 카드 본문을 누르면 고르기만 하고, 실제 수정은 오른쪽 '수정' 버튼으로만 연다. */
let _schedSel=null;
function selectSchedRow(id){_schedSel=(_schedSel===id?null:id);openScheduleSettings();}
function schedRowHTML(x,i){
  const rowId='schedRow-'+x.id,days=setDays(x),blocks=setBlocks(x);
  const dayTxt=days.length?days.map(d=>DOW[d]).join('·'):L.noDays;
  const sub=dayTxt+' · '+L.blockCount(blocks.length)+(setEdited(x)&&x.kind?' · '+L.editedMark:'');
  return '<div class="schedrow'+(days.length?'':' off')+(_schedSel===rowId?' sel':'')+'" id="'+rowId+'"'+
    (i===0?' data-first="1"':'')+'>'+
    '<button class="schedsum" onclick="selectSchedRow(\''+rowId+'\')">'+
    '<div><b>'+esc(setName(x))+'</b><span>'+esc(sub)+'</span></div></button>'+
    '<button class="schedbadge" onclick="editSchedSet(\''+x.id+'\')">'+esc(L.edit)+'</button></div>';
}
function openScheduleSettings(){
  const sets=schedSets();
  const used={};sets.forEach(x=>setDays(x).forEach(d=>{used[d]=1;}));
  const wide=DOW.map((d,i)=>used[i]?null:d).filter(d=>d!=null);
  const addBtn='<div class="row2"><button class="btn s" onclick="editSchedSet(null)">'+esc(L.schedAdd)+'</button></div>';
  openSheet('<div class="sh2">'+esc(L.schedTitle)+'</div><div class="sheetlead">'+esc(L.schedLead)+'</div>'+
    sets.map(schedRowHTML).join('')+
    '<div class="fullnote">'+(wide.length
      ?esc(L.schedFree)+esc(wide.join(' · '))+'<br>'+esc(L.schedFreeNote)
      :esc(L.defaultSchedNote))+'</div>'+addBtn);
}
let _sched={};
function timeVal(m){if(m===1440)return '00:00';m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function parseTime(v,end){if(!/^\d\d:\d\d$/.test(v||''))return NaN;const a=v.split(':').map(Number),m=a[0]*60+a[1];return end&&m===0?1440:m;}
/* 묶음 하나를 고친다. 저장하면 그 묶음의 내용이 바뀔 뿐, 시간표가 하나 더 생기지 않는다.
   id 가 없으면 이 시간대에 묶음을 하나 더 넣는다. */
function editSchedSet(id){
  const x=id?findSet(id):null;
  _sched=x
    ?{id:x.id,kind:x.kind||null,name:setName(x),days:setDays(x),
      blocks:setBlocks(x).map(b=>({id:uid(),name:b.name,s:b.s,e:b.e})),delArmed:false}
    :{id:null,kind:null,name:'',days:[],
      blocks:[{id:uid(),name:L.firstBlock,s:M(9,0),e:M(10,0)}],delArmed:false};
  scheduleEditor();
}
function syncScheduleForm(){
  const n=$('#schName');if(n&&!_sched.kind)_sched.name=n.value;
  document.querySelectorAll('.blockrow[data-bi]').forEach(row=>{const b=_sched.blocks[Number(row.dataset.bi)];if(!b)return;
    b.name=row.querySelector('.bname').value;b.s=parseTime(row.querySelector('.bstart').value,false);b.e=parseTime(row.querySelector('.bend').value,true);});
}
function scheduleEditor(){
  const seed=!!_sched.kind;
  const head=seed
    ?'<div class="sh2">'+esc(L.defaultEditTitle(_sched.name))+'</div>'
    :'<div class="sh2">'+esc(_sched.id?L.schedSetEdit:L.schedSetNew)+'</div>'+
     '<div class="fl">'+esc(L.schedSetName)+'</div><input class="fi" id="schName" placeholder="'+esc(L.schedSetNamePh)+'" value="'+esc(_sched.name)+'">';
  const h=head+'<div class="sheetlead" style="margin-top:10px">'+esc(L.defaultEditLead)+'</div>'+
    '<div class="fl"><span>'+esc(L.schedDays)+'</span><span><button onclick="setScheduleDays(\'none\')">'+esc(L.clearDays)+'</button></span></div>'+
    '<div class="dws">'+DOW.map((d,i)=>'<button class="dw'+(_sched.days.includes(i)?' on':'')+(i===0?' sun':'')+'" onclick="toggleScheduleDay('+i+')">'+d+'</button>').join('')+'</div>'+
    '<div class="fl">'+esc(L.blocks)+'</div>'+
    _sched.blocks.map((b,i)=>'<div class="blockrow" data-bi="'+i+'"><div class="bnamewrap"><label>'+esc(L.name)+'</label><input class="fi bname" value="'+esc(b.name)+'" placeholder="'+esc(L.blockNamePh)+'"></div>'+
      '<div class="blocktimes"><div><label>'+esc(L.start)+'</label><input class="fi bstart" type="time" step="300" value="'+timeVal(b.s)+'"></div>'+
      '<div><label>'+esc(L.end)+'</label><input class="fi bend" type="time" step="300" value="'+timeVal(b.e)+'"></div></div>'+
      '<button class="blockdel" aria-label="'+esc(L.aBlockDel)+'" onclick="removeScheduleBlock('+i+')">−</button></div>').join('')+
    '<button class="btn s" style="width:100%;margin-top:4px" onclick="addScheduleBlock()">'+esc(L.addBlock)+'</button>'+
    '<div class="row2"><button class="btn p" onclick="saveSchedule()">'+esc(L.save)+'</button></div>'+
    (seed
      ?(setEdited(findSet(_sched.id)||{})?'<div class="row2"><button class="btn d" onclick="resetSchedSet()">'+esc(L.defaultReset)+'</button></div>':'')
      :(_sched.id?'<div class="row2"><button class="btn d" onclick="deleteSchedSet()">'+esc(_sched.delArmed?L.reallyDel:L.setDel)+'</button></div>':''));
  openSheet(h);
}
function toggleScheduleDay(i){syncScheduleForm();const p=_sched.days.indexOf(i);if(p>=0)_sched.days.splice(p,1);else _sched.days.push(i);scheduleEditor();}
function setScheduleDays(){syncScheduleForm();_sched.days=[];scheduleEditor();}
function addScheduleBlock(){
  syncScheduleForm();const last=_sched.blocks.slice().sort((a,b)=>a.e-b.e).pop(),st=last&&Number.isFinite(last.e)?Math.min(1380,last.e+10):M(9,0);
  _sched.blocks.push({id:uid(),name:L.newBlock,s:st,e:Math.min(1440,st+60)});scheduleEditor();
}
function removeScheduleBlock(i){syncScheduleForm();_sched.blocks.splice(i,1);scheduleEditor();}
/* 한 요일은 한 묶음에만 속한다. 새로 가져간 요일은 다른 묶음에서 뺀다. */
function claimDays(days,exceptId){
  schedSets().forEach(x=>{if(x.id!==exceptId)x.days=setDays(x).filter(d=>days.indexOf(d)<0);});
}
function saveSchedule(){
  syncScheduleForm();
  const days=[...new Set(_sched.days)].sort((a,b)=>a-b);
  const name=String(_sched.name||'').trim();
  const blocks=_sched.blocks.map(b=>({id:b.id||uid(),name:String(b.name||'').trim(),s:Number(b.s),e:Number(b.e)})).sort((a,b)=>a.s-b.s);
  if(!_sched.kind&&!name){toast(L.needSetName);return;}
  if(!blocks.length){toast(L.needBlock);return;}
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i];if(!b.name){toast(L.needBlockNames);return;}
    if(!Number.isFinite(b.s)||!Number.isFinite(b.e)||b.s<0||b.e>1440||b.e<=b.s){toast(L.checkTimes);return;}
    if(i&&b.s<blocks[i-1].e){toast(L.overlapping);return;}
  }
  let x=_sched.id?findSet(_sched.id):null;
  if(!x){x={id:uid(),kind:null,name,days:[],blocks:null};schedSets().push(x);}
  claimDays(days,x.id);
  x.days=days;x.blocks=blocks;if(!x.kind)x.name=name;
  save();paint();openScheduleSettings();toast(L.defaultSaved);
  tourSignal('schedule-saved');
}
function resetSchedSet(){
  const x=findSet(_sched.id);if(!x)return;
  const days=x.kind==='weekend'?[0,6]:[1,2,3,4,5];
  claimDays(days,x.id);x.days=days;x.blocks=null;
  save();paint();openScheduleSettings();toast(L.defaultResetDone);
}
function deleteSchedSet(){
  if(!_sched.delArmed){syncScheduleForm();_sched.delArmed=true;scheduleEditor();return;}
  const id=_sched.id;
  schedRoot().sets=schedSets().filter(x=>x.id!==id||x.kind);
  save();paint();openScheduleSettings();toast(L.setDeleted);
}

/* ═════ 15. 화면을 직접 따라가는 사용법 ═════ */
/* 자산 URL에도 캐시 버전을 붙인다. 파일명이 같으면 그림을 바꿔도 옛 파일이 계속 나온다. */
const MASCOT_IDLE='assets/planner-mascot-idle.png?v=67';
const MASCOT_LOOP='assets/planner-mascot-loop.gif?v=67';
const MASCOT_ONCE='assets/planner-mascot-once.gif?v=67';
const MASCOT_CYCLE_MS=5040;
let _homeMascotTimer=null,_homeMascotUntil=0,_homeMascotToken=0;
function mascotHTML(place){
  if(place!=='home')return '';
  const playing=_homeMascotUntil>Date.now();
  return '<button id="mascotHome" class="mascot-home'+(playing?' playing':'')+(_tourActive?' tour-away':'')+'" data-mascot-slot="home" aria-label="'+esc(L.aMascot)+'" onclick="playHomeMascot(true)">'+
    '<img id="mascotHomeImg" src="'+(playing?MASCOT_ONCE:MASCOT_IDLE)+'" alt="'+esc(L.altMascot)+'"></button>';
}
function playHomeMascot(withSay){
  if(_tourActive)return;const home=$('#mascotHome'),img=$('#mascotHomeImg');if(!home||!img)return;
  if(withSay)showMascotSay();else hideMascotSay();
  const token=++_homeMascotToken;_homeMascotUntil=Date.now()+MASCOT_CYCLE_MS;
  clearTimeout(_homeMascotTimer);home.classList.add('playing');img.src=MASCOT_IDLE;
  requestAnimationFrame(()=>{if(token===_homeMascotToken&&document.contains(img))img.src=MASCOT_ONCE;});
  _homeMascotTimer=setTimeout(()=>{if(token!==_homeMascotToken)return;_homeMascotUntil=0;
    const now=$('#mascotHomeImg'),btn=$('#mascotHome');if(now)now.src=MASCOT_IDLE;if(btn)btn.classList.remove('playing');
  },MASCOT_CYCLE_MS+80);
}
/* 헤더 캐릭터를 누르면 재생과 함께 말풍선이 뜨고, 거기서 사용법을 다시 볼 수 있다.

/* 사용법은 짧게, 대신 반드시 해 봐야 넘어간다.
   시간대 만들기만 넘길 수 있고 나머지는 직접 해야 다음으로 간다.
   hintKind 는 강조 상자 말고 어떻게 움직여 보여줄지다 — press(눌러라)/drag(끌어라)/grab(손잡이) */
const TOUR_STEPS=[
  {id:'install',scene:'modal',hintKind:'none',btn:'skip',hint:''},
  // 목록에서는 아무 데도 강조하지 않는다. 수정 버튼에 상자를 씌우면 읽지도 않고 눌러 버린다.
