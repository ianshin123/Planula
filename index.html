<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FAF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>플랜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FAF9F5; --bg2:#FFFFFF; --solid:#FFFFFF;
  --ink:#26221D; --ink2:#6E655A; --ink3:#A79D90;
  --line:rgba(90,75,60,.13); --line2:rgba(90,75,60,.07);
  --ac:#E07A4F; --ac2:#F0A059; --ac-s:rgba(224,122,79,.13); --ac-b:rgba(224,122,79,.34);
  --gd:#D64F4F; --gd-s:rgba(214,79,79,.13);
  --ok:#3F9E6B; --ok-s:rgba(63,158,107,.13);
  --cls:rgba(224,122,79,.055); --gapc:rgba(120,105,88,.035);
  --glass-bg:radial-gradient(150% 100% at 3% -12%, rgba(255,255,255,.9), transparent 44%), linear-gradient(165deg, rgba(255,255,255,.66), rgba(255,255,255,.36));
  --glass-brd:rgba(255,255,255,.72);
  --glass-shadow:0 16px 40px rgba(90,70,50,.13), 0 3px 10px rgba(90,70,50,.08), inset 0 1px 0 rgba(255,255,255,.95), inset 0 10px 24px -12px rgba(255,255,255,.75), inset 0 -14px 28px -16px rgba(120,95,70,.1);
  --glass-blur:blur(22px) saturate(185%) brightness(1.04);
  --r:26px; --r2:19px; --r3:14px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --dockh:78px; --wrap:720px;
}
:root[data-theme="dark"],
:root:not([data-theme="light"]) .dkvars{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191713; --bg2:#221F1A; --solid:#221F1A;
  --ink:#F2EDE5; --ink2:#B0A597; --ink3:#7A7166;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.055);
  --ac:#FF9264; --ac2:#FFB877; --ac-s:rgba(255,146,100,.16); --ac-b:rgba(255,146,100,.4);
  --gd:#FF7A6E; --gd-s:rgba(255,122,110,.16);
  --ok:#4FC98A; --ok-s:rgba(79,201,138,.15);
  --cls:rgba(255,146,100,.07); --gapc:rgba(255,255,255,.02);
  --glass-bg:radial-gradient(150% 100% at 3% -12%, rgba(255,255,255,.09), transparent 44%), linear-gradient(165deg, rgba(255,255,255,.07), rgba(255,255,255,.028));
  --glass-brd:rgba(255,255,255,.13);
  --glass-shadow:0 18px 44px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -14px 30px -18px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#191713; --bg2:#221F1A; --solid:#221F1A;
  --ink:#F2EDE5; --ink2:#B0A597; --ink3:#7A7166;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.055);
  --ac:#FF9264; --ac2:#FFB877; --ac-s:rgba(255,146,100,.16); --ac-b:rgba(255,146,100,.4);
  --gd:#FF7A6E; --gd-s:rgba(255,122,110,.16);
  --ok:#4FC98A; --ok-s:rgba(79,201,138,.15);
  --cls:rgba(255,146,100,.07); --gapc:rgba(255,255,255,.02);
  --glass-bg:radial-gradient(150% 100% at 3% -12%, rgba(255,255,255,.09), transparent 44%), linear-gradient(165deg, rgba(255,255,255,.07), rgba(255,255,255,.028));
  --glass-brd:rgba(255,255,255,.13);
  --glass-shadow:0 18px 44px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -14px 30px -18px rgba(0,0,0,.5);
}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;position:fixed;inset:0;overflow:hidden}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(52% 36% at 6% 0%, rgba(224,122,79,.09), transparent 62%),
             radial-gradient(46% 32% at 100% 10%, rgba(240,160,89,.07), transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:0;height:0}
.glass{background:var(--glass-bg);border:1px solid var(--glass-brd);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}

#app{height:100%;display:flex;flex-direction:column}
#top{padding:calc(var(--st) + 16px) 18px 10px;flex:none}
#topin{max-width:var(--wrap);margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.h1{font-size:31px;font-weight:800;letter-spacing:-.034em;line-height:1.08;display:flex;align-items:center;gap:11px}
.h1 small{display:block;font-size:13.5px;font-weight:650;color:var(--ink3);letter-spacing:-.01em;margin-bottom:4px}
.hbtns{display:flex;gap:9px;align-items:center}
.ib{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:var(--ink2);flex:none}
.ib:active{transform:scale(.9);color:var(--ac)}
.ib svg{width:22px;height:22px}
.ib.on{color:var(--ac);background:var(--ac-s)}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:6px 16px calc(var(--sb) + var(--dockh) + 30px)}
#view{max-width:var(--wrap);margin:0 auto;will-change:transform}

.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:11px;
  padding:6px 14px calc(var(--sb) + 10px);z-index:40;pointer-events:none}
.dock>*{pointer-events:auto}
.dock-bar{display:flex;gap:3px;padding:7px 15px;border-radius:30px;flex:0 1 auto;touch-action:none;
  position:relative;height:66px;box-sizing:border-box;align-items:center}
.dockthumb{position:absolute;top:7px;left:0;height:52px;width:64px;border-radius:19px;z-index:0;pointer-events:none;
  background:var(--ac-s);transition:transform .42s cubic-bezier(.32,1.75,.5,1),width .25s,box-shadow .28s,background .28s;will-change:transform}
.dockthumb.drag{background:linear-gradient(135deg,var(--ac-b),var(--ac-s));
  box-shadow:inset 0 1.6px 0 rgba(255,255,255,.6),0 9px 22px var(--ac-b)}
.nb{width:64px;height:52px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink3);position:relative;z-index:1;transition:color .2s}
.nb svg{width:25px;height:25px}
.nb .lb{font-size:10.5px;font-weight:700;letter-spacing:-.02em}
.nb.on{color:var(--ac)}
.nb.on .lb{font-weight:800}
.nb:active{transform:scale(.9)}
.fab{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:#fff;
  background:var(--ac);box-shadow:0 8px 20px var(--ac-b)}
.fab:active{transform:scale(.9)}
.fab svg{width:27px;height:27px}

.card{border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.ctitle{display:flex;align-items:center;justify-content:space-between;padding:15px 17px 10px;gap:8px}
.ctitle b{font-size:12.5px;font-weight:800;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase}

/* D-day rail */
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x proximity}
.dcard{flex:0 0 auto;min-width:136px;border-radius:20px;padding:13px 15px 14px 18px;scroll-snap-align:start;
  position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.34,1.5,.6,1)}
.dcard:active{transform:scale(.96)}
.dcard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px;
  background:var(--dc);box-shadow:0 0 9px var(--dc)}
.dcard .nm{font-size:12.5px;font-weight:750;color:var(--ink2);display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.dcard .big{font-size:26px;font-weight:850;letter-spacing:-.045em;font-variant-numeric:tabular-nums;margin-top:3px;
  color:var(--dc)}
.dcard .sub{font-size:11px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.dcard.urgent{--dc:var(--gd)!important}
.dcard.urgent .nm::before{content:"⚠ ";color:var(--gd)}

#tt{display:flex;flex-direction:column;gap:7px}
.blk{display:flex;border-radius:var(--r2);overflow:hidden;position:relative;min-height:64px;
  background:var(--gapc);border:1px solid var(--line2);transition:background .16s,box-shadow .16s,transform .16s}
.blk.cls{background:var(--cls);border-color:var(--ac-s);min-height:74px}
.blk.now{border-color:var(--ac-b);box-shadow:0 0 0 2px var(--ac-b) inset}
.blk.tgt{background:var(--ac-s);box-shadow:0 0 0 2.5px var(--ac) inset;transform:scale(1.012)}
.bt{flex:none;width:66px;padding:13px 0 13px 14px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.bt i{font-style:normal;font-size:15px;font-weight:800;color:var(--ink2);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bt s{text-decoration:none;font-size:11.5px;font-weight:650;color:var(--ink3);font-variant-numeric:tabular-nums}
.bb{flex:1;min-width:0;padding:11px 12px 11px 2px;display:flex;flex-direction:column;gap:7px;justify-content:center}
.bh{display:flex;align-items:center;gap:8px;min-height:26px}
.bh b{font-size:14.5px;font-weight:750;color:var(--ink2);letter-spacing:-.02em}
.blk.cls .bh b{color:var(--ink);font-weight:800;font-size:15.5px}
.bh .dur{font-size:11px;font-weight:700;color:var(--ink3);background:var(--line2);padding:2px 8px;border-radius:8px}
.bh .add{margin-left:auto;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;color:var(--ink3);flex:none}
.bh .add:active{background:var(--ac-s);color:var(--ac)}
.bh .add svg{width:17px;height:17px}

.tk{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:var(--r3);
  background:var(--bg2);border:1px solid var(--line);box-shadow:0 2px 6px rgba(90,70,50,.06);
  position:relative;transition:transform .16s cubic-bezier(.3,1.2,.5,1),opacity .16s}
.tk.dragging{opacity:.26}
.tk.done{opacity:.42}
.tk.done .tkt{text-decoration:line-through;color:var(--ink3)}
.ck{width:26px;height:26px;border-radius:9px;border:2.4px solid var(--line);flex:none;display:grid;place-items:center;transition:.16s}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck svg{width:14px;height:14px;color:#fff;opacity:0;transition:.16s}
.ck.on svg{opacity:1}
.tkb{flex:1;min-width:0}
.tkt{font-size:15px;font-weight:650;letter-spacing:-.018em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkm{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.tkm span{font-size:11px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.tkm .sj{padding:2px 7px;border-radius:6px;font-size:10.5px}
.tkm .rp{display:inline-flex;align-items:center;gap:3px;color:var(--ac)}
.tkm .rp svg{width:10px;height:10px}
.gr{width:22px;flex:none;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;opacity:.3}
.gr i{display:block;width:15px;height:1.8px;border-radius:1px;background:var(--ink2)}

#ghost{position:fixed;z-index:200;pointer-events:none;opacity:0;box-shadow:var(--glass-shadow);
  border-radius:var(--r3);transform-origin:center;transition:opacity .12s}
#ghost.on{opacity:1}
.dropline{height:4px;border-radius:2px;background:var(--ac);box-shadow:0 0 10px var(--ac-b);margin:1px 0;flex:none;
  animation:dl .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes dl{from{transform:scaleX(.2);opacity:0}to{transform:scaleX(1);opacity:1}}
#dropinfo{position:fixed;z-index:201;pointer-events:none;opacity:0;transition:opacity .14s;
  background:var(--ac);color:#fff;padding:7px 14px;border-radius:13px;font-size:13px;font-weight:800;
  box-shadow:0 8px 22px var(--ac-b);white-space:nowrap;letter-spacing:-.015em}
#dropinfo.on{opacity:1}
.inbox{display:flex;flex-direction:column;gap:7px;padding:0 14px 15px}
.empty{text-align:center;padding:26px 16px;color:var(--ink3);font-size:13.5px;font-weight:600}

.calh{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
.calh b{font-size:21px;font-weight:800;letter-spacing:-.028em}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow i{font-style:normal;text-align:center;font-size:11.5px;font-weight:800;color:var(--ink3);padding:3px 0}
.dow i.sun{color:var(--gd)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:6px}
.cell{border-radius:15px;background:var(--gapc);border:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;padding-top:7px;gap:3px;position:relative;
  transition:transform .12s,background .16s;min-height:42px;overflow:hidden}
.cell:active{transform:scale(.94)}
.cell.out{opacity:.3}
.cell.today{background:var(--ac-s);border-color:var(--ac-b)}
.dn{font-size:15px;font-weight:750;color:var(--ink2);font-variant-numeric:tabular-nums}
.cell.sun .dn{color:var(--gd)}
.cell.today .dn{color:var(--ac)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.dot{width:5px;height:5px;border-radius:50%;background:var(--ac)}
.cdd{font-size:9px;font-weight:800;color:var(--gd);letter-spacing:-.02em;line-height:1.1;text-align:center}

.sj{border-radius:var(--r);margin-bottom:13px;overflow:hidden}
.sjh{display:flex;align-items:center;gap:11px;padding:16px 17px}
.sjc{width:13px;height:13px;border-radius:50%;flex:none}
.sjh b{font-size:18px;font-weight:800;letter-spacing:-.028em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{display:flex;align-items:center;gap:11px;padding:12px 17px;border-top:1px solid var(--line2)}
.ddn{flex:1;min-width:0;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddd{font-size:11.5px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.ddc{font-size:14.5px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em;flex:none;
  padding:5px 11px;border-radius:11px;background:var(--gd-s);color:var(--gd)}
.ddc.far{background:var(--ac-s);color:var(--ac)}
.ddc.past{background:var(--line2);color:var(--ink3)}
.gl{display:flex;align-items:center;gap:11px;padding:10px 17px 10px 19px}
.gld{width:6px;height:6px;border-radius:50%;background:var(--ink3);flex:none;margin-left:3px}
.glt{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl.dragging{opacity:.3}
.sjf{display:flex;gap:8px;padding:11px 14px 15px}
.mini{flex:1;padding:12px;border-radius:14px;background:var(--line2);color:var(--ink2);
  font-size:13.5px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:5px}
.mini:active{transform:scale(.96);background:var(--ac-s);color:var(--ac)}
.mini svg{width:14px;height:14px}

#scrim{position:fixed;inset:0;z-index:100;background:rgba(30,22,14,.34);opacity:0;pointer-events:none;transition:opacity .3s;
  -webkit-backdrop-filter:blur(5px) saturate(130%);backdrop-filter:blur(5px) saturate(130%)}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;max-width:760px;margin:0 auto;
  background:var(--bg2);border-radius:32px 32px 0 0;box-shadow:var(--glass-shadow);
  transform:translateY(110%);transition:transform .36s cubic-bezier(.32,.72,0,1);
  padding:10px 20px calc(var(--sb) + 22px);max-height:90vh;max-height:90dvh;overflow-y:auto}
#sheet.on{transform:translateY(0)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--ink3);opacity:.45;margin:0 auto 14px}
.sh2{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:16px}
.fl{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;margin:18px 0 8px;
  display:flex;align-items:center;justify-content:space-between}
.fl button{font-size:11.5px;font-weight:800;color:var(--ac);letter-spacing:-.01em;text-transform:none}
.fi{width:100%;padding:15px 16px;border-radius:16px;background:var(--gapc);border:1px solid var(--line);
  font-size:16px;font-weight:600;transition:.16s}
.fi:focus{border-color:var(--ac);background:var(--ac-s)}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.sg{padding:11px 15px;border-radius:14px;background:var(--gapc);border:1px solid var(--line);
  font-size:14px;font-weight:700;color:var(--ink2);transition:.16s}
.sg.on{background:var(--ac);color:#fff;border-color:transparent;box-shadow:0 3px 10px var(--ac-b)}
.dws{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dw{aspect-ratio:1;border-radius:14px;background:var(--gapc);border:1px solid var(--line);
  font-size:15px;font-weight:750;color:var(--ink2);display:grid;place-items:center;transition:.16s}
.dw.on{background:var(--ac);color:#fff;border-color:transparent}
.dw.sun{color:var(--gd)}
.dw.on.sun{color:#fff}
.two{display:flex;gap:9px}
.two>div{flex:1}
.two label{display:block;font-size:11.5px;font-weight:750;color:var(--ink3);margin-bottom:5px}
.tp{display:flex;align-items:center;gap:14px;justify-content:center;padding:8px 0}
.tpb{width:54px;height:54px;border-radius:18px;background:var(--gapc);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink2);font-size:24px;font-weight:700}
.tpb:active{transform:scale(.9);background:var(--ac-s);color:var(--ac)}
.tpv{font-size:36px;font-weight:850;letter-spacing:-.045em;font-variant-numeric:tabular-nums;min-width:140px;text-align:center}
.tpu{font-size:12.5px;font-weight:700;color:var(--ink3);text-align:center;margin-top:-3px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:4px 0}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid transparent;
  box-shadow:0 0 0 1px rgba(0,0,0,.08);transition:transform .18s,box-shadow .18s}
.sw.on{transform:scale(1.14);border-color:var(--solid);box-shadow:0 0 0 4px var(--ac-s),0 0 0 1px rgba(0,0,0,.1)}
.row2{display:flex;gap:9px;margin-top:20px}
.btn{flex:1;padding:16px;border-radius:17px;font-size:15.5px;font-weight:800;letter-spacing:-.018em;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:.16s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--ac);color:#fff;box-shadow:0 4px 14px var(--ac-b)}
.btn.s{background:var(--line2);color:var(--ink2)}
.btn.d{background:var(--gd-s);color:var(--gd)}
.popnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.popt{text-align:center}
.popt .p1{font-size:19px;font-weight:800;letter-spacing:-.03em}
.popt .p2{font-size:12px;font-weight:750;color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + var(--dockh) + 26px);z-index:210;
  transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--bg);
  padding:12px 19px;border-radius:15px;font-size:14px;font-weight:750;letter-spacing:-.015em;
  opacity:0;pointer-events:none;transition:.26s;box-shadow:var(--glass-shadow);white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body ontouchstart="">
<div id="app">
  <div id="top"><div id="topin"></div></div>
  <div id="scroll"><div id="view"></div></div>
</div>
<div class="dock">
  <div class="dock-bar glass" id="navtabs">
    <div class="dockthumb"></div>
    <button class="nb on" data-t="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3.2 2"/></svg><span class="lb">오늘</span></button>
    <button class="nb" data-t="cal" onclick="go('cal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3.4"/><path d="M3 9.4h18M8 2.6v3.8M16 2.6v3.8"/></svg><span class="lb">달력</span></button>
    <button class="nb" data-t="subj" onclick="go('subj')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.2A1.6 1.6 0 0 1 5.6 3.6H19v16.8H5.6A1.6 1.6 0 0 1 4 18.8z"/><path d="M4 16.6h15"/></svg><span class="lb">과목</span></button>
  </div>
  <button class="fab" onclick="quickAdd()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
</div>
<div id="ghost"></div>
<div id="dropinfo"></div>
<div id="scrim" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" style="display:none" onchange="doImport(this)">

<script>
'use strict';
/* ═════ 1. 시간표 ═════ */
const M=(h,m)=>h*60+m;
const CLASSES=[
  ['roll', M(6,50), M(7,15), '점호'],
  ['hr',   M(8,10), M(8,20), '아침조례'],
  ['p1',   M(8,30), M(9,20), '1교시'],
  ['p2',   M(9,30), M(10,20),'2교시'],
  ['p3',   M(10,30),M(11,20),'3교시'],
  ['p4',   M(11,30),M(12,20),'4교시'],
  ['p5',   M(13,30),M(14,20),'5교시'],
  ['p6',   M(14,30),M(15,20),'6교시'],
  ['p7',   M(15,30),M(16,20),'7교시'],
  ['p8',   M(16,50),M(18,0), '8교시'],
  ['ja1',  M(19,10),M(21,0), '야자 1차시'],
  ['ja2',  M(21,15),M(23,30),'야자 2차시'],
];
function schoolBlocks(){
  const out=[];let cur=0;
  const nameGap=(s,e)=>{
    if(s===M(12,20))return '점심시간';
    if(s===M(18,0))return '저녁시간';
    if(e<=M(6,50))return '새벽';
    if(s>=M(23,30))return '취침 전';
    if(s===M(7,15))return '아침 시간';
    return (e-s)>=25?'빈 시간':'쉬는시간';};
  for(const [id,s,e,name] of CLASSES){
    if(s>cur)out.push({id:'g'+cur,s:cur,e:s,name:nameGap(cur,s),cls:false});
    out.push({id,s,e,name,cls:true});cur=e;}
  if(cur<1440)out.push({id:'g'+cur,s:cur,e:1440,name:nameGap(cur,1440),cls:false});
  return out;
}
const SCHOOL=schoolBlocks();
function h24Blocks(){const o=[];for(let h=0;h<24;h++)o.push({id:'h'+h,s:h*60,e:h*60+60,name:hhmm(h*60),cls:false});return o;}
function blocksFor(ds){
  const wd=new Date(ds+'T00:00:00').getDay(),f=DB.s.force24[ds];
  const use24 = f!==undefined ? f : (wd===0||wd===6);
  return {list:use24?h24Blocks():SCHOOL, is24:use24};
}
function hhmm(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function durTxt(d){return d>=60?(d%60?Math.floor(d/60)+'시간 '+(d%60)+'분':Math.floor(d/60)+'시간'):d+'분';}
/** 배치 정본은 절대 분(min). 블록 id를 저장하면 24시간 모드에서 할일이 증발한다. */
function blockOf(ds,min){const {list}=blocksFor(ds);return list.find(x=>min>=x.s&&min<x.e)||null;}

/* ═════ 2. 저장소 ═════ */
const KEY='planner_v3';
let DB={v:4,tasks:[],subjects:[],repeats:[],s:{force24:{},theme:'sys'}};
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);
  DB={v:4,tasks:d.tasks||[],subjects:d.subjects||[],repeats:d.repeats||[],
      s:Object.assign({force24:{},theme:'sys'},d.s||{})};}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('저장 실패');}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1900);}
function buzz(n){if(navigator.vibrate)navigator.vibrate(n);}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseD(s){return new Date(s+'T00:00:00');}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);}
const TODAY=()=>dstr(new Date());
const DOW=['일','월','화','수','목','금','토'];
const PALETTE=['#E07A4F','#F0A059','#D64F4F','#C9639E','#8A6FD4','#4F86D6','#3F9E6B','#8C9A4F','#7A6A5C','#5A8F9E'];

/* ═════ 3. 상태 ═════ */
let tab='today', calM=new Date(), popDate=null, _anim=false;
load();
function applyTheme(){
  const t=DB.s.theme||'sys';
  if(t==='sys')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
}
applyTheme();

/* ═════ 4. 반복 (규칙 + 예외목록 방식) ═════ */
function repHits(rep,ds){
  const d=parseD(ds),start=parseD(rep.start);
  if(d<start)return false;
  if(rep.end&&d>parseD(rep.end))return false;
  if(rep.freq==='daily')return true;
  if(rep.freq==='weekly')return (rep.weekdays||[]).includes(d.getDay());
  if(rep.freq==='interval')return Math.round((d-start)/864e5)%(rep.interval||1)===0;
  return false;
}
/** 그 날짜에 해당하는 반복 인스턴스를 만든다. 시각(min)·소요(dur)를 그대로 복사한다. */
function materialize(ds){
  DB.repeats.forEach(rep=>{
    if(!repHits(rep,ds))return;
    if(rep.ex&&rep.ex.indexOf(ds)>=0)return;
    if(DB.tasks.some(t=>t.repId===rep.id&&t.date===ds))return;
    const sibs=DB.tasks.filter(t=>t.date===ds&&(t.min==null)===(rep.min==null));
    DB.tasks.push({id:uid(),title:rep.title,date:ds,min:rep.min,dur:rep.dur,
      ord:sibs.length,done:false,subj:rep.subj,repId:rep.id});
  });
}
function materializeWindow(){
  const base=new Date(calM.getFullYear(),calM.getMonth(),1);
  for(let i=-7;i<45;i++){const d=new Date(base);d.setDate(base.getDate()+i);materialize(dstr(d));}
  for(let i=-2;i<60;i++)materialize(addDays(TODAY(),i));
}
function repLabel(r){
  if(r.freq==='daily')return '매일';
  if(r.freq==='weekly')return (r.weekdays||[]).map(i=>DOW[i]).join('');
  return r.interval+'일마다';
}
function taskDur(t,ds){
  if(t.dur!=null)return t.dur;
  const b=t.min!=null?blockOf(ds||t.date,t.min):null;
  return b?b.e-b.s:30;
}

/* ═════ 5. 렌더 — 하루 ═════ */
function tasksOf(ds){return DB.tasks.filter(t=>t.date===ds);}
function subjOf(id){return DB.subjects.find(s=>s.id===id);}
function tkHTML(t){
  const sj=t.subj?subjOf(t.subj):null,meta=[];
  if(t.min!=null)meta.push('<span>'+hhmm(t.min)+'</span>');
  if(t.dur!=null)meta.push('<span>'+durTxt(t.dur)+'</span>');
  if(t.repId)meta.push('<span class="rp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l3.5 3.5L17 9.5"/><path d="M3.5 11V9.5A3.5 3.5 0 0 1 7 6h13.5"/><path d="M7 21.5L3.5 18 7 14.5"/><path d="M20.5 13v1.5a3.5 3.5 0 0 1-3.5 3.5H3.5"/></svg>반복</span>');
  if(sj)meta.push('<span class="sj" style="background:'+sj.color+'22;color:'+sj.color+'">'+esc(sj.name)+'</span>');
  return '<div class="tk'+(t.done?' done':'')+'" data-id="'+t.id+'">'+
    '<button class="ck'+(t.done?' on':'')+'" onclick="event.stopPropagation();toggleDone(\''+t.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></button>'+
    '<div class="tkb"><div class="tkt">'+esc(t.title)+'</div>'+
    (meta.length?'<div class="tkm">'+meta.join('')+'</div>':'')+'</div>'+
    '<div class="gr"><i></i><i></i><i></i></div></div>';
}
/** 하루치 타임테이블 — 오늘 탭과 달력 팝업이 같이 쓴다 */
function renderDay(ds){
  const {list}=blocksFor(ds),ts=tasksOf(ds);
  const inbox=ts.filter(t=>t.min==null).sort((a,b)=>a.ord-b.ord);
  let h='';
  if(inbox.length)h+='<div class="card glass" style="margin-bottom:10px"><div class="ctitle"><b>미배정 '+inbox.length+'</b></div>'+
    '<div class="inbox" data-inbox="1">'+inbox.map(tkHTML).join('')+'</div></div>';
  h+='<div id="tt">';
  const now=new Date(),nowM=now.getHours()*60+now.getMinutes(),isT=ds===TODAY();
  for(const b of list){
    const bt=ts.filter(t=>t.min!=null&&t.min>=b.s&&t.min<b.e).sort((a,b2)=>a.min!==b2.min?a.min-b2.min:a.ord-b2.ord);
    h+='<div class="blk'+(b.cls?' cls':'')+(isT&&nowM>=b.s&&nowM<b.e?' now':'')+'" data-s="'+b.s+'" data-e="'+b.e+'">'+
      '<div class="bt"><i>'+hhmm(b.s)+'</i><s>'+hhmm(b.e)+'</s></div>'+
      '<div class="bb"><div class="bh"><b>'+esc(b.name)+'</b><span class="dur">'+durTxt(b.e-b.s)+'</span>'+
      '<button class="add" onclick="newTask(\''+ds+'\','+b.s+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg></button></div>'+
      bt.map(tkHTML).join('')+'</div></div>';}
  return h+'</div>';
}
function ddayList(){
  const arr=[];
  DB.subjects.forEach(s=>(s.ddays||[]).forEach(d=>{if(dcount(d.date)>=0)arr.push({s,d});}));
  return arr.sort((a,b)=>a.d.date<b.d.date?-1:1);
}
function railHTML(){
  const up=ddayList();if(!up.length)return '';
  return '<div class="rail">'+up.slice(0,10).map(({s,d})=>{
    const n=dcount(d.date),dt=parseD(d.date);
    return '<div class="dcard glass'+(n<=3?' urgent':'')+'" style="--dc:'+s.color+'" onclick="go(\'subj\')">'+
      '<div class="nm"><span class="sjc" style="background:'+s.color+';color:'+s.color+';width:9px;height:9px"></span>'+esc(s.name)+'</div>'+
      '<div class="big">'+(n===0?'D-DAY':'D-'+n)+'</div>'+
      '<div class="sub">'+(dt.getMonth()+1)+'.'+dt.getDate()+' · '+esc(d.title)+'</div></div>';}).join('')+'</div>';
}
function todayHTML(){return railHTML()+renderDay(TODAY());}

function themeIcon(){
  const t=DB.s.theme||'sys';
  if(t==='light')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.6"/><path d="M12 1.8v2.4M12 19.8v2.4M22.2 12h-2.4M4.2 12H1.8M19.2 4.8l-1.7 1.7M6.5 17.5l-1.7 1.7M19.2 19.2l-1.7-1.7M6.5 6.5L4.8 4.8"/></svg>';
  if(t==='dark')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.6 8.6 0 0 1 9.5 3.5a8.7 8.7 0 1 0 11 11z"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" fill="currentColor" stroke="none"/></svg>';
}
function topHTML(){
  const th='<button class="ib" onclick="cycleTheme()">'+themeIcon()+'</button>'+
    '<button class="ib" onclick="dataSheet()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V3.5"/><path d="M8 7.5L12 3.5l4 4"/><path d="M4 14.5v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></button>';
  if(tab==='today'){
    const d=new Date(),{is24}=blocksFor(TODAY());
    return '<div class="h1"><div><small>'+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW[d.getDay()]+'요일</small>오늘</div></div><div class="hbtns">'+
      '<button class="ib'+(is24?' on':'')+'" onclick="toggle24()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.4 2"/></svg></button>'+th+'</div>';
  }
  if(tab==='cal')return '<div class="h1"><div><small>날짜를 누르면 그날 계획이 열린다</small>달력</div></div><div class="hbtns">'+th+'</div>';
  return '<div class="h1"><div><small>디데이와 목표</small>과목</div></div><div class="hbtns">'+
    '<button class="ib" onclick="editSubject(null)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg></button>'+th+'</div>';
}
function cycleTheme(){
  const o=['sys','light','dark'],i=o.indexOf(DB.s.theme||'sys');
  DB.s.theme=o[(i+1)%3];save();applyTheme();paint();
  toast({sys:'시스템 설정 따름',light:'라이트 모드',dark:'다크 모드'}[DB.s.theme]);
}

/* ═════ 6. 달력 ═════ */
function calHTML(){
  const y=calM.getFullYear(),m=calM.getMonth();
  const first=new Date(y,m,1),start=new Date(first);start.setDate(1-first.getDay());
  const dd={};DB.subjects.forEach(s=>(s.ddays||[]).forEach(d=>{(dd[d.date]=dd[d.date]||[]).push({s,d});}));
  let h='<div class="card glass" style="padding:16px 15px 17px"><div class="calh">'+
    '<button class="ib" onclick="moveMonth(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>'+
    '<b>'+y+'년 '+(m+1)+'월</b>'+
    '<button class="ib" onclick="moveMonth(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button></div>'+
    '<div class="dow">'+DOW.map((d,i)=>'<i class="'+(i===0?'sun':'')+'">'+d+'</i>').join('')+'</div><div class="calgrid">';
  for(let i=0;i<42;i++){
    const dt=new Date(start);dt.setDate(start.getDate()+i);const ds=dstr(dt);
    const n=tasksOf(ds).length,dds=dd[ds]||[];
    h+='<div class="cell'+(dt.getMonth()!==m?' out':'')+(ds===TODAY()?' today':'')+(dt.getDay()===0?' sun':'')+'" onclick="openDay(\''+ds+'\')">'+
      '<div class="dn">'+dt.getDate()+'</div>'+
      (n?'<div class="dots">'+Array.from({length:Math.min(n,4)},()=>'<span class="dot"></span>').join('')+'</div>':'')+
      (dds.length?'<div class="cdd">'+esc(dds[0].d.title.slice(0,3))+'</div>':'')+'</div>';}
  h+='</div></div>';
  const up=ddayList();
  if(up.length){h+='<div class="card glass"><div class="ctitle"><b>다가오는 디데이</b></div>';
    up.slice(0,8).forEach(({s,d})=>{h+=ddHTML(s,d,false);});h+='</div>';}
  return h;
}
function fitCalendar(){
  const g=document.querySelector('.calgrid');if(!g)return;
  g.style.height='auto';
  const top=g.getBoundingClientRect().top;
  const dockTop=window.innerHeight-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dockh'))||78)-20;
  const hh=dockTop-top-16;
  if(hh>150)g.style.height=Math.min(hh,430)+'px';
}
/** 달력에서 날짜를 누르면 그 날 계획이 팝업으로 뜬다 */
function openDay(ds){
  popDate=ds;
  const d=parseD(ds),isT=ds===TODAY(),{is24}=blocksFor(ds);
  const h='<div class="popnav">'+
    '<button class="ib" onclick="popMove(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>'+
    '<div class="popt"><div class="p1">'+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')</div>'+(isT?'<div class="p2">오늘</div>':'')+'</div>'+
    '<div style="display:flex;gap:6px">'+
      '<button class="ib'+(is24?' on':'')+'" onclick="popToggle24()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.4 2"/></svg></button>'+
      '<button class="ib" onclick="popMove(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button></div></div>'+
    '<div id="popbody" data-date="'+ds+'">'+renderDay(ds)+'</div>'+
    '<div class="row2"><button class="btn p" onclick="newTask(\''+ds+'\',null)">할일 추가</button></div>';
  openSheet(h);
  setTimeout(()=>bindDrag($('#popbody')),50);
}
function popMove(n){openDay(addDays(popDate,n));}
function popToggle24(){const ds=popDate,{is24}=blocksFor(ds),wd=parseD(ds).getDay(),def=(wd===0||wd===6);
  if(is24===def)DB.s.force24[ds]=!def;else delete DB.s.force24[ds];save();openDay(ds);}

/* ═════ 7. 과목 ═════ */
function dcount(date){return Math.round((parseD(date)-new Date().setHours(0,0,0,0))/86400000);}
function ddHTML(s,d,editable){
  const n=dcount(d.date),cl=n<0?'past':(n<=7?'':'far');
  const lab=n===0?'D-DAY':(n>0?'D-'+n:'D+'+(-n)),dt=parseD(d.date);
  return '<div class="dd"'+(editable?' onclick="editDday(\''+s.id+'\',\''+d.id+'\')"':'')+'>'+
    '<div class="sjc" style="background:'+s.color+';color:'+s.color+'"></div>'+
    '<div style="flex:1;min-width:0"><div class="ddn">'+esc(d.title)+'</div>'+
    '<div class="ddd">'+(dt.getMonth()+1)+'.'+dt.getDate()+' ('+DOW[dt.getDay()]+')'+(editable?'':' · '+esc(s.name))+'</div></div>'+
    '<div class="ddc '+cl+'">'+lab+'</div></div>';
}
function subjHTML(){
  if(!DB.subjects.length)return '<div class="card glass"><div class="empty">과목이 없다.<br>오른쪽 위 + 로 추가</div></div>';
  let h='';
  DB.subjects.forEach(s=>{
    const dds=(s.ddays||[]).slice().sort((a,b)=>a.date<b.date?-1:1),gls=s.goals||[];
    h+='<div class="sj glass"><div class="sjh" onclick="editSubject(\''+s.id+'\')">'+
      '<div class="sjc" style="background:'+s.color+';color:'+s.color+'"></div><b>'+esc(s.name)+'</b>'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:17px;height:17px;color:var(--ink3)"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></div>';
    dds.forEach(d=>{h+=ddHTML(s,d,true);});

function placeThumb(){
  const bar=$('#navtabs');if(!bar)return;
  const th=bar.querySelector('.dockthumb'),a=bar.querySelector('.nb.on');if(!th||!a)return;
  th.style.width=a.offsetWidth+'px';th._x=a.offsetLeft;
  if(!th.classList.contains('drag'))th.style.transform='translateX('+a.offsetLeft+'px)';
}
function attachDockDrag(){
  const bar=$('#navtabs');if(!bar||bar._bound)return;bar._bound=true;
  const th=bar.querySelector('.dockthumb');let on=false;
  const idxAt=cx=>{const b=[...bar.querySelectorAll('.nb')];let bi=0,bd=1e9;
    b.forEach((n,i)=>{const r=n.getBoundingClientRect(),c=(r.left+r.right)/2;
      if(Math.abs(cx-c)<bd){bd=Math.abs(cx-c);bi=i;}});return bi;};
  bar.addEventListener('touchstart',()=>{on=true;th.classList.add('drag');
    th.style.transition='transform .18s ease-out, box-shadow .2s ease, background .2s ease';
    th.style.transform='translateX('+(th._x||0)+'px) scale(1.13)';},{passive:true});
  bar.addEventListener('touchmove',e=>{if(!on)return;if(e.cancelable)e.preventDefault();
    const r=bar.getBoundingClientRect(),tw=th.offsetWidth;
    let x=e.touches[0].clientX-r.left-tw/2;x=Math.max(0,Math.min(bar.clientWidth-tw,x));
    th._x=x;th.style.transition='none';th.style.transform='translateX('+x+'px) scale(1.13)';},{passive:false});
  const rel=e=>{if(!on)return;on=false;th.classList.remove('drag');
    th.style.transition='transform .42s cubic-bezier(.32,1.75,.5,1), box-shadow .3s ease, background .3s ease';
    const cx=e.changedTouches?e.changedTouches[0].clientX:0,b=[...bar.querySelectorAll('.nb')],i=idxAt(cx),nt=b[i].dataset.t;
    if(nt!==tab)go(nt);else{th._x=b[i].offsetLeft;th.style.transform='translateX('+b[i].offsetLeft+'px)';}};
  bar.addEventListener('touchend',rel,{passive:true});
  bar.addEventListener('touchcancel',()=>{on=false;th.classList.remove('drag');placeThumb();},{passive:true});
}
function go(t){
  if(t===tab){$('#scroll').scrollTo({top:0,behavior:'smooth'});return;}
  const order=['today','cal','subj'],dir=order.indexOf(t)>order.indexOf(tab)?1:-1;

      v.style.transform='translateX(0)';v.style.opacity='1';setTimeout(()=>{_anim=false;},320);});},170);

(function(){
  const S=$('#scroll');let x0=null,y0=null,decided=false,horiz=false;
  S.addEventListener('touchstart',e=>{if(_anim||DRAG.on){x0=null;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;decided=false;horiz=false;},{passive:true});
  S.addEventListener('touchmove',e=>{

/* ═════ 10. 드래그 ═════ */
const DRAG={on:false};
function bindDrag(root){
  if(!root||root._db)return;root._db=true;
  const dateOf=()=>root.dataset.date||TODAY();
  let timer=null,sx=0,sy=0,moved=0,src=null,tid=null;
  const gh=$('#ghost'),info=$('#dropinfo');
  let curBlk=null,curIdx=-1,line=null;
  const cleanup=()=>{clearTimeout(timer);timer=null;
    document.querySelectorAll('.blk.tgt').forEach(b=>b.classList.remove('tgt'));
    if(line&&line.parentNode)line.parentNode.removeChild(line);line=null;
    gh.classList.remove('on');gh.innerHTML='';info.classList.remove('on');
    if(src)src.classList.remove('dragging');
    src=null;curBlk=null;curIdx=-1;DRAG.on=false;};
  const lift=()=>{DRAG.on=true;src.classList.add('dragging');
    const r=src.getBoundingClientRect();
    gh.style.width=r.width+'px';gh.innerHTML=src.outerHTML;
    const g=gh.firstElementChild;if(g){g.classList.remove('dragging');g.style.transform='none';}
    gh._ox=sx-r.left;gh._oy=sy-r.top;
    gh.style.left=(sx-gh._ox)+'px';gh.style.top=(sy-gh._oy)+'px';
    gh.style.transform='scale(1.045) rotate(-.6deg)';gh.classList.add('on');buzz(14);};
  const place=(cx,cy)=>{
    const el=document.elementFromPoint(cx,cy);
    const blk=el&&el.closest?el.closest('.blk, [data-inbox]'):null;
    document.querySelectorAll('.blk.tgt').forEach(b=>{if(b!==blk)b.classList.remove('tgt')});
    if(!blk||!root.contains(blk)){if(line&&line.parentNode)line.parentNode.removeChild(line);line=null;curBlk=null;info.classList.remove('on');return;}
    if(blk.classList.contains('blk'))blk.classList.add('tgt');
    curBlk=blk;
    const host=blk.classList.contains('blk')?blk.querySelector('.bb'):blk;
    const chips=[...host.querySelectorAll('.tk')].filter(c=>c!==src);
    let idx=chips.length;
    for(let i=0;i<chips.length;i++){const cr=chips[i].getBoundingClientRect();
      if(cy<cr.top+cr.height/2){idx=i;break;}}
    curIdx=idx;
    if(!line){line=document.createElement('div');line.className='dropline';}
    const ref=chips[idx]||null;
    if(ref)host.insertBefore(line,ref);else host.appendChild(line);
    const nm=blk.classList.contains('blk')?(blk.querySelector('.bh b').textContent+' · '+hhmm(+blk.dataset.s)):'미배정';
    info.textContent=nm;info.classList.add('on');
    const ir=info.getBoundingClientRect();
    info.style.left=Math.max(10,Math.min(window.innerWidth-ir.width-10,cx-ir.width/2))+'px';
    info.style.top=Math.max(10,cy-64)+'px';};
  const autoScroll=cy=>{
    const S=root.closest('#sheet')||$('#scroll'),r=S.getBoundingClientRect();let v=0;
    if(cy<r.top+100)v=-Math.min(15,(r.top+100-cy)/4);
    else if(cy>r.bottom-120)v=Math.min(15,(cy-(r.bottom-120))/4);
    if(v)S.scrollTop+=v;};

  root.addEventListener('touchstart',e=>{
    const tk=e.target.closest('.tk');if(!tk||e.target.closest('.ck'))return;
    src=tk;tid=tk.dataset.id;sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=0;
    clearTimeout(timer);timer=setTimeout(lift,250);},{passive:true});
  root.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(!DRAG.on){if(src){moved=Math.max(moved,Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy));
      if(moved>9){clearTimeout(timer);timer=null;src=null;}}return;}
    if(e.cancelable)e.preventDefault();
    moved=Math.max(moved,Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy));
    gh.style.left=(t.clientX-gh._ox)+'px';gh.style.top=(t.clientY-gh._oy)+'px';
    autoScroll(t.clientY);place(t.clientX,t.clientY);},{passive:false});
  const drop=()=>{
    if(!DRAG.on)return;
    const ds=dateOf(),task=DB.tasks.find(x=>x.id===tid),blk=curBlk,idx=curIdx;
    if(task&&blk){
      if(blk.classList.contains('blk')){
        const bs=+blk.dataset.s,be=+blk.dataset.e;
        if(task.min==null||task.min<bs||task.min>=be)task.min=bs;
      }else task.min=null;
      const inSame=x=>task.min==null?x.min==null
        :(x.min!=null&&x.min>=+blk.dataset.s&&x.min<+blk.dataset.e);
      const sibs=DB.tasks.filter(x=>x.date===ds&&x.id!==task.id&&inSame(x)).sort((a,b)=>a.ord-b.ord);
      sibs.splice(Math.max(0,Math.min(sibs.length,idx)),0,task);
      sibs.forEach((x,i)=>x.ord=i);
      save();buzz(11);}
    const wasMoved=moved>9;cleanup();refresh();
    if(!wasMoved&&task)openTask(task.id);};
  root.addEventListener('touchend',()=>{
    if(DRAG.on){drop();return;}
    if(timer&&src&&moved<=9){clearTimeout(timer);timer=null;
      const id=src.dataset.id;src=null;openTask(id);return;}
    clearTimeout(timer);timer=null;src=null;});
  root.addEventListener('touchcancel',()=>{if(DRAG.on)cleanup();else{clearTimeout(timer);timer=null;src=null;}});
}
function bindGoalDrag(){
  document.querySelectorAll('.goals').forEach(list=>{
    if(list._b)return;list._b=true;
    let items=[],el=null,y0=0,h=44,from=-1,to=-1,timer=null,active=false;
    const clr=()=>{clearTimeout(timer);timer=null;};
    list.addEventListener('touchstart',e=>{const it=e.target.closest('.gl');if(!it)return;
      y0=e.touches[0].clientY;clr();
      timer=setTimeout(()=>{active=true;el=it;items=[...list.querySelectorAll('.gl')];
        from=items.indexOf(it);to=from;
        h=items.length>1?(items[1].getBoundingClientRect().top-items[0].getBoundingClientRect().top):it.offsetHeight;
        items.forEach(x=>{if(x!==it)x.style.transition='transform .18s cubic-bezier(.3,1.2,.5,1)';});
        it.classList.add('dragging');buzz(12);},240);},{passive:true});
    list.addEventListener('touchmove',e=>{
      if(!active){if(Math.abs(e.touches[0].clientY-y0)>8)clr();return;}
      if(e.cancelable)e.preventDefault();
      const dy=e.touches[0].clientY-y0;
      el.style.transform='translateY('+dy+'px) scale(1.02)';
      to=Math.max(0,Math.min(items.length-1,from+Math.round(dy/h)));
      items.forEach((it,i)=>{if(it===el)return;let s=0;
        if(from<to&&i>from&&i<=to)s=-h;else if(from>to&&i>=to&&i<from)s=h;
        it.style.transform=s?'translateY('+s+'px)':'';});},{passive:false});
    const end=()=>{clr();if(!active)return;active=false;
      const s=subjOf(list.dataset.sid),ids=items.map(x=>x.dataset.gid);
      el.classList.remove('dragging');items.forEach(x=>{x.style.transition='';x.style.transform='';});
      if(to!==from&&s){const mv=ids.splice(from,1)[0];ids.splice(to,0,mv);
        s.goals=ids.map(id=>s.goals.find(g=>g.id===id)).filter(Boolean);save();paint();}
      el=null;};
    list.addEventListener('touchend',end);list.addEventListener('touchcancel',end);});
}

function readTitle(){const i=$('#f_title');if(i)_ed.title=i.value;
  const rs=$('#r_s'),re=$('#r_e');if(_ed.rep){if(rs)_ed.rep.start=rs.value;if(re)_ed.rep.end=re.value;}}
function toggleAdv(){readTitle();_adv=!_adv;taskSheet();}

function setDur(d){readTitle();_ed.dur=d;taskSheet();}
function setSubj(s){readTitle();_ed.subj=s;taskSheet();}
function bumpMin(d){readTitle();if(_ed.min==null)return;

function setRep(f){readTitle();

function togDow(i){readTitle();const d=_ed.rep.weekdays,k=d.indexOf(i);
  if(k>=0){if(d.length>1)d.splice(k,1);}else d.push(i);taskSheet();}
function bumpN(x){readTitle();_ed.rep.interval=Math.max(1,Math.min(60,_ed.rep.interval+x));taskSheet();}
function saveTask(){
  readTitle();const e=_ed;
  if(!e.title.trim()){toast('할일 이름을 적어줘');return;}
  const mkRule=()=>({id:e.repId||uid(),title:e.title.trim(),freq:e.rep.freq,
    weekdays:e.rep.weekdays.slice(),interval:e.rep.interval,
    start:e.rep.start||e.date,end:e.rep.end||'',min:e.min,dur:e.dur,subj:e.subj,ex:[]});
  if(e.id){
    const t=DB.tasks.find(x=>x.id===e.id);if(!t)return;
    Object.assign(t,{title:e.title.trim(),min:e.min,dur:e.dur,subj:e.subj});
    if(e.rep){
      const old=e.repId?DB.repeats.find(r=>r.id===e.repId):null;
      if(old){const ex=old.ex||[];Object.assign(old,mkRule(),{ex});
        DB.tasks=DB.tasks.filter(x=>!(x.repId===old.id&&x.date>e.date));}
      else{const r=mkRule();DB.repeats.push(r);t.repId=r.id;}
    }else if(e.repId){
      DB.repeats=DB.repeats.filter(r=>r.id!==e.repId);
      DB.tasks.forEach(x=>{if(x.repId===e.repId)x.repId=null;});
    }
  }else{
    if(e.rep){const r=mkRule();DB.repeats.push(r);}
    else{
      const sibs=DB.tasks.filter(x=>x.date===e.date&&(x.min==null)===(e.min==null));
      DB.tasks.push({id:uid(),title:e.title.trim(),date:e.date,min:e.min,dur:e.dur,
        ord:sibs.length,done:false,subj:e.subj,repId:null});
    }
  }
  materializeWindow();save();closeSheet();
  if(popDate)openDay(popDate);else paint();
  toast(e.id?'수정했다':'추가했다');
}
function delTask(all){
  const t=DB.tasks.find(x=>x.id===_ed.id);if(!t)return;
  if(all&&t.repId){
    DB.repeats=DB.repeats.filter(r=>r.id!==t.repId);
    DB.tasks=DB.tasks.filter(x=>x.repId!==t.repId);
  }else{
    if(t.repId){const r=DB.repeats.find(x=>x.id===t.repId);
      if(r){r.ex=r.ex||[];if(r.ex.indexOf(t.date)<0)r.ex.push(t.date);}}
    DB.tasks=DB.tasks.filter(x=>x.id!==t.id);
  }
  save();closeSheet();
  if(popDate)openDay(popDate);else paint();
  toast(all?'반복 전체를 지웠다':'지웠다');
}

/* ═════ 12. 과목·디데이·목표 ═════ */
let _sj={};
function editSubject(id){const s=id?subjOf(id):null;
  _sj=s?{id:s.id,name:s.name,color:s.color}:{id:null,name:'',color:PALETTE[DB.subjects.length%PALETTE.length]};
  sjSheet();}
function sjSheet(){
  const s=_sj;
  let h='<div class="sh2">'+(s.id?'과목 수정':'새 과목')+'</div>'+
    '<input class="fi" id="f_sname" placeholder="과목 이름" value="'+esc(s.name)+'">'+
    '<div class="fl">색상</div><div class="swatches">'+
    PALETTE.map(c=>'<button class="sw'+(s.color===c?' on':'')+'" style="background:'+c+'" onclick="setSjColor(\''+c+'\')"></button>').join('')+'</div>'+
    '<div class="row2"><button class="btn p" onclick="saveSubject()">저장</button></div>';
  if(s.id)h+='<div class="row2"><button class="btn d" onclick="delSubject()">과목 삭제</button></div>';
  openSheet(h);
  setTimeout(()=>{if(!s.id&&$('#f_sname'))$('#f_sname').focus();},380);}
function setSjColor(c){const i=$('#f_sname');if(i)_sj.name=i.value;_sj.color=c;sjSheet();}
function saveSubject(){
  const i=$('#f_sname');if(i)_sj.name=i.value;
  if(!_sj.name.trim()){toast('과목 이름을 적어줘');return;}
  if(_sj.id){const s=subjOf(_sj.id);s.name=_sj.name.trim();s.color=_sj.color;}
  else DB.subjects.push({id:uid(),name:_sj.name.trim(),color:_sj.color,ddays:[],goals:[]});
  save();closeSheet();paint();}
function delSubject(){
  DB.subjects=DB.subjects.filter(s=>s.id!==_sj.id);
  DB.tasks.forEach(t=>{if(t.subj===_sj.id)t.subj=null;});
  save();closeSheet();paint();toast('과목을 지웠다');}
let _dd={};
function editDday(sid,did){
  const s=subjOf(sid);if(!s)return;
  const d=did?(s.ddays||[]).find(x=>x.id===did):null;
  _dd=d?{sid,id:d.id,title:d.title,date:d.date}:{sid,id:null,title:'',date:TODAY()};
  let h='<div class="sh2">'+(d?'디데이 수정':'디데이 추가')+'</div>'+
    '<input class="fi" id="f_ddt" placeholder="예: 2회고사, 보고서 제출" value="'+esc(_dd.title)+'">'+
    '<div class="fl">날짜</div><input class="fi" type="date" id="f_ddd" value="'+_dd.date+'">'+
    '<div class="row2"><button class="btn p" onclick="saveDday()">저장</button></div>';
  if(d)h+='<div class="row2"><button class="btn d" onclick="delDday()">삭제</button></div>';
  openSheet(h);}
function saveDday(){
  const t=$('#f_ddt').value.trim(),dt=$('#f_ddd').value;
  if(!t){toast('이름을 적어줘');return;}
  if(!dt){toast('날짜를 골라줘');return;}
  const s=subjOf(_dd.sid);if(!s)return;s.ddays=s.ddays||[];
  if(_dd.id){const d=s.ddays.find(x=>x.id===_dd.id);d.title=t;d.date=dt;}
  else s.ddays.push({id:uid(),title:t,date:dt});
  save();closeSheet();paint();}
function delDday(){const s=subjOf(_dd.sid);s.ddays=(s.ddays||[]).filter(x=>x.id!==_dd.id);
  save();closeSheet();paint();}
let _gl={};
function editGoal(sid,gid){
  const s=subjOf(sid);if(!s)return;
  const g=gid?(s.goals||[]).find(x=>x.id===gid):null;
  _gl={sid,id:g?g.id:null,text:g?g.text:''};
  let h='<div class="sh2">'+(g?'하위 목표 수정':'하위 목표 추가')+'</div>'+
    '<input class="fi" id="f_gl" placeholder="예: 3단원 문제집 1회독" value="'+esc(_gl.text)+'">'+
    '<div class="row2"><button class="btn p" onclick="saveGoal()">저장</button></div>';
  if(g)h+='<div class="row2"><button class="btn d" onclick="delGoal()">삭제</button></div>';
  openSheet(h);
  setTimeout(()=>{if(!g&&$('#f_gl'))$('#f_gl').focus();},380);}
function saveGoal(){
  const v=$('#f_gl').value.trim();if(!v){toast('내용을 적어줘');return;}
  const s=subjOf(_gl.sid);s.goals=s.goals||[];
  if(_gl.id)s.goals.find(x=>x.id===_gl.id).text=v;
  else s.goals.push({id:uid(),text:v});
  save();closeSheet();paint();}
function delGoal(){const s=subjOf(_gl.sid);s.goals=(s.goals||[]).filter(x=>x.id!==_gl.id);
  save();closeSheet();paint();}

/* ═════ 13. 내보내기 / 가져오기 ═════ */
function dataSheet(){
  const n=DB.tasks.length,sn=DB.subjects.length,rn=DB.repeats.length;
  openSheet('<div class="sh2">데이터</div>'+
    '<div style="font-size:14px;font-weight:650;color:var(--ink2);line-height:1.7">'+
    '할일 <b>'+n+'</b>개 · 과목 <b>'+sn+'</b>개 · 반복 규칙 <b>'+rn+'</b>개<br>'+
    '<span style="color:var(--ink3);font-size:13px">파일로 내보내서 다른 기기에서 가져오면 그대로 옮겨진다.</span></div>'+
    '<div class="row2"><button class="btn p" onclick="doExport()">내보내기</button>'+
    '<button class="btn s" onclick="document.getElementById(\'fileIn\').click()">가져오기</button></div>'+
    '<div class="fl">반복 규칙</div>'+
    (DB.repeats.length?DB.repeats.map(r=>'<div class="dd" style="border-top:1px solid var(--line2)">'+
      '<div style="flex:1;min-width:0"><div class="ddn">'+esc(r.title)+'</div>'+
      '<div class="ddd">'+repLabel(r)+' · '+r.start+(r.end?' ~ '+r.end:' ~')+(r.min!=null?' · '+hhmm(r.min):'')+'</div></div>'+
      '<button class="mini" style="flex:0 0 auto;padding:8px 12px;color:var(--gd)" onclick="delRule(\''+r.id+'\')">삭제</button></div>').join('')
      :'<div class="empty" style="padding:14px">등록된 반복이 없다</div>'));
}
function doExport(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='plan-'+TODAY()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
  toast('내보냈다');
}
function doImport(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.tasks))throw 0;
      DB={v:4,tasks:d.tasks||[],subjects:d.subjects||[],repeats:d.repeats||[],
          s:Object.assign({force24:{},theme:'sys'},d.s||{})};
      save();applyTheme();closeSheet();paint();
      toast('가져왔다 — 할일 '+DB.tasks.length+'개');
    }catch(err){toast('파일을 읽지 못했다');}
    inp.value='';
  };
  rd.onerror=()=>{toast('파일을 읽지 못했다');inp.value='';};
  rd.readAsText(f);
}
function delRule(id){
  DB.repeats=DB.repeats.filter(r=>r.id!==id);
  DB.tasks=DB.tasks.filter(t=>t.repId!==id);
  save();dataSheet();paint();toast('반복을 지웠다');
}

paint();
window.addEventListener('resize',()=>{placeThumb();if(tab==='cal')setTimeout(fitCalendar,50);});
setInterval(()=>{if(tab==='today'&&!DRAG.on&&!$('#sheet').classList.contains('on'))paint();},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
