<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Planner</title>
<style>
/* ═══════════ design system ═══════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F4F5FA; --bg2:#FFFFFF;
  --surf:rgba(255,255,255,.72); --surf2:rgba(255,255,255,.5);
  --line:rgba(18,22,45,.09); --line2:rgba(18,22,45,.055);
  --tx:#12162D; --tx2:#5C6485; --tx3:#9BA1BC;
  --ac:#5B5BF5; --ac2:#9B5BF5; --ac-s:rgba(91,91,245,.11); --ac-b:rgba(91,91,245,.3);
  --gd:#F0596B; --gd-s:rgba(240,89,107,.12);
  --ok:#14B37D; --ok-s:rgba(20,179,125,.12);
  --wr:#F0A020;
  --cls:rgba(91,91,245,.055); --gap:rgba(120,128,160,.04);
  --sh:0 2px 10px rgba(20,26,60,.05), 0 12px 34px rgba(20,26,60,.06);
  --sh-lg:0 8px 22px rgba(20,26,60,.13), 0 30px 60px rgba(20,26,60,.16);
  --blur:blur(22px) saturate(180%);
  --r:22px; --r2:15px; --r3:10px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --dock:66px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#080A12; --bg2:#10131F;
  --surf:rgba(28,32,50,.72); --surf2:rgba(28,32,50,.46);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.05);
  --tx:#EEF0FA; --tx2:#9AA2C4; --tx3:#646B8C;
  --ac:#7B7BFF; --ac2:#B47BFF; --ac-s:rgba(123,123,255,.16); --ac-b:rgba(123,123,255,.4);
  --gd:#FF6B7D; --gd-s:rgba(255,107,125,.16);
  --ok:#2DD69B; --ok-s:rgba(45,214,155,.15);
  --cls:rgba(123,123,255,.07); --gap:rgba(255,255,255,.018);
  --sh:0 2px 10px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.35);
  --sh-lg:0 10px 30px rgba(0,0,0,.5), 0 30px 70px rgba(0,0,0,.55);
}}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;
  background:var(--bg);color:var(--tx);
  font-size:15px;line-height:1.45;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
  position:fixed;inset:0;overflow:hidden;
}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48% 34% at 8% 2%, var(--ac-s), transparent 62%),
    radial-gradient(42% 30% at 98% 12%, rgba(155,91,245,.10), transparent 60%),
    radial-gradient(60% 40% at 50% 105%, rgba(20,179,125,.07), transparent 65%);}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:0;height:0}

/* ═══════════ shell ═══════════ */
#app{height:100%;display:flex;flex-direction:column}
#top{padding:calc(var(--st) + 14px) 18px 8px;flex:none}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.h1{font-size:27px;font-weight:800;letter-spacing:-.032em;line-height:1.1}
.h1 small{display:block;font-size:12.5px;font-weight:650;color:var(--tx3);letter-spacing:-.01em;margin-bottom:3px}
.hbtns{display:flex;gap:7px;align-items:center}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:var(--surf);border:1px solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  color:var(--tx2);transition:.18s;flex:none}
.ib:active{transform:scale(.9);background:var(--ac-s);color:var(--ac)}
.ib svg{width:18px;height:18px}
.ib.on{background:var(--ac);color:#fff;border-color:transparent}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px 14px calc(var(--sb) + var(--dock) + 26px)}
#view{will-change:transform}

/* ═══════════ dock ═══════════ */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 12px);z-index:50;
  display:flex;gap:2px;padding:5px;border-radius:21px;
  background:var(--surf);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line);box-shadow:var(--sh-lg);position:relative}
#dockwrap{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 12px);z-index:50;display:flex;justify-content:center;pointer-events:none}
#dockwrap>#dock{pointer-events:auto}
#thumb{position:absolute;top:5px;bottom:5px;left:0;border-radius:17px;background:var(--ac);
  box-shadow:0 4px 14px var(--ac-b);transition:transform .38s cubic-bezier(.34,1.5,.44,1),width .3s;z-index:0}
.nb{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:7px 20px 6px;border-radius:17px;color:var(--tx3);transition:color .25s;min-width:78px}
.nb.on{color:#fff}
.nb svg{width:20px;height:20px}
.nb b{font-size:10.5px;font-weight:750;letter-spacing:-.01em}

/* ═══════════ cards ═══════════ */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.ctitle{display:flex;align-items:center;justify-content:space-between;padding:13px 15px 9px;gap:8px}
.ctitle b{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--tx3);text-transform:uppercase}

/* ═══════════ timetable ═══════════ */
#tt{display:flex;flex-direction:column;gap:5px}
.blk{display:flex;gap:0;border-radius:var(--r2);overflow:hidden;position:relative;
  background:var(--gap);border:1px solid var(--line2);transition:background .16s,box-shadow .16s,transform .16s}
.blk.cls{background:var(--cls);border-color:rgba(91,91,245,.13)}
.blk.now{border-color:var(--ac-b);box-shadow:0 0 0 1.5px var(--ac-b) inset}
.blk.tgt{background:var(--ac-s);box-shadow:0 0 0 2px var(--ac) inset;transform:scale(1.012)}
.bt{flex:none;width:52px;padding:9px 0 9px 10px;display:flex;flex-direction:column;gap:1px;align-items:flex-start}
.bt i{font-style:normal;font-size:12px;font-weight:800;color:var(--tx2);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bt s{text-decoration:none;font-size:9.5px;font-weight:650;color:var(--tx3);font-variant-numeric:tabular-nums}
.bb{flex:1;min-width:0;padding:8px 10px 8px 2px;display:flex;flex-direction:column;gap:5px}
.bh{display:flex;align-items:center;gap:6px;min-height:19px}
.bh b{font-size:12.5px;font-weight:750;color:var(--tx2);letter-spacing:-.015em}
.blk.cls .bh b{color:var(--tx);font-weight:800}
.bh .dur{font-size:10px;font-weight:700;color:var(--tx3);background:var(--line2);padding:1px 6px;border-radius:6px}
.bh .add{margin-left:auto;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--tx3);flex:none}
.bh .add:active{background:var(--ac-s);color:var(--ac)}
.bh .add svg{width:13px;height:13px}

/* task chip */
.tk{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r3);
  background:var(--bg2);border:1px solid var(--line);box-shadow:0 1px 3px rgba(20,26,60,.05);
  position:relative;transition:transform .16s cubic-bezier(.3,1.2,.5,1),opacity .16s}
.tk.dragging{opacity:.28}
.tk.done{opacity:.42}
.tk.done .tkt{text-decoration:line-through;color:var(--tx3)}
.ck{width:19px;height:19px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.16s}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck svg{width:11px;height:11px;color:#fff;opacity:0;transition:.16s}
.ck.on svg{opacity:1}
.tkb{flex:1;min-width:0}
.tkt{font-size:13.5px;font-weight:650;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkm{display:flex;align-items:center;gap:5px;margin-top:1px}
.tkm span{font-size:10px;font-weight:700;color:var(--tx3);font-variant-numeric:tabular-nums}
.tkm .sj{padding:1px 6px;border-radius:5px;font-size:9.5px}
.tkm .rp{display:inline-flex;align-items:center;gap:2px;color:var(--ac)}
.tkm .rp svg{width:9px;height:9px}
.gr{width:16px;flex:none;display:flex;flex-direction:column;gap:2.5px;align-items:center;justify-content:center;opacity:.32}
.gr i{display:block;width:12px;height:1.5px;border-radius:1px;background:var(--tx2)}

/* drag ghost + indicator */
#ghost{position:fixed;z-index:200;pointer-events:none;opacity:0;
  box-shadow:var(--sh-lg);border-radius:var(--r3);transform-origin:center;
  transition:opacity .12s}
#ghost.on{opacity:1}
.dropline{height:3px;border-radius:2px;background:var(--ac);box-shadow:0 0 8px var(--ac-b);margin:1px 0;flex:none;
  animation:dl .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes dl{from{transform:scaleX(.2);opacity:0}to{transform:scaleX(1);opacity:1}}
#dropinfo{position:fixed;z-index:201;pointer-events:none;opacity:0;transition:opacity .14s;
  background:var(--ac);color:#fff;padding:5px 11px;border-radius:11px;font-size:11.5px;font-weight:800;
  box-shadow:0 6px 18px var(--ac-b);white-space:nowrap;letter-spacing:-.01em}
#dropinfo.on{opacity:1}

/* inbox */
.inbox{display:flex;flex-direction:column;gap:5px;padding:0 12px 12px}
.empty{text-align:center;padding:22px 14px;color:var(--tx3);font-size:12.5px;font-weight:600}

/* ═══════════ calendar ═══════════ */
.calh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px}
.calh b{font-size:19px;font-weight:800;letter-spacing:-.025em}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px}
.dow i{font-style:normal;text-align:center;font-size:10.5px;font-weight:800;color:var(--tx3);padding:3px 0}
.dow i.sun{color:var(--gd)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cd{aspect-ratio:1/1.16;border-radius:12px;padding:5px 3px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--surf2);border:1px solid transparent;transition:.16s;position:relative}
.cd.out{opacity:.28}
.cd.today{background:var(--ac-s);border-color:var(--ac-b)}
.cd.sel{background:var(--ac);box-shadow:0 5px 16px var(--ac-b)}
.cd.sel .cdn,.cd.sel .cdd{color:#fff}
.cdn{font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums}
.cd.sun .cdn{color:var(--gd)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dot{width:4px;height:4px;border-radius:50%;background:var(--ac)}
.cd.sel .dot{background:#fff}
.cdd{font-size:8.5px;font-weight:800;color:var(--gd);letter-spacing:-.02em}

/* ═══════════ subjects ═══════════ */
.sj{border-radius:var(--r);background:var(--surf);border:1px solid var(--line);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--sh);margin-bottom:11px;overflow:hidden}
.sjh{display:flex;align-items:center;gap:9px;padding:13px 14px}
.sjc{width:11px;height:11px;border-radius:4px;flex:none}
.sjh b{font-size:16px;font-weight:800;letter-spacing:-.025em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{display:flex;align-items:center;gap:9px;padding:9px 14px;border-top:1px solid var(--line2)}
.ddn{flex:1;min-width:0;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddd{font-size:10.5px;font-weight:700;color:var(--tx3);font-variant-numeric:tabular-nums}
.ddc{font-size:13px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.03em;flex:none;
  padding:3px 9px;border-radius:9px;background:var(--gd-s);color:var(--gd)}
.ddc.far{background:var(--ac-s);color:var(--ac)}
.ddc.past{background:var(--line2);color:var(--tx3)}
.gl{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 16px}
.gl:first-of-type{padding-top:10px}
.gld{width:5px;height:5px;border-radius:50%;background:var(--tx3);flex:none;margin-left:3px}
.glt{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--tx2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl.dragging{opacity:.3}
.sjf{display:flex;gap:6px;padding:9px 12px 12px}
.mini{flex:1;padding:8px;border-radius:11px;background:var(--line2);color:var(--tx2);
  font-size:12px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:4px;transition:.16s}
.mini:active{transform:scale(.96);background:var(--ac-s);color:var(--ac)}
.mini svg{width:12px;height:12px}

/* ═══════════ sheet ═══════════ */
#scrim{position:fixed;inset:0;z-index:100;background:rgba(6,8,18,.4);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .28s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;
  background:var(--bg2);border-radius:26px 26px 0 0;box-shadow:var(--sh-lg);
  transform:translateY(101%);transition:transform .36s cubic-bezier(.32,1.06,.4,1);
  padding:8px 18px calc(var(--sb) + 20px);max-height:88vh;overflow-y:auto}
#sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh2{font-size:18px;font-weight:800;letter-spacing:-.028em;margin-bottom:14px}
.fl{font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px}
.fi{width:100%;padding:13px 14px;border-radius:14px;background:var(--surf2);border:1px solid var(--line);
  font-size:15px;font-weight:600;transition:.16s}
.fi:focus{border-color:var(--ac);background:var(--ac-s)}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.sg{padding:9px 13px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--tx2);transition:.16s}
.sg.on{background:var(--ac);color:#fff;border-color:transparent;box-shadow:0 3px 10px var(--ac-b)}
.dws{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dw{aspect-ratio:1;border-radius:11px;background:var(--surf2);border:1px solid var(--line);
  font-size:13px;font-weight:750;color:var(--tx2);display:grid;place-items:center;transition:.16s}
.dw.on{background:var(--ac);color:#fff;border-color:transparent}
.dw.sun{color:var(--gd)}
.dw.on.sun{color:#fff}
.tp{display:flex;align-items:center;gap:10px;justify-content:center;padding:6px 0}
.tpb{width:42px;height:42px;border-radius:14px;background:var(--surf2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--tx2);transition:.16s;font-size:20px;font-weight:700}
.tpb:active{transform:scale(.9);background:var(--ac-s);color:var(--ac)}
.tpv{font-size:30px;font-weight:850;letter-spacing:-.04em;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.tpu{font-size:11.5px;font-weight:700;color:var(--tx3);text-align:center;margin-top:-2px}
.row2{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;padding:14px;border-radius:15px;font-size:14.5px;font-weight:800;letter-spacing:-.015em;transition:.16s;
  display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--ac);color:#fff;box-shadow:0 5px 16px var(--ac-b)}
.btn.s{background:var(--line2);color:var(--tx2)}
.btn.d{background:var(--gd-s);color:var(--gd)}
.btn svg{width:15px;height:15px}
.cls5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cbx{aspect-ratio:1;border-radius:13px;border:2.5px solid transparent;transition:.16s}
.cbx.on{border-color:var(--tx);transform:scale(1.07)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + var(--dock) + 26px);z-index:210;
  transform:translateX(-50%) translateY(14px);background:var(--tx);color:var(--bg2);
  padding:10px 17px;border-radius:13px;font-size:13px;font-weight:750;letter-spacing:-.015em;
  opacity:0;pointer-events:none;transition:.26s;box-shadow:var(--sh-lg);white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--gd);z-index:3;pointer-events:none}
.nowline::before{content:'';position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--gd)}
</style>
</head>
<body ontouchstart="">
<div id="app">
  <div id="top"></div>
  <div id="scroll"><div id="view"></div></div>
</div>
<div id="dockwrap"><div id="dock">
  <div id="thumb"></div>
  <button class="nb on" data-t="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3.2 2"/></svg><b>오늘</b></button>
  <button class="nb" data-t="cal" onclick="go('cal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3.4"/><path d="M3 9.4h18M8 2.6v3.8M16 2.6v3.8"/></svg><b>달력</b></button>
  <button class="nb" data-t="subj" onclick="go('subj')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.2A1.6 1.6 0 0 1 5.6 3.6H19v16.8H5.6A1.6 1.6 0 0 1 4 18.8z"/><path d="M4 16.6h15"/></svg><b>과목</b></button>
</div></div>
<div id="ghost"></div>
<div id="dropinfo"></div>
<div id="scrim" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
'use strict';
/* ══════════════════ 1. 시간표 ══════════════════ */
const M=(h,m)=>h*60+m;
const CLASSES=[
  ['roll', M(6,50), M(7,15), '점호'],
  ['hr',   M(8,10), M(8,20), '아침조례'],
  ['p1',   M(8,30), M(9,20), '1교시'],
  ['p2',   M(9,30), M(10,20),'2교시'],
  ['p3',   M(10,30),M(11,20),'3교시'],
  ['p4',   M(11,30),M(12,20),'4교시'],
  ['p5',   M(13,30),M(14,20),'5교시'],
  ['p6',   M(14,30),M(15,20),'6교시'],
  ['p7',   M(15,30),M(16,20),'7교시'],
  ['p8',   M(16,50),M(18,0), '8교시'],
  ['ja1',  M(19,10),M(21,0), '야자 1차시'],
  ['ja2',  M(21,15),M(23,30),'야자 2차시'],
];
/** 수업 사이 빈 구간을 쉬는시간/점심/저녁으로 자동 생성해 24시간을 빠짐없이 덮는다. */
function schoolBlocks(){
  const out=[];let cur=0;
  const nameGap=(s,e)=>{const d=e-s;
    if(s===M(12,20))return '점심시간';
    if(s===M(18,0))return '저녁시간';
    if(e<=M(6,50))return '새벽';
    if(s>=M(23,30))return '취침 전';
    if(s===M(7,15))return '아침 시간';
    return d>=25?'빈 시간':'쉬는시간';};
  for(const [id,s,e,name] of CLASSES){
    if(s>cur)out.push({id:'g'+cur,s:cur,e:s,name:nameGap(cur,s),cls:false});
    out.push({id,s,e,name,cls:true});cur=e;
  }
  if(cur<1440)out.push({id:'g'+cur,s:cur,e:1440,name:nameGap(cur,1440),cls:false});
  return out;
}
const SCHOOL=schoolBlocks();
function h24Blocks(){const o=[];for(let h=0;h<24;h++)o.push({id:'h'+h,s:h*60,e:h*60+60,name:hhmm(h*60),cls:false});return o;}
function blocksFor(ds){
  const wd=new Date(ds+'T00:00:00').getDay();
  const forced=DB.s.force24[ds];
  const use24 = forced!==undefined ? forced : (wd===0||wd===6);
  return {list:use24?h24Blocks():SCHOOL, is24:use24, weekend:(wd===0||wd===6)};
}
function hhmm(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function durTxt(d){return d>=60?(d%60?Math.floor(d/60)+'시간 '+(d%60)+'분':Math.floor(d/60)+'시간'):d+'분';}
/** 할일의 배치 정본은 '절대 분(min)'이다. null이면 미배정.
 *  블록 id를 저장하면 24시간 모드로 바꿀 때 그 블록이 사라져 할일이 증발한다 — 실제로 그랬다. */
function blockOf(ds,min){const {list}=blocksFor(ds);return list.find(x=>min>=x.s&&min<x.e)||null;}

/* ══════════════════ 2. 저장소 ══════════════════ */
const KEY='planner_v3';
let DB={v:3,tasks:[],subjects:[],s:{force24:{}}};
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);
  DB={v:3,tasks:d.tasks||[],subjects:d.subjects||[],s:Object.assign({force24:{}},d.s||{})};}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('저장 실패');}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1800);}
function buzz(n){if(navigator.vibrate)navigator.vibrate(n);}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseD(s){return new Date(s+'T00:00:00');}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);}

let tab='today', cur=TODAY(), calM=new Date(), _anim=false;

/* ══════════════════ 4. 반복 ══════════════════ */
const HORIZON=120;
/** 반복 규칙에 맞는 날짜인지 */
function repHit(rep,baseDs,ds){
  if(rep.t==='w')return rep.d.includes(parseD(ds).getDay());
  if(rep.t==='n'){const diff=Math.round((parseD(ds)-parseD(baseDs))/86400000);return diff>=0&&diff%rep.n===0;}
  return false;
}
/** 반복 인스턴스 생성 — 시각(절대 분)을 그대로 복사하고, 그 날 레이아웃의 블록으로 재배치 */
function materialize(t){
  if(!t.rep)return;
  const gid=t.repId||(t.repId=uid());
  const have=new Set(DB.tasks.filter(x=>x.repId===gid).map(x=>x.date));
  let made=0;
  for(let i=1;i<=HORIZON;i++){
    const ds=addDays(t.date,i);
    if(have.has(ds))continue;
    if(!repHit(t.rep,t.date,ds))continue;
    DB.tasks.push({id:uid(),title:t.title,date:ds,min:t.min,dur:t.dur,
      ord:t.ord,done:false,subj:t.subj,rep:t.rep,repId:gid});
    made++;
  }
  return made;
}
/** 로드/이동 시 지평선 보충 */
function topUp(){
  const groups={};
  DB.tasks.forEach(t=>{if(t.repId){(groups[t.repId]=groups[t.repId]||[]).push(t);}});
  let n=0;
  Object.values(groups).forEach(arr=>{
    arr.sort((a,b)=>a.date<b.date?-1:1);
    const last=arr[arr.length-1];
    if(!last.rep)return;
    const far=Math.round((parseD(last.date)-new Date().setHours(0,0,0,0))/86400000);
    if(far<60)n+=materialize(last)||0;
  });
  if(n)save();
}
function taskMin(t){return t.min!=null?t.min:0;}

/* ══════════════════ 5. 렌더 — 오늘 ══════════════════ */
function tasksOf(ds){return DB.tasks.filter(t=>t.date===ds);}
function subjOf(id){return DB.subjects.find(s=>s.id===id);}

/* ══════════════════ 6. 렌더 — 달력 ══════════════════ */

/* ══════════════════ 7. 렌더 — 과목 ══════════════════ */
function dcount(date){return Math.round((parseD(date)-new Date().setHours(0,0,0,0))/86400000);}

/* ══════════════════ 8. paint ══════════════════ */
function paint(){
  $('#top').innerHTML=topHTML();
  $('#view').innerHTML=({today:todayHTML,cal:calHTML,subj:subjHTML}[tab])();
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  placeThumb();
  if(tab==='today')bindDrag();
  if(tab==='subj')bindGoalDrag();
}
function placeThumb(){
  const th=$('#thumb'),a=document.querySelector('.nb.on');if(!th||!a)return;
  th.style.width=a.offsetWidth+'px';th.style.transform='translateX('+a.offsetLeft+'px)';
}
function go(t){
  if(t===tab){$('#scroll').scrollTo({top:0,behavior:'smooth'});return;}
  const order=['today','cal','subj'],dir=order.indexOf(t)>order.indexOf(tab)?1:-1;
  _anim=true;const v=$('#view');
  v.style.transition='transform .17s ease-in,opacity .17s ease-in';
  v.style.transform='translateX('+(-dir*26)+'px)';v.style.opacity='0';
  setTimeout(()=>{
    tab=t;$('#scroll').scrollTop=0;paint();
    v.style.transition='none';v.style.transform='translateX('+(dir*26)+'px)';v.style.opacity='0';
    requestAnimationFrame(()=>{v.style.transition='transform .3s cubic-bezier(.3,1.1,.4,1),opacity .28s';
      v.style.transform='translateX(0)';v.style.opacity='1';setTimeout(()=>{_anim=false;},300);});
  },170);
  buzz(8);
}
function moveDay(n){cur=addDays(cur,n);paint();}
function moveMonth(n){calM=new Date(calM.getFullYear(),calM.getMonth()+n,1);paint();}
function pickDate(ds){cur=ds;paint();}
function toggle24(){
  const {is24}=blocksFor(cur);const wd=parseD(cur).getDay();const def=(wd===0||wd===6);
  if(is24===def)DB.s.force24[cur]=!def;else delete DB.s.force24[cur];
  save();paint();toast(blocksFor(cur).is24?'24시간 보기':'학교 시간표');
}
function toggleDone(id){const t=DB.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;buzz(9);save();paint();}

/* ══════════════════ 9. 스와이프 탭 전환 ══════════════════ */
(function(){
  const S=$('#scroll');let x0=null,y0=null,decided=false,horiz=false;
  S.addEventListener('touchstart',e=>{if(_anim||DRAG.on){x0=null;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;decided=false;horiz=false;},{passive:true});
  S.addEventListener('touchmove',e=>{
    if(x0==null||DRAG.on)return;
    const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
    if(!decided){if(Math.abs(dx)>10||Math.abs(dy)>10){decided=true;horiz=Math.abs(dx)>Math.abs(dy)*1.5;}}
    if(horiz&&e.cancelable){e.preventDefault();
      const v=$('#view');v.style.transition='none';
      v.style.transform='translateX('+(dx*.28)+'px)';v.style.opacity=String(Math.max(.55,1-Math.abs(dx)/620));}
  },{passive:false});
  const end=e=>{
    if(x0==null)return;const v=$('#view');
    if(horiz){
      const dx=(e.changedTouches?e.changedTouches[0].clientX:x0)-x0;
      const order=['today','cal','subj'],i=order.indexOf(tab);
      v.style.transition='transform .26s cubic-bezier(.3,1.1,.4,1),opacity .24s';
      v.style.transform='translateX(0)';v.style.opacity='1';
      if(dx<-58&&i<order.length-1)go(order[i+1]);
      else if(dx>58&&i>0)go(order[i-1]);
    }
    x0=null;decided=false;horiz=false;};
  S.addEventListener('touchend',end);S.addEventListener('touchcancel',end);
})();

/* ══════════════════ 10. 드래그 — 할일 → 타임테이블 ══════════════════ */
const DRAG={on:false};
function bindDrag(){
  const root=$('#view');if(root._db)return;root._db=true;
  let timer=null,sx=0,sy=0,moved=0,src=null,tid=null,gh=$('#ghost'),info=$('#dropinfo');
  let curBlk=null,curIdx=-1,line=null,scrollT=null;

  const cleanup=()=>{
    clearTimeout(timer);timer=null;
    if(scrollT){cancelAnimationFrame(scrollT);scrollT=null;}
    document.querySelectorAll('.blk.tgt').forEach(b=>b.classList.remove('tgt'));
    if(line&&line.parentNode)line.parentNode.removeChild(line);line=null;
    gh.classList.remove('on');gh.innerHTML='';info.classList.remove('on');
    if(src)src.classList.remove('dragging');
    src=null;curBlk=null;curIdx=-1;DRAG.on=false;
  };
  const lift=()=>{
    DRAG.on=true;src.classList.add('dragging');
    const r=src.getBoundingClientRect();
    gh.style.width=r.width+'px';gh.innerHTML=src.outerHTML;
    const g=gh.firstElementChild;if(g){g.classList.remove('dragging');g.style.transform='none';}
    gh._ox=sx-r.left;gh._oy=sy-r.top;
    gh.style.left=(sx-gh._ox)+'px';gh.style.top=(sy-gh._oy)+'px';
    gh.style.transform='scale(1.045) rotate(-.6deg)';
    gh.classList.add('on');buzz(14);
  };
  const place=(cx,cy)=>{
    const el=document.elementFromPoint(cx,cy);
    const blk=el&&el.closest?el.closest('.blk, #inbox'):null;
    document.querySelectorAll('.blk.tgt').forEach(b=>{if(b!==blk)b.classList.remove('tgt')});
    if(!blk){if(line&&line.parentNode)line.parentNode.removeChild(line);line=null;curBlk=null;info.classList.remove('on');return;}
    if(blk.classList.contains('blk'))blk.classList.add('tgt');
    curBlk=blk;
    const host=blk.classList.contains('blk')?blk.querySelector('.bb'):blk;
    const chips=[...host.querySelectorAll('.tk')].filter(c=>c!==src);
    let idx=chips.length;
    for(let i=0;i<chips.length;i++){const cr=chips[i].getBoundingClientRect();
      if(cy<cr.top+cr.height/2){idx=i;break;}}
    curIdx=idx;
    if(!line){line=document.createElement('div');line.className='dropline';}
    const ref=chips[idx]||null;
    if(ref)host.insertBefore(line,ref);else host.appendChild(line);
    const nm=blk.classList.contains('blk')?(blk.querySelector('.bh b').textContent+' · '+hhmm(+blk.dataset.s)):'미배정';
    info.textContent=nm;info.classList.add('on');
    const ir=info.getBoundingClientRect();
    info.style.left=Math.max(10,Math.min(window.innerWidth-ir.width-10,cx-ir.width/2))+'px';
    info.style.top=Math.max(10,cy-58)+'px';
  };
  const autoScroll=cy=>{
    const S=$('#scroll'),r=S.getBoundingClientRect();
    let v=0;
    if(cy<r.top+90)v=-Math.min(14,(r.top+90-cy)/4);
    else if(cy>r.bottom-110)v=Math.min(14,(cy-(r.bottom-110))/4);
    if(v){S.scrollTop+=v;}
  };

  root.addEventListener('touchstart',e=>{
    const tk=e.target.closest('.tk');if(!tk)return;
    if(e.target.closest('.ck'))return;
    src=tk;tid=tk.dataset.id;sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=0;
    clearTimeout(timer);timer=setTimeout(lift,250);
  },{passive:true});

  root.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(!DRAG.on){
      if(src){moved=Math.max(moved,Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy));
        if(moved>9){clearTimeout(timer);timer=null;src=null;}}
      return;}
    if(e.cancelable)e.preventDefault();
    moved=Math.max(moved,Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy));
    gh.style.left=(t.clientX-gh._ox)+'px';gh.style.top=(t.clientY-gh._oy)+'px';
    autoScroll(t.clientY);place(t.clientX,t.clientY);
  },{passive:false});

  const drop=e=>{
    if(!DRAG.on){clearTimeout(timer);timer=null;src=null;return;}
    const task=DB.tasks.find(x=>x.id===tid);
    const blk=curBlk,idx=curIdx;
    if(task&&blk){
      const isBlk=blk.classList.contains('blk');
      if(isBlk){
        const bs=+blk.dataset.s,be=+blk.dataset.e;
        // 그 블록 안의 정확한 시각이면 유지, 아니면 블록 시작으로 스냅
        if(task.min==null||task.min<bs||task.min>=be)task.min=bs;
      }else task.min=null;
      const inSame=x=>{if(task.min==null)return x.min==null;
        return x.min!=null&&x.min>=+blk.dataset.s&&x.min<+blk.dataset.e;};
      const sibs=DB.tasks.filter(x=>x.date===cur&&x.id!==task.id&&inSame(x))
        .sort((a,b)=>a.ord-b.ord);
      sibs.splice(Math.max(0,Math.min(sibs.length,idx)),0,task);
      sibs.forEach((x,i)=>x.ord=i);
      save();buzz(11);
    }
    const wasMoved=moved>9;
    cleanup();
    if(!wasMoved&&task){paint();openTask(task.id);}else paint();
  };
  root.addEventListener('touchend',e=>{
    if(DRAG.on){drop(e);return;}
    if(timer&&src&&moved<=9){ // 꾹 누르기 전에 뗀 경우 = 그냥 탭
      clearTimeout(timer);timer=null;
      const id=src.dataset.id;src=null;openTask(id);return;}
    clearTimeout(timer);timer=null;src=null;
  });
  root.addEventListener('touchcancel',()=>{if(DRAG.on)cleanup();else{clearTimeout(timer);timer=null;src=null;}});
}

/* ══════════════════ 11. 드래그 — 하위 목표 순서 ══════════════════ */
function bindGoalDrag(){
  document.querySelectorAll('.goals').forEach(list=>{
    if(list._b)return;list._b=true;
    let items=[],el=null,y0=0,h=44,from=-1,to=-1,timer=null,active=false;
    const clr=()=>{clearTimeout(timer);timer=null;};
    list.addEventListener('touchstart',e=>{
      const it=e.target.closest('.gl');if(!it)return;
      y0=e.touches[0].clientY;clr();
      timer=setTimeout(()=>{active=true;el=it;items=[...list.querySelectorAll('.gl')];
        from=items.indexOf(it);to=from;
        h=items.length>1?(items[1].getBoundingClientRect().top-items[0].getBoundingClientRect().top):it.offsetHeight;
        items.forEach(x=>{if(x!==it)x.style.transition='transform .18s cubic-bezier(.3,1.2,.5,1)';});
        it.classList.add('dragging');buzz(12);},240);
    },{passive:true});
    list.addEventListener('touchmove',e=>{
      if(!active){if(Math.abs(e.touches[0].clientY-y0)>8)clr();return;}
      if(e.cancelable)e.preventDefault();
      const dy=e.touches[0].clientY-y0;
      el.style.transform='translateY('+dy+'px) scale(1.02)';
      to=Math.max(0,Math.min(items.length-1,from+Math.round(dy/h)));
      items.forEach((it,i)=>{if(it===el)return;let s=0;
        if(from<to&&i>from&&i<=to)s=-h;else if(from>to&&i>=to&&i<from)s=h;
        it.style.transform=s?'translateY('+s+'px)':'';});
    },{passive:false});
    const end=()=>{clr();if(!active)return;active=false;
      const s=subjOf(list.dataset.sid);
      const ids=items.map(x=>x.dataset.gid);
      el.classList.remove('dragging');items.forEach(x=>{x.style.transition='';x.style.transform='';});
      if(to!==from&&s){const mv=ids.splice(from,1)[0];ids.splice(to,0,mv);
        s.goals=ids.map(id=>s.goals.find(g=>g.id===id)).filter(Boolean);save();paint();}
      el=null;};
    list.addEventListener('touchend',end);list.addEventListener('touchcancel',end);
  });
}

/* ══════════════════ 12. 시트 ══════════════════ */
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;
  $('#scrim').classList.add('on');$('#sheet').classList.add('on');}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');}

let _ed={};
function newTask(min){
  _ed={id:null,title:'',date:cur,min:(min==null?null:min),dur:30,subj:null,rep:null};
  taskSheet();
}
function openTask(id){
  const t=DB.tasks.find(x=>x.id===id);if(!t)return;
  _ed={id:t.id,title:t.title,date:t.date,min:t.min,dur:t.dur||30,subj:t.subj||null,
       rep:t.rep?JSON.parse(JSON.stringify(t.rep)):null,repId:t.repId||null};
  taskSheet();
}
function taskSheet(){
  const e=_ed;
  const {list}=blocksFor(e.date);
  const blk=e.min!=null?blockOf(e.date,e.min):null;
  const rep=e.rep;
  let h='<div class="sh2">'+(e.id?'할일 수정':'새 할일')+'</div>'+
    '<input class="fi" id="f_title" placeholder="무엇을 할까" value="'+esc(e.title)+'">'+
    '<div class="fl">배치</div>'+
    '<div class="seg"><button class="sg'+(e.min==null?' on':'')+'" onclick="setMin(null)">미배정</button>'+
      list.map(b=>'<button class="sg'+(blk&&blk.id===b.id?' on':'')+'" onclick="setMin('+b.s+')">'+esc(b.name)+'</button>').join('')+'</div>';
  if(e.min!=null){
    h+='<div class="fl">정확한 시각 (5분 단위)</div>'+
      '<div class="tp"><button class="tpb" onclick="bumpMin(-5)">−</button>'+
      '<div><div class="tpv" id="f_time">'+hhmm(e.min)+'</div><div class="tpu">'+(blk?esc(blk.name):'')+'</div></div>'+
      '<button class="tpb" onclick="bumpMin(5)">+</button></div>';
  }
  h+='<div class="fl">소요 시간</div><div class="seg">'+
    [10,20,30,50,60,90,120].map(d=>'<button class="sg'+(e.dur===d?' on':'')+'" onclick="setDur('+d+')">'+durTxt(d)+'</button>').join('')+'</div>';
  if(DB.subjects.length){
    h+='<div class="fl">과목</div><div class="seg"><button class="sg'+(!e.subj?' on':'')+'" onclick="setSubj(null)">없음</button>'+
      DB.subjects.map(s=>'<button class="sg'+(e.subj===s.id?' on':'')+'" onclick="setSubj(\''+s.id+'\')">'+esc(s.name)+'</button>').join('')+'</div>';
  }
  h+='<div class="fl">반복</div><div class="seg">'+
    '<button class="sg'+(!rep?' on':'')+'" onclick="setRep(null)">없음</button>'+
    '<button class="sg'+(rep&&rep.t==='w'?' on':'')+'" onclick="setRep(\'w\')">요일 지정</button>'+
    '<button class="sg'+(rep&&rep.t==='n'?' on':'')+'" onclick="setRep(\'n\')">며칠마다</button></div>';
  if(rep&&rep.t==='w'){
    h+='<div style="margin-top:8px" class="dws">'+DOW.map((d,i)=>
      '<button class="dw'+(rep.d.includes(i)?' on':'')+(i===0?' sun':'')+'" onclick="togDow('+i+')">'+d+'</button>').join('')+'</div>';
  }
  if(rep&&rep.t==='n'){
    h+='<div class="tp" style="margin-top:6px"><button class="tpb" onclick="bumpN(-1)">−</button>'+
      '<div><div class="tpv">'+rep.n+'일</div><div class="tpu">마다 반복</div></div>'+
      '<button class="tpb" onclick="bumpN(1)">+</button></div>';
  }
  h+='<div class="row2"><button class="btn p" onclick="saveTask()">저장</button></div>';
  if(e.id){
    h+='<div class="row2"><button class="btn d" onclick="delTask(false)">삭제</button>'+
      (e.repId?'<button class="btn d" onclick="delTask(true)">반복 전체 삭제</button>':'')+'</div>';
  }
  openSheet(h);
  setTimeout(()=>{if(!e.id)$('#f_title').focus();},380);
}
function readTitle(){const i=$('#f_title');if(i)_ed.title=i.value;}
function setMin(m){readTitle();_ed.min=m;taskSheet();}
function setDur(d){readTitle();_ed.dur=d;taskSheet();}
function setSubj(s){readTitle();_ed.subj=s;taskSheet();}
function bumpMin(d){readTitle();
  if(_ed.min==null)return;
  let v=Math.round((_ed.min+d)/5)*5;
  _ed.min=Math.max(0,Math.min(1435,v));taskSheet();}
function setRep(t){readTitle();
  if(!t)_ed.rep=null;
  else if(t==='w')_ed.rep={t:'w',d:[parseD(_ed.date).getDay()]};
  else _ed.rep={t:'n',n:2};
  taskSheet();}
function togDow(i){readTitle();const d=_ed.rep.d;const k=d.indexOf(i);
  if(k>=0){if(d.length>1)d.splice(k,1);}else d.push(i);taskSheet();}
function bumpN(x){readTitle();_ed.rep.n=Math.max(1,Math.min(60,_ed.rep.n+x));taskSheet();}
function saveTask(){
  readTitle();const e=_ed;
  if(!e.title.trim()){toast('할일 이름을 적어줘');return;}
  if(e.id){
    const t=DB.tasks.find(x=>x.id===e.id);if(!t)return;
    const repChanged=JSON.stringify(t.rep||null)!==JSON.stringify(e.rep||null);
    Object.assign(t,{title:e.title.trim(),min:e.min,dur:e.dur,subj:e.subj,rep:e.rep});
    if(repChanged){
      if(t.repId){DB.tasks=DB.tasks.filter(x=>!(x.repId===t.repId&&x.id!==t.id&&x.date>t.date));}
      if(e.rep){t.repId=t.repId||uid();materialize(t);}else t.repId=null;
    }
  }else{
    const sibs=DB.tasks.filter(x=>x.date===e.date&&(x.min==null)===(e.min==null));
    const t={id:uid(),title:e.title.trim(),date:e.date,min:e.min,dur:e.dur,
      ord:sibs.length,done:false,subj:e.subj,rep:e.rep,repId:e.rep?uid():null};
    DB.tasks.push(t);
    if(e.rep)materialize(t);
  }
  save();closeSheet();paint();toast(e.id?'수정했다':'추가했다');
}
function delTask(all){
  const e=_ed;const t=DB.tasks.find(x=>x.id===e.id);if(!t)return;
  if(all&&t.repId)DB.tasks=DB.tasks.filter(x=>x.repId!==t.repId);
  else DB.tasks=DB.tasks.filter(x=>x.id!==t.id);
  save();closeSheet();paint();toast(all?'반복 전체 삭제':'삭제했다');
}

/* ── 과목 ── */
let _sj={};
function editSubject(id){
  const s=id?subjOf(id):null;
  _sj=s?{id:s.id,name:s.name,color:s.color}:{id:null,name:'',color:PALETTE[DB.subjects.length%PALETTE.length]};
  sjSheet();
}
function sjSheet(){
  const s=_sj;
  let h='<div class="sh2">'+(s.id?'과목 수정':'새 과목')+'</div>'+
    '<input class="fi" id="f_sname" placeholder="과목 이름" value="'+esc(s.name)+'">'+
    '<div class="fl">색</div><div class="cls5">'+
    PALETTE.map(c=>'<button class="cbx'+(s.color===c?' on':'')+'" style="background:'+c+'" onclick="setSjColor(\''+c+'\')"></button>').join('')+'</div>'+
    '<div class="row2"><button class="btn p" onclick="saveSubject()">저장</button></div>';
  if(s.id)h+='<div class="row2"><button class="btn d" onclick="delSubject()">과목 삭제</button></div>';
  openSheet(h);
  setTimeout(()=>{if(!s.id)$('#f_sname').focus();},380);
}
function setSjColor(c){const i=$('#f_sname');if(i)_sj.name=i.value;_sj.color=c;sjSheet();}
function saveSubject(){
  const i=$('#f_sname');if(i)_sj.name=i.value;
  if(!_sj.name.trim()){toast('과목 이름을 적어줘');return;}
  if(_sj.id){const s=subjOf(_sj.id);s.name=_sj.name.trim();s.color=_sj.color;}
  else DB.subjects.push({id:uid(),name:_sj.name.trim(),color:_sj.color,ddays:[],goals:[]});
  save();closeSheet();paint();
}
function delSubject(){
  DB.subjects=DB.subjects.filter(s=>s.id!==_sj.id);
  DB.tasks.forEach(t=>{if(t.subj===_sj.id)t.subj=null;});
  save();closeSheet();paint();toast('과목을 지웠다');
}
let _dd={};
function editDday(sid,did){
  const s=subjOf(sid);if(!s)return;
  const d=did?(s.ddays||[]).find(x=>x.id===did):null;
  _dd=d?{sid,id:d.id,title:d.title,date:d.date}:{sid,id:null,title:'',date:TODAY()};
  ddSheet();
}
function ddSheet(){
  const d=_dd;
  let h='<div class="sh2">'+(d.id?'디데이 수정':'디데이 추가')+'</div>'+
    '<input class="fi" id="f_ddt" placeholder="예: 2회고사, 보고서 제출" value="'+esc(d.title)+'">'+
    '<div class="fl">날짜</div><input class="fi" type="date" id="f_ddd" value="'+d.date+'">'+
    '<div class="row2"><button class="btn p" onclick="saveDday()">저장</button></div>';
  if(d.id)h+='<div class="row2"><button class="btn d" onclick="delDday()">삭제</button></div>';
  openSheet(h);
}
function saveDday(){
  const t=$('#f_ddt').value.trim(),dt=$('#f_ddd').value;
  if(!t){toast('이름을 적어줘');return;}
  if(!dt){toast('날짜를 골라줘');return;}
  const s=subjOf(_dd.sid);if(!s)return;s.ddays=s.ddays||[];
  if(_dd.id){const d=s.ddays.find(x=>x.id===_dd.id);d.title=t;d.date=dt;}
  else s.ddays.push({id:uid(),title:t,date:dt});
  save();closeSheet();paint();
}
function delDday(){
  const s=subjOf(_dd.sid);s.ddays=(s.ddays||[]).filter(x=>x.id!==_dd.id);
  save();closeSheet();paint();
}
let _gl={};
function editGoal(sid,gid){
  const s=subjOf(sid);if(!s)return;
  const g=gid?(s.goals||[]).find(x=>x.id===gid):null;
  _gl={sid,id:g?g.id:null,text:g?g.text:''};
  let h='<div class="sh2">'+(g?'하위 목표 수정':'하위 목표 추가')+'</div>'+
    '<input class="fi" id="f_gl" placeholder="예: 3단원 문제집 1회독" value="'+esc(_gl.text)+'">'+
    '<div class="row2"><button class="btn p" onclick="saveGoal()">저장</button></div>';
  if(g)h+='<div class="row2"><button class="btn d" onclick="delGoal()">삭제</button></div>';
  openSheet(h);
  setTimeout(()=>{if(!g)$('#f_gl').focus();},380);
}
function saveGoal(){
  const v=$('#f_gl').value.trim();if(!v){toast('내용을 적어줘');return;}
  const s=subjOf(_gl.sid);s.goals=s.goals||[];
  if(_gl.id){s.goals.find(x=>x.id===_gl.id).text=v;}
  else s.goals.push({id:uid(),text:v});
  save();closeSheet();paint();
}
function delGoal(){
  const s=subjOf(_gl.sid);s.goals=(s.goals||[]).filter(x=>x.id!==_gl.id);
  save();closeSheet();paint();
}
